<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" role="img" aria-label="Topic map of the six overhead aerial and satellite optical dense-detection and classification threads in this report">
  <title>Overhead optical imagery &#8212; six dense-detection &amp; classification threads</title>
  <defs>
    <marker id="tm" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#94a3b8"/>
    </marker>
  </defs>
  <!-- edges -->
  <g stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#tm)">
    <line x1="450" y1="320" x2="205" y2="140"/>
    <line x1="450" y1="320" x2="450" y2="118"/>
    <line x1="450" y1="320" x2="695" y2="140"/>
    <line x1="450" y1="320" x2="205" y2="500"/>
    <line x1="450" y1="320" x2="450" y2="522"/>
    <line x1="450" y1="320" x2="695" y2="500"/>
  </g>
  <!-- hub -->
  <g>
    <rect x="304" y="272" width="292" height="96" rx="12" fill="#0f172a" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="450" y="300" text-anchor="middle" fill="#f8fafc" font-size="15" font-weight="700">The overhead image</text>
    <text x="450" y="322" text-anchor="middle" fill="#cbd5e1" font-size="12.5">top-down &#183; metric GSD &#183; no canonical &#8593;</text>
    <text x="450" y="340" text-anchor="middle" fill="#cbd5e1" font-size="12.5">objects tiny, arbitrarily rotated,</text>
    <text x="450" y="358" text-anchor="middle" fill="#cbd5e1" font-size="12.5">densely packed &#183; huge scene tiles</text>
  </g>
  <!-- nodes -->
  <g>
    <!-- 1 primitive (top-left) -->
    <rect x="45" y="80" width="300" height="92" rx="10" fill="#4f46e5" stroke="#3730a3"/>
    <text x="60" y="104" fill="#f8fafc" font-size="12.5" font-weight="700">1 &#183; The primitive (&#167;3)</text>
    <text x="60" y="123" fill="#e0e7ff" font-size="11.5">ground sample distance sets object size</text>
    <text x="60" y="140" fill="#e0e7ff" font-size="11.5">orientation is arbitrary; boxes rotate</text>
    <text x="60" y="157" fill="#e0e7ff" font-size="11.5">gigapixel tiles &#8594; tile-and-stitch</text>

    <!-- 2 oriented detection (top-center) -->
    <rect x="300" y="28" width="300" height="92" rx="10" fill="#0f766e" stroke="#115e59"/>
    <text x="315" y="52" fill="#f8fafc" font-size="12.5" font-weight="700">2 &#183; Oriented detection (&#167;4)</text>
    <text x="315" y="71" fill="#ccfbf1" font-size="11.5">DOTA &#183; DIOR-R &#183; FAIR1M benchmarks</text>
    <text x="315" y="88" fill="#ccfbf1" font-size="11.5">Oriented R-CNN &#183; S2A-Net &#183; ReDet</text>
    <text x="315" y="105" fill="#ccfbf1" font-size="11.5">rotated DETR (ARS-DETR)</text>

    <!-- 3 angle regression (top-right) -->
    <rect x="555" y="80" width="300" height="92" rx="10" fill="#9333ea" stroke="#6b21a8"/>
    <text x="570" y="104" fill="#f8fafc" font-size="12.5" font-weight="700">3 &#183; The angle problem (&#167;5)</text>
    <text x="570" y="123" fill="#f3e8ff" font-size="11.5">boundary discontinuity &amp; periodicity</text>
    <text x="570" y="140" fill="#f3e8ff" font-size="11.5">CSL &#183; DCL classify the angle</text>
    <text x="570" y="157" fill="#f3e8ff" font-size="11.5">GWD &#183; KLD &#183; KFIoU: box as Gaussian</text>

    <!-- 4 tiny objects (bottom-left) -->
    <rect x="45" y="500" width="300" height="92" rx="10" fill="#b45309" stroke="#92400e"/>
    <text x="60" y="524" fill="#f8fafc" font-size="12.5" font-weight="700">4 &#183; Tiny objects (&#167;6)</text>
    <text x="60" y="543" fill="#fde68a" font-size="11.5">AI-TOD &#183; SODA-A &#183; VisDrone</text>
    <text x="60" y="560" fill="#fde68a" font-size="11.5">IoU breaks &#8594; NWD &#183; RFLA assignment</text>
    <text x="60" y="577" fill="#fde68a" font-size="11.5">SAHI sliced inference</text>

    <!-- 5 foundation/VLM (bottom-center) -->
    <rect x="300" y="522" width="300" height="92" rx="10" fill="#be123c" stroke="#9f1239"/>
    <text x="315" y="546" fill="#f8fafc" font-size="12.5" font-weight="700">5 &#183; FMs &amp; VLMs (&#167;7)</text>
    <text x="315" y="565" fill="#ffe4e6" font-size="11.5">SatMAE &#183; ScaleMAE &#183; SkySense</text>
    <text x="315" y="582" fill="#ffe4e6" font-size="11.5">RemoteCLIP &#183; GeoChat &#183; open-vocab</text>
    <text x="315" y="599" fill="#ffe4e6" font-size="11.5">SAM &#8594; SAMRS &#183; RSPrompter</text>

    <!-- 6 backbones/deploy (bottom-right) -->
    <rect x="555" y="500" width="300" height="92" rx="10" fill="#0369a1" stroke="#075985"/>
    <text x="570" y="524" fill="#f8fafc" font-size="12.5" font-weight="700">6 &#183; Backbones &amp; deploy (&#167;8)</text>
    <text x="570" y="543" fill="#e0f2fe" font-size="11.5">LSKNet &#183; PKINet large-context kernels</text>
    <text x="570" y="560" fill="#e0f2fe" font-size="11.5">MMRotate toolbox &#183; reproducibility</text>
    <text x="570" y="577" fill="#e0f2fe" font-size="11.5">onboard / edge &#183; cross-sensor shift</text>
  </g>
</svg>
