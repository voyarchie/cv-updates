<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" role="img" aria-label="The deep-learning stack for weather radar in four layers over five deployed verticals. Layer one, the raw record: reflectivity, Doppler velocity and dual-polarization moments gridded into a multi-frame mosaic. Layer two, preprocessing and quality control: clutter and non-meteorological echo removal, dealiasing, attenuation correction and normalization. Layer three, the model family, split into deterministic spatiotemporal predictors (convolutional LSTM and TrajGRU, U-Net and encoder-decoder, and space-time transformers such as Earthformer) and generative models (adversarial DGMR, the hybrid physics-plus-generative NowcastNet, latent and correction diffusion such as PreDiff, StormCast and CorrDiff, conditional flow matching, and tokenized language models such as GPTCast). Layer four, the tasks: precipitation nowcasting, storm-cell detection and tracking, hydrometeor and storm-mode classification, and severe-weather detection of tornado and hail. Underneath run five verticals: aviation, flood and hydrology, severe-weather warning, energy, and agriculture.">
  <title>The weather-radar deep-learning stack: raw moments to tasks, across five verticals</title>
  <rect x="0" y="0" width="960" height="500" rx="10" fill="#f4f6fb" stroke="#cbd5e1" stroke-width="1"/>
  <text x="24" y="32" fill="#334155" font-size="17" font-weight="800">The weather-radar learning stack &#8212; and why the marquee task is <tspan font-style="italic">prediction</tspan></text>

  <!-- Layer 1 -->
  <g>
    <rect x="24" y="48" width="912" height="58" rx="8" fill="#0b1220" stroke="#334155" stroke-width="2"/>
    <text x="38" y="70" fill="#7dd3fc" font-size="12.5" font-weight="700">1 &#183; Raw record</text>
    <text x="38" y="90" fill="#cbd5e1" font-size="11.5">reflectivity Z &#183; Doppler velocity v &#183; dual-pol (Z&#8341;&#7523;, K&#8341;&#7527;, &#961;&#7511;&#7515;) &#8212; gridded into a multi-radar mosaic, one frame every ~2&#8211;5 min &#8594; a spatiotemporal image stack</text>
  </g>

  <!-- Layer 2 -->
  <g>
    <rect x="24" y="116" width="912" height="52" rx="8" fill="#111c30" stroke="#334155" stroke-width="2"/>
    <text x="38" y="137" fill="#fbbf24" font-size="12.5" font-weight="700">2 &#183; Preprocessing / QC</text>
    <text x="38" y="156" fill="#cbd5e1" font-size="11.5">clutter &amp; non-met removal &#183; velocity dealiasing &#183; attenuation correction &#183; log-dBZ &amp; VIL normalization &#183; advection/optical-flow priors</text>
  </g>

  <!-- Layer 3 -->
  <g>
    <rect x="24" y="178" width="912" height="176" rx="8" fill="#0b1220" stroke="#334155" stroke-width="2"/>
    <text x="38" y="200" fill="#f9a8d4" font-size="12.5" font-weight="700">3 &#183; Model family &#8212; how the frames are presented &amp; generated</text>

    <!-- deterministic column -->
    <rect x="40" y="212" width="436" height="130" rx="6" fill="#132033" stroke="#334155"/>
    <text x="54" y="232" fill="#93c5fd" font-size="11.5" font-weight="700">Deterministic spatiotemporal predictors</text>
    <text x="54" y="252" fill="#cbd5e1" font-size="10.8">&#8226; ConvLSTM / TrajGRU &#8212; recurrent echo extrapolation</text>
    <text x="54" y="270" fill="#cbd5e1" font-size="10.8">&#8226; U-Net / encoder&#8211;decoder &#8212; frame-to-frame regression</text>
    <text x="54" y="288" fill="#cbd5e1" font-size="10.8">&#8226; Earthformer &#8212; space-time (cuboid-attention) transformer</text>
    <text x="54" y="312" fill="#93c5fd" font-size="10.2" font-style="italic">sharp near t+0, but blur &amp; wash out extremes with lead time</text>
    <text x="54" y="330" fill="#64748b" font-size="10.2">(the double-penalty / mean-regression problem)</text>

    <!-- generative column -->
    <rect x="488" y="212" width="432" height="130" rx="6" fill="#1a1330" stroke="#334155"/>
    <text x="502" y="232" fill="#c4b5fd" font-size="11.5" font-weight="700">Generative models (keep the extremes sharp)</text>
    <text x="502" y="252" fill="#cbd5e1" font-size="10.8">&#8226; GAN &#8212; DGMR (ensembles of plausible rain fields)</text>
    <text x="502" y="270" fill="#cbd5e1" font-size="10.8">&#8226; Hybrid physics+gen &#8212; NowcastNet (evolution + net)</text>
    <text x="502" y="288" fill="#cbd5e1" font-size="10.8">&#8226; Diffusion &#8212; PreDiff, StormCast, CorrDiff, hail-diffusion</text>
    <text x="502" y="306" fill="#cbd5e1" font-size="10.8">&#8226; Flow matching (FlowCast) &#183; token LM (GPTCast)</text>
    <text x="502" y="330" fill="#c4b5fd" font-size="10.2" font-style="italic">probabilistic ensembles &#8594; calibrated risk, not a blurry mean</text>
  </g>

  <!-- Layer 4 -->
  <g>
    <rect x="24" y="364" width="912" height="70" rx="8" fill="#111c30" stroke="#334155" stroke-width="2"/>
    <text x="38" y="385" fill="#5eead4" font-size="12.5" font-weight="700">4 &#183; Tasks</text>
    <g font-size="11" fill="#e2e8f0">
      <rect x="40" y="394" width="205" height="30" rx="6" fill="#0e2a26" stroke="#334155"/>
      <text x="52" y="413">precipitation nowcasting (predict frames)</text>
      <rect x="255" y="394" width="200" height="30" rx="6" fill="#0e2a26" stroke="#334155"/>
      <text x="267" y="413">storm-cell detection &amp; tracking</text>
      <rect x="465" y="394" width="215" height="30" rx="6" fill="#0e2a26" stroke="#334155"/>
      <text x="477" y="413">hydrometeor / storm-mode classification</text>
      <rect x="690" y="394" width="230" height="30" rx="6" fill="#0e2a26" stroke="#334155"/>
      <text x="702" y="413">severe-weather detection (tornado / hail)</text>
    </g>
  </g>

  <!-- verticals -->
  <text x="24" y="458" fill="#334155" font-size="11.5" font-weight="700">Deployed verticals</text>
  <g font-size="11" fill="#334155">
    <rect x="24" y="466" width="168" height="26" rx="13" fill="#e2e8f0" stroke="#cbd5e1"/><text x="42" y="483">aviation &amp; air traffic</text>
    <rect x="200" y="466" width="176" height="26" rx="13" fill="#e2e8f0" stroke="#cbd5e1"/><text x="218" y="483">flood / hydrology warning</text>
    <rect x="384" y="466" width="176" height="26" rx="13" fill="#e2e8f0" stroke="#cbd5e1"/><text x="402" y="483">severe-weather warning</text>
    <rect x="568" y="466" width="150" height="26" rx="13" fill="#e2e8f0" stroke="#cbd5e1"/><text x="586" y="483">energy / renewables</text>
    <rect x="726" y="466" width="150" height="26" rx="13" fill="#e2e8f0" stroke="#cbd5e1"/><text x="744" y="483">agriculture</text>
  </g>
</svg>
