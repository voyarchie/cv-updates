<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" role="img" aria-label="A weather-radar scan shown as a dense detection scene. A radar antenna sweeps a rotating fan beam and samples returned power in range-azimuth bins, which are gridded into a two-dimensional reflectivity image (a plan-position mosaic). In that image an isolated thunderstorm is a compact high-reflectivity blob, a squall line is a long quasi-linear band, a supercell shows a hook echo with a paired inbound-outbound Doppler velocity couplet and a low correlation-coefficient tornado-debris signature, a hail core is a very high reflectivity patch with low differential reflectivity, the melting layer is a bright-band ring in stratiform rain, and non-meteorological ground clutter and birds are echoes to be rejected. The computer-vision job is to detect each storm as an object, segment its footprint, classify the hydrometeor type and storm mode, and predict the next frames.">
  <title>A weather-radar scan = a dense reflectivity image full of storms to detect, classify and predict</title>
  <rect x="0" y="0" width="960" height="480" rx="10" fill="#f4f6fb" stroke="#cbd5e1" stroke-width="1"/>
  <text x="24" y="32" fill="#334155" font-size="17" font-weight="800">A radar scan = sweeping beam &#8594; a reflectivity image of growing, moving storms</text>

  <!-- ============ Panel 1: antenna sweeps a cone into range-azimuth bins ============ -->
  <g>
    <rect x="24" y="52" width="300" height="404" rx="8" fill="#0b1220" stroke="#334155" stroke-width="2"/>
    <text x="38" y="74" fill="#94a3b8" font-size="11.5">1 &#183; one antenna = a rotating fan of range bins</text>

    <!-- radar site -->
    <circle cx="88" cy="300" r="6" fill="#38bdf8"/>
    <rect x="82" y="306" width="12" height="40" fill="#1e293b" stroke="#334155"/>
    <text x="60" y="366" fill="#7dd3fc" font-size="10">radar site (WSR-88D / C-band)</text>

    <!-- sweeping cone -->
    <path d="M88,300 L300,150 A250,250 0 0 1 300,300 Z" fill="#38bdf8" opacity="0.10"/>
    <path d="M88,300 L300,150" stroke="#38bdf8" stroke-width="1.4" opacity="0.5"/>
    <path d="M88,300 L300,300" stroke="#38bdf8" stroke-width="1.4" opacity="0.5"/>
    <!-- current beam -->
    <path d="M88,300 L296,196" stroke="#f59e0b" stroke-width="2.5"/>
    <text x="150" y="188" fill="#fbbf24" font-size="10">beam broadens with range</text>

    <!-- range rings -->
    <path d="M18,300 A70,70 0 0 1 158,300" fill="none" stroke="#475569" stroke-width="1" opacity="0.7"/>
    <path d="M-52,300 A140,140 0 0 1 228,300" fill="none" stroke="#475569" stroke-width="1" opacity="0.6"/>
    <path d="M-122,300 A210,210 0 0 1 298,300" fill="none" stroke="#475569" stroke-width="1" opacity="0.5"/>

    <!-- bins along the beam -->
    <g fill="#f472b6">
      <rect x="150" y="256" width="9" height="7" opacity="0.9"/>
      <rect x="188" y="237" width="9" height="7" opacity="0.75"/>
      <rect x="226" y="218" width="9" height="7" opacity="0.6"/>
    </g>
    <text x="40" y="404" fill="#cbd5e1" font-size="10.5">each (range, azimuth) bin = returned power,</text>
    <text x="40" y="420" fill="#cbd5e1" font-size="10.5">Doppler velocity, &amp; dual-pol variables</text>
    <text x="40" y="442" fill="#94a3b8" font-size="10.5">many radars are stitched into one mosaic</text>
  </g>

  <!-- arrow -->
  <path d="M330,254 L352,254" stroke="#94a3b8" stroke-width="2" marker-end="url(#ah)"/>

  <!-- ============ Panel 2: the reflectivity image ============ -->
  <g>
    <rect x="360" y="52" width="576" height="404" rx="8" fill="#0b1220" stroke="#334155" stroke-width="2"/>
    <text x="374" y="74" fill="#94a3b8" font-size="11.5">2 &#183; grid the bins &#8594; a dense image; every storm is an object</text>

    <!-- faint grid -->
    <g stroke="#1e293b" stroke-width="1">
      <line x1="374" y1="130" x2="922" y2="130"/><line x1="374" y1="200" x2="922" y2="200"/>
      <line x1="374" y1="270" x2="922" y2="270"/><line x1="374" y1="340" x2="922" y2="340"/>
      <line x1="470" y1="92" x2="470" y2="440"/><line x1="600" y1="92" x2="600" y2="440"/>
      <line x1="730" y1="92" x2="730" y2="440"/><line x1="850" y1="92" x2="850" y2="440"/>
    </g>

    <!-- isolated convective cell: compact blob, layered dBZ -->
    <ellipse cx="430" cy="150" rx="34" ry="27" fill="#22d3ee" opacity="0.35"/>
    <ellipse cx="430" cy="150" rx="22" ry="17" fill="#fbbf24" opacity="0.75"/>
    <ellipse cx="430" cy="150" rx="10" ry="8" fill="#f472b6" opacity="0.95"/>
    <text x="392" y="112" fill="#67e8f9" font-size="10.5" font-weight="700">convective cell (blob)</text>

    <!-- squall line / MCS: long quasi-linear band -->
    <path d="M520,430 Q560,330 610,250 Q650,190 720,150" fill="none" stroke="#fbbf24" stroke-width="14" opacity="0.55" stroke-linecap="round"/>
    <path d="M520,430 Q560,330 610,250 Q650,190 720,150" fill="none" stroke="#f472b6" stroke-width="5" opacity="0.85" stroke-linecap="round"/>
    <text x="527" y="418" fill="#fcd34d" font-size="10.5" font-weight="700">squall line / MCS (band)</text>

    <!-- supercell: hook echo + velocity couplet -->
    <g>
      <path d="M812,300 a30,30 0 1 0 12,22 l-16,-6" fill="none" stroke="#f472b6" stroke-width="7" opacity="0.9"/>
      <circle cx="806" cy="292" r="7" fill="#60a5fa"/>
      <circle cx="822" cy="300" r="7" fill="#ef4444"/>
      <text x="770" y="256" fill="#f9a8d4" font-size="10.5" font-weight="700">supercell: hook echo</text>
      <text x="770" y="352" fill="#93c5fd" font-size="9.5">inbound</text>
      <text x="828" y="352" fill="#fca5a5" font-size="9.5">outbound</text>
      <text x="756" y="368" fill="#e2e8f0" font-size="9.5">velocity couplet + low &#961;&#7511;&#7515; (debris)</text>
    </g>

    <!-- hail core: high Z, low ZDR -->
    <rect x="640" y="120" width="30" height="24" rx="4" fill="#f9fafb" opacity="0.9"/>
    <rect x="646" y="126" width="18" height="12" rx="2" fill="#f472b6"/>
    <text x="612" y="112" fill="#f8fafc" font-size="10">hail core (high Z, low Z&#8341;&#7523;)</text>

    <!-- bright band ring (stratiform) -->
    <ellipse cx="500" cy="300" rx="46" ry="34" fill="none" stroke="#a78bfa" stroke-width="6" opacity="0.6"/>
    <text x="454" y="360" fill="#c4b5fd" font-size="10">bright band (melting layer)</text>

    <!-- ground clutter / birds: speckle to reject -->
    <g fill="#64748b" opacity="0.8">
      <circle cx="392" cy="410" r="2.5"/><circle cx="404" cy="420" r="2"/><circle cx="416" cy="404" r="2.5"/>
      <circle cx="428" cy="424" r="2"/><circle cx="440" cy="412" r="2.5"/>
    </g>
    <text x="384" y="446" fill="#94a3b8" font-size="9.5">clutter / birds / AP &#8594; reject (non-met)</text>

    <!-- detection boxes -->
    <g fill="none" stroke="#f8fafc" stroke-width="1.3" stroke-dasharray="4 3">
      <rect x="392" y="120" width="76" height="62" rx="4"/>
      <rect x="772" y="262" width="72" height="76" rx="4"/>
      <rect x="632" y="112" width="46" height="40" rx="4"/>
    </g>
    <text x="600" y="212" fill="#e2e8f0" font-size="10.5" text-anchor="middle">detect &#8594; segment &#8594; classify type/mode &#8594; predict next frames</text>
  </g>

  <defs>
    <marker id="ah" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#94a3b8"/>
    </marker>
  </defs>
</svg>
