<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 620" role="img" aria-label="Why millimetre-wave and terahertz body screening is its own dense-detection primitive">
  <title>The MMW/THz reflection primitive and the privacy-mandated ATR constraint</title>
  <desc>A three-part figure. Left: the three sensing modes — active millimetre-wave (illuminate and receive, portal, higher resolution), passive millimetre-wave (radiometric, standoff, covert, low signal-to-noise) and terahertz (higher resolution, standoff, penetrates more materials). Middle: the physics — non-ionizing waves penetrate clothing and reflect off the body and any concealed object, so a metal gun shows a bright return but a non-metallic threat such as a ceramic blade, powder or liquid barely differs from skin, which is the core difficulty. Right and bottom: the defining legal constraint — the scanner may not show the body image to a human operator, so automatic threat recognition onto a generic avatar is mandatory, and the deliverable is a probability of detection at a fixed per-person false-alarm rate rather than COCO mean average precision.</desc>
  <style>
    .lbl { font-family: ui-sans-serif, system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .h { fill: #f8fafc; font-weight: 700; }
    .t { fill: #e2e8f0; }
    .edge { stroke: #94a3b8; stroke-width: 2; fill: none; }
    .frame { fill: #1f2937; stroke: #94a3b8; stroke-width: 1.5; }
  </style>

  <!-- LEFT PANEL: the three sensing modes -->
  <g class="lbl">
    <rect x="16" y="16" width="300" height="300" rx="12" class="frame"/>
    <text x="166" y="46" text-anchor="middle" class="h" font-size="15">Three sensing modes</text>
    <rect x="36" y="66" width="260" height="66" rx="9" fill="#0369a1" stroke="#075985" stroke-width="1.5"/>
    <text x="166" y="90" text-anchor="middle" class="h" font-size="12.5">Active MMW (~24–80 GHz)</text>
    <text x="166" y="110" text-anchor="middle" class="t" font-size="11">illuminate + receive · portal</text>
    <text x="166" y="126" text-anchor="middle" class="t" font-size="11">higher res · deployed body scanner</text>
    <rect x="36" y="146" width="260" height="66" rx="9" fill="#b45309" stroke="#92400e" stroke-width="1.5"/>
    <text x="166" y="170" text-anchor="middle" class="h" font-size="12.5">Passive MMW (radiometric)</text>
    <text x="166" y="190" text-anchor="middle" class="t" font-size="11">emission/reflection · standoff</text>
    <text x="166" y="206" text-anchor="middle" class="t" font-size="11">covert · very low SNR</text>
    <rect x="36" y="226" width="260" height="66" rx="9" fill="#7c3aed" stroke="#6d28d9" stroke-width="1.5"/>
    <text x="166" y="250" text-anchor="middle" class="h" font-size="12.5">Terahertz (0.1–10 THz)</text>
    <text x="166" y="270" text-anchor="middle" class="t" font-size="11">higher res · standoff</text>
    <text x="166" y="286" text-anchor="middle" class="t" font-size="11">penetrates more materials</text>
  </g>

  <!-- MIDDLE PANEL: the physics -->
  <g class="lbl">
    <rect x="340" y="16" width="300" height="300" rx="12" class="frame"/>
    <text x="490" y="46" text-anchor="middle" class="h" font-size="15">Reflects off body, not through it</text>
    <text x="490" y="66" text-anchor="middle" class="t" font-size="11.5">non-ionizing · penetrates clothing</text>
    <!-- body silhouette -->
    <ellipse cx="490" cy="110" rx="20" ry="24" fill="#475569" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect x="458" y="132" width="64" height="120" rx="16" fill="#475569" stroke="#cbd5e1" stroke-width="1.5"/>
    <!-- metallic threat: bright -->
    <rect x="470" y="160" width="20" height="34" rx="3" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
    <text x="392" y="176" text-anchor="middle" class="h" font-size="11">metal =</text>
    <text x="392" y="192" text-anchor="middle" class="h" font-size="11">bright return</text>
    <line x1="420" y1="182" x2="468" y2="177" class="edge"/>
    <!-- non-metallic threat: faint -->
    <rect x="494" y="196" width="22" height="30" rx="3" fill="#64748b" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="3 3"/>
    <text x="590" y="212" text-anchor="middle" class="t" font-size="11">non-metallic =</text>
    <text x="590" y="228" text-anchor="middle" class="t" font-size="11">nearly invisible</text>
    <line x1="560" y1="216" x2="518" y2="211" class="edge"/>
    <text x="490" y="286" text-anchor="middle" class="t" font-size="11">Ceramic blade, powder, liquid, 3-D-printed:</text>
    <text x="490" y="302" text-anchor="middle" class="t" font-size="11">the hard case — barely differs from skin.</text>
  </g>

  <!-- RIGHT PANEL: the privacy / ATR constraint -->
  <g class="lbl">
    <rect x="664" y="16" width="300" height="300" rx="12" class="frame"/>
    <text x="814" y="46" text-anchor="middle" class="h" font-size="15">Privacy → ATR is mandatory</text>
    <text x="814" y="70" text-anchor="middle" class="t" font-size="11.5">no operator may see the body image</text>
    <!-- avatar with flag -->
    <ellipse cx="814" cy="130" rx="18" ry="20" fill="none" stroke="#22c55e" stroke-width="2.5"/>
    <rect x="786" y="150" width="56" height="96" rx="14" fill="none" stroke="#22c55e" stroke-width="2.5"/>
    <rect x="820" y="175" width="26" height="26" rx="4" fill="#ef4444" stroke="#fca5a5" stroke-width="1.5"/>
    <text x="833" y="193" text-anchor="middle" class="h" font-size="13">!</text>
    <text x="814" y="278" text-anchor="middle" class="t" font-size="11">Generic avatar + auto-flagged zone.</text>
    <text x="814" y="296" text-anchor="middle" class="t" font-size="11">Automatic detection is the law, not a luxury.</text>
  </g>

  <!-- BOTTOM: pipeline + metric -->
  <g class="lbl">
    <text x="490" y="356" text-anchor="middle" class="h" font-size="15">From raw scan to the number that ships</text>
  </g>
  <g class="lbl">
    <rect x="60" y="378" width="176" height="60" rx="10" fill="#0369a1" stroke="#075985" stroke-width="1.5"/>
    <text x="148" y="404" text-anchor="middle" class="h" font-size="12.5">Low-SNR image</text>
    <text x="148" y="423" text-anchor="middle" class="t" font-size="11">speckle · few pixels on target</text>

    <rect x="288" y="378" width="176" height="60" rx="10" fill="#b45309" stroke="#92400e" stroke-width="1.5"/>
    <text x="376" y="404" text-anchor="middle" class="h" font-size="12.5">Enhance / fuse</text>
    <text x="376" y="423" text-anchor="middle" class="t" font-size="11">GAN denoise · +visible/IR</text>

    <rect x="516" y="378" width="176" height="60" rx="10" fill="#15803d" stroke="#166534" stroke-width="1.5"/>
    <text x="604" y="404" text-anchor="middle" class="h" font-size="12.5">Detector / segmenter</text>
    <text x="604" y="423" text-anchor="middle" class="t" font-size="11">YOLO · DETR · UNet · OV</text>

    <rect x="744" y="378" width="212" height="60" rx="10" fill="#1f2937" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="850" y="404" text-anchor="middle" class="h" font-size="12.5">Operating point</text>
    <text x="850" y="423" text-anchor="middle" class="t" font-size="11">P_d @ fixed per-person P_fa</text>
  </g>
  <g class="edge">
    <line x1="236" y1="408" x2="288" y2="408"/>
    <line x1="464" y1="408" x2="516" y2="408"/>
    <line x1="692" y1="408" x2="744" y2="408"/>
  </g>

  <!-- footnote -->
  <g class="lbl">
    <text x="490" y="480" text-anchor="middle" class="t" font-size="12">Non-ionizing and clothing-penetrating — the safety win over X-ray — but low-resolution, low-contrast and speckle-limited.</text>
    <text x="490" y="502" text-anchor="middle" class="t" font-size="12">Labels are scarce and privacy-constrained, so simulation, GAN synthesis and open-vocabulary transfer route around the wall.</text>
    <text x="490" y="524" text-anchor="middle" class="t" font-size="11.5" fill="#94a3b8">Colours mark sensing mode (active MMW blue, passive MMW amber, THz violet); brightness in the middle panel is radar return strength, not appearance.</text>
  </g>
</svg>
