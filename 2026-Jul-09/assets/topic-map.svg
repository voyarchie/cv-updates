<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 620" role="img" aria-label="Topic map for the 2026-Jul-09 CV update">
  <title>Topic map — 2026-Jul-09 CV update</title>
  <desc>A radial topic map of six threads in millimetre-wave and terahertz person-screening dense detection and classification: the reflection-imaging primitive (active/passive millimetre-wave and terahertz) and why it breaks natural-image vision, including the privacy-mandated automatic-target-recognition constraint; the detection zoo of YOLO and transformer detectors tuned for low signal-to-noise; segmentation and body-region context; passive-millimetre-wave plus visible/infrared fusion; open-vocabulary, foundation models and the privacy-driven data wall; and datasets, the probability-of-detection versus false-alarm metric and deployment as portal and standoff scanners.</desc>
  <style>
    .lbl { font-family: ui-sans-serif, system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .edge { stroke: #94a3b8; stroke-width: 2; }
    .node { stroke-width: 1.5; }
    .nt { fill: #f8fafc; font-weight: 600; }
    .ns { fill: #e2e8f0; }
  </style>
  <!-- edges -->
  <g class="edge" fill="none">
    <line x1="490" y1="310" x2="315" y2="150"/>
    <line x1="490" y1="310" x2="665" y2="150"/>
    <line x1="490" y1="310" x2="255" y2="310"/>
    <line x1="490" y1="310" x2="725" y2="310"/>
    <line x1="490" y1="310" x2="315" y2="470"/>
    <line x1="490" y1="310" x2="665" y2="470"/>
  </g>
  <!-- hub -->
  <g class="lbl">
    <rect x="360" y="266" width="260" height="88" rx="12" fill="#1f2937" stroke="#94a3b8" class="node"/>
    <text x="490" y="298" text-anchor="middle" class="nt" font-size="15">MMW / THz body screening</text>
    <text x="490" y="319" text-anchor="middle" class="nt" font-size="15">dense detection</text>
    <text x="490" y="340" text-anchor="middle" class="ns" font-size="12.5">+ classification</text>
  </g>
  <!-- T1 primitive (green) -->
  <g class="lbl">
    <rect x="112" y="86" width="260" height="92" rx="12" fill="#15803d" stroke="#166534" class="node"/>
    <text x="242" y="116" text-anchor="middle" class="nt" font-size="13.5">1 · The reflection primitive</text>
    <text x="242" y="136" text-anchor="middle" class="ns" font-size="12">active/passive MMW · THz</text>
    <text x="242" y="154" text-anchor="middle" class="ns" font-size="12">non-ionizing · privacy → ATR</text>
  </g>
  <!-- T2 detection zoo (blue) -->
  <g class="lbl">
    <rect x="608" y="86" width="260" height="92" rx="12" fill="#0369a1" stroke="#075985" class="node"/>
    <text x="738" y="116" text-anchor="middle" class="nt" font-size="13.5">2 · Detection under low SNR</text>
    <text x="738" y="136" text-anchor="middle" class="ns" font-size="12">CFIPC/adaptation-YOLO · MWYOLOv5</text>
    <text x="738" y="154" text-anchor="middle" class="ns" font-size="12">TA-DETR · small-object heads</text>
  </g>
  <!-- T3 segmentation & body context (amber) -->
  <g class="lbl">
    <rect x="4" y="264" width="252" height="92" rx="12" fill="#b45309" stroke="#92400e" class="node"/>
    <text x="130" y="294" text-anchor="middle" class="nt" font-size="13.5">3 · Segmentation · body context</text>
    <text x="130" y="314" text-anchor="middle" class="ns" font-size="12">FA-UNet PMMW seg</text>
    <text x="130" y="332" text-anchor="middle" class="ns" font-size="12">shape/location &gt; grayscale</text>
  </g>
  <!-- T4 fusion (green) -->
  <g class="lbl">
    <rect x="724" y="264" width="252" height="92" rx="12" fill="#15803d" stroke="#166534" class="node"/>
    <text x="850" y="294" text-anchor="middle" class="nt" font-size="13.5">4 · PMMW + visible/IR fusion</text>
    <text x="850" y="314" text-anchor="middle" class="ns" font-size="12">GAN reconstruct · registration</text>
    <text x="850" y="332" text-anchor="middle" class="ns" font-size="12">wavelet fusion · lower P_fa</text>
  </g>
  <!-- T5 open-vocab / foundation / data (green) -->
  <g class="lbl">
    <rect x="112" y="442" width="260" height="92" rx="12" fill="#15803d" stroke="#166534" class="node"/>
    <text x="242" y="472" text-anchor="middle" class="nt" font-size="13.5">5 · Open-vocab · data wall</text>
    <text x="242" y="492" text-anchor="middle" class="ns" font-size="12">YOLO-World for AMMW · CLIP</text>
    <text x="242" y="510" text-anchor="middle" class="ns" font-size="12">CGAN aug · EM sim · few labels</text>
  </g>
  <!-- T6 data / metrics / deployment (green) -->
  <g class="lbl">
    <rect x="608" y="442" width="260" height="92" rx="12" fill="#15803d" stroke="#166534" class="node"/>
    <text x="738" y="472" text-anchor="middle" class="nt" font-size="13.5">6 · Data · metrics · deploy</text>
    <text x="738" y="492" text-anchor="middle" class="ns" font-size="12">PTI2000 · P_d @ fixed P_fa</text>
    <text x="738" y="510" text-anchor="middle" class="ns" font-size="12">portal vs standoff · non-metallic</text>
  </g>
</svg>
