<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 620" role="img" aria-label="Topic map for the 2026-Jun-19 CV update">
  <title>Topic map — 2026-Jun-19 CV update</title>
  <desc>A radial topic map showing eight dense detection / classification threads grouped under four families: temporal and regime-stressed detection (video object detection and long-tailed / large-vocabulary detection); label-efficient open-vocabulary and weakly-supervised semantic segmentation; low-level dense structure prediction (image matting and edge / line-segment detection); and change and relational structure (bi-temporal change detection and scene graph generation).</desc>
  <style>
    .hub    { fill: none; stroke: currentColor; stroke-width: 1.7; }
    .spoke  { fill: none; stroke: currentColor; stroke-width: 1.1; opacity: 0.5; }
    .node   { stroke: currentColor; stroke-width: 1.3; }
    .det    { fill: rgba(59,130,246,0.16); }
    .seg    { fill: rgba(168,85,247,0.16); }
    .low    { fill: rgba(16,185,129,0.16); }
    .rel    { fill: rgba(244,114,182,0.16); }
    .lbl    { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 13px; fill: currentColor; }
    .sub    { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 10.5px; fill: currentColor; opacity: 0.72; }
    .hublbl { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 13px; font-weight: 600; fill: currentColor; }
    .keylbl { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 11px; font-weight: 600; fill: currentColor; letter-spacing: 0.03em; }
    .swatch { stroke: currentColor; stroke-width: 1; }
  </style>

  <!-- spokes -->
  <line class="spoke" x1="480" y1="285" x2="480" y2="92"/>
  <line class="spoke" x1="480" y1="285" x2="722" y2="150"/>
  <line class="spoke" x1="480" y1="285" x2="800" y2="285"/>
  <line class="spoke" x1="480" y1="285" x2="722" y2="420"/>
  <line class="spoke" x1="480" y1="285" x2="480" y2="478"/>
  <line class="spoke" x1="480" y1="285" x2="238" y2="420"/>
  <line class="spoke" x1="480" y1="285" x2="160" y2="285"/>
  <line class="spoke" x1="480" y1="285" x2="238" y2="150"/>

  <!-- hub -->
  <circle class="hub" cx="480" cy="285" r="54"/>
  <text class="hublbl" x="480" y="281" text-anchor="middle">Dense detection</text>
  <text class="hublbl" x="480" y="298" text-anchor="middle">&amp; classification</text>

  <!-- N: Video object detection (det) -->
  <rect class="node det" x="374" y="67" width="212" height="50" rx="9"/>
  <text class="lbl" x="480" y="88" text-anchor="middle">Video object detection</text>
  <text class="sub" x="480" y="105" text-anchor="middle">FGFA · SELSA · MEGA · TransVOD</text>

  <!-- NE: Long-tail / large-vocab detection (det) -->
  <rect class="node det" x="616" y="125" width="212" height="50" rx="9"/>
  <text class="lbl" x="722" y="146" text-anchor="middle">Long-tail / LVIS detection</text>
  <text class="sub" x="722" y="163" text-anchor="middle">EQL · Seesaw · BAGS · Detic</text>

  <!-- E: Open-vocab semantic seg (seg) -->
  <rect class="node seg" x="694" y="260" width="212" height="50" rx="9"/>
  <text class="lbl" x="800" y="281" text-anchor="middle">Open-vocab semantic seg.</text>
  <text class="sub" x="800" y="298" text-anchor="middle">LSeg · CAT-Seg · SAN · FC-CLIP</text>

  <!-- SE: Weakly-supervised semantic seg (seg) -->
  <rect class="node seg" x="616" y="395" width="212" height="50" rx="9"/>
  <text class="lbl" x="722" y="416" text-anchor="middle">Weakly-supervised seg.</text>
  <text class="sub" x="722" y="433" text-anchor="middle">CAM · SEAM · ToCo · WeCLIP</text>

  <!-- S: Scene graph generation (rel) -->
  <rect class="node rel" x="374" y="453" width="212" height="50" rx="9"/>
  <text class="lbl" x="480" y="474" text-anchor="middle">Scene graph generation</text>
  <text class="sub" x="480" y="491" text-anchor="middle">Motifs · TDE · SGTR · OvSGTR</text>

  <!-- SW: Change detection (rel) -->
  <rect class="node rel" x="132" y="395" width="212" height="50" rx="9"/>
  <text class="lbl" x="238" y="416" text-anchor="middle">Change detection</text>
  <text class="sub" x="238" y="433" text-anchor="middle">FC-Siam · BIT · AnyChange · Changen2</text>

  <!-- W: Edge / line-segment detection (low) -->
  <rect class="node low" x="54" y="260" width="212" height="50" rx="9"/>
  <text class="lbl" x="160" y="281" text-anchor="middle">Edge / line-segment det.</text>
  <text class="sub" x="160" y="298" text-anchor="middle">HED · EDTER · HAWP · DT-LSD</text>

  <!-- NW: Image matting (low) -->
  <rect class="node low" x="132" y="125" width="212" height="50" rx="9"/>
  <text class="lbl" x="238" y="146" text-anchor="middle">Image matting</text>
  <text class="sub" x="238" y="163" text-anchor="middle">DIM · MODNet · ViTMatte · MAM</text>

  <!-- legend -->
  <text class="keylbl" x="60" y="556">FAMILIES</text>
  <rect class="swatch det" x="60"  y="568" width="16" height="12" rx="2"/>
  <text class="sub" x="84"  y="578">Temporal &amp; regime-stressed detection</text>
  <rect class="swatch seg" x="330" y="568" width="16" height="12" rx="2"/>
  <text class="sub" x="354" y="578">Label-efficient segmentation</text>
  <rect class="swatch low" x="560" y="568" width="16" height="12" rx="2"/>
  <text class="sub" x="584" y="578">Low-level dense structure</text>
  <rect class="swatch rel" x="770" y="568" width="16" height="12" rx="2"/>
  <text class="sub" x="794" y="578">Change &amp; relations</text>
</svg>
