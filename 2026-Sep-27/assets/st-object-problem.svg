<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" role="img" aria-label="The object problem in subcellular spatial transcriptomics. Two neighbouring cells, A and B, each have a stained nucleus and a cloud of detected RNA molecules; blue molecules come from cell A marker genes and orange from cell B. Panel 1 draws the boundary at the nucleus only: every molecule inside is correct but most molecules are left unassigned. Panel 2 expands each nucleus by a fixed radius: most molecules are captured but orange cell-B molecules fall inside cell A, creating contaminated doublet-like profiles. Panel 3 uses a transcript-aware model that bends the boundary to follow molecule identity, capturing most molecules while keeping each cell pure. Below, an axis shows the capture versus purity trade-off that benchmarks report is tissue dependent.">
