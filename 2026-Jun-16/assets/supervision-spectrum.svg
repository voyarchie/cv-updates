<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 250" role="img" aria-label="Annotation-cost vs localization-signal spectrum">
  <title>Supervision-cost spectrum for object detection</title>
  <desc>Image-level tags, single points, and full boxes ordered by annotation time per image and by the strength of the localization signal they provide.</desc>
  <style>
    .axis  { stroke: currentColor; stroke-width: 1.4; }
    .tick  { stroke: currentColor; stroke-width: 1; opacity: 0.6; }
    .lbl   { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 13px; fill: currentColor; }
    .big   { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 14px; font-weight: 600; fill: currentColor; }
    .sub   { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 11px; fill: currentColor; opacity: 0.72; }
    .ax    { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 11.5px; font-weight: 600; fill: currentColor; letter-spacing: 0.03em; }
    .tag   { fill: rgba(16,185,129,0.18);  stroke: currentColor; stroke-width: 1.2; }
    .pt    { fill: rgba(59,130,246,0.18);  stroke: currentColor; stroke-width: 1.2; }
    .box   { fill: rgba(244,114,182,0.18); stroke: currentColor; stroke-width: 1.2; }
  </style>

  <!-- baseline axis (cost) -->
  <line class="axis" x1="60" y1="170" x2="700" y2="170"/>
  <polygon points="700,170 690,165 690,175" fill="currentColor"/>
  <text class="ax" x="60" y="200">CHEAPER  →  ANNOTATION COST PER IMAGE  →  COSTLIER</text>

  <!-- image-level tag -->
  <line class="tick" x1="130" y1="166" x2="130" y2="174"/>
  <rect class="tag" x="92" y="78" width="76" height="56" rx="8"/>
  <text class="big" x="130" y="110" text-anchor="middle">tag</text>
  <text class="lbl" x="130" y="152" text-anchor="middle">image-level</text>
  <text class="sub" x="130" y="58"  text-anchor="middle">~1.5 s</text>
  <text class="sub" x="130" y="222" text-anchor="middle">no location</text>

  <!-- single point -->
  <line class="tick" x1="210" y1="166" x2="210" y2="174"/>
  <rect class="pt" x="172" y="78" width="76" height="56" rx="8"/>
  <circle cx="210" cy="106" r="5" fill="currentColor"/>
  <text class="lbl" x="210" y="152" text-anchor="middle">point</text>
  <text class="sub" x="210" y="58"  text-anchor="middle">~1.9 s</text>
  <text class="sub" x="210" y="222" text-anchor="middle">coarse prior</text>

  <!-- full box -->
  <line class="tick" x1="600" y1="166" x2="600" y2="174"/>
  <rect class="box" x="562" y="78" width="76" height="56" rx="8"/>
  <rect x="578" y="92" width="44" height="30" rx="2" fill="none" stroke="currentColor" stroke-width="1.6"/>
  <text class="lbl" x="600" y="152" text-anchor="middle">box</text>
  <text class="sub" x="600" y="58"  text-anchor="middle">~34.5 s</text>
  <text class="sub" x="600" y="222" text-anchor="middle">exact extent</text>

  <!-- ~20x bracket -->
  <line class="tick" x1="210" y1="44" x2="600" y2="44"/>
  <text class="sub" x="405" y="38" text-anchor="middle">≈ 20× more expensive</text>
</svg>
