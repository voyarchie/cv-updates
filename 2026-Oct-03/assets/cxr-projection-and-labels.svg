<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" role="img" aria-label="The chest radiograph as a dense-vision primitive. Left: three acquisition geometries. PA (posteroanterior) is taken standing, beam from back to front, the standard outpatient view. AP (anteroposterior) is taken portable at the bedside, often supine, with magnified heart, lower contrast and lines and tubes in the image; it is used for ICU and emergency patients, who are also sicker. Lateral is a side view used with PA. Because view type correlates with how sick the patient is, view is a confounder: one 2026 study found PA versus AP explained 69 to 87 percent of variation in AI performance, versus 5 to 30 percent for age and under 2 percent for sex. Right: the label space has five layers: image-level labels such as normal versus abnormal and 14 to 45 findings; anatomical regions such as lung zones, heart, mediastinum and costophrenic angles; finding boxes or masks such as nodules, consolidation, pneumothorax and effusion; devices such as endotracheal tubes, central lines, nasogastric tubes and chest drains, scored by tip position; and temporal change relative to a prior study: new, improved, worse or stable.">
  <title>Chest radiograph: three geometries, five label layers</title>
  <defs>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#b45309"/></marker>
  </defs>
  <rect x="0" y="0" width="960" height="440" rx="10" fill="#f4f6fb" stroke="#cbd5e1"/>
  <text x="24" y="32" fill="#334155" font-size="16.5" font-weight="800">The chest radiograph: one 2D projection, three geometries, five label layers</text>
  <text x="24" y="52" fill="#64748b" font-size="11.5">Everything between the X-ray source and the detector is summed into one pixel; ribs, heart and lung overlap.</text>

  <!-- geometry panels -->
  <g font-size="11.5">
    <!-- PA -->
    <rect x="24" y="70" width="140" height="190" rx="8" fill="#ffffff" stroke="#94a3b8"/>
    <text x="36" y="90" fill="#0f766e" font-weight="800" font-size="13">PA · standing</text>
    <ellipse cx="94" cy="160" rx="34" ry="46" fill="#ccfbf1" stroke="#0f766e"/>
    <rect x="132" y="112" width="8" height="96" fill="#334155"/>
    <circle cx="40" cy="160" r="6" fill="#b45309"/>
    <path d="M46 160 L130 160" stroke="#b45309" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#b)"/>
    <text x="36" y="228" fill="#334155">back → front</text>
    <text x="36" y="244" fill="#64748b" font-size="10.5">outpatient default</text>

    <!-- AP -->
    <rect x="174" y="70" width="140" height="190" rx="8" fill="#ffffff" stroke="#94a3b8"/>
    <text x="186" y="90" fill="#b45309" font-weight="800" font-size="13">AP · portable</text>
    <ellipse cx="244" cy="160" rx="40" ry="46" fill="#fef3c7" stroke="#b45309"/>
    <path d="M232 118 C236 140 240 170 236 196" stroke="#475569" stroke-width="2.5" fill="none"/>
    <path d="M262 122 C270 150 266 178 274 196" stroke="#475569" stroke-width="2" fill="none"/>
    <rect x="182" y="112" width="8" height="96" fill="#334155"/>
    <circle cx="300" cy="160" r="6" fill="#b45309"/>
    <path d="M294 160 L196 160" stroke="#b45309" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#b)"/>
    <text x="186" y="228" fill="#334155">front → back, supine</text>
    <text x="186" y="244" fill="#64748b" font-size="10.5">ICU / ED: tubes, big heart</text>

    <!-- Lateral -->
    <rect x="324" y="70" width="140" height="190" rx="8" fill="#ffffff" stroke="#94a3b8"/>
    <text x="336" y="90" fill="#4338ca" font-weight="800" font-size="13">Lateral</text>
    <ellipse cx="394" cy="160" rx="26" ry="46" fill="#e0e7ff" stroke="#4338ca"/>
    <rect x="432" y="112" width="8" height="96" fill="#334155"/>
    <circle cx="340" cy="160" r="6" fill="#b45309"/>
    <path d="M346 160 L430 160" stroke="#b45309" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#b)"/>
    <text x="336" y="228" fill="#334155">side view, paired with PA</text>
    <text x="336" y="244" fill="#64748b" font-size="10.5">behind-heart findings</text>
  </g>

  <!-- confounder callout -->
  <rect x="24" y="276" width="440" height="140" rx="8" fill="#fff7ed" stroke="#b45309"/>
  <text x="38" y="298" fill="#78350f" font-weight="800" font-size="13">View is a confounder, not just a nuisance</text>
  <g font-size="11.5" fill="#334155">
    <text x="38" y="320">AP films come from sicker patients, so a model can learn</text>
    <text x="38" y="336">"portable = disease". In a Jan 2026 external-validation study,</text>
    <text x="38" y="352">PA vs AP explained <tspan font-weight="800">69–87%</tspan> of the variation in AI</text>
    <text x="38" y="368">performance; age <tspan font-weight="800">5–30%</tspan>, sex <tspan font-weight="800">&lt;2%</tspan>. Five systems</text>
    <text x="38" y="384">missed <tspan font-weight="800">30–78%</tspan> of pneumonia in standing (PA) patients.</text>
    <text x="38" y="404" fill="#64748b" font-size="10.5">medRxiv 10.64898/2026.01.20.26344495 (preprint, not peer reviewed)</text>
  </g>

  <!-- label layers -->
  <text x="490" y="90" fill="#334155" font-weight="800" font-size="13">Label layers (coarse → fine)</text>
  <g font-size="11.5">
    <rect x="490" y="102" width="446" height="52" rx="6" fill="#e2e8f0" stroke="#475569"/>
    <text x="504" y="122" fill="#0f172a" font-weight="800">1 · Image level</text>
    <text x="504" y="141" fill="#334155">normal vs abnormal; 14 → 30 → 45 findings (CheXpert, CXR-LT)</text>

    <rect x="490" y="160" width="446" height="52" rx="6" fill="#ccfbf1" stroke="#0f766e"/>
    <text x="504" y="180" fill="#134e4a" font-weight="800">2 · Anatomical regions</text>
    <text x="504" y="199" fill="#334155">lung zones, heart, mediastinum, CP angles (region tokens)</text>

    <rect x="490" y="218" width="446" height="52" rx="6" fill="#fef3c7" stroke="#b45309"/>
    <text x="504" y="238" fill="#78350f" font-weight="800">3 · Findings: boxes / masks</text>
    <text x="504" y="257" fill="#334155">nodule, consolidation, pneumothorax, effusion (VinDr, PadChest-GR)</text>

    <rect x="490" y="276" width="446" height="52" rx="6" fill="#e0e7ff" stroke="#4338ca"/>
    <text x="504" y="296" fill="#312e81" font-weight="800">4 · Devices</text>
    <text x="504" y="315" fill="#334155">ET tube, central line, NG tube, drain — scored by tip position</text>

    <rect x="490" y="334" width="446" height="52" rx="6" fill="#dcfce7" stroke="#15803d"/>
    <text x="504" y="354" fill="#14532d" font-weight="800">5 · Change vs prior study</text>
    <text x="504" y="373" fill="#334155">new / improved / worse / stable, per finding and region</text>
  </g>
  <text x="490" y="410" fill="#64748b" font-size="10.5">Benchmarks climb this ladder: CXR-LT (1) → Foundation X (2–3) → NoduLoCC (3) → GRCD, CheXGround (5).</text>
</svg>
