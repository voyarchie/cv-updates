<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" role="img" aria-label="Diagram of the weld inspection image. Left: a cross-section of a butt weld between two plates, showing where typical defects sit: porosity inside the weld metal, a crack, lack of fusion along the sidewall, incomplete penetration at the root, slag inclusion, and undercut and spatter on the surface. Middle: four sensing modalities see different subsets of those defects: a surface camera or laser profile sees undercut, spatter and surface pores; in-process weld-pool cameras see the molten pool and keyhole while welding; radiography (film or digital) projects the volume onto a 2D image where porosity, slag, cracks and incomplete penetration appear as darker or lighter regions along a long thin weld strip; phased-array ultrasound gives B-scan or TFM images where planar defects such as lack of fusion reflect strongly. Right: the output is not just a box but a disposition: defect class and size are graded against an acceptance standard such as ISO 5817 quality levels or ISO 10675 radiographic acceptance levels, giving accept, repair, or reject.">
  <title>The weld inspection image: one joint, four ways of seeing it</title>
  <rect x="0" y="0" width="960" height="520" rx="10" fill="#f4f6fb" stroke="#cbd5e1"/>
  <text x="24" y="34" fill="#334155" font-size="17" font-weight="800">The weld inspection image: one joint, four ways of seeing it</text>
  <text x="24" y="54" fill="#64748b" font-size="11.5">Defects live in 3D inside a long thin bead; each modality sees a different subset, and the answer is graded against a standard, not just boxed.</text>

  <!-- Panel 1: cross-section -->
  <text x="24" y="88" fill="#334155" font-size="13" font-weight="800">1 · Where defects sit (butt weld, cross-section)</text>
  <rect x="24" y="100" width="300" height="250" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
  <!-- plates -->
  <polygon points="40,200 150,200 165,300 40,300" fill="#cbd5e1" stroke="#64748b"/>
  <polygon points="308,200 198,200 183,300 308,300" fill="#cbd5e1" stroke="#64748b"/>
  <!-- weld bead -->
  <path d="M150,200 Q174,178 198,200 L183,300 Q174,308 165,300 Z" fill="#fcd34d" stroke="#b45309" stroke-width="1.5"/>
  <!-- porosity -->
  <circle cx="170" cy="230" r="4" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.5"/>
  <circle cx="180" cy="242" r="3" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.5"/>
  <circle cx="174" cy="252" r="2.5" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.5"/>
  <!-- crack -->
  <polyline points="176,262 179,270 175,277 180,286" fill="none" stroke="#b91c1c" stroke-width="2"/>
  <!-- lack of fusion -->
  <line x1="153" y1="212" x2="164" y2="290" stroke="#7c3aed" stroke-width="3"/>
  <!-- incomplete penetration -->
  <rect x="168" y="296" width="12" height="6" fill="#0f766e"/>
  <!-- slag -->
  <ellipse cx="188" cy="222" rx="5" ry="3" fill="#475569"/>
  <!-- undercut -->
  <path d="M196,199 q4,6 10,1" fill="none" stroke="#c2410c" stroke-width="2.5"/>
  <!-- spatter -->
  <circle cx="226" cy="194" r="2.5" fill="#c2410c"/><circle cx="240" cy="196" r="2" fill="#c2410c"/>
  <g font-size="10.5" fill="#334155">
    <text x="40" y="122">● <tspan fill="#1d4ed8" font-weight="700">porosity</tspan> (volumetric)</text>
    <text x="40" y="138">● <tspan fill="#475569" font-weight="700">slag inclusion</tspan> (volumetric)</text>
    <text x="40" y="154">● <tspan fill="#b91c1c" font-weight="700">crack</tspan> (planar, thin)</text>
    <text x="40" y="170">● <tspan fill="#7c3aed" font-weight="700">lack of fusion</tspan> (planar, on sidewall)</text>
    <text x="190" y="122">● <tspan fill="#0f766e" font-weight="700">incomplete pen.</tspan> (root)</text>
    <text x="190" y="138">● <tspan fill="#c2410c" font-weight="700">undercut, spatter</tspan></text>
    <text x="190" y="154" fill="#64748b">(surface only)</text>
  </g>
  <text x="40" y="330" font-size="10.5" fill="#64748b">Planar defects are thin; seen edge-on by X-ray</text>
  <text x="40" y="344" font-size="10.5" fill="#64748b">they can almost vanish. Orientation matters.</text>

  <!-- Panel 2: modalities -->
  <text x="344" y="88" fill="#334155" font-size="13" font-weight="800">2 · Four images of the same joint</text>
  <g font-size="11">
    <rect x="344" y="100" width="300" height="56" rx="6" fill="#dbeafe" stroke="#1d4ed8"/>
    <text x="356" y="120" fill="#1e3a8a" font-weight="800">Surface camera / laser profile</text>
    <text x="356" y="138" fill="#1e3a8a">undercut, spatter, surface pores, bead shape;</text>
    <text x="356" y="152" fill="#1e3a8a">also seam tracking (laser stripe)</text>

    <rect x="344" y="164" width="300" height="56" rx="6" fill="#fef3c7" stroke="#b45309"/>
    <text x="356" y="184" fill="#78350f" font-weight="800">In-process weld-pool camera</text>
    <text x="356" y="202" fill="#78350f">molten pool + keyhole, while welding;</text>
    <text x="356" y="216" fill="#78350f">predicts penetration before the bead cools</text>

    <rect x="344" y="228" width="300" height="70" rx="6" fill="#ede9fe" stroke="#7c3aed"/>
    <text x="356" y="248" fill="#4c1d95" font-weight="800">Radiography (film → CR/DR)</text>
    <text x="356" y="266" fill="#4c1d95">3D volume projected to 2D; weld is a long</text>
    <text x="356" y="280" fill="#4c1d95">thin strip, low contrast, defects tiny vs frame</text>
    <rect x="530" y="285" width="104" height="8" fill="#a78bfa"/>
    <circle cx="552" cy="289" r="2" fill="#4c1d95"/><circle cx="560" cy="289" r="1.5" fill="#4c1d95"/>
    <line x1="590" y1="286" x2="606" y2="291" stroke="#4c1d95" stroke-width="1.2"/>

    <rect x="344" y="306" width="300" height="56" rx="6" fill="#ccfbf1" stroke="#0f766e"/>
    <text x="356" y="326" fill="#134e4a" font-weight="800">Phased-array ultrasound (B-scan / TFM)</text>
    <text x="356" y="344" fill="#134e4a">echoes; planar defects (LOF, cracks) reflect</text>
    <text x="356" y="358" fill="#134e4a">strongly; geometry echoes look like defects</text>
  </g>

  <!-- arrows -->
  <g stroke="#64748b" stroke-width="1.8" fill="none">
    <line x1="644" y1="128" x2="676" y2="200"/>
    <line x1="644" y1="192" x2="676" y2="210"/>
    <line x1="644" y1="262" x2="676" y2="222"/>
    <line x1="644" y1="334" x2="676" y2="232"/>
  </g>

  <!-- Panel 3: disposition -->
  <text x="680" y="88" fill="#334155" font-size="13" font-weight="800">3 · Output is a disposition</text>
  <rect x="680" y="160" width="256" height="104" rx="6" fill="#ffffff" stroke="#334155"/>
  <g font-size="11" fill="#334155">
    <text x="692" y="180" font-weight="800">Detect · classify · measure</text>
    <text x="692" y="198">class, length, diameter, depth,</text>
    <text x="692" y="212">count per weld length</text>
    <text x="692" y="234" font-weight="800">Grade vs standard</text>
    <text x="692" y="252">e.g. ISO 5817 level B/C/D, ISO 10675</text>
  </g>
  <g font-size="11.5" font-weight="800">
    <rect x="680" y="284" width="78" height="30" rx="6" fill="#dcfce7" stroke="#15803d"/>
    <text x="700" y="304" fill="#14532d">accept</text>
    <rect x="769" y="284" width="78" height="30" rx="6" fill="#fef9c3" stroke="#a16207"/>
    <text x="790" y="304" fill="#713f12">repair</text>
    <rect x="858" y="284" width="78" height="30" rx="6" fill="#fee2e2" stroke="#b91c1c"/>
    <text x="879" y="304" fill="#7f1d1d">reject</text>
  </g>
  <g stroke="#64748b" stroke-width="1.5"><line x1="719" y1="264" x2="719" y2="284"/><line x1="808" y1="264" x2="808" y2="284"/><line x1="897" y1="264" x2="897" y2="284"/></g>
  <text x="680" y="340" font-size="10.5" fill="#64748b">Benchmarks mostly score the first box;</text>
  <text x="680" y="354" font-size="10.5" fill="#64748b">the grading step is rarely evaluated.</text>

  <!-- datasets strip -->
  <rect x="24" y="378" width="912" height="124" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="38" y="400" fill="#334155" font-size="13" font-weight="800">Public data, by what it keeps</text>
  <g font-size="11" fill="#334155">
    <text x="38" y="422"><tspan font-weight="800" fill="#4c1d95">GDXray Welds</tspan>: 68 long radiographs, only 10 with official masks (radiography, segmentation)</text>
    <text x="38" y="440"><tspan font-weight="800" fill="#4c1d95">RIAWELC</tspan>: 24,407 crops of 224×224, 4 classes; crops, not whole films, so split by source film or leak</text>
    <text x="38" y="458"><tspan font-weight="800" fill="#4c1d95">SWRD</tspan>: ~3,600 pipeline seam radiographs with polygon labels (preprint);  <tspan font-weight="800" fill="#4c1d95">WDXI</tspan>: 13,766 images, 7 classes, not yet open</text>
    <text x="38" y="476"><tspan font-weight="800" fill="#1e3a8a">WELD / SWRDv2 (IEEE DataPort)</tspan>: surface anomaly set, train on good only, pixel GT on test anomalies</text>
    <text x="38" y="494"><tspan font-weight="800" fill="#1e3a8a">SMAW surface set (Mendeley, Aug 2026)</tspan>: 448 phone photos, spatter / slag / undercut</text>
  </g>
</svg>
