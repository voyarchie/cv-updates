<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" role="img" aria-label="The muography learning pipeline, drawn as five stages left to right. Stage one, the raw signal: sparse, noisy muon tracks recorded by tracking detectors, each with an entry direction, an exit direction, and optionally a momentum estimate. Stage two, reconstruction: classical methods such as point of closest approach and maximum-likelihood expectation-maximization are increasingly replaced or refined by learned methods, including three-dimensional convolutional-neural-network denoisers, physics-informed trajectory reconstruction that models multiple Coulomb scattering, generative models that fill in low-statistics images, and projection-shifted super-resolution. Stage three, detection: clustering such as HDBSCAN separates multiple objects, and anomaly detection flags voids, high-Z cores, and missing fuel assemblies against an expected model. Stage four, dense classification: material atomic number Z is estimated per region using transfer learning, artificial neural networks, and coarse momentum encoding with unsupervised domain adaptation to close the simulation-to-measurement gap. Stage five, the application heads that supply the labels: nuclear security and safeguards, volcano monitoring and eruption forecasting, archaeology, industrial process monitoring such as blast furnaces, and cargo and border screening. A feedback arrow notes that Geant4 Monte-Carlo simulation supplies most training labels, which is why the simulation-to-real domain gap is the central obstacle.">
  <title>The muography learning pipeline: sparse tracks &#8594; learned reconstruction &#8594; detection &#8594; Z-classification &#8594; application heads</title>
  <rect x="0" y="0" width="960" height="560" rx="10" fill="#f4f6fb" stroke="#cbd5e1" stroke-width="1"/>
  <text x="24" y="32" fill="#334155" font-size="17" font-weight="800">From sparse muon tracks to a labeled 3D scene &#8212; where learning is entering the muography stack</text>

  <!-- flow arrows baseline -->
  <defs>
    <marker id="fl" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto">
      <path d="M0 0 L7 3 L0 6 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <!-- Stage 1: raw signal -->
  <g>
    <rect x="20" y="60" width="168" height="180" rx="8" fill="#0b1220" stroke="#334155" stroke-width="2"/>
    <text x="34" y="82" fill="#e2e8f0" font-size="12" font-weight="800">1 &#183; raw signal</text>
    <text x="34" y="100" fill="#94a3b8" font-size="10">sparse, noisy muon tracks</text>
    <!-- tiny track sketch -->
    <g stroke="#38bdf8" stroke-width="1.3">
      <line x1="44" y1="120" x2="60" y2="160"/><line x1="60" y1="160" x2="72" y2="200"/>
      <line x1="120" y1="120" x2="132" y2="160"/><line x1="132" y1="160" x2="150" y2="200"/>
    </g>
    <circle cx="60" cy="160" r="3" fill="#fbbf24"/><circle cx="132" cy="160" r="3" fill="#fbbf24"/>
    <text x="34" y="222" fill="#7dd3fc" font-size="9.5">in-dir, out-dir, (momentum p)</text>
  </g>

  <!-- Stage 2: reconstruction -->
  <g>
    <rect x="204" y="60" width="212" height="290" rx="8" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1.5"/>
    <text x="218" y="82" fill="#3730a3" font-size="12" font-weight="800">2 &#183; reconstruction</text>
    <rect x="218" y="94" width="184" height="42" rx="5" fill="#e0e7ff" stroke="#c7d2fe" stroke-width="1"/>
    <text x="228" y="111" fill="#1e293b" font-size="10" font-weight="700">classical: PoCA &#183; MLEM/EM</text>
    <text x="228" y="126" fill="#475569" font-size="9">binocular kink &#8594; voxel scattering</text>

    <rect x="218" y="144" width="184" height="196" rx="5" fill="#0b1220"/>
    <text x="230" y="163" fill="#f8fafc" font-size="10" font-weight="700">learned &amp; hybrid</text>
    <text x="230" y="182" fill="#93c5fd" font-size="9.5">&#8226; 3D-CNN denoiser on PoCA grid</text>
    <text x="230" y="200" fill="#93c5fd" font-size="9.5">&#8226; physics-informed traj. (&#956;TRec,</text>
    <text x="240" y="213" fill="#93c5fd" font-size="9.5">multiple-Coulomb-scatter model)</text>
    <text x="230" y="231" fill="#93c5fd" font-size="9.5">&#8226; generative fill-in @ low stats</text>
    <text x="230" y="249" fill="#93c5fd" font-size="9.5">&#8226; projection-shifted super-res</text>
    <text x="230" y="267" fill="#93c5fd" font-size="9.5">&#8226; subpixel track regression</text>
    <text x="230" y="292" fill="#cbd5e1" font-size="9">order-of-magnitude faster,</text>
    <text x="230" y="305" fill="#cbd5e1" font-size="9">higher SNR at fixed exposure</text>
    <text x="230" y="326" fill="#a5b4fc" font-size="9">output: dense density / scattering field</text>
  </g>

  <!-- Stage 3: detection -->
  <g>
    <rect x="432" y="60" width="196" height="150" rx="8" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.5"/>
    <text x="446" y="82" fill="#9a3412" font-size="12" font-weight="800">3 &#183; detection</text>
    <text x="446" y="102" fill="#7c2d12" font-size="9.5">&#8226; HDBSCAN cluster &#8594; separate</text>
    <text x="456" y="115" fill="#7c2d12" font-size="9.5">multiple objects</text>
    <text x="446" y="133" fill="#7c2d12" font-size="9.5">&#8226; anomaly vs expected model</text>
    <text x="446" y="151" fill="#7c2d12" font-size="9.5">&#8226; targets: voids, high-Z cores,</text>
    <text x="456" y="164" fill="#7c2d12" font-size="9.5">missing fuel assemblies</text>
    <text x="446" y="188" fill="#b45309" font-size="9">localize + volume + shape</text>
  </g>

  <!-- Stage 4: classification -->
  <g>
    <rect x="432" y="222" width="196" height="128" rx="8" fill="#0b1220" stroke="#334155" stroke-width="2"/>
    <text x="446" y="244" fill="#f8fafc" font-size="12" font-weight="800">4 &#183; classify: material Z</text>
    <text x="446" y="264" fill="#c4b5fd" font-size="9.5">&#8226; transfer learning &#8594; Z classes</text>
    <text x="446" y="282" fill="#c4b5fd" font-size="9.5">&#8226; ANN on scattering features</text>
    <text x="446" y="300" fill="#c4b5fd" font-size="9.5">&#8226; coarse momentum encoding</text>
    <text x="446" y="318" fill="#c4b5fd" font-size="9.5">&#8226; UDA closes sim&#8594;real gap</text>
    <text x="446" y="338" fill="#a5b4fc" font-size="9">low-Z / medium / high-Z ranking</text>
  </g>

  <!-- Stage 5: application heads -->
  <g>
    <rect x="644" y="60" width="296" height="290" rx="8" fill="#ecfeff" stroke="#a5f3fc" stroke-width="1.5"/>
    <text x="658" y="82" fill="#155e75" font-size="12" font-weight="800">5 &#183; application heads = the label source</text>
    <g font-size="10">
      <rect x="658" y="96" width="268" height="40" rx="5" fill="#0b1220"/>
      <text x="670" y="113" fill="#f8fafc" font-weight="700">nuclear security &amp; safeguards</text>
      <text x="670" y="128" fill="#94a3b8">spent-fuel casks, reactors, microreactors, SNM</text>

      <rect x="658" y="142" width="268" height="40" rx="5" fill="#0b1220"/>
      <text x="670" y="159" fill="#f8fafc" font-weight="700">volcanology</text>
      <text x="670" y="174" fill="#94a3b8">conduit density, CNN eruption forecasting</text>

      <rect x="658" y="188" width="268" height="36" rx="5" fill="#0b1220"/>
      <text x="670" y="205" fill="#f8fafc" font-weight="700">archaeology</text>
      <text x="670" y="219" fill="#94a3b8">pyramid voids &amp; corridors (ScanPyramids)</text>

      <rect x="658" y="230" width="268" height="36" rx="5" fill="#0b1220"/>
      <text x="670" y="247" fill="#f8fafc" font-weight="700">industrial process monitoring</text>
      <text x="670" y="261" fill="#94a3b8">blast-furnace burden line (BLEMAB)</text>

      <rect x="658" y="272" width="268" height="36" rx="5" fill="#0b1220"/>
      <text x="670" y="289" fill="#f8fafc" font-weight="700">cargo &amp; border screening</text>
      <text x="670" y="303" fill="#94a3b8">maritime containers, contraband high-Z</text>
    </g>
    <text x="658" y="330" fill="#0e7490" font-size="9.5">each head defines what counts as an object &amp; a class</text>
  </g>

  <!-- connective arrows -->
  <g stroke="#94a3b8" stroke-width="2" fill="none">
    <line x1="188" y1="150" x2="202" y2="150" marker-end="url(#fl)"/>
    <line x1="416" y1="150" x2="430" y2="135" marker-end="url(#fl)"/>
    <line x1="416" y1="230" x2="430" y2="270" marker-end="url(#fl)"/>
    <line x1="628" y1="135" x2="642" y2="150" marker-end="url(#fl)"/>
    <line x1="628" y1="286" x2="642" y2="240" marker-end="url(#fl)"/>
    <line x1="530" y1="210" x2="530" y2="221" marker-end="url(#fl)"/>
  </g>

  <!-- feedback: simulation supplies labels -->
  <g>
    <rect x="20" y="392" width="920" height="146" rx="8" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5"/>
    <text x="34" y="414" fill="#991b1b" font-size="12" font-weight="800">The training-label problem &#8212; and why sim&#8594;real is the whole game</text>
    <text x="34" y="436" fill="#7f1d1d" font-size="10.5">&#8226; Ground truth is scarce: you rarely get to open a volcano, a loaded cask, or a sealed container. So <tspan font-weight="700">Geant4 Monte-Carlo</tspan> supplies almost all labels &#8212;</text>
    <text x="44" y="452" fill="#7f1d1d" font-size="10.5">geometry, materials, and per-muon truth are known exactly in simulation.</text>
    <text x="34" y="474" fill="#7f1d1d" font-size="10.5">&#8226; But detector response, cosmic-flux modeling, and real backgrounds differ from sim &#8594; a <tspan font-weight="700">domain gap</tspan> that unsupervised domain adaptation,</text>
    <text x="44" y="490" fill="#7f1d1d" font-size="10.5">physics-informed priors, and momentum measurement all try to close.</text>
    <text x="34" y="512" fill="#7f1d1d" font-size="10.5">&#8226; And the exposure is long: minutes for dense-lab objects, <tspan font-weight="700">days to months</tspan> for a volcano or a pyramid &#8212; so label-efficiency and denoising pay off directly.</text>
    <text x="34" y="530" fill="#b91c1c" font-size="10">Feedback: better sim &#8594; better labels &#8594; better learned reconstruction &#8594; but only if the sim&#8594;real gap is modeled, not ignored.</text>
  </g>
</svg>
