<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" role="img" aria-label="Diagram of the livestock barn image. Four views: the pig pen seen from a ceiling camera, where a group of look-alike pigs is detected, tracked and classified by behaviour; the poultry house, where thousands of birds are counted and dead or lame birds and floor eggs are detected; the dairy barn and milking rotary, where individual cows are re-identified by coat pattern and scored for lameness and body condition; and the depth or thermal camera, where back point clouds give weight and ear-root temperature gives fever. All feed a per-animal and per-pen health and production ledger.">
  <title>The livestock barn image: four views, one animal ledger</title>
  <rect x="0" y="0" width="960" height="470" rx="10" fill="#f4f6fb" stroke="#cbd5e1"/>
  <text x="24" y="34" fill="#334155" font-size="17" font-weight="800">The livestock barn image: four views, one animal ledger</text>
  <text x="24" y="54" fill="#64748b" font-size="11.5">Look-alike animals in a fixed pen, filmed for weeks; identity must survive piling, night IR and dirt; outputs are per-animal health records</text>

  <g font-size="12" fill="#334155">
    <!-- pig pen -->
    <rect x="24" y="72" width="300" height="168" rx="8" fill="#e0e7ff" stroke="#6366f1"/>
    <text x="38" y="94" font-weight="700">① Pig pen — ceiling camera</text>
    <g fill="#f9a8d4" stroke="#be185d" stroke-width="1.2">
      <ellipse cx="70" cy="140" rx="24" ry="12" transform="rotate(20 70 140)"/>
      <ellipse cx="112" cy="128" rx="24" ry="12" transform="rotate(-10 112 128)"/>
      <ellipse cx="98" cy="160" rx="24" ry="12" transform="rotate(5 98 160)"/>
      <ellipse cx="150" cy="150" rx="24" ry="12" transform="rotate(40 150 150)"/>
      <ellipse cx="190" cy="125" rx="24" ry="12"/>
      <ellipse cx="200" cy="175" rx="24" ry="12" transform="rotate(-30 200 175)"/>
    </g>
    <rect x="44" y="124" width="54" height="34" fill="none" stroke="#4f46e5" stroke-dasharray="3 2"/>
    <text x="46" y="120" font-size="10" fill="#4338ca">ID 3 · lying</text>
    <text x="236" y="125" font-size="10.5">detect</text>
    <text x="236" y="140" font-size="10.5">track / re-ID</text>
    <text x="236" y="155" font-size="10.5">behaviour</text>
    <text x="236" y="170" font-size="10.5">(tail-biting,</text>
    <text x="236" y="185" font-size="10.5"> feeding, lying)</text>
    <text x="38" y="226" font-size="10.5" fill="#475569">PigDetect / PigTrack · Edinburgh Pig · Grounded-SAM2</text>

    <!-- poultry -->
    <rect x="336" y="72" width="300" height="168" rx="8" fill="#fef3c7" stroke="#d97706"/>
    <text x="350" y="94" font-weight="700">② Poultry house — flock camera</text>
    <g fill="#fde68a" stroke="#92400e" stroke-width="1">
      <circle cx="370" cy="125" r="8"/><circle cx="388" cy="132" r="8"/><circle cx="406" cy="122" r="8"/>
      <circle cx="424" cy="134" r="8"/><circle cx="378" cy="150" r="8"/><circle cx="396" cy="156" r="8"/>
      <circle cx="414" cy="150" r="8"/><circle cx="432" cy="158" r="8"/><circle cx="450" cy="128" r="8"/>
      <circle cx="450" cy="148" r="8"/><circle cx="366" cy="172" r="8"/><circle cx="386" cy="180" r="8"/>
      <circle cx="404" cy="176" r="8"/><circle cx="440" cy="178" r="8"/>
    </g>
    <circle cx="422" cy="198" r="9" fill="#94a3b8" stroke="#dc2626" stroke-width="2"/>
    <ellipse cx="465" cy="200" rx="5" ry="7" fill="#fff7ed" stroke="#92400e"/>
    <text x="490" y="125" font-size="10.5">count (density map)</text>
    <text x="490" y="140" font-size="10.5">dead / lying bird</text>
    <text x="490" y="155" font-size="10.5">gait score</text>
    <text x="490" y="170" font-size="10.5">floor eggs</text>
    <text x="350" y="226" font-size="10.5" fill="#475569">Dense-Chicken · TP-MVCC · UGA cage-free sets</text>

    <!-- dairy -->
    <rect x="24" y="252" width="300" height="168" rx="8" fill="#dcfce7" stroke="#16a34a"/>
    <text x="38" y="274" font-weight="700">③ Dairy barn / rotary — top &amp; side</text>
    <rect x="50" y="296" width="80" height="40" rx="14" fill="#ffffff" stroke="#166534"/>
    <path d="M62 300 q10 10 0 22 q14 -4 20 8 M100 298 q-6 12 8 20 q10 4 14 14" fill="#1f2937"/>
    <rect x="150" y="296" width="80" height="40" rx="14" fill="#ffffff" stroke="#166534"/>
    <path d="M170 298 q12 6 6 22 q-10 6 -4 14 M200 300 q14 8 20 26" fill="#1f2937"/>
    <text x="50" y="354" font-size="10.5">coat pattern = biometric ID</text>
    <text x="50" y="370" font-size="10.5">keypoints → lameness · BCS · behaviour</text>
    <text x="38" y="406" font-size="10.5" fill="#475569">Cows2021 · MultiCamCows · MOO · CVB · Cattle-CLIP</text>

    <!-- depth/thermal -->
    <rect x="336" y="252" width="300" height="168" rx="8" fill="#fee2e2" stroke="#dc2626"/>
    <text x="350" y="274" font-weight="700">④ Depth &amp; thermal — at the feeder/scale</text>
    <defs>
      <linearGradient id="lbHeat" x1="0" x2="1">
        <stop offset="0" stop-color="#3b82f6"/><stop offset="0.5" stop-color="#facc15"/><stop offset="1" stop-color="#ef4444"/>
      </linearGradient>
    </defs>
    <ellipse cx="420" cy="320" rx="56" ry="22" fill="url(#lbHeat)" stroke="#7f1d1d"/>
    <circle cx="470" cy="308" r="6" fill="none" stroke="#111827" stroke-width="2"/>
    <text x="486" y="300" font-size="10.5">ear-root ROI → °C</text>
    <text x="486" y="318" font-size="10.5">back point cloud</text>
    <text x="486" y="333" font-size="10.5">→ weight (kg)</text>
    <text x="350" y="370" font-size="10.5">YOLO ear ROI · PointNet / KPConv</text>
    <text x="350" y="406" font-size="10.5" fill="#475569">mostly private, single-farm data</text>
  </g>

  <!-- arrows and ledger -->
  <g stroke="#64748b" stroke-width="1.6" fill="none">
    <path d="M652 84 L664 84 L664 408 L652 408"/>
    <path d="M664 240 L692 240"/>
    <path d="M686 234 L694 240 L686 246" fill="#64748b"/>
  </g>
  <rect x="700" y="150" width="236" height="180" rx="8" fill="#ffffff" stroke="#475569"/>
  <text x="714" y="174" font-size="13" font-weight="800" fill="#334155">Per-animal / per-pen ledger</text>
  <g font-size="11.5" fill="#334155">
    <text x="714" y="198">• head count, mortality</text>
    <text x="714" y="218">• ID-linked behaviour budget</text>
    <text x="714" y="238">• tail-biting / aggression alarm</text>
    <text x="714" y="258">• lameness &amp; body condition</text>
    <text x="714" y="278">• weight curve, sort-to-market</text>
    <text x="714" y="298">• fever / disease early warning</text>
    <text x="714" y="318">• welfare audit evidence</text>
  </g>
</svg>
