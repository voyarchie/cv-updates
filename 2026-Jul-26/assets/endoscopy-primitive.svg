<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" role="img" aria-label="What makes the endoscopic frame a distinct primitive: a coupled light-camera probe inside a deforming, specular lumen, and the four dense tasks it feeds">
  <title>The endoscopic frame — a coupled light-camera probe, and the tasks it feeds</title>
  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#94a3b8"/>
    </marker>
  </defs>

  <!-- left: the probe inside the lumen -->
  <g>
    <rect x="30" y="60" width="250" height="350" rx="14" fill="#1e293b" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="155" y="90" text-anchor="middle" fill="#f8fafc" font-size="14" font-weight="700">The probe = light + camera</text>
    <text x="155" y="110" text-anchor="middle" fill="#cbd5e1" font-size="11.5">move together, one rigid unit</text>

    <!-- lumen wall -->
    <ellipse cx="155" cy="270" rx="105" ry="105" fill="none" stroke="#f97316" stroke-width="3"/>
    <ellipse cx="155" cy="270" rx="55" ry="55" fill="#0f172a" stroke="#f97316" stroke-width="2" stroke-dasharray="5 4"/>
    <text x="155" y="392" text-anchor="middle" fill="#fdba74" font-size="11">deforming mucosal wall</text>

    <!-- specular highlights -->
    <circle cx="120" cy="225" r="6" fill="#fde68a"/>
    <circle cx="195" cy="245" r="5" fill="#fde68a"/>
    <circle cx="170" cy="315" r="4" fill="#fde68a"/>
    <text x="245" y="205" text-anchor="end" fill="#fde68a" font-size="10">specular</text>
    <text x="245" y="218" text-anchor="end" fill="#fde68a" font-size="10">glare</text>

    <!-- camera at center -->
    <circle cx="155" cy="270" r="16" fill="#4f46e5" stroke="#e0e7ff" stroke-width="1.5"/>
    <text x="155" y="274" text-anchor="middle" fill="#e0e7ff" font-size="10" font-weight="700">cam</text>
  </g>

  <!-- consequences band -->
  <g font-size="11">
    <rect x="315" y="55" width="235" height="80" rx="9" fill="#0f766e" stroke="#115e59"/>
    <text x="332" y="78" fill="#f8fafc" font-size="12" font-weight="700">No global coordinate frame</text>
    <text x="332" y="96" fill="#ccfbf1">brightness falls off with distance;</text>
    <text x="332" y="112" fill="#ccfbf1">a moved light re-lights the scene;</text>
    <text x="332" y="128" fill="#ccfbf1">photometric loss is unreliable</text>

    <rect x="315" y="150" width="235" height="72" rx="9" fill="#9333ea" stroke="#6b21a8"/>
    <text x="332" y="173" fill="#f8fafc" font-size="12" font-weight="700">Non-rigid &amp; occluded</text>
    <text x="332" y="191" fill="#f3e8ff">peristalsis, breathing, smoke,</text>
    <text x="332" y="207" fill="#f3e8ff">blood, tools passing through view</text>

    <rect x="315" y="237" width="235" height="72" rx="9" fill="#b45309" stroke="#92400e"/>
    <text x="332" y="260" fill="#f8fafc" font-size="12" font-weight="700">Must run live</text>
    <text x="332" y="278" fill="#fde68a">latency budget in ms; a late box</text>
    <text x="332" y="294" fill="#fde68a">on a passed polyp is worthless</text>

    <rect x="315" y="324" width="235" height="80" rx="9" fill="#be123c" stroke="#9f1239"/>
    <text x="332" y="347" fill="#f8fafc" font-size="12" font-weight="700">Label scarcity + drift</text>
    <text x="332" y="365" fill="#ffe4e6">few boxed frames; each scope brand,</text>
    <text x="332" y="381" fill="#ffe4e6">light source &amp; prep is a new domain;</text>
    <text x="332" y="397" fill="#ffe4e6">self-supervision fills the gap</text>
  </g>

  <!-- arrow to tasks -->
  <line x1="555" y1="230" x2="605" y2="230" stroke="#94a3b8" stroke-width="2" marker-end="url(#ar)"/>

  <!-- right: dense tasks -->
  <g font-size="11">
    <rect x="612" y="60" width="260" height="66" rx="9" fill="#0369a1" stroke="#075985"/>
    <text x="628" y="86" fill="#f8fafc" font-size="12" font-weight="700">Detect / classify</text>
    <text x="628" y="105" fill="#e0f2fe">lesions, polyps, bleeding, tools</text>

    <rect x="612" y="136" width="260" height="66" rx="9" fill="#0369a1" stroke="#075985"/>
    <text x="628" y="162" fill="#f8fafc" font-size="12" font-weight="700">Segment</text>
    <text x="628" y="181" fill="#e0f2fe">instruments, anatomy, margins</text>

    <rect x="612" y="212" width="260" height="66" rx="9" fill="#0369a1" stroke="#075985"/>
    <text x="628" y="238" fill="#f8fafc" font-size="12" font-weight="700">Recognize workflow</text>
    <text x="628" y="257" fill="#e0f2fe">surgical phase / step over time</text>

    <rect x="612" y="288" width="260" height="66" rx="9" fill="#0369a1" stroke="#075985"/>
    <text x="628" y="314" fill="#f8fafc" font-size="12" font-weight="700">Reconstruct geometry</text>
    <text x="628" y="333" fill="#e0f2fe">depth, camera pose, 3D/4D surface</text>

    <rect x="612" y="364" width="260" height="66" rx="9" fill="#0369a1" stroke="#075985"/>
    <text x="628" y="390" fill="#f8fafc" font-size="12" font-weight="700">Describe / answer</text>
    <text x="628" y="409" fill="#e0f2fe">captions, findings, VQA</text>
  </g>
</svg>
