<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 660" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" role="img" aria-label="Topic map of the seven in-vivo endoscopic-video dense-detection and classification threads">
  <title>In-vivo endoscopic video — seven dense-detection &amp; classification threads</title>
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#94a3b8"/>
    </marker>
  </defs>
  <!-- edges -->
  <g stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#ah)">
    <line x1="450" y1="330" x2="205" y2="150"/>
    <line x1="450" y1="330" x2="450" y2="128"/>
    <line x1="450" y1="330" x2="695" y2="150"/>
    <line x1="450" y1="330" x2="150" y2="330"/>
    <line x1="450" y1="330" x2="750" y2="330"/>
    <line x1="450" y1="330" x2="255" y2="512"/>
    <line x1="450" y1="330" x2="645" y2="512"/>
  </g>
  <!-- hub -->
  <g>
    <rect x="318" y="284" width="264" height="92" rx="12" fill="#1e293b" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="450" y="314" text-anchor="middle" fill="#f8fafc" font-size="15" font-weight="700">The in-vivo video frame</text>
    <text x="450" y="336" text-anchor="middle" fill="#cbd5e1" font-size="12.5">light welded to the camera,</text>
    <text x="450" y="354" text-anchor="middle" fill="#cbd5e1" font-size="12.5">inside a wet, deforming lumen</text>
  </g>
  <!-- nodes -->
  <g font-size="12" fill="#f8fafc">
    <!-- 1 primitive (top-left) -->
    <rect x="45" y="92" width="300" height="86" rx="10" fill="#4f46e5" stroke="#3730a3"/>
    <text x="60" y="116" font-size="12.5" font-weight="700">1 &#183; The primitive</text>
    <text x="60" y="134" font-size="11.5" fill="#e0e7ff">specular wet mucosa &#183; no world frame</text>
    <text x="60" y="150" font-size="11.5" fill="#e0e7ff">non-rigid tissue &#183; real-time constraint</text>
    <text x="60" y="168" font-size="11.5" fill="#e0e7ff">illumination coupled to viewpoint</text>

    <!-- 2 lesion detection (top-center) -->
    <rect x="300" y="42" width="300" height="86" rx="10" fill="#0f766e" stroke="#115e59"/>
    <text x="315" y="66" font-size="12.5" font-weight="700">2 &#183; Dense lesion detection</text>
    <text x="315" y="84" font-size="11.5" fill="#ccfbf1">polyp CADe &#183; capsule small-bowel</text>
    <text x="315" y="100" font-size="11.5" fill="#ccfbf1">real-time &#183; false-positive suppression</text>
    <text x="315" y="118" font-size="11.5" fill="#ccfbf1">the sensitivity/FP trade</text>

    <!-- 3 instruments (top-right) -->
    <rect x="555" y="92" width="300" height="86" rx="10" fill="#9333ea" stroke="#6b21a8"/>
    <text x="570" y="116" font-size="12.5" font-weight="700">3 &#183; Instruments &amp; anatomy</text>
    <text x="570" y="134" font-size="11.5" fill="#f3e8ff">tool detection &amp; segmentation</text>
    <text x="570" y="150" font-size="11.5" fill="#f3e8ff">SAM/SAM 2 adapted to surgery</text>
    <text x="570" y="168" font-size="11.5" fill="#f3e8ff">stereo &#183; temporal consistency</text>

    <!-- 4 workflow (mid-left) -->
    <rect x="0" y="287" width="150" height="86" rx="10" fill="#b45309" stroke="#92400e"/>
    <text x="12" y="311" font-size="12" font-weight="700">4 &#183; Workflow</text>
    <text x="12" y="329" font-size="11" fill="#fde68a">phase / step</text>
    <text x="12" y="345" font-size="11" fill="#fde68a">recognition</text>
    <text x="12" y="361" font-size="11" fill="#fde68a">the time axis</text>

    <!-- 5 geometry (mid-right) -->
    <rect x="750" y="287" width="150" height="86" rx="10" fill="#0369a1" stroke="#075985"/>
    <text x="762" y="311" font-size="12" font-weight="700">5 &#183; Geometry</text>
    <text x="762" y="329" font-size="11" fill="#e0f2fe">depth &#183; SLAM</text>
    <text x="762" y="345" font-size="11" fill="#e0f2fe">4D Gaussian</text>
    <text x="762" y="361" font-size="11" fill="#e0f2fe">reconstruction</text>

    <!-- 6 foundation / VLM (bottom-left) -->
    <rect x="100" y="526" width="310" height="86" rx="10" fill="#be123c" stroke="#9f1239"/>
    <text x="115" y="550" font-size="12.5" font-weight="700">6 &#183; Foundation &amp; language</text>
    <text x="115" y="568" font-size="11.5" fill="#ffe4e6">Endo-FM &#183; SurgVLP / PeskaVLP</text>
    <text x="115" y="584" font-size="11.5" fill="#ffe4e6">lecture-video pretraining</text>
    <text x="115" y="600" font-size="11.5" fill="#ffe4e6">GI VQA &#183; report generation</text>

    <!-- 7 clinical reality (bottom-right) -->
    <rect x="490" y="526" width="310" height="86" rx="10" fill="#334155" stroke="#475569"/>
    <text x="505" y="550" font-size="12.5" font-weight="700">7 &#183; Clinical reality</text>
    <text x="505" y="568" font-size="11.5" fill="#e2e8f0">RCTs &#183; adenoma detection rate</text>
    <text x="505" y="584" font-size="11.5" fill="#e2e8f0">deskilling &#183; domain shift</text>
    <text x="505" y="600" font-size="11.5" fill="#e2e8f0">multi-device generalization</text>
  </g>
</svg>
