<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 640" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" role="img" aria-label="Topic map of the six terahertz dense-detection and classification threads arranged around the terahertz signal primitive">
  <title>Terahertz — six dense-detection &amp; classification threads around one primitive</title>
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#94a3b8"/>
    </marker>
  </defs>
  <!-- edges -->
  <g stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#ah)">
    <line x1="460" y1="320" x2="185" y2="130"/>
    <line x1="460" y1="320" x2="460" y2="128"/>
    <line x1="460" y1="320" x2="735" y2="130"/>
    <line x1="460" y1="320" x2="185" y2="512"/>
    <line x1="460" y1="320" x2="460" y2="514"/>
    <line x1="460" y1="320" x2="735" y2="512"/>
  </g>
  <!-- hub -->
  <g>
    <rect x="322" y="272" width="276" height="98" rx="12" fill="#1e293b" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="460" y="302" text-anchor="middle" fill="#f8fafc" font-size="15" font-weight="700">The THz signal</text>
    <text x="460" y="324" text-anchor="middle" fill="#cbd5e1" font-size="12">a slow, low-res, water-gated cube where</text>
    <text x="460" y="342" text-anchor="middle" fill="#cbd5e1" font-size="12">each pixel is a spectrum + a depth,</text>
    <text x="460" y="360" text-anchor="middle" fill="#cbd5e1" font-size="12">not a picture</text>
  </g>
  <!-- nodes -->
  <g>
    <!-- 1 computational imaging -->
    <rect x="30" y="72" width="300" height="96" rx="10" fill="#4f46e5" stroke="#3730a3"/>
    <text x="45" y="96" fill="#ffffff" font-size="12.5" font-weight="700">1 &#183; Computational imaging (&#167;4)</text>
    <text x="45" y="115" fill="#e0e7ff" font-size="11">single-pixel, super-resolution, denoising</text>
    <text x="45" y="132" fill="#e0e7ff" font-size="11">physics-enhanced nets sit upstream of</text>
    <text x="45" y="149" fill="#e0e7ff" font-size="11">every detector — the picture is inferred</text>
    <!-- 2 spectral classification -->
    <rect x="310" y="72" width="300" height="96" rx="10" fill="#0891b2" stroke="#0e7490"/>
    <text x="325" y="96" fill="#ffffff" font-size="12.5" font-weight="700">2 &#183; Spectral classification (&#167;5)</text>
    <text x="325" y="115" fill="#e0f2fe" font-size="11">the class label lives in the per-pixel</text>
    <text x="325" y="132" fill="#e0f2fe" font-size="11">THz-TDS fingerprint — explosives, drugs,</text>
    <text x="325" y="149" fill="#e0f2fe" font-size="11">chemicals, materials; CNN + transformer</text>
    <!-- 3 dense detection / security -->
    <rect x="590" y="72" width="300" height="96" rx="10" fill="#0d9488" stroke="#0f766e"/>
    <text x="605" y="96" fill="#ffffff" font-size="12.5" font-weight="700">3 &#183; Dense detection (&#167;6)</text>
    <text x="605" y="115" fill="#ccfbf1" font-size="11">concealed weapons/objects on the body;</text>
    <text x="605" y="132" fill="#ccfbf1" font-size="11">low-res, low-SNR, tiny targets; YOLO &amp;</text>
    <text x="605" y="149" fill="#ccfbf1" font-size="11">DETR variants; MMW crossover</text>
    <!-- 4 NDT -->
    <rect x="30" y="472" width="300" height="96" rx="10" fill="#b45309" stroke="#92400e"/>
    <text x="45" y="496" fill="#ffffff" font-size="12.5" font-weight="700">4 &#183; Non-destructive testing (&#167;7)</text>
    <text x="45" y="515" fill="#fef3c7" font-size="11">defects, voids, delamination in layered</text>
    <text x="45" y="532" fill="#fef3c7" font-size="11">composites &amp; coatings; depth-resolved</text>
    <text x="45" y="549" fill="#fef3c7" font-size="11">B/C-scans; classify defect type</text>
    <!-- 5 biomedical -->
    <rect x="310" y="472" width="300" height="96" rx="10" fill="#be123c" stroke="#9f1239"/>
    <text x="325" y="496" fill="#ffffff" font-size="12.5" font-weight="700">5 &#183; Biomedical mapping (&#167;8)</text>
    <text x="325" y="515" fill="#ffe4e6" font-size="11">water-contrast tumour margins, burn</text>
    <text x="325" y="532" fill="#ffe4e6" font-size="11">depth, skin lesions; non-imaging reflection</text>
    <text x="325" y="549" fill="#ffe4e6" font-size="11">data reconstructed to interpretable maps</text>
    <!-- 6 data / foundation gap -->
    <rect x="590" y="472" width="300" height="96" rx="10" fill="#6d28d9" stroke="#5b21b6"/>
    <text x="605" y="496" fill="#ffffff" font-size="12.5" font-weight="700">6 &#183; The data &amp; domain gap (&#167;9)</text>
    <text x="605" y="515" fill="#ede9fe" font-size="11">no big pretrained THz model; scarce,</text>
    <text x="605" y="532" fill="#ede9fe" font-size="11">costly labels; per-instrument drift;</text>
    <text x="605" y="549" fill="#ede9fe" font-size="11">physics-informed &amp; synthetic data</text>
  </g>
</svg>
