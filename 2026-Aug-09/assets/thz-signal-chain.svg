<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 600" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" role="img" aria-label="The terahertz signal chain from source through the sample to a per-pixel time-domain waveform that yields both a molecular spectrum and a depth, then computational reconstruction and dense recognition">
  <title>THz signal chain — one waveform per pixel becomes a spectrum and a depth</title>
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#94a3b8"/>
    </marker>
  </defs>

  <!-- Band 1: acquisition spine -->
  <g stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#a)">
    <line x1="230" y1="82" x2="266" y2="82"/>
    <line x1="520" y1="82" x2="556" y2="82"/>
  </g>
  <g>
    <rect x="30" y="44" width="200" height="76" rx="10" fill="#1e293b" stroke="#94a3b8"/>
    <text x="130" y="76" text-anchor="middle" fill="#f8fafc" font-size="12.5" font-weight="700">THz source</text>
    <text x="130" y="95" text-anchor="middle" fill="#cbd5e1" font-size="10.5">0.1&#8211;10 THz &#183; &#955; 0.03&#8211;3 mm</text>
    <text x="130" y="110" text-anchor="middle" fill="#cbd5e1" font-size="10.5">non-ionizing (unlike X-ray)</text>

    <rect x="266" y="44" width="254" height="76" rx="10" fill="#1e293b" stroke="#94a3b8"/>
    <text x="393" y="72" text-anchor="middle" fill="#f8fafc" font-size="12.5" font-weight="700">Sample interaction</text>
    <text x="393" y="90" text-anchor="middle" fill="#cbd5e1" font-size="10.5">penetrates plastics, paper, clothing</text>
    <text x="393" y="105" text-anchor="middle" fill="#cbd5e1" font-size="10.5">absorbed by water &#183; blocked by metal</text>

    <rect x="556" y="44" width="200" height="76" rx="10" fill="#1e293b" stroke="#94a3b8"/>
    <text x="656" y="76" text-anchor="middle" fill="#f8fafc" font-size="12.5" font-weight="700">Detector</text>
    <text x="656" y="95" text-anchor="middle" fill="#cbd5e1" font-size="10.5">TDS (pulsed) or CW</text>
    <text x="656" y="110" text-anchor="middle" fill="#cbd5e1" font-size="10.5">one point at a time</text>
  </g>

  <!-- branch down from detector -->
  <g stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#a)">
    <path d="M656,120 L656,150 L393,150 L393,182"/>
    <path d="M656,120 L656,150 L790,150 L790,182"/>
  </g>

  <!-- Band 2: TDS product = spectrum + depth ; CW product = intensity -->
  <g>
    <!-- the key insight box spanning both products -->
    <rect x="30" y="182" width="920" height="150" rx="12" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="45" y="204" fill="#64748b" font-size="11.5" font-weight="700">Each pixel is a full time-domain waveform &#8212; not a single number</text>

    <rect x="270" y="216" width="246" height="66" rx="10" fill="#334155" stroke="#94a3b8"/>
    <text x="393" y="244" text-anchor="middle" fill="#f8fafc" font-size="12" font-weight="700">TDS: per-pixel waveform</text>
    <text x="393" y="263" text-anchor="middle" fill="#cbd5e1" font-size="10.5">FFT &#8594; complex spectrum + arrival time</text>

    <!-- spectrum product -->
    <rect x="55" y="216" width="190" height="66" rx="10" fill="#0891b2" stroke="#0e7490"/>
    <text x="150" y="244" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="700">Spectrum = fingerprint</text>
    <text x="150" y="263" text-anchor="middle" fill="#e0f2fe" font-size="10.5">&#8594; classification (&#167;5)</text>

    <!-- depth product -->
    <rect x="540" y="216" width="190" height="66" rx="10" fill="#b45309" stroke="#92400e"/>
    <text x="635" y="244" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="700">Time-of-flight = depth</text>
    <text x="635" y="263" text-anchor="middle" fill="#fef3c7" font-size="10.5">&#8594; B/C-scan tomography (&#167;7)</text>

    <!-- CW product -->
    <rect x="750" y="216" width="180" height="66" rx="10" fill="#475569" stroke="#94a3b8"/>
    <text x="840" y="244" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="700">CW intensity image</text>
    <text x="840" y="263" text-anchor="middle" fill="#e2e8f0" font-size="10.5">single-frequency amp/phase</text>

    <!-- arrows tds -> spectrum & depth -->
    <g stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#a)">
      <line x1="270" y1="249" x2="249" y2="249"/>
      <line x1="516" y1="249" x2="536" y2="249"/>
    </g>
    <text x="393" y="305" text-anchor="middle" fill="#64748b" font-size="10.5">a THz cube = a spectrum stack with a depth axis, gated by water content</text>
  </g>

  <!-- arrow to back-end -->
  <g stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#a)">
    <line x1="490" y1="332" x2="490" y2="372"/>
  </g>

  <!-- Band 3: acquisition reality + reconstruction -->
  <g>
    <rect x="30" y="374" width="440" height="80" rx="10" fill="#4f46e5" stroke="#3730a3"/>
    <text x="250" y="402" text-anchor="middle" fill="#ffffff" font-size="12.5" font-weight="700">Acquisition reality (&#167;4)</text>
    <text x="250" y="421" text-anchor="middle" fill="#e0e7ff" font-size="10.5">raster single-pixel / focal-plane array &#8212; slow,</text>
    <text x="250" y="438" text-anchor="middle" fill="#e0e7ff" font-size="10.5">diffraction-limited (sub-mm), low SNR</text>

    <rect x="510" y="374" width="440" height="80" rx="10" fill="#4f46e5" stroke="#3730a3"/>
    <text x="730" y="402" text-anchor="middle" fill="#ffffff" font-size="12.5" font-weight="700">Computational reconstruction &amp; denoising</text>
    <text x="730" y="421" text-anchor="middle" fill="#e0e7ff" font-size="10.5">physics-enhanced / untrained nets, super-resolution</text>
    <text x="730" y="438" text-anchor="middle" fill="#e0e7ff" font-size="10.5">the picture is inferred before anything is recognized</text>

    <line x1="470" y1="414" x2="506" y2="414" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)" fill="none"/>
  </g>

  <!-- arrow to recognition -->
  <g stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#a)">
    <line x1="730" y1="454" x2="730" y2="494"/>
  </g>

  <!-- Band 4: recognition -->
  <g>
    <rect x="270" y="496" width="200" height="72" rx="10" fill="#0891b2" stroke="#0e7490"/>
    <text x="370" y="526" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="700">Spectral classification</text>
    <text x="370" y="545" text-anchor="middle" fill="#e0f2fe" font-size="10.5">chemicals, explosives, materials</text>

    <rect x="490" y="496" width="200" height="72" rx="10" fill="#0d9488" stroke="#0f766e"/>
    <text x="590" y="526" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="700">Dense detection</text>
    <text x="590" y="545" text-anchor="middle" fill="#ccfbf1" font-size="10.5">concealed objects, defects</text>

    <rect x="710" y="496" width="200" height="72" rx="10" fill="#be123c" stroke="#9f1239"/>
    <text x="810" y="526" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="700">Tissue mapping</text>
    <text x="810" y="545" text-anchor="middle" fill="#ffe4e6" font-size="10.5">tumour margins, burn depth</text>

    <g stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#a)">
      <path d="M730,476 L730,486 M660,486 L400,486 L400,492"/>
      <line x1="590" y1="486" x2="590" y2="492"/>
      <line x1="730" y1="486" x2="730" y2="492"/>
      <path d="M730,486 L810,486 L810,492"/>
      <line x1="400" y1="486" x2="730" y2="486"/>
    </g>
  </g>
</svg>
