<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" role="img" aria-label="The screening mammogram as a detection primitive. A standard exam has four views: right and left craniocaudal (CC) and right and left mediolateral oblique (MLO). Three comparisons carry the signal: ipsilateral (CC versus MLO of the same breast, to confirm a finding seen in two projections), bilateral (left versus right, to spot asymmetry) and temporal (current versus prior exam, to spot change). Each full-field digital view is roughly 3,000 by 4,000 pixels at about 70 to 100 micrometres per pixel, so a microcalcification of 0.1 to 0.5 millimetres covers only a few pixels. Digital breast tomosynthesis replaces each view with a stack of roughly 1 millimetre slices plus a synthetic 2D image, which multiplies the data per exam.">
  <title>The screening mammogram — four views, three comparisons</title>
  <rect x="0" y="0" width="960" height="440" rx="10" fill="#f4f6fb" stroke="#cbd5e1"/>
  <text x="24" y="32" fill="#334155" font-size="16.5" font-weight="800">The screening mammogram: four views, three comparisons, one tiny target</text>
  <text x="24" y="52" fill="#64748b" font-size="11.5">Typical full-field digital mammography (FFDM) and tomosynthesis (DBT) geometry. Pixel sizes and slice counts vary by vendor.</text>

  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#64748b"/></marker>
    <marker id="ah2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0f766e"/></marker>
    <marker id="ah3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9f1239"/></marker>
  </defs>

  <!-- four-view panel -->
  <rect x="24" y="70" width="520" height="350" rx="8" fill="#e2e8f0" stroke="#94a3b8"/>
  <text x="40" y="92" fill="#334155" font-size="13" font-weight="800">One exam = 4 views (R-CC, L-CC, R-MLO, L-MLO)</text>

  <!-- view tiles -->
  <g font-size="11.5">
    <!-- R-CC -->
    <rect x="44" y="104" width="150" height="130" rx="6" fill="#334155" stroke="#94a3b8"/>
    <path d="M194 112 C 120 120, 84 150, 84 169 C 84 190, 120 220, 194 226 Z" fill="#64748b"/>
    <circle cx="128" cy="160" r="4" fill="#fbbf24"/>
    <text x="52" y="122" fill="#f8fafc" font-weight="800">R-CC</text>

    <!-- L-CC -->
    <rect x="374" y="104" width="150" height="130" rx="6" fill="#334155" stroke="#94a3b8"/>
    <path d="M374 112 C 448 120, 484 150, 484 169 C 484 190, 448 220, 374 226 Z" fill="#64748b"/>
    <text x="482" y="122" fill="#f8fafc" font-weight="800">L-CC</text>

    <!-- R-MLO -->
    <rect x="44" y="270" width="150" height="130" rx="6" fill="#334155" stroke="#94a3b8"/>
    <path d="M194 276 L 160 276 C 120 300, 86 330, 90 360 C 96 384, 140 394, 194 394 Z" fill="#64748b"/>
    <path d="M194 276 L 172 276 L 194 312 Z" fill="#475569"/>
    <circle cx="132" cy="336" r="4" fill="#fbbf24"/>
    <text x="52" y="288" fill="#f8fafc" font-weight="800">R-MLO</text>

    <!-- L-MLO -->
    <rect x="374" y="270" width="150" height="130" rx="6" fill="#334155" stroke="#94a3b8"/>
    <path d="M374 276 L 408 276 C 448 300, 482 330, 478 360 C 472 384, 428 394, 374 394 Z" fill="#64748b"/>
    <path d="M374 276 L 396 276 L 374 312 Z" fill="#475569"/>
    <text x="476" y="288" fill="#f8fafc" font-weight="800">L-MLO</text>
  </g>

  <!-- ipsilateral arrow (R-CC <-> R-MLO) -->
  <line x1="119" y1="237" x2="119" y2="267" stroke="#0f766e" stroke-width="2.5" marker-start="url(#ah2)" marker-end="url(#ah2)"/>
  <!-- bilateral arrows -->
  <line x1="200" y1="169" x2="368" y2="169" stroke="#9f1239" stroke-width="2.5" stroke-dasharray="6 4" marker-start="url(#ah3)" marker-end="url(#ah3)"/>
  <line x1="200" y1="335" x2="368" y2="335" stroke="#9f1239" stroke-width="2.5" stroke-dasharray="6 4" marker-start="url(#ah3)" marker-end="url(#ah3)"/>

  <g font-size="11.5">
    <rect x="214" y="190" width="146" height="54" rx="6" fill="#9f1239" stroke="#fb7185"/>
    <text x="287" y="210" text-anchor="middle" fill="#ffe4e6" font-weight="800">bilateral</text>
    <text x="287" y="226" text-anchor="middle" fill="#ffe4e6">left vs right:</text>
    <text x="287" y="240" text-anchor="middle" fill="#ffe4e6">asymmetry</text>

    <rect x="214" y="252" width="146" height="54" rx="6" fill="#0f766e" stroke="#2dd4bf"/>
    <text x="287" y="272" text-anchor="middle" fill="#ccfbf1" font-weight="800">ipsilateral</text>
    <text x="287" y="288" text-anchor="middle" fill="#ccfbf1">CC vs MLO: same</text>
    <text x="287" y="302" text-anchor="middle" fill="#ccfbf1">finding in 2 projections</text>

    <rect x="214" y="352" width="146" height="54" rx="6" fill="#075985" stroke="#38bdf8"/>
    <text x="287" y="372" text-anchor="middle" fill="#e0f2fe" font-weight="800">temporal</text>
    <text x="287" y="388" text-anchor="middle" fill="#e0f2fe">current vs prior exams:</text>
    <text x="287" y="402" text-anchor="middle" fill="#e0f2fe">change, and future risk</text>
  </g>

  <!-- right column: scale + DBT -->
  <rect x="564" y="70" width="372" height="160" rx="8" fill="#334155" stroke="#94a3b8"/>
  <text x="580" y="94" fill="#f8fafc" font-size="13" font-weight="800">Scale: why it is a small-object problem</text>
  <g font-size="11.5" fill="#e2e8f0">
    <text x="580" y="116">• one FFDM view ≈ 3,000 × 4,000 px (≈ 12 MP)</text>
    <text x="580" y="134">• pixel pitch ≈ 70–100 µm</text>
    <text x="580" y="152">• microcalcification 0.1–0.5 mm → a few pixels</text>
    <text x="580" y="170">• typical ViT input 224–518 px → down-sampling</text>
    <text x="596" y="186">by ~10× erases the target</text>
    <text x="580" y="206">• cancer prevalence ≈ 5–7 per 1,000 screens</text>
  </g>

  <rect x="564" y="244" width="372" height="176" rx="8" fill="#075985" stroke="#38bdf8"/>
  <text x="580" y="268" fill="#e0f2fe" font-size="13" font-weight="800">Tomosynthesis (DBT): each view becomes a stack</text>
  <g>
    <rect x="600" y="290" width="90" height="70" rx="4" fill="#0c4a6e" stroke="#7dd3fc"/>
    <rect x="608" y="298" width="90" height="70" rx="4" fill="#0c4a6e" stroke="#7dd3fc"/>
    <rect x="616" y="306" width="90" height="70" rx="4" fill="#0c4a6e" stroke="#7dd3fc"/>
    <rect x="624" y="314" width="90" height="70" rx="4" fill="#0c4a6e" stroke="#7dd3fc"/>
    <circle cx="672" cy="346" r="4" fill="#fbbf24"/>
    <text x="669" y="404" text-anchor="middle" fill="#e0f2fe" font-size="11">~1 mm slices, often 40–80+</text>
  </g>
  <g font-size="11.5" fill="#e0f2fe">
    <text x="736" y="300">• less tissue overlap →</text>
    <text x="748" y="316">fewer masked lesions</text>
    <text x="736" y="336">• plus a synthetic 2D view</text>
    <text x="736" y="356">• 3D boxes are scarce:</text>
    <text x="748" y="372">reuse 2D models (§5)</text>
  </g>
</svg>
