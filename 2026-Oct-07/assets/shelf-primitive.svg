<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" role="img" aria-label="The retail shelf image as a detection primitive. Left: a shelf bay photo with three shelves of tightly packed, near-identical product facings, a price-label rail under each shelf, one empty gap and one misplaced product. A typical SKU-110K image holds about 147 products. Right: five output layers read from the same photo: product instances, SKU identity against a changing catalogue, facings and counts, shelf structure and price labels, and the compliance decision against the planogram.">
  <title>The shelf image: one photo, ~150 near-identical facings, five output layers</title>
  <rect x="0" y="0" width="960" height="540" rx="10" fill="#f4f6fb" stroke="#cbd5e1"/>
  <text x="24" y="32" fill="#334155" font-size="16.5" font-weight="800">The shelf image: ~150 near-identical facings per photo, and an open-ended catalogue</text>
  <text x="24" y="52" fill="#64748b" font-size="11.5">Schematic. SKU-110K averages ~147 annotated products per image; real catalogues hold thousands of SKUs and change weekly.</text>

  <!-- Left panel: shelf bay -->
  <rect x="24" y="72" width="452" height="444" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="40" y="96" fill="#334155" font-size="13" font-weight="700">One shelf bay, photographed at an angle</text>

  <!-- shelf 1 -->
  <g stroke="#2563eb" stroke-width="1" fill="#dbeafe">
    <rect x="48" y="112" width="34" height="70" rx="3"/><rect x="84" y="112" width="34" height="70" rx="3"/>
    <rect x="120" y="112" width="34" height="70" rx="3"/><rect x="156" y="112" width="34" height="70" rx="3"/>
  </g>
  <g stroke="#0d9488" stroke-width="1" fill="#ccfbf1">
    <rect x="196" y="122" width="30" height="60" rx="3"/><rect x="228" y="122" width="30" height="60" rx="3"/>
    <rect x="260" y="122" width="30" height="60" rx="3"/>
  </g>
  <rect x="296" y="122" width="30" height="60" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <g stroke="#0d9488" stroke-width="1" fill="#ccfbf1">
    <rect x="332" y="122" width="30" height="60" rx="3"/><rect x="364" y="122" width="30" height="60" rx="3"/>
  </g>
  <g stroke="#7c3aed" stroke-width="1" fill="#ede9fe">
    <rect x="400" y="132" width="26" height="50" rx="3"/><rect x="428" y="132" width="26" height="50" rx="3"/>
  </g>
  <rect x="44" y="182" width="414" height="8" fill="#94a3b8"/>
  <g fill="#ffffff" stroke="#475569" stroke-width="0.8">
    <rect x="60" y="191" width="28" height="12"/><rect x="210" y="191" width="28" height="12"/><rect x="405" y="191" width="28" height="12"/>
  </g>

  <!-- shelf 2 with gap -->
  <g stroke="#2563eb" stroke-width="1" fill="#dbeafe">
    <rect x="48" y="222" width="40" height="64" rx="3"/><rect x="90" y="222" width="40" height="64" rx="3"/>
  </g>
  <rect x="134" y="222" width="86" height="64" rx="3" fill="none" stroke="#dc2626" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="177" y="258" text-anchor="middle" fill="#dc2626" font-size="11" font-weight="700">gap (OOS)</text>
  <g stroke="#7c3aed" stroke-width="1" fill="#ede9fe">
    <rect x="224" y="230" width="28" height="56" rx="3"/><rect x="254" y="230" width="28" height="56" rx="3"/>
    <rect x="284" y="230" width="28" height="56" rx="3"/><rect x="314" y="230" width="28" height="56" rx="3"/>
    <rect x="344" y="230" width="28" height="56" rx="3"/><rect x="374" y="230" width="28" height="56" rx="3"/>
    <rect x="404" y="230" width="28" height="56" rx="3"/>
  </g>
  <rect x="44" y="286" width="414" height="8" fill="#94a3b8"/>
  <g fill="#ffffff" stroke="#475569" stroke-width="0.8">
    <rect x="60" y="295" width="28" height="12"/><rect x="160" y="295" width="28" height="12" stroke="#dc2626" stroke-width="1.6"/><rect x="300" y="295" width="28" height="12"/>
  </g>

  <!-- shelf 3: stacked -->
  <g stroke="#0d9488" stroke-width="1" fill="#ccfbf1">
    <rect x="48" y="330" width="56" height="26" rx="3"/><rect x="48" y="358" width="56" height="26" rx="3"/>
    <rect x="106" y="330" width="56" height="26" rx="3"/><rect x="106" y="358" width="56" height="26" rx="3"/>
  </g>
  <g stroke="#2563eb" stroke-width="1" fill="#dbeafe">
    <rect x="168" y="326" width="32" height="58" rx="3"/><rect x="202" y="326" width="32" height="58" rx="3"/>
    <rect x="236" y="326" width="32" height="58" rx="3"/><rect x="270" y="326" width="32" height="58" rx="3"/>
    <rect x="304" y="326" width="32" height="58" rx="3"/><rect x="338" y="326" width="32" height="58" rx="3"/>
    <rect x="372" y="326" width="32" height="58" rx="3"/><rect x="406" y="326" width="32" height="58" rx="3"/>
  </g>
  <rect x="44" y="384" width="414" height="8" fill="#94a3b8"/>

  <g font-size="11.5" fill="#334155">
    <text x="40" y="420" font-weight="700">What makes it hard</text>
    <text x="40" y="438">• ~10² touching, near-identical boxes per photo (NMS stress)</text>
    <text x="40" y="455">• identity is fine-grained: flavour / size variants of one brand</text>
    <text x="40" y="472">• catalogue is open: new SKUs and pack redesigns every week</text>
    <text x="40" y="489">• hidden depth: facings hide the stock behind them</text>
    <text x="300" y="164" fill="#d97706" font-weight="700" font-size="10.5" text-anchor="middle">?</text>
    <text x="311" y="113" fill="#d97706" font-size="10.5" text-anchor="middle">misplaced</text>
  </g>

  <!-- Right panel: output layers -->
  <rect x="492" y="72" width="444" height="444" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="508" y="96" fill="#334155" font-size="13" font-weight="700">Five output layers read from the same photo</text>

  <g font-size="11.5">
    <rect x="508" y="110" width="412" height="66" rx="6" fill="#dbeafe" stroke="#2563eb"/>
    <text x="520" y="130" fill="#1e3a8a" font-weight="800">1 · Instances</text>
    <text x="520" y="148" fill="#1e293b">class-agnostic box per facing (SKU-110K style)</text>
    <text x="520" y="165" fill="#475569">metric: AP, AR300 on ~150 objects / image</text>

    <rect x="508" y="184" width="412" height="66" rx="6" fill="#ede9fe" stroke="#7c3aed"/>
    <text x="520" y="204" fill="#4c1d95" font-weight="800">2 · SKU identity</text>
    <text x="520" y="222" fill="#1e293b">retrieve against a changing catalogue (image + OCR text)</text>
    <text x="520" y="239" fill="#475569">metric: Recall@1 / @5, checkout accuracy</text>

    <rect x="508" y="258" width="412" height="66" rx="6" fill="#ccfbf1" stroke="#0d9488"/>
    <text x="520" y="278" fill="#134e4a" font-weight="800">3 · Facings &amp; counts</text>
    <text x="520" y="296" fill="#1e293b">visible facings, stacked / hidden stock, exemplar counting</text>
    <text x="520" y="313" fill="#475569">metric: MAE / RMSE, count error %</text>

    <rect x="508" y="332" width="412" height="66" rx="6" fill="#fef3c7" stroke="#d97706"/>
    <text x="520" y="352" fill="#78350f" font-weight="800">4 · Shelf structure &amp; labels</text>
    <text x="520" y="370" fill="#1e293b">shelf lines, gaps, price tags, OCR, tag ↔ facing link</text>
    <text x="520" y="387" fill="#475569">metric: gap F1, OCR accuracy, link accuracy</text>

    <rect x="508" y="406" width="412" height="66" rx="6" fill="#fee2e2" stroke="#dc2626"/>
    <text x="520" y="426" fill="#7f1d1d" font-weight="800">5 · Decision</text>
    <text x="520" y="444" fill="#1e293b">realogram vs planogram: restock / move / reprice tasks</text>
    <text x="520" y="461" fill="#475569">metric: compliance accuracy, cost of a missed gap</text>
  </g>
  <text x="508" y="500" fill="#64748b" font-size="11">Layer 1 is mature; 2026 work concentrates on layers 2–5.</text>
</svg>
