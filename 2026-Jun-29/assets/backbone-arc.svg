<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 470" role="img" aria-label="Event-camera detection backbone evolution ladder">
  <title>Backbone-efficiency ladder — event-camera dense detection</title>
  <desc>An evolution ladder of event-camera detection backbones, ascending from dense frame CNNs that discard asynchrony, through recurrent vision transformers (RVT, 2023), scene-adaptive sparse transformers (SAST, 2024), linear-time state-space models (S5-ViT and SMamba, 2024-25), to asynchronous graph and event-by-event detectors (AEGNN, DAGr, SSLA-Det) that compute only on incoming events. The vertical axis is increasing exploitation of event sparsity and asynchrony; the horizontal axis is time.</desc>
  <style>
    .axis   { stroke: currentColor; stroke-width: 1.3; opacity: 0.55; }
    .arrow  { fill: currentColor; opacity: 0.55; }
    .rung   { stroke: currentColor; stroke-width: 1.3; }
    .r1 { fill: rgba(148,163,184,0.18); }
    .r2 { fill: rgba(59,130,246,0.16); }
    .r3 { fill: rgba(16,185,129,0.16); }
    .r4 { fill: rgba(245,158,11,0.18); }
    .r5 { fill: rgba(168,85,247,0.16); }
    .ttl  { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 13px; font-weight: 600; fill: currentColor; }
    .sub  { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 10.5px; fill: currentColor; opacity: 0.74; }
    .axl  { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 11px; font-weight: 600; fill: currentColor; letter-spacing: 0.02em; opacity: 0.8; }
    .yr   { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 10px; fill: currentColor; opacity: 0.6; }
  </style>

  <!-- axes -->
  <line class="axis" x1="70" y1="40" x2="70" y2="410"/>
  <polygon class="arrow" points="70,30 65,44 75,44"/>
  <line class="axis" x1="70" y1="410" x2="940" y2="410"/>
  <polygon class="arrow" points="950,410 936,405 936,415"/>
  <text class="axl" x="20" y="60" transform="rotate(-90 20,60)" text-anchor="end">more sparsity / asynchrony exploited  →</text>
  <text class="axl" x="500" y="438" text-anchor="middle">time / maturity  →</text>

  <!-- rung 1: dense CNN -->
  <g>
    <rect class="rung r1" x="96" y="338" width="250" height="58" rx="10"/>
    <text class="ttl" x="110" y="362">Dense frame CNN</text>
    <text class="sub" x="110" y="380">events → fixed frame; async discarded</text>
    <text class="yr"  x="110" y="332">pre-2022 baseline</text>
  </g>
  <!-- rung 2: recurrent ViT -->
  <g>
    <rect class="rung r2" x="262" y="262" width="262" height="58" rx="10"/>
    <text class="ttl" x="276" y="286">Recurrent ViT — RVT / GET</text>
    <text class="sub" x="276" y="304">conv + attention + temporal recurrence</text>
    <text class="yr"  x="276" y="256">CVPR / ICCV 2023</text>
  </g>
  <!-- rung 3: sparse transformer -->
  <g>
    <rect class="rung r3" x="402" y="190" width="270" height="58" rx="10"/>
    <text class="ttl" x="416" y="214">Sparse transformer — SAST</text>
    <text class="sub" x="416" y="232">window-token co-sparsification</text>
    <text class="yr"  x="416" y="184">CVPR 2024</text>
  </g>
  <!-- rung 4: state-space -->
  <g>
    <rect class="rung r4" x="540" y="118" width="278" height="58" rx="10"/>
    <text class="ttl" x="554" y="142">State-space — S5-ViT / SMamba</text>
    <text class="sub" x="554" y="160">linear-time scan; frequency-robust</text>
    <text class="yr"  x="554" y="112">CVPR 2024 · AAAI 2025</text>
  </g>
  <!-- rung 5: async graph / event-by-event -->
  <g>
    <rect class="rung r5" x="660" y="46" width="278" height="58" rx="10"/>
    <text class="ttl" x="674" y="70">Async graph / event-by-event</text>
    <text class="sub" x="674" y="88">AEGNN · DAGr · SSLA-Det</text>
    <text class="yr"  x="674" y="40">CVPR'22 · Nature'24 · ECCV'26</text>
  </g>

  <!-- connecting dashed risers -->
  <g stroke="currentColor" stroke-width="1.1" opacity="0.4" stroke-dasharray="4 4" fill="none">
    <path d="M221 338 L393 320"/>
    <path d="M393 262 L533 248"/>
    <path d="M537 190 L671 176"/>
    <path d="M679 118 L799 104"/>
  </g>
</svg>
