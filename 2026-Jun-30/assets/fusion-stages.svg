<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 300" role="img" aria-label="Where RGB and thermal streams are fused in a multispectral detector">
  <title>RGB–thermal fusion stages — 2026-Jun-30 CV update</title>
  <desc>A left-to-right diagram of the four points where visible and thermal streams can be combined in a multispectral detector: pixel/early fusion before the backbone, feature/mid fusion inside the backbone (the dominant transformer-fusion regime, e.g. CFT and ICAFusion), decision/late fusion after per-modality detection, and quality- or illumination-gated fusion that reweights modalities by reliability. An arrow notes the shift from static addition toward trust-aware, quality-gated fusion.</desc>
  <style>
    .box   { stroke: currentColor; stroke-width: 1.3; }
    .early { fill: rgba(59,130,246,0.16); }
    .mid   { fill: rgba(16,185,129,0.18); }
    .late  { fill: rgba(245,158,11,0.16); }
    .gate  { fill: rgba(239,68,68,0.16); }
    .flow  { fill: none; stroke: currentColor; stroke-width: 1.4; marker-end: url(#ah); }
    .lbl   { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 13px; font-weight: 600; fill: currentColor; }
    .sub   { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 10.5px; fill: currentColor; opacity: 0.74; }
    .tag   { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 11px; font-style: italic; fill: currentColor; opacity: 0.8; }
    .note  { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 11px; font-weight: 600; fill: currentColor; letter-spacing: 0.02em; }
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
    </marker>
  </defs>

  <!-- four stage boxes -->
  <g>
    <rect class="box early" x="24"  y="70" width="210" height="86" rx="10"/>
    <text class="lbl" x="129" y="96"  text-anchor="middle">Pixel / early</text>
    <text class="sub" x="129" y="116" text-anchor="middle">concat or image fusion</text>
    <text class="sub" x="129" y="132" text-anchor="middle">before the backbone</text>
    <text class="tag" x="129" y="150" text-anchor="middle">TarDAL · pixel-level</text>
  </g>
  <g>
    <rect class="box mid" x="262" y="70" width="220" height="86" rx="10"/>
    <text class="lbl" x="372" y="96"  text-anchor="middle">Feature / mid</text>
    <text class="sub" x="372" y="116" text-anchor="middle">cross-attention in backbone</text>
    <text class="sub" x="372" y="132" text-anchor="middle">the dominant regime</text>
    <text class="tag" x="372" y="150" text-anchor="middle">CFT · ICAFusion · COMO</text>
  </g>
  <g>
    <rect class="box late" x="510" y="70" width="210" height="86" rx="10"/>
    <text class="lbl" x="615" y="96"  text-anchor="middle">Decision / late</text>
    <text class="sub" x="615" y="116" text-anchor="middle">per-modality detect,</text>
    <text class="sub" x="615" y="132" text-anchor="middle">then merge boxes</text>
    <text class="tag" x="615" y="150" text-anchor="middle">query fusion · DPDETR</text>
  </g>
  <g>
    <rect class="box gate" x="748" y="70" width="210" height="86" rx="10"/>
    <text class="lbl" x="853" y="96"  text-anchor="middle">Quality / illum-gated</text>
    <text class="sub" x="853" y="116" text-anchor="middle">reweight by reliability</text>
    <text class="sub" x="853" y="132" text-anchor="middle">day/night, degraded</text>
    <text class="tag" x="853" y="150" text-anchor="middle">IAF · MBNet · imbalance</text>
  </g>

  <!-- flow arrows -->
  <path class="flow" d="M234,113 L260,113"/>
  <path class="flow" d="M482,113 L508,113"/>
  <path class="flow" d="M720,113 L746,113"/>

  <!-- annotation -->
  <text class="note" x="24"  y="42">Where the visible + thermal streams meet</text>
  <text class="note" x="491" y="210" text-anchor="middle">static addition  ⟶  trust-aware, quality-gated fusion</text>
  <path class="flow" d="M250,224 L732,224"/>
</svg>
