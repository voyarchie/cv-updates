<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" role="img" aria-label="A liquid-argon time projection chamber readout shown as a dense scene of physics objects. Left: a raw wire-versus-time image with a neutrino interaction vertex, a long straight muon track, a short stubby proton track, a branching electromagnetic shower, a delta-ray kink and scattered low-energy blips. Right: the same event decomposed by the reconstruction chain into semantic segmentation classes, proposed key points (vertex and track end points), clustered particle instances, and particle identity plus the interaction that groups them.">
  <title>The LArTPC readout as a dense scene of physics objects</title>
  <defs>
    <marker id="lt-arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- self-contained light card so dark text stays legible on any page theme -->
  <rect x="0" y="0" width="960" height="520" rx="10" fill="#f4f6fb" stroke="#cbd5e1" stroke-width="1"/>
  <text x="24" y="32" fill="#334155" font-size="17" font-weight="800">One LArTPC readout, read as a dense scene of physics objects</text>

  <!-- ===================== LEFT: raw detector image ===================== -->
  <g>
    <rect x="24" y="50" width="430" height="330" rx="8" fill="#0b1220" stroke="#334155" stroke-width="2"/>
    <!-- faint wire grid to signal "wire x time image" -->
    <g stroke="#1e293b" stroke-width="1">
      <line x1="24" y1="105" x2="454" y2="105"/><line x1="24" y1="160" x2="454" y2="160"/>
      <line x1="24" y1="215" x2="454" y2="215"/><line x1="24" y1="270" x2="454" y2="270"/>
      <line x1="24" y1="325" x2="454" y2="325"/>
      <line x1="110" y1="50" x2="110" y2="380"/><line x1="196" y1="50" x2="196" y2="380"/>
      <line x1="282" y1="50" x2="282" y2="380"/><line x1="368" y1="50" x2="368" y2="380"/>
    </g>

    <!-- interaction vertex -->
    <g>
      <path d="M150,250 l6,-16 6,16 16,6 -16,6 -6,16 -6,-16 -16,-6 z" fill="#f472b6" opacity="0.95"/>
    </g>
    <!-- muon: long straight track -->
    <line x1="156" y1="250" x2="420" y2="120" stroke="#38bdf8" stroke-width="6" stroke-linecap="round"/>
    <!-- delta-ray kink off the muon -->
    <line x1="330" y1="164" x2="356" y2="128" stroke="#facc15" stroke-width="3.5" stroke-linecap="round"/>
    <!-- proton: short stubby high-dE/dx track -->
    <line x1="156" y1="250" x2="232" y2="300" stroke="#fb923c" stroke-width="9" stroke-linecap="round"/>
    <!-- electromagnetic shower: branching cone -->
    <g stroke="#a78bfa" stroke-width="3.5" stroke-linecap="round" fill="none">
      <path d="M156,250 L250,214"/>
      <path d="M250,214 L322,196"/><path d="M250,214 L318,232"/>
      <path d="M322,196 L392,182"/><path d="M322,196 L388,204"/>
      <path d="M318,232 L390,236"/><path d="M318,232 L384,254"/>
    </g>
    <g fill="#c4b5fd">
      <circle cx="392" cy="182" r="3.4"/><circle cx="388" cy="204" r="3"/>
      <circle cx="390" cy="236" r="3.2"/><circle cx="384" cy="254" r="3"/>
      <circle cx="410" cy="176" r="2.6"/><circle cx="406" cy="248" r="2.6"/>
    </g>
    <!-- scattered low-energy blips (Compton / neutron) -->
    <g fill="#22d3ee">
      <circle cx="90"  cy="330" r="3.2"/><circle cx="415" cy="325" r="3"/>
      <circle cx="70"  cy="130" r="2.8"/><circle cx="300" cy="345" r="3"/>
    </g>

    <!-- in-scene labels -->
    <text x="404" y="112" fill="#7dd3fc" font-size="11" font-weight="700">muon track</text>
    <text x="236" y="312" fill="#fdba74" font-size="11" font-weight="700">proton</text>
    <text x="360" y="176" fill="#c4b5fd" font-size="11" font-weight="700">e/&#947; shower</text>
    <text x="360" y="120" fill="#fde047" font-size="10.5" font-weight="700">&#948;-ray</text>
    <text x="60"  y="346" fill="#67e8f9" font-size="10.5" font-weight="700">low-E blips</text>
    <text x="118" y="238" fill="#f9a8d4" font-size="11" font-weight="800">&#957; vertex</text>

    <text x="30" y="372" fill="#64748b" font-size="11">raw readout &#183; drift time (t) &#215; wire / pixel &#183; charge = brightness</text>
  </g>
  <text x="24" y="402" fill="#0f172a" font-size="13.5" font-weight="800">The image</text>
  <text x="24" y="421" fill="#475569" font-size="12">A 2-D projection (or 3-D voxel cloud) that is &gt;99.9% empty, but where</text>
  <text x="24" y="438" fill="#475569" font-size="12">occupied pixels are <tspan font-weight="700" fill="#334155">locally dense</tspan> lines and cones. Many objects, one vertex.</text>

  <!-- flow arrow -->
  <line x1="462" y1="215" x2="502" y2="215" stroke="#64748b" stroke-width="2.5" marker-end="url(#lt-arr)"/>

  <!-- ===================== RIGHT: reconstruction outputs ===================== -->
  <!-- 1 semantic segmentation -->
  <g>
    <rect x="512" y="50" width="424" height="76" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <text x="524" y="70" fill="#38bdf8" font-size="12.5" font-weight="800">1 &#183; Semantic segmentation (UResNet)</text>
    <text x="524" y="88" fill="#94a3b8" font-size="11">per-pixel class: track / shower / Michel / delta / low-E</text>
    <g>
      <rect x="524" y="98" width="70" height="16" rx="3" fill="#38bdf8"/><text x="530" y="110" fill="#08131f" font-size="10" font-weight="700">track</text>
      <rect x="600" y="98" width="76" height="16" rx="3" fill="#a78bfa"/><text x="606" y="110" fill="#0f0a1e" font-size="10" font-weight="700">shower</text>
      <rect x="682" y="98" width="72" height="16" rx="3" fill="#f472b6"/><text x="688" y="110" fill="#1e0713" font-size="10" font-weight="700">Michel</text>
      <rect x="760" y="98" width="66" height="16" rx="3" fill="#facc15"/><text x="766" y="110" fill="#1e1706" font-size="10" font-weight="700">delta</text>
      <rect x="832" y="98" width="90" height="16" rx="3" fill="#22d3ee"/><text x="838" y="110" fill="#06171b" font-size="10" font-weight="700">low-E blip</text>
    </g>
  </g>
  <!-- 2 point proposal -->
  <g>
    <rect x="512" y="134" width="424" height="70" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <text x="524" y="154" fill="#f472b6" font-size="12.5" font-weight="800">2 &#183; Point proposal (PPN)</text>
    <text x="524" y="172" fill="#94a3b8" font-size="11">sub-pixel key points: interaction vertex + track end points</text>
    <g>
      <path d="M556,190 l4,-11 4,11 11,4 -11,4 -4,11 -4,-11 -11,-4 z" fill="#f472b6"/>
      <circle cx="626" cy="190" r="5" fill="none" stroke="#38bdf8" stroke-width="2.5"/>
      <circle cx="686" cy="190" r="5" fill="none" stroke="#38bdf8" stroke-width="2.5"/>
      <circle cx="746" cy="190" r="5" fill="none" stroke="#fb923c" stroke-width="2.5"/>
      <text x="596" y="194" fill="#64748b" font-size="10">end points &#8594;</text>
    </g>
  </g>
  <!-- 3 instance clustering -->
  <g>
    <rect x="512" y="212" width="424" height="70" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <text x="524" y="232" fill="#34d399" font-size="12.5" font-weight="800">3 &#183; Instance clustering (SPICE / dense embed.)</text>
    <text x="524" y="250" fill="#94a3b8" font-size="11">split touching pixels into <tspan font-weight="700" fill="#cbd5e1">individual particles</tspan> &#8212; no boxes, no NMS</text>
    <g fill="none" stroke-width="2.5">
      <ellipse cx="560" cy="268" rx="26" ry="9" stroke="#38bdf8"/>
      <ellipse cx="628" cy="268" rx="20" ry="9" stroke="#fb923c"/>
      <ellipse cx="700" cy="268" rx="24" ry="10" stroke="#a78bfa"/>
      <ellipse cx="770" cy="268" rx="16" ry="8" stroke="#f472b6"/>
    </g>
  </g>
  <!-- 4 particle ID + interaction -->
  <g>
    <rect x="512" y="290" width="424" height="90" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <text x="524" y="310" fill="#fbbf24" font-size="12.5" font-weight="800">4 &#183; Particle ID + interaction (GrapPA GNN)</text>
    <text x="524" y="328" fill="#94a3b8" font-size="11">type each cluster &#183; link fragments &#183; group into one &#957; interaction</text>
    <g font-size="10.5" font-weight="700">
      <rect x="524" y="338" width="52" height="30" rx="6" fill="#0b2540" stroke="#38bdf8"/><text x="536" y="357" fill="#7dd3fc">&#956;&#8315;</text>
      <rect x="584" y="338" width="52" height="30" rx="6" fill="#3a1e05" stroke="#fb923c"/><text x="596" y="357" fill="#fdba74">p</text>
      <rect x="644" y="338" width="52" height="30" rx="6" fill="#241546" stroke="#a78bfa"/><text x="650" y="357" fill="#c4b5fd">e/&#947;</text>
      <line x1="576" y1="353" x2="584" y2="353" stroke="#64748b" stroke-width="2"/>
      <line x1="636" y1="353" x2="644" y2="353" stroke="#64748b" stroke-width="2"/>
      <rect x="712" y="338" width="210" height="30" rx="6" fill="#052e26" stroke="#34d399"/>
      <text x="724" y="357" fill="#6ee7b7">&#8721; = one neutrino interaction</text>
    </g>
  </g>

  <!-- bottom strip: the departures -->
  <rect x="24" y="458" width="912" height="46" rx="8" fill="#eef2fb" stroke="#d5deef" stroke-width="1"/>
  <text x="36" y="477" fill="#334155" font-size="12" font-weight="800">Not a natural image:</text>
  <text x="158" y="477" fill="#475569" font-size="11.5">extreme sparsity (&gt;99.9% empty) &#183; objects <tspan font-weight="700" fill="#334155">overlap &amp; sum charge</tspan>, they do not occlude &#183; axes are drift-time &#215; wire, not x&#215;y</text>
  <text x="36" y="495" fill="#475569" font-size="11.5">&#183; class is defined by <tspan font-weight="700" fill="#334155">dE/dx physics</tspan> (a proton and a muon differ by ionization density, not shape) &#183; ground truth comes from a simulator, not a human annotator</text>
</svg>
