<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" role="img" aria-label="Diagram of the three images in semiconductor wafer inspection, drawn at three length scales. Left: the wafer map, a 300 millimetre disc of dies coloured pass or fail, where the defect is a spatial pattern such as a ring, centre cluster or scratch, and the label is a pattern class tied to a process root cause. Middle: the optical or e-beam patterned-wafer inspection image, a die-to-die difference image at roughly 10 to 100 nanometre pixels, which produces millions of candidate events, most of them nuisance, so the task is defect-of-interest versus nuisance filtering. Right: the SEM review image at about 1 nanometre pixels, a close-up of line-space resist patterns where the defect is a bridge, break or line collapse, and the task is detection, instance segmentation and automatic defect classification. Arrows show the funnel: wafer to candidate events to sampled review sites, with counts dropping from millions to hundreds.">
  <title>The wafer inspection image: three images, three scales</title>
  <rect x="0" y="0" width="960" height="440" rx="10" fill="#f4f6fb" stroke="#cbd5e1"/>
  <text x="24" y="34" fill="#334155" font-size="17" font-weight="800">The wafer inspection image: three images, three length scales</text>
  <text x="24" y="54" fill="#64748b" font-size="11.5">Each stage feeds the next; the count of things to look at drops by ~4 orders of magnitude while pixel size drops by ~2–3.</text>

  <!-- Panel 1: wafer map -->
  <rect x="24" y="72" width="284" height="290" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="166" y="96" text-anchor="middle" fill="#334155" font-size="14" font-weight="700">① Wafer map (bin map)</text>
  <text x="166" y="113" text-anchor="middle" fill="#64748b" font-size="11">300 mm disc · 1 pixel = 1 die</text>
  <circle cx="166" cy="208" r="78" fill="#e2e8f0" stroke="#94a3b8"/>
  <g fill="#94a3b8">
    <rect x="118" y="160" width="12" height="12"/><rect x="134" y="160" width="12" height="12"/><rect x="150" y="160" width="12" height="12"/><rect x="166" y="160" width="12" height="12"/><rect x="182" y="160" width="12" height="12"/><rect x="198" y="160" width="12" height="12"/>
    <rect x="102" y="176" width="12" height="12"/><rect x="118" y="176" width="12" height="12"/><rect x="134" y="176" width="12" height="12"/><rect x="198" y="176" width="12" height="12"/><rect x="214" y="176" width="12" height="12"/>
    <rect x="102" y="192" width="12" height="12"/><rect x="118" y="192" width="12" height="12"/><rect x="214" y="192" width="12" height="12"/>
    <rect x="102" y="208" width="12" height="12"/><rect x="118" y="208" width="12" height="12"/><rect x="214" y="208" width="12" height="12"/>
    <rect x="102" y="224" width="12" height="12"/><rect x="118" y="224" width="12" height="12"/><rect x="134" y="224" width="12" height="12"/><rect x="198" y="224" width="12" height="12"/><rect x="214" y="224" width="12" height="12"/>
    <rect x="118" y="240" width="12" height="12"/><rect x="134" y="240" width="12" height="12"/><rect x="150" y="240" width="12" height="12"/><rect x="166" y="240" width="12" height="12"/><rect x="182" y="240" width="12" height="12"/><rect x="198" y="240" width="12" height="12"/>
  </g>
  <!-- centre cluster of failing dies -->
  <g fill="#b45309">
    <rect x="134" y="176" width="12" height="12"/><rect x="150" y="176" width="12" height="12"/><rect x="166" y="176" width="12" height="12"/><rect x="182" y="176" width="12" height="12"/>
    <rect x="134" y="192" width="12" height="12"/><rect x="150" y="192" width="12" height="12"/><rect x="166" y="192" width="12" height="12"/><rect x="182" y="192" width="12" height="12"/><rect x="198" y="192" width="12" height="12"/>
    <rect x="134" y="208" width="12" height="12"/><rect x="150" y="208" width="12" height="12"/><rect x="166" y="208" width="12" height="12"/><rect x="182" y="208" width="12" height="12"/><rect x="198" y="208" width="12" height="12"/>
    <rect x="150" y="224" width="12" height="12"/><rect x="166" y="224" width="12" height="12"/><rect x="182" y="224" width="12" height="12"/>
  </g>
  <text x="166" y="310" text-anchor="middle" fill="#334155" font-size="12">Defect = <tspan font-weight="700">spatial pattern</tspan></text>
  <text x="166" y="327" text-anchor="middle" fill="#64748b" font-size="11">Center · Donut · Edge-Ring · Scratch …</text>
  <text x="166" y="344" text-anchor="middle" fill="#64748b" font-size="11">Task: pattern class → process cause</text>

  <!-- Panel 2: optical / e-beam inspection -->
  <rect x="338" y="72" width="284" height="290" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="480" y="96" text-anchor="middle" fill="#334155" font-size="14" font-weight="700">② Patterned-wafer inspection</text>
  <text x="480" y="113" text-anchor="middle" fill="#64748b" font-size="11">optical / e-beam · ~10–100 nm pixels</text>
  <g font-size="10.5" fill="#64748b" text-anchor="middle">
    <rect x="360" y="132" width="70" height="70" fill="#e2e8f0" stroke="#94a3b8"/>
    <text x="395" y="216">test die</text>
    <text x="445" y="172" font-size="16" fill="#334155">−</text>
    <rect x="460" y="132" width="70" height="70" fill="#e2e8f0" stroke="#94a3b8"/>
    <text x="495" y="216">reference die</text>
    <text x="545" y="172" font-size="16" fill="#334155">=</text>
    <rect x="558" y="132" width="50" height="70" fill="#334155"/>
    <text x="583" y="216">diff</text>
  </g>
  <g stroke="#94a3b8" stroke-width="2">
    <line x1="370" y1="145" x2="420" y2="145"/><line x1="370" y1="160" x2="420" y2="160"/><line x1="370" y1="175" x2="420" y2="175"/><line x1="370" y1="190" x2="420" y2="190"/>
    <line x1="470" y1="145" x2="520" y2="145"/><line x1="470" y1="160" x2="520" y2="160"/><line x1="470" y1="175" x2="520" y2="175"/><line x1="470" y1="190" x2="520" y2="190"/>
  </g>
  <circle cx="400" cy="168" r="4" fill="#b45309"/>
  <circle cx="574" cy="152" r="3" fill="#2f6fd6"/><circle cx="592" cy="170" r="3" fill="#2f6fd6"/><circle cx="580" cy="188" r="3" fill="#2f6fd6"/><circle cx="596" cy="140" r="3" fill="#2f6fd6"/>
  <circle cx="584" cy="164" r="4.5" fill="#b45309"/>
  <rect x="360" y="236" width="12" height="12" fill="#b45309"/><text x="378" y="246" fill="#334155" font-size="11">defect of interest (DOI)</text>
  <rect x="360" y="256" width="12" height="12" fill="#2f6fd6"/><text x="378" y="266" fill="#334155" font-size="11">nuisance (noise, grain, CD wiggle)</text>
  <text x="480" y="310" text-anchor="middle" fill="#334155" font-size="12">Defect = <tspan font-weight="700">difference event</tspan></text>
  <text x="480" y="327" text-anchor="middle" fill="#64748b" font-size="11">10⁵–10⁶ candidates per wafer</text>
  <text x="480" y="344" text-anchor="middle" fill="#64748b" font-size="11">Task: DOI vs nuisance filtering</text>

  <!-- Panel 3: SEM review -->
  <rect x="652" y="72" width="284" height="290" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="794" y="96" text-anchor="middle" fill="#334155" font-size="14" font-weight="700">③ SEM review image</text>
  <text x="794" y="113" text-anchor="middle" fill="#64748b" font-size="11">~1 nm pixels · line-space resist</text>
  <rect x="700" y="128" width="188" height="150" fill="#cbd5e1"/>
  <g fill="#64748b">
    <rect x="712" y="128" width="16" height="150"/>
    <rect x="744" y="128" width="16" height="150"/>
    <rect x="776" y="128" width="16" height="62"/><rect x="776" y="206" width="16" height="72"/>
    <rect x="808" y="128" width="16" height="150"/>
    <rect x="840" y="128" width="16" height="150"/>
    <rect x="824" y="236" width="16" height="12"/>
  </g>
  <rect x="770" y="186" width="28" height="24" fill="none" stroke="#b45309" stroke-width="2.5"/>
  <text x="758" y="200" text-anchor="end" fill="#b45309" font-size="11" font-weight="700">break</text>
  <rect x="818" y="230" width="44" height="24" fill="none" stroke="#0f766e" stroke-width="2.5"/>
  <text x="866" y="270" text-anchor="end" fill="#0f766e" font-size="11" font-weight="700">bridge</text>
  <text x="794" y="310" text-anchor="middle" fill="#334155" font-size="12">Defect = <tspan font-weight="700">nanoscale instance</tspan></text>
  <text x="794" y="327" text-anchor="middle" fill="#64748b" font-size="11">bridge · break · line collapse · micro-bridge</text>
  <text x="794" y="344" text-anchor="middle" fill="#64748b" font-size="11">Task: detect · segment · classify (ADC)</text>

  <!-- funnel arrows -->
  <g stroke="#334155" stroke-width="2" fill="#334155">
    <line x1="166" y1="372" x2="166" y2="398"/>
    <line x1="166" y1="398" x2="790" y2="398"/>
    <polygon points="790,392 802,398 790,404"/>
  </g>
  <text x="480" y="424" text-anchor="middle" fill="#334155" font-size="12">
    In the fab, ② runs first and ③ reviews a few hundred sampled events; ① aggregates test results at the end. Each image is a different CV problem.
  </text>
</svg>
