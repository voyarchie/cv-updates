<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" role="img" aria-label="Topic map of the six astronomical-survey dense-detection threads">
  <title>Astronomical-survey dense detection &amp; classification — six threads</title>
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#94a3b8"/>
    </marker>
  </defs>
  <!-- edges -->
  <g stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#ah)">
    <line x1="450" y1="260" x2="205" y2="120"/>
    <line x1="450" y1="260" x2="450" y2="95"/>
    <line x1="450" y1="260" x2="695" y2="120"/>
    <line x1="450" y1="260" x2="205" y2="400"/>
    <line x1="450" y1="260" x2="450" y2="425"/>
    <line x1="450" y1="260" x2="695" y2="400"/>
  </g>
  <!-- hub -->
  <g>
    <rect x="345" y="220" width="210" height="80" rx="12" fill="#1e293b" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="450" y="250" text-anchor="middle" fill="#f8fafc" font-size="15" font-weight="700">Astronomical surveys</text>
    <text x="450" y="272" text-anchor="middle" fill="#cbd5e1" font-size="12.5">dense detection +</text>
    <text x="450" y="289" text-anchor="middle" fill="#cbd5e1" font-size="12.5">classification</text>
  </g>
  <!-- nodes -->
  <g font-size="12" fill="#f8fafc">
    <!-- 1 primitive -->
    <rect x="60" y="70" width="290" height="66" rx="10" fill="#4f46e5" stroke="#3730a3"/>
    <text x="75" y="94" font-size="12.5" font-weight="700">1 · The primitive</text>
    <text x="75" y="112" font-size="11.5" fill="#e0e7ff">flux not RGB · PSF points · crowded blends</text>
    <text x="75" y="128" font-size="11.5" fill="#e0e7ff">completeness/purity, not mAP</text>
    <!-- 2 detection -->
    <rect x="305" y="45" width="290" height="66" rx="10" fill="#4f46e5" stroke="#3730a3"/>
    <text x="320" y="69" font-size="12.5" font-weight="700">2 · Detection &amp; deblending</text>
    <text x="320" y="87" font-size="11.5" fill="#e0e7ff">SExtractor · scarlet2 · DeepDISC</text>
    <text x="320" y="103" font-size="11.5" fill="#e0e7ff">Mask R-CNN · YOLO-CIANNA (radio)</text>
    <!-- 3 classification -->
    <rect x="610" y="70" width="270" height="66" rx="10" fill="#c026d3" stroke="#a21caf"/>
    <text x="625" y="94" font-size="12.5" font-weight="700">3 · Classification</text>
    <text x="625" y="112" font-size="11.5" fill="#fae8ff">star/galaxy · Zoobot morphology</text>
    <text x="625" y="128" font-size="11.5" fill="#fae8ff">radio FR-type</text>
    <!-- 4 time domain -->
    <rect x="60" y="384" width="290" height="66" rx="10" fill="#d97706" stroke="#b45309"/>
    <text x="75" y="408" font-size="12.5" font-weight="700">4 · Time domain &amp; real/bogus</text>
    <text x="75" y="426" font-size="11.5" fill="#fef3c7">difference imaging · ZTF · ALeRCE</text>
    <text x="75" y="442" font-size="11.5" fill="#fef3c7">BTSbot · Rubin alert stream</text>
    <!-- 5 foundation -->
    <rect x="305" y="409" width="290" height="66" rx="10" fill="#059669" stroke="#047857"/>
    <text x="320" y="433" font-size="12.5" font-weight="700">5 · Foundation models</text>
    <text x="320" y="451" font-size="11.5" fill="#d1fae5">AstroCLIP · AstroPT · AstroM³</text>
    <text x="320" y="467" font-size="11.5" fill="#d1fae5">Multimodal Universe · photo-z · lenses</text>
    <!-- 6 data/gate -->
    <rect x="610" y="384" width="270" height="66" rx="10" fill="#1e293b" stroke="#94a3b8"/>
    <text x="625" y="408" font-size="12.5" font-weight="700">6 · Data · metrics · gate</text>
    <text x="625" y="426" font-size="11.5" fill="#cbd5e1">Rubin/Euclid/SKA · σ-scatter</text>
    <text x="625" y="442" font-size="11.5" fill="#cbd5e1">selection fn · domain shift</text>
  </g>
</svg>
