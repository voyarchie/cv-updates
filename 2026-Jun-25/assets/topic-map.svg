<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 640" role="img" aria-label="Topic map for the 2026-Jun-25 CV update">
  <title>Topic map — 2026-Jun-25 CV update</title>
  <desc>A radial topic map of six threads in remote-sensing / Earth-observation dense vision, grouped into three families: shared pretraining (multi-sensor geospatial foundation models and capability-driven benchmarks), dense localization (oriented aerial object detection and SAR / multi-sensor detection), and dense classification and language (land-cover semantic segmentation and remote-sensing vision-language models).</desc>
  <style>
    .hub    { fill: none; stroke: currentColor; stroke-width: 1.7; }
    .spoke  { fill: none; stroke: currentColor; stroke-width: 1.1; opacity: 0.5; }
    .node   { stroke: currentColor; stroke-width: 1.3; }
    .found  { fill: rgba(59,130,246,0.16); }
    .local  { fill: rgba(16,185,129,0.16); }
    .lang   { fill: rgba(168,85,247,0.16); }
    .lbl    { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 13px; fill: currentColor; }
    .sub    { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 10.5px; fill: currentColor; opacity: 0.72; }
    .hublbl { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 13px; font-weight: 600; fill: currentColor; }
    .keylbl { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 11px; font-weight: 600; fill: currentColor; letter-spacing: 0.03em; }
    .swatch { stroke: currentColor; stroke-width: 1; }
  </style>

  <!-- spokes -->
  <line class="spoke" x1="480" y1="310" x2="480" y2="100"/>
  <line class="spoke" x1="480" y1="310" x2="772" y2="166"/>
  <line class="spoke" x1="480" y1="310" x2="772" y2="410"/>
  <line class="spoke" x1="480" y1="310" x2="480" y2="478"/>
  <line class="spoke" x1="480" y1="310" x2="188" y2="410"/>
  <line class="spoke" x1="480" y1="310" x2="188" y2="166"/>

  <!-- hub -->
  <circle class="hub" cx="480" cy="310" r="60"/>
  <text class="hublbl" x="480" y="304" text-anchor="middle">Remote-sensing /</text>
  <text class="hublbl" x="480" y="320" text-anchor="middle">Earth-observation</text>
  <text class="hublbl" x="480" y="336" text-anchor="middle">dense vision</text>

  <!-- nodes -->
  <g>
    <rect class="node found" x="356" y="48" width="248" height="56" rx="10"/>
    <text class="lbl" x="480" y="72" text-anchor="middle">1 · Geospatial foundation models</text>
    <text class="sub" x="480" y="90" text-anchor="middle">SkySense V2 · TerraMind · Copernicus-FM</text>
  </g>
  <g>
    <rect class="node local" x="650" y="138" width="252" height="56" rx="10"/>
    <text class="lbl" x="776" y="162" text-anchor="middle">2 · Oriented aerial detection</text>
    <text class="sub" x="776" y="180" text-anchor="middle">PointOBB-v3 · PWOOD · S²Teacher</text>
  </g>
  <g>
    <rect class="node local" x="650" y="382" width="252" height="56" rx="10"/>
    <text class="lbl" x="776" y="406" text-anchor="middle">4 · SAR &amp; multi-sensor detection</text>
    <text class="sub" x="776" y="424" text-anchor="middle">SMEP-DETR · MHFNet · oriented ship</text>
  </g>
  <g>
    <rect class="node lang" x="356" y="472" width="248" height="56" rx="10"/>
    <text class="lbl" x="480" y="496" text-anchor="middle">5 · RS vision-language models</text>
    <text class="sub" x="480" y="514" text-anchor="middle">SkySense-O · EarthGPT-X · SkyMoE</text>
  </g>
  <g>
    <rect class="node lang" x="62" y="382" width="252" height="56" rx="10"/>
    <text class="lbl" x="188" y="406" text-anchor="middle">3 · Land-cover segmentation</text>
    <text class="sub" x="188" y="424" text-anchor="middle">LandSegmenter · MM-SAM · FlexiSAM</text>
  </g>
  <g>
    <rect class="node found" x="62" y="138" width="252" height="56" rx="10"/>
    <text class="lbl" x="188" y="162" text-anchor="middle">6 · Capability benchmarks</text>
    <text class="sub" x="188" y="180" text-anchor="middle">GEO-Bench-2 · PANGAEA · REOBench</text>
  </g>

  <!-- legend -->
  <g>
    <text class="keylbl" x="62" y="586">FAMILIES</text>
    <rect class="swatch found" x="62" y="598" width="14" height="14" rx="3"/>
    <text class="sub" x="84" y="609">Shared pretraining &amp; evaluation</text>
    <rect class="swatch local" x="360" y="598" width="14" height="14" rx="3"/>
    <text class="sub" x="382" y="609">Dense localization (boxes)</text>
    <rect class="swatch lang" x="648" y="598" width="14" height="14" rx="3"/>
    <text class="sub" x="670" y="609">Dense classification &amp; language</text>
  </g>
</svg>
