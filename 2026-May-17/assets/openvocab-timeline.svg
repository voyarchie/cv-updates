<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 360" role="img" aria-label="Open-vocabulary detection timeline 2021–2026">
  <title>Open-vocabulary detection timeline 2021–2026</title>
  <desc>Six rows of open-vocabulary detection models grouped by lineage: CLIP-distilled, dual-encoder, region-text contrastive, grounded MLLM, and visual-prompt.</desc>
  <style>
    .axis { stroke: currentColor; stroke-width: 1.2; opacity: 0.6; }
    .tick { stroke: currentColor; stroke-width: 1; opacity: 0.45; }
    .yr   { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 11.5px; fill: currentColor; opacity: 0.8; }
    .row  { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 12px; font-weight: 600; fill: currentColor; }
    .pill { stroke: currentColor; stroke-width: 1.3; }
    .lbl  { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 11px; fill: currentColor; }
    .cd { fill: rgba(59,130,246,0.20); }
    .de { fill: rgba(16,185,129,0.20); }
    .rt { fill: rgba(245,158,11,0.20); }
    .mm { fill: rgba(168,85,247,0.20); }
    .vp { fill: rgba(244,114,182,0.20); }
  </style>

  <!-- x-axis: years 2021..2026 -->
  <line class="axis" x1="180" y1="310" x2="860" y2="310"/>
  <g>
    <line class="tick" x1="180" y1="305" x2="180" y2="315"/>
    <line class="tick" x1="316" y1="305" x2="316" y2="315"/>
    <line class="tick" x1="452" y1="305" x2="452" y2="315"/>
    <line class="tick" x1="588" y1="305" x2="588" y2="315"/>
    <line class="tick" x1="724" y1="305" x2="724" y2="315"/>
    <line class="tick" x1="860" y1="305" x2="860" y2="315"/>
    <text class="yr" x="180" y="332" text-anchor="middle">2021</text>
    <text class="yr" x="316" y="332" text-anchor="middle">2022</text>
    <text class="yr" x="452" y="332" text-anchor="middle">2023</text>
    <text class="yr" x="588" y="332" text-anchor="middle">2024</text>
    <text class="yr" x="724" y="332" text-anchor="middle">2025</text>
    <text class="yr" x="860" y="332" text-anchor="middle">2026</text>
  </g>

  <!-- row labels -->
  <text class="row" x="20" y="60">CLIP-distilled</text>
  <text class="row" x="20" y="110">Dual encoder</text>
  <text class="row" x="20" y="160">Region-text</text>
  <text class="row" x="20" y="210">Grounded MLLM</text>
  <text class="row" x="20" y="260">Visual prompt</text>

  <!-- CLIP-distilled row -->
  <g>
    <rect class="pill cd" x="180" y="44"  width="70" height="26" rx="6"/>
    <text class="lbl" x="215" y="61" text-anchor="middle">ViLD</text>
    <rect class="pill cd" x="280" y="44"  width="80" height="26" rx="6"/>
    <text class="lbl" x="320" y="61" text-anchor="middle">RegionCLIP</text>
    <rect class="pill cd" x="395" y="44"  width="70" height="26" rx="6"/>
    <text class="lbl" x="430" y="61" text-anchor="middle">F-VLM</text>
    <rect class="pill cd" x="490" y="44"  width="70" height="26" rx="6"/>
    <text class="lbl" x="525" y="61" text-anchor="middle">CORA</text>
    <rect class="pill cd" x="590" y="44"  width="120" height="26" rx="6"/>
    <text class="lbl" x="650" y="61" text-anchor="middle">CLIP-Self / DST-Det</text>
  </g>

  <!-- Dual-encoder row -->
  <g>
    <rect class="pill de" x="270" y="94" width="60" height="26" rx="6"/>
    <text class="lbl" x="300" y="111" text-anchor="middle">OWL-ViT</text>
    <rect class="pill de" x="380" y="94" width="60" height="26" rx="6"/>
    <text class="lbl" x="410" y="111" text-anchor="middle">OWLv2</text>
    <rect class="pill de" x="490" y="94" width="60" height="26" rx="6"/>
    <text class="lbl" x="520" y="111" text-anchor="middle">OWL-ST</text>
    <rect class="pill de" x="610" y="94" width="80" height="26" rx="6"/>
    <text class="lbl" x="650" y="111" text-anchor="middle">YOLO-World</text>
    <rect class="pill de" x="730" y="94" width="110" height="26" rx="6"/>
    <text class="lbl" x="785" y="111" text-anchor="middle">YOLO-World v3 / SigLIP</text>
  </g>

  <!-- Region-text row -->
  <g>
    <rect class="pill rt" x="180" y="144" width="60" height="26" rx="6"/>
    <text class="lbl" x="210" y="161" text-anchor="middle">GLIP</text>
    <rect class="pill rt" x="270" y="144" width="80" height="26" rx="6"/>
    <text class="lbl" x="310" y="161" text-anchor="middle">GLIPv2 · DetCLIP</text>
    <rect class="pill rt" x="395" y="144" width="80" height="26" rx="6"/>
    <text class="lbl" x="435" y="161" text-anchor="middle">Grounding DINO</text>
    <rect class="pill rt" x="500" y="144" width="80" height="26" rx="6"/>
    <text class="lbl" x="540" y="161" text-anchor="middle">MM-Grounding</text>
    <rect class="pill rt" x="610" y="144" width="100" height="26" rx="6"/>
    <text class="lbl" x="660" y="161" text-anchor="middle">Grounding-DINO 1.5</text>
    <rect class="pill rt" x="740" y="144" width="100" height="26" rx="6"/>
    <text class="lbl" x="790" y="161" text-anchor="middle">DINO-X / Pro</text>
  </g>

  <!-- Grounded MLLM row -->
  <g>
    <rect class="pill mm" x="430" y="194" width="80" height="26" rx="6"/>
    <text class="lbl" x="470" y="211" text-anchor="middle">Kosmos-2</text>
    <rect class="pill mm" x="540" y="194" width="60" height="26" rx="6"/>
    <text class="lbl" x="570" y="211" text-anchor="middle">Shikra</text>
    <rect class="pill mm" x="620" y="194" width="60" height="26" rx="6"/>
    <text class="lbl" x="650" y="211" text-anchor="middle">Ferret</text>
    <rect class="pill mm" x="700" y="194" width="60" height="26" rx="6"/>
    <text class="lbl" x="730" y="211" text-anchor="middle">Lenna</text>
    <rect class="pill mm" x="780" y="194" width="60" height="26" rx="6"/>
    <text class="lbl" x="810" y="211" text-anchor="middle">Sa2VA</text>
  </g>

  <!-- Visual prompt row -->
  <g>
    <rect class="pill vp" x="490" y="244" width="80" height="26" rx="6"/>
    <text class="lbl" x="530" y="261" text-anchor="middle">DINOv-iC</text>
    <rect class="pill vp" x="580" y="244" width="60" height="26" rx="6"/>
    <text class="lbl" x="610" y="261" text-anchor="middle">T-Rex</text>
    <rect class="pill vp" x="650" y="244" width="60" height="26" rx="6"/>
    <text class="lbl" x="680" y="261" text-anchor="middle">T-Rex2</text>
    <rect class="pill vp" x="720" y="244" width="70" height="26" rx="6"/>
    <text class="lbl" x="755" y="261" text-anchor="middle">CountGD</text>
    <rect class="pill vp" x="800" y="244" width="60" height="26" rx="6"/>
    <text class="lbl" x="830" y="261" text-anchor="middle">SAM 3</text>
  </g>
</svg>
