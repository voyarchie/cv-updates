<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 340" role="img" aria-label="The 4D radar representation ladder from raw ADC to point cloud">
  <title>The radar representation ladder — 2026-Jul-02 CV update</title>
  <desc>A left-to-right ladder of radar data representations: raw ADC samples, then a range-Doppler map after range and Doppler FFTs, then a range-azimuth map after an angle FFT or beamforming, then the full range-azimuth-Doppler tensor with elevation, and finally a sparse point cloud after CFAR thresholding and direction-of-arrival estimation. Moving right, information kept decreases while sparsity and efficiency increase; the CFAR step is marked as the lossy cut where most tensor cells are discarded. Pre-CFAR learning keeps the earlier rungs; post-CFAR pipelines start from the point cloud.</desc>
  <style>
    .box   { stroke: currentColor; stroke-width: 1.3; }
    .raw   { fill: rgba(6,182,212,0.18); }
    .ten   { fill: rgba(59,130,246,0.16); }
    .pc    { fill: rgba(168,85,247,0.16); }
    .arrow { fill: none; stroke: currentColor; stroke-width: 1.6; }
    .cut   { fill: none; stroke: currentColor; stroke-width: 1.6; stroke-dasharray: 5 4; }
    .ttl   { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 13px; font-weight: 600; fill: currentColor; }
    .sub   { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 10px; fill: currentColor; opacity: 0.74; }
    .edge  { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 9.5px; fill: currentColor; opacity: 0.82; }
    .axis  { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 11px; fill: currentColor; }
    .axsub { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 10px; fill: currentColor; opacity: 0.7; }
    .bar   { fill: currentColor; opacity: 0.12; }
  </style>

  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
    </marker>
  </defs>

  <!-- Rung 1: raw ADC -->
  <rect class="box raw" x="18" y="60" width="168" height="72" rx="9"/>
  <text class="ttl" x="102" y="90" text-anchor="middle">Raw ADC</text>
  <text class="sub" x="102" y="107" text-anchor="middle">fast-time × chirps × RX</text>
  <text class="sub" x="102" y="121" text-anchor="middle">all info · complex · dense</text>

  <!-- arrow 1 -->
  <line class="arrow" x1="188" y1="96" x2="222" y2="96" marker-end="url(#ah)"/>
  <text class="edge" x="205" y="80" text-anchor="middle">range +</text>
  <text class="edge" x="205" y="91" text-anchor="middle">Doppler FFT</text>

  <!-- Rung 2: RD -->
  <rect class="box ten" x="226" y="60" width="150" height="72" rx="9"/>
  <text class="ttl" x="301" y="90" text-anchor="middle">Range-Doppler</text>
  <text class="sub" x="301" y="107" text-anchor="middle">(RD) map</text>
  <text class="sub" x="301" y="121" text-anchor="middle">angle still latent</text>

  <!-- arrow 2 -->
  <line class="arrow" x1="378" y1="96" x2="412" y2="96" marker-end="url(#ah)"/>
  <text class="edge" x="395" y="80" text-anchor="middle">angle FFT /</text>
  <text class="edge" x="395" y="91" text-anchor="middle">beamforming</text>

  <!-- Rung 3: RA -->
  <rect class="box ten" x="416" y="60" width="150" height="72" rx="9"/>
  <text class="ttl" x="491" y="90" text-anchor="middle">Range-Azimuth</text>
  <text class="sub" x="491" y="107" text-anchor="middle">(RA) map · BEV-like</text>
  <text class="sub" x="491" y="121" text-anchor="middle">Doppler collapsed</text>

  <!-- arrow 3 -->
  <line class="arrow" x1="568" y1="96" x2="602" y2="96" marker-end="url(#ah)"/>
  <text class="edge" x="585" y="86" text-anchor="middle">+ elevation</text>

  <!-- Rung 4: RAD tensor -->
  <rect class="box ten" x="606" y="60" width="150" height="72" rx="9"/>
  <text class="ttl" x="681" y="90" text-anchor="middle">RAD tensor</text>
  <text class="sub" x="681" y="107" text-anchor="middle">4D (+elev.)</text>
  <text class="sub" x="681" y="121" text-anchor="middle">richest · huge</text>

  <!-- CFAR cut arrow -->
  <line class="cut" x1="758" y1="96" x2="808" y2="96" marker-end="url(#ah)"/>
  <text class="edge" x="783" y="80" text-anchor="middle">CFAR ✂</text>
  <text class="edge" x="783" y="91" text-anchor="middle">+ DoA</text>

  <!-- Rung 5: point cloud -->
  <rect class="box pc" x="812" y="60" width="152" height="72" rx="9"/>
  <text class="ttl" x="888" y="90" text-anchor="middle">Point cloud</text>
  <text class="sub" x="888" y="107" text-anchor="middle">sparse · cheap</text>
  <text class="sub" x="888" y="121" text-anchor="middle">most cells discarded</text>

  <!-- pre/post CFAR brackets -->
  <text class="axsub" x="18" y="164">◄ pre-CFAR learning keeps these rungs (§3)</text>
  <text class="axsub" x="962" y="164" text-anchor="end">post-CFAR pipelines start here (§2) ►</text>

  <!-- axis bars -->
  <rect class="bar" x="18" y="212" width="946" height="26" rx="6"/>
  <text class="axis" x="30" y="229">Information kept</text>
  <text class="axsub" x="180" y="229">rich, soft evidence, micro-Doppler, target shape</text>
  <text class="axis" x="952" y="229" text-anchor="end">lossy →</text>

  <rect class="bar" x="18" y="248" width="946" height="26" rx="6"/>
  <text class="axis" x="30" y="265">Sparsity / efficiency</text>
  <text class="axsub" x="200" y="265">memory + compute drop, geometry becomes explicit</text>
  <text class="axis" x="952" y="265" text-anchor="end">sparse, fast →</text>

  <text class="axsub" x="490" y="304" text-anchor="middle">The central design choice: which rung feeds the network. The 2024–26 frontier is moving left, toward raw ADC, to stop discarding information at CFAR.</text>
</svg>
