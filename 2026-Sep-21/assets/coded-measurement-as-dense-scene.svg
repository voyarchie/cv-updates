<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 580" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" role="img" aria-label="A comparison of three optical front ends as dense-vision surfaces. On the left, a conventional lens performs the inversion in glass: each scene point maps to one sensor point, so the sensor already holds a picture and a detector can run straight on the pixels. In the middle, a mask-based lensless camera replaces the lens with a thin coded mask, so each scene point spreads across a large area of the sensor and every pixel is a weighted sum of the whole scene; the measurement looks like unstructured haze, and there are two routes forward, either invert first and then detect, or feed the raw measurement to a network trained to detect and classify without ever forming a picture. On the right, the optics themselves are trained, and part of the inference happens in light before digitization, so only a small number of task-relevant numbers are ever read out. The three panels differ in where the picture is formed, whether it is formed at all, and how many photons and bits each decision costs.">
  <title>A coded measurement is not an image: the lens, the mask, and the trained optic as three different dense-vision surfaces</title>
  <rect x="0" y="0" width="980" height="580" rx="10" fill="#f4f6fb" stroke="#cbd5e1" stroke-width="1"/>
  <text x="24" y="32" fill="#334155" font-size="16.5" font-weight="800">Where does the picture get formed? &#8212; glass &#8594; computation &#8594; never</text>

  <!-- ================= Panel 1: conventional lens ================= -->
  <g>
    <rect x="24" y="52" width="298" height="500" rx="8" fill="#0b1220" stroke="#334155" stroke-width="2"/>
    <text x="38" y="74" fill="#94a3b8" font-size="11.5">1 &#183; lens: the inversion happens in glass</text>

    <!-- scene -->
    <rect x="44" y="88" width="258" height="58" rx="5" fill="#0f172a" stroke="#334155"/>
    <text x="54" y="106" fill="#cbd5e1" font-size="10">scene: three point sources</text>
    <circle cx="90" cy="128" r="5" fill="#fbbf24"/>
    <circle cx="172" cy="128" r="5" fill="#5eead4"/>
    <circle cx="256" cy="128" r="5" fill="#f9a8d4"/>

    <!-- lens element -->
    <path d="M 84 168 Q 173 150 262 168 Q 173 186 84 168 Z" fill="#1d4ed8" opacity="0.5" stroke="#60a5fa"/>
    <text x="118" y="204" fill="#93c5fd" font-size="10">a thick, heavy, well-corrected lens</text>

    <!-- rays converge: one point in, one point out -->
    <g stroke="#fbbf24" stroke-width="1.1" opacity="0.85">
      <line x1="90" y1="133" x2="120" y2="166"/><line x1="120" y1="170" x2="104" y2="256"/>
    </g>
    <g stroke="#5eead4" stroke-width="1.1" opacity="0.85">
      <line x1="172" y1="133" x2="172" y2="166"/><line x1="172" y1="170" x2="172" y2="256"/>
    </g>
    <g stroke="#f9a8d4" stroke-width="1.1" opacity="0.85">
      <line x1="256" y1="133" x2="226" y2="166"/><line x1="226" y1="170" x2="242" y2="256"/>
    </g>

    <!-- sensor with a focused image -->
    <rect x="44" y="258" width="258" height="72" rx="5" fill="#111a2e" stroke="#475569"/>
    <circle cx="104" cy="294" r="5" fill="#fbbf24"/>
    <circle cx="172" cy="294" r="5" fill="#5eead4"/>
    <circle cx="242" cy="294" r="5" fill="#f9a8d4"/>
    <text x="54" y="322" fill="#cbd5e1" font-size="10">sensor: one scene point &#8594; one pixel</text>

    <rect x="44" y="346" width="258" height="34" rx="5" fill="#0d2a22" stroke="#34d399"/>
    <text x="54" y="368" fill="#6ee7b7" font-size="10.5" font-weight="700">the measurement IS a picture</text>

    <text x="44" y="406" fill="#94a3b8" font-size="10">A detector runs on the pixels as-is. Every</text>
    <text x="44" y="422" fill="#94a3b8" font-size="10">pretrained backbone, augmentation recipe</text>
    <text x="44" y="438" fill="#94a3b8" font-size="10">and robustness benchmark assumes this.</text>

    <text x="44" y="468" fill="#f87171" font-size="10.5" font-weight="700">cost: volume, mass, aberration correction</text>
    <text x="44" y="486" fill="#94a3b8" font-size="10">and a full photograph&#8217;s worth of photons,</text>
    <text x="44" y="502" fill="#94a3b8" font-size="10">bits and readout energy per decision &#8212;</text>
    <text x="44" y="518" fill="#94a3b8" font-size="10">whether or not the task needs them</text>
    <text x="44" y="540" fill="#64748b" font-size="9.5">optics fixed &#183; inference all electronic</text>
  </g>

  <!-- ================= Panel 2: mask-based lensless ================= -->
  <g>
    <rect x="338" y="52" width="298" height="500" rx="8" fill="#0b1220" stroke="#334155" stroke-width="2"/>
    <text x="352" y="74" fill="#94a3b8" font-size="11.5">2 &#183; coded mask: the inversion is deferred</text>

    <!-- scene -->
    <rect x="358" y="88" width="258" height="58" rx="5" fill="#0f172a" stroke="#334155"/>
    <text x="368" y="106" fill="#cbd5e1" font-size="10">same scene</text>
    <circle cx="404" cy="128" r="5" fill="#fbbf24"/>
    <circle cx="486" cy="128" r="5" fill="#5eead4"/>
    <circle cx="570" cy="128" r="5" fill="#f9a8d4"/>

    <!-- thin mask -->
    <rect x="378" y="164" width="218" height="10" rx="2" fill="#312e81" stroke="#818cf8"/>
    <g fill="#0b1220">
      <rect x="392" y="166" width="6" height="6"/><rect x="416" y="166" width="4" height="6"/>
      <rect x="442" y="166" width="7" height="6"/><rect x="470" y="166" width="4" height="6"/>
      <rect x="498" y="166" width="6" height="6"/><rect x="530" y="166" width="5" height="6"/>
      <rect x="558" y="166" width="7" height="6"/><rect x="578" y="166" width="4" height="6"/>
    </g>
    <text x="378" y="194" fill="#a5b4fc" font-size="10">a thin amplitude or phase mask (&#8776;0.1 mm)</text>

    <!-- each point spreads across the whole sensor -->
    <g stroke="#fbbf24" stroke-width="0.8" opacity="0.55">
      <line x1="404" y1="176" x2="376" y2="256"/><line x1="404" y1="176" x2="452" y2="256"/>
      <line x1="404" y1="176" x2="530" y2="256"/><line x1="404" y1="176" x2="600" y2="256"/>
    </g>
    <g stroke="#5eead4" stroke-width="0.8" opacity="0.55">
      <line x1="486" y1="176" x2="372" y2="256"/><line x1="486" y1="176" x2="446" y2="256"/>
      <line x1="486" y1="176" x2="546" y2="256"/><line x1="486" y1="176" x2="606" y2="256"/>
    </g>
    <g stroke="#f9a8d4" stroke-width="0.8" opacity="0.55">
      <line x1="570" y1="176" x2="380" y2="256"/><line x1="570" y1="176" x2="470" y2="256"/>
      <line x1="570" y1="176" x2="540" y2="256"/><line x1="570" y1="176" x2="598" y2="256"/>
    </g>
    <text x="378" y="222" fill="#cbd5e1" font-size="10">one scene point &#8594; a caustic spread over</text>
    <text x="378" y="236" fill="#cbd5e1" font-size="10">thousands of pixels (the PSF)</text>

    <!-- sensor: haze -->
    <rect x="358" y="258" width="258" height="72" rx="5" fill="#131a2c" stroke="#475569"/>
    <g opacity="0.75">
      <path d="M 366 300 Q 396 272 426 300 Q 456 328 486 300 Q 516 272 546 300 Q 576 326 606 300" stroke="#94a3b8" fill="none" stroke-width="7" opacity="0.35"/>
      <path d="M 366 288 Q 400 316 434 288 Q 468 262 502 288 Q 536 314 570 288 Q 594 272 610 282" stroke="#a78bfa" fill="none" stroke-width="5" opacity="0.3"/>
      <path d="M 366 312 Q 402 290 438 312 Q 474 334 510 312 Q 546 292 582 312" stroke="#22d3ee" fill="none" stroke-width="4" opacity="0.28"/>
    </g>
    <text x="368" y="324" fill="#cbd5e1" font-size="10">every pixel = a weighted sum of the scene</text>

    <rect x="358" y="346" width="258" height="34" rx="5" fill="#3f1d2e" stroke="#9f1239"/>
    <text x="368" y="368" fill="#fda4af" font-size="10.5" font-weight="700">the measurement is NOT a picture</text>

    <!-- two routes -->
    <rect x="358" y="392" width="124" height="112" rx="6" fill="#0f172a" stroke="#38bdf8"/>
    <text x="368" y="410" fill="#7dd3fc" font-size="10" font-weight="700">route A</text>
    <text x="368" y="426" fill="#cbd5e1" font-size="9.5">invert first:</text>
    <text x="368" y="440" fill="#cbd5e1" font-size="9.5">deconvolve /</text>
    <text x="368" y="454" fill="#cbd5e1" font-size="9.5">unroll / diffuse</text>
    <text x="368" y="470" fill="#cbd5e1" font-size="9.5">&#8594; then run an</text>
    <text x="368" y="484" fill="#cbd5e1" font-size="9.5">ordinary detector</text>
    <text x="368" y="499" fill="#94a3b8" font-size="9">pays for pixels it</text>
    <text x="368" y="511" fill="#94a3b8" font-size="9">will never look at</text>

    <rect x="492" y="392" width="124" height="112" rx="6" fill="#0f172a" stroke="#34d399"/>
    <text x="502" y="410" fill="#6ee7b7" font-size="10" font-weight="700">route B</text>
    <text x="502" y="426" fill="#cbd5e1" font-size="9.5">never invert:</text>
    <text x="502" y="440" fill="#cbd5e1" font-size="9.5">train a network</text>
    <text x="502" y="454" fill="#cbd5e1" font-size="9.5">to detect and</text>
    <text x="502" y="470" fill="#cbd5e1" font-size="9.5">classify on the</text>
    <text x="502" y="484" fill="#cbd5e1" font-size="9.5">raw measurement</text>
    <text x="502" y="499" fill="#94a3b8" font-size="9">no pretrained</text>
    <text x="502" y="511" fill="#94a3b8" font-size="9">backbone fits it</text>

    <text x="358" y="540" fill="#64748b" font-size="9.5">optics fixed but coded &#183; the picture is optional</text>
  </g>

  <!-- ================= Panel 3: trained optics that compute ================= -->
  <g>
    <rect x="652" y="52" width="304" height="500" rx="8" fill="#0b1220" stroke="#334155" stroke-width="2"/>
    <text x="666" y="74" fill="#94a3b8" font-size="11.5">3 &#183; trained optics: inference starts in light</text>

    <!-- scene -->
    <rect x="672" y="88" width="264" height="58" rx="5" fill="#0f172a" stroke="#334155"/>
    <text x="682" y="106" fill="#cbd5e1" font-size="10">same scene</text>
    <circle cx="718" cy="128" r="5" fill="#fbbf24"/>
    <circle cx="800" cy="128" r="5" fill="#5eead4"/>
    <circle cx="884" cy="128" r="5" fill="#f9a8d4"/>

    <!-- stack of trained diffractive layers -->
    <g>
      <rect x="692" y="162" width="224" height="9" rx="2" fill="#4c1d95" stroke="#c4b5fd"/>
      <rect x="692" y="182" width="224" height="9" rx="2" fill="#4c1d95" stroke="#c4b5fd"/>
      <rect x="692" y="202" width="224" height="9" rx="2" fill="#4c1d95" stroke="#c4b5fd"/>
    </g>
    <g stroke="#c4b5fd" stroke-width="0.7" opacity="0.5">
      <line x1="718" y1="133" x2="740" y2="162"/><line x1="800" y1="133" x2="800" y2="162"/>
      <line x1="884" y1="133" x2="862" y2="162"/>
      <line x1="740" y1="171" x2="790" y2="182"/><line x1="800" y1="171" x2="760" y2="182"/>
      <line x1="862" y1="171" x2="820" y2="182"/>
      <line x1="790" y1="191" x2="812" y2="202"/><line x1="760" y1="191" x2="800" y2="202"/>
      <line x1="820" y1="191" x2="786" y2="202"/>
    </g>
    <text x="692" y="230" fill="#ddd6fe" font-size="10">phase masks / metasurface / DOE whose</text>
    <text x="692" y="244" fill="#ddd6fe" font-size="10">profile is a trained parameter</text>

    <!-- the gradient arrow back into the optics -->
    <path d="M 926 240 C 948 210 948 180 930 166" stroke="#f472b6" stroke-width="1.6" fill="none" stroke-dasharray="4 3"/>
    <polygon points="930,166 924,176 936,174" fill="#f472b6"/>
    <text x="700" y="262" fill="#f9a8d4" font-size="9.5">task loss back-propagates into the glass</text>

    <!-- tiny readout -->
    <rect x="672" y="276" width="264" height="54" rx="5" fill="#111a2e" stroke="#475569"/>
    <g>
      <rect x="700" y="294" width="20" height="20" rx="3" fill="#34d399" opacity="0.8"/>
      <rect x="732" y="294" width="20" height="20" rx="3" fill="#1f2937" stroke="#475569"/>
      <rect x="764" y="294" width="20" height="20" rx="3" fill="#34d399" opacity="0.45"/>
      <rect x="796" y="294" width="20" height="20" rx="3" fill="#1f2937" stroke="#475569"/>
      <rect x="828" y="294" width="20" height="20" rx="3" fill="#34d399" opacity="0.95"/>
      <rect x="860" y="294" width="20" height="20" rx="3" fill="#1f2937" stroke="#475569"/>
    </g>
    <text x="682" y="290" fill="#cbd5e1" font-size="10">only a handful of numbers are digitized</text>

    <rect x="672" y="346" width="264" height="34" rx="5" fill="#0d2540" stroke="#38bdf8"/>
    <text x="682" y="368" fill="#7dd3fc" font-size="10.5" font-weight="700">the picture is never formed at all</text>

    <text x="672" y="406" fill="#94a3b8" font-size="10">Part of the first layer is paid for in photons</text>
    <text x="672" y="422" fill="#94a3b8" font-size="10">instead of joules: propagation and</text>
    <text x="672" y="438" fill="#94a3b8" font-size="10">interference do the multiply-accumulate.</text>

    <text x="672" y="468" fill="#fbbf24" font-size="10.5" font-weight="700">cost: the optic is frozen at fabrication</text>
    <text x="672" y="486" fill="#94a3b8" font-size="10">Retraining the task means re-etching the</text>
    <text x="672" y="502" fill="#94a3b8" font-size="10">mask; demonstrated accuracy is mostly on</text>
    <text x="672" y="518" fill="#94a3b8" font-size="10">MNIST-scale problems, not COCO.</text>
    <text x="672" y="540" fill="#64748b" font-size="9.5">optics trained &#183; inference partly optical</text>
  </g>
</svg>
