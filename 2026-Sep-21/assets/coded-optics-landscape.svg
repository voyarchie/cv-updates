<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 640" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" role="img" aria-label="A two-axis map of computational-optics approaches to dense detection and classification. The horizontal axis runs from always reconstructing an image before inference, through optionally reconstructing, to never reconstructing at all. The vertical axis runs from optics that are fixed and off the shelf, through optics that are calibrated, to optics whose parameters are trained with the task loss, up to optics that perform part of the computation in light. Conventional cameras with detectors sit in the bottom left: fixed glass, image always formed. Metalens cameras with neural post-processing and snapshot compressive imaging reconstruction sit in the lower middle. Learned lensless reconstruction methods sit in the middle left. Reconstruction-free recognition on lensless measurements, privacy-preserving optics and image-free single-pixel detection sit to the right, where no picture is formed. End-to-end deep-optics co-design sits high and centre, because the mask is trained jointly with the detector. Diffractive optical neural networks and in-sensor computing sit in the top right, where the optic computes and no image ever exists. The diagonal band from bottom left to top right is labelled as the direction of travel: each step trades generality and reusable pretrained backbones for photons, bits and joules per decision.">
  <title>Two axes of the field: is the picture reconstructed, and is the optic trained?</title>
  <rect x="0" y="0" width="980" height="640" rx="10" fill="#f4f6fb" stroke="#cbd5e1" stroke-width="1"/>
  <text x="24" y="32" fill="#334155" font-size="16.5" font-weight="800">The coded-optics landscape: two independent choices, one direction of travel</text>
  <text x="24" y="52" fill="#64748b" font-size="11">Moving up trades flexibility for photon and energy efficiency; moving right trades reusable pretrained vision for the same.</text>

  <!-- plot frame -->
  <rect x="150" y="70" width="700" height="470" rx="8" fill="#0b1220" stroke="#334155" stroke-width="2"/>

  <!-- diagonal direction-of-travel band -->
  <path d="M 150 540 L 850 70 L 850 160 L 300 540 Z" fill="#1d4ed8" opacity="0.10"/>
  <path d="M 190 500 L 800 120" stroke="#60a5fa" stroke-width="1.6" stroke-dasharray="6 4" opacity="0.7"/>
  <polygon points="800,120 786,124 792,136" fill="#60a5fa" opacity="0.9"/>
  <text x="596" y="176" fill="#93c5fd" font-size="10.5" font-weight="700" transform="rotate(-32 596 176)">fewer photons, bits and joules per decision</text>
  <text x="596" y="190" fill="#7dd3fc" font-size="9.5" transform="rotate(-32 596 190)">&#8212; and less reusable, more task-frozen hardware</text>

  <!-- grid lines -->
  <g stroke="#1e293b" stroke-width="1">
    <line x1="383" y1="70" x2="383" y2="540"/>
    <line x1="616" y1="70" x2="616" y2="540"/>
    <line x1="150" y1="227" x2="850" y2="227"/>
    <line x1="150" y1="384" x2="850" y2="384"/>
  </g>

  <!-- x axis labels -->
  <text x="266" y="566" fill="#cbd5e1" font-size="11" text-anchor="middle" font-weight="700">image always formed</text>
  <text x="266" y="581" fill="#64748b" font-size="9.5" text-anchor="middle">inversion is the product</text>
  <text x="499" y="566" fill="#cbd5e1" font-size="11" text-anchor="middle" font-weight="700">image optional</text>
  <text x="499" y="581" fill="#64748b" font-size="9.5" text-anchor="middle">formed for humans, skipped for machines</text>
  <text x="733" y="566" fill="#cbd5e1" font-size="11" text-anchor="middle" font-weight="700">no image, ever</text>
  <text x="733" y="581" fill="#64748b" font-size="9.5" text-anchor="middle">only the answer is read out</text>
  <text x="499" y="612" fill="#475569" font-size="11.5" text-anchor="middle" font-weight="800">&#8594; how much of the picture do you refuse to compute?</text>

  <!-- y axis labels -->
  <text x="138" y="502" fill="#cbd5e1" font-size="11" text-anchor="end" font-weight="700">optic is fixed</text>
  <text x="138" y="517" fill="#64748b" font-size="9.5" text-anchor="end">off-the-shelf glass</text>
  <text x="138" y="340" fill="#cbd5e1" font-size="11" text-anchor="end" font-weight="700">optic is calibrated</text>
  <text x="138" y="355" fill="#64748b" font-size="9.5" text-anchor="end">measured PSF in the loop</text>
  <text x="138" y="188" fill="#cbd5e1" font-size="11" text-anchor="end" font-weight="700">optic is trained</text>
  <text x="138" y="203" fill="#64748b" font-size="9.5" text-anchor="end">mask is a parameter</text>
  <text x="138" y="106" fill="#cbd5e1" font-size="11" text-anchor="end" font-weight="700">optic computes</text>
  <text x="138" y="121" fill="#64748b" font-size="9.5" text-anchor="end">layers of the net are glass</text>
  <text x="40" y="320" fill="#475569" font-size="11.5" font-weight="800" transform="rotate(-90 40 320)" text-anchor="middle">&#8593; how much of the system is optimized?</text>

  <!-- ============ plotted families ============ -->
  <!-- bottom-left: conventional -->
  <g>
    <circle cx="238" cy="482" r="9" fill="#94a3b8"/>
    <rect x="166" y="424" width="188" height="46" rx="5" fill="#0f172a" stroke="#64748b"/>
    <text x="176" y="441" fill="#e2e8f0" font-size="10.5" font-weight="700">lens + detector</text>
    <text x="176" y="456" fill="#94a3b8" font-size="9.5">where all of mainstream vision lives</text>
    <line x1="238" y1="473" x2="238" y2="470" stroke="#64748b"/>
  </g>

  <!-- lower middle: metalens + neural ISP -->
  <g>
    <circle cx="430" cy="470" r="9" fill="#38bdf8"/>
    <rect x="368" y="486" width="200" height="46" rx="5" fill="#0f172a" stroke="#38bdf8"/>
    <text x="378" y="503" fill="#e0f2fe" font-size="10.5" font-weight="700">metalens / thin optic + neural ISP</text>
    <text x="378" y="518" fill="#7dd3fc" font-size="9.5">aberration is fixed downstream, not in glass</text>
    <line x1="430" y1="479" x2="430" y2="486" stroke="#38bdf8"/>
  </g>

  <!-- middle-left: learned lensless reconstruction -->
  <g>
    <circle cx="300" cy="320" r="9" fill="#a78bfa"/>
    <rect x="166" y="262" width="210" height="46" rx="5" fill="#0f172a" stroke="#a78bfa"/>
    <text x="176" y="279" fill="#ede9fe" font-size="10.5" font-weight="700">learned lensless reconstruction</text>
    <text x="176" y="294" fill="#c4b5fd" font-size="9.5">unrolled / transformer / diffusion-prior</text>
    <line x1="300" y1="311" x2="300" y2="308" stroke="#a78bfa"/>
  </g>

  <!-- middle: snapshot compressive imaging -->
  <g>
    <circle cx="452" cy="352" r="9" fill="#c084fc"/>
    <rect x="392" y="318" width="188" height="32" rx="5" fill="#0f172a" stroke="#c084fc"/>
    <text x="402" y="338" fill="#f3e8ff" font-size="10.5" font-weight="700">snapshot compressive imaging</text>
    <line x1="452" y1="343" x2="452" y2="350" stroke="#c084fc"/>
  </g>

  <!-- right-middle: reconstruction-free recognition -->
  <g>
    <circle cx="700" cy="330" r="9" fill="#34d399"/>
    <rect x="612" y="246" width="226" height="60" rx="5" fill="#0f172a" stroke="#34d399"/>
    <text x="622" y="263" fill="#d1fae5" font-size="10.5" font-weight="700">reconstruction-free recognition</text>
    <text x="622" y="278" fill="#6ee7b7" font-size="9.5">classify / detect on the raw measurement;</text>
    <text x="622" y="292" fill="#6ee7b7" font-size="9.5">privacy-by-optics claims live here too</text>
    <line x1="700" y1="321" x2="700" y2="306" stroke="#34d399"/>
  </g>

  <!-- right-lower: image-free single pixel -->
  <g>
    <circle cx="768" cy="452" r="9" fill="#fbbf24"/>
    <rect x="648" y="470" width="200" height="46" rx="5" fill="#0f172a" stroke="#fbbf24"/>
    <text x="658" y="487" fill="#fef3c7" font-size="10.5" font-weight="700">image-free single-pixel vision</text>
    <text x="658" y="502" fill="#fcd34d" font-size="9.5">detection / tracking from a few dozen numbers</text>
    <line x1="768" y1="461" x2="768" y2="470" stroke="#fbbf24"/>
  </g>

  <!-- upper-centre: deep optics co-design -->
  <g>
    <circle cx="500" cy="180" r="9" fill="#f472b6"/>
    <rect x="392" y="122" width="232" height="46" rx="5" fill="#0f172a" stroke="#f472b6"/>
    <text x="402" y="139" fill="#fce7f3" font-size="10.5" font-weight="700">end-to-end deep-optics co-design</text>
    <text x="402" y="154" fill="#f9a8d4" font-size="9.5">mask, sensor and detector trained together</text>
    <line x1="500" y1="171" x2="500" y2="168" stroke="#f472b6"/>
  </g>

  <!-- top-right: D2NN / optical NN -->
  <g>
    <circle cx="780" cy="128" r="9" fill="#5eead4"/>
    <rect x="636" y="84" width="204" height="32" rx="5" fill="#0f172a" stroke="#5eead4"/>
    <text x="646" y="104" fill="#ccfbf1" font-size="10.5" font-weight="700">diffractive / optical neural nets</text>
    <line x1="780" y1="119" x2="780" y2="116" stroke="#5eead4"/>
  </g>

  <!-- top-right lower: in-sensor compute -->
  <g>
    <circle cx="690" cy="192" r="9" fill="#fb923c"/>
    <rect x="612" y="196" width="212" height="32" rx="5" fill="#0f172a" stroke="#fb923c"/>
    <text x="622" y="216" fill="#ffedd5" font-size="10.5" font-weight="700">in-sensor / near-sensor computing</text>
    <line x1="690" y1="201" x2="690" y2="196" stroke="#fb923c"/>
  </g>

  <!-- the empty corner callout -->
  <g>
    <rect x="166" y="84" width="200" height="60" rx="5" fill="#111a2e" stroke="#475569" stroke-dasharray="4 3"/>
    <text x="176" y="102" fill="#94a3b8" font-size="10" font-weight="700">this corner is nearly empty</text>
    <text x="176" y="117" fill="#64748b" font-size="9.5">optics trained to compute, yet still</text>
    <text x="176" y="131" fill="#64748b" font-size="9.5">required to emit a full picture</text>
  </g>

  <!-- honest caveat strip -->
  <rect x="150" y="70" width="700" height="0" fill="none"/>
  <text x="24" y="634" fill="#64748b" font-size="10">Positions are editorial, not measured: this is a map of design commitments, not a benchmark. Almost every result above the middle band is demonstrated on classification-scale tasks; COCO-scale detection still lives in the bottom-left cell.</text>
</svg>
