<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" role="img" aria-label="An astronomical survey image shown as a dense scene of sources. Left: a raw crowded star field on a dark sky, with point-like stars, two overlapping (blended) galaxies sharing the same footprint, an extended spiral galaxy, faint background sources, and a transient point source that has newly appeared. Right: the same field decomposed by the survey pipeline into detection footprints, deblended instance profiles for the two overlapping galaxies, morphological and star-galaxy classes, and a transient flagged from difference imaging.">
  <title>One survey image, read as a dense scene of astronomical sources</title>
  <defs>
    <marker id="sk-arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <radialGradient id="sk-gal" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="45%" stop-color="#f59e0b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sk-gal2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#bfdbfe"/>
      <stop offset="45%" stop-color="#60a5fa" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#60a5fa" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sk-star" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="55%" stop-color="#e2e8f0" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#e2e8f0" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- self-contained light card so dark text stays legible on any page theme -->
  <rect x="0" y="0" width="960" height="520" rx="10" fill="#f4f6fb" stroke="#cbd5e1" stroke-width="1"/>
  <text x="24" y="32" fill="#334155" font-size="17" font-weight="800">One survey image, read as a dense scene of sources</text>

  <!-- ===================== LEFT: raw sky image ===================== -->
  <g>
    <rect x="24" y="50" width="430" height="400" rx="8" fill="#070b16" stroke="#334155" stroke-width="2"/>
    <text x="38" y="72" fill="#94a3b8" font-size="11.5">raw calibrated exposure &#183; brightness = photon counts</text>

    <!-- faint background sources -->
    <g>
      <circle cx="80" cy="130" r="9" fill="url(#sk-star)"/>
      <circle cx="410" cy="180" r="7" fill="url(#sk-star)"/>
      <circle cx="120" cy="410" r="8" fill="url(#sk-star)"/>
      <circle cx="380" cy="410" r="10" fill="url(#sk-gal2)"/>
      <circle cx="60" cy="300" r="7" fill="url(#sk-gal)"/>
    </g>

    <!-- bright stars (point sources with diffraction spikes) -->
    <g stroke="#e2e8f0" stroke-width="1" opacity="0.7">
      <line x1="150" y1="120" x2="150" y2="160"/><line x1="130" y1="140" x2="170" y2="140"/>
      <line x1="330" y1="330" x2="330" y2="366"/><line x1="312" y1="348" x2="348" y2="348"/>
    </g>
    <circle cx="150" cy="140" r="13" fill="url(#sk-star)"/>
    <circle cx="150" cy="140" r="4" fill="#ffffff"/>
    <circle cx="330" cy="348" r="11" fill="url(#sk-star)"/>
    <circle cx="330" cy="348" r="3.5" fill="#ffffff"/>

    <!-- extended spiral galaxy -->
    <circle cx="360" cy="110" r="26" fill="url(#sk-gal)"/>
    <ellipse cx="360" cy="110" rx="20" ry="8" fill="none" stroke="#fbbf24" stroke-width="2" opacity="0.55" transform="rotate(30 360 110)"/>

    <!-- TWO OVERLAPPING (blended) galaxies sharing one footprint -->
    <circle cx="205" cy="260" r="30" fill="url(#sk-gal)"/>
    <circle cx="245" cy="285" r="26" fill="url(#sk-gal2)"/>
    <path d="M205,225 a30,30 0 1 0 0.1,0" fill="none"/>
    <text x="150" y="330" fill="#fca5a5" font-size="11" font-weight="700">blend: 2 galaxies,</text>
    <text x="150" y="345" fill="#fca5a5" font-size="11" font-weight="700">one shared footprint</text>

    <!-- transient point source (new) -->
    <circle cx="300" cy="210" r="9" fill="url(#sk-star)"/>
    <circle cx="300" cy="210" r="3" fill="#f472b6"/>
    <text x="300" y="188" fill="#f9a8d4" font-size="10.5" font-weight="700" text-anchor="middle">new source?</text>
  </g>

  <!-- flow arrow -->
  <line x1="462" y1="250" x2="502" y2="250" stroke="#64748b" stroke-width="2.5" marker-end="url(#sk-arr)"/>
  <text x="482" y="240" fill="#64748b" font-size="10.5" text-anchor="middle">pipeline</text>

  <!-- ===================== RIGHT: decomposed ladder ===================== -->
  <g>
    <!-- 1 detection footprints -->
    <rect x="510" y="50" width="426" height="92" rx="8" fill="#0b1220" stroke="#334155" stroke-width="1.5"/>
    <text x="524" y="70" fill="#38bdf8" font-size="12.5" font-weight="800">1 &#183; Detection &#8594; footprints above noise</text>
    <g fill="none" stroke="#38bdf8" stroke-width="1.6" stroke-dasharray="4 3">
      <rect x="560" y="82" width="34" height="34" rx="4"/>
      <rect x="640" y="86" width="60" height="46" rx="6"/>
      <rect x="740" y="84" width="30" height="30" rx="4"/>
      <rect x="820" y="88" width="26" height="26" rx="4"/>
    </g>
    <text x="524" y="132" fill="#64748b" font-size="10">segments the sky into "something is here" regions</text>

    <!-- 2 deblend -->
    <rect x="510" y="152" width="426" height="104" rx="8" fill="#0b1220" stroke="#334155" stroke-width="1.5"/>
    <text x="524" y="172" fill="#f59e0b" font-size="12.5" font-weight="800">2 &#183; Deblend &#8594; split the shared footprint</text>
    <circle cx="600" cy="212" r="24" fill="url(#sk-gal)"/>
    <circle cx="636" cy="230" r="20" fill="url(#sk-gal2)"/>
    <path d="M618,190 L620,250" stroke="#f8fafc" stroke-width="1.4" stroke-dasharray="3 3"/>
    <text x="672" y="206" fill="#fde68a" font-size="10.5">instance A: profile,</text>
    <text x="672" y="220" fill="#fde68a" font-size="10.5">flux, centroid</text>
    <text x="672" y="236" fill="#bfdbfe" font-size="10.5">instance B: profile,</text>
    <text x="672" y="250" fill="#bfdbfe" font-size="10.5">flux, centroid</text>

    <!-- 3 classify -->
    <rect x="510" y="266" width="426" height="86" rx="8" fill="#0b1220" stroke="#334155" stroke-width="1.5"/>
    <text x="524" y="286" fill="#a78bfa" font-size="12.5" font-weight="800">3 &#183; Classify each instance</text>
    <g font-size="10.5">
      <rect x="524" y="298" width="86" height="20" rx="10" fill="#3730a3"/><text x="567" y="312" fill="#e0e7ff" text-anchor="middle">star / galaxy</text>
      <rect x="618" y="298" width="96" height="20" rx="10" fill="#3730a3"/><text x="666" y="312" fill="#e0e7ff" text-anchor="middle">spiral / elliptical</text>
      <rect x="722" y="298" width="92" height="20" rx="10" fill="#3730a3"/><text x="768" y="312" fill="#e0e7ff" text-anchor="middle">photo-z / SED</text>
    </g>
    <text x="524" y="340" fill="#64748b" font-size="10">fine-grained: morphology, redshift, variability class</text>

    <!-- 4 transient -->
    <rect x="510" y="362" width="426" height="88" rx="8" fill="#0b1220" stroke="#334155" stroke-width="1.5"/>
    <text x="524" y="382" fill="#f472b6" font-size="12.5" font-weight="800">4 &#183; Difference imaging &#8594; transient alert</text>
    <text x="524" y="402" fill="#94a3b8" font-size="10.5">new &#8722; template = residual; real-vs-bogus filter</text>
    <g font-size="10.5">
      <rect x="524" y="414" width="70" height="22" rx="11" fill="#831843"/><text x="559" y="429" fill="#fbcfe8" text-anchor="middle">REAL</text>
      <rect x="602" y="414" width="74" height="22" rx="11" fill="#334155"/><text x="639" y="429" fill="#cbd5e1" text-anchor="middle">bogus</text>
      <text x="690" y="429" fill="#f9a8d4">&#8594; stream to alert brokers</text>
    </g>
  </g>
</svg>
