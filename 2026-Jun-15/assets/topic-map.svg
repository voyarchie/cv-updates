<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 540" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" role="img" aria-label="Topic map: under-the-hood detector machinery and the classification half">
  <title>CV-updates Jun-15 topic map</title>
  <desc>Four clusters: training recipe, architecture plumbing, the classification half, and panoramic geometry. Colors are self-contained fills so the figure reads on light and dark backgrounds.</desc>

  <!-- edges -->
  <g stroke="#94a3b8" stroke-width="2" fill="none" opacity="0.8">
    <path d="M460,70 L200,150"/>
    <path d="M460,70 L460,150"/>
    <path d="M460,70 L720,150"/>
    <path d="M460,70 L720,430"/>

    <path d="M200,190 L120,270"/>
    <path d="M200,190 L200,270"/>
    <path d="M200,190 L280,270"/>

    <path d="M460,190 L400,270"/>
    <path d="M460,190 L520,270"/>

    <path d="M720,190 L640,270"/>
    <path d="M720,190 L800,270"/>
  </g>

  <!-- root -->
  <g>
    <rect x="350" y="30" width="220" height="40" rx="8" fill="#1f2937" stroke="#94a3b8"/>
    <text x="460" y="55" text-anchor="middle" fill="#f8fafc" font-size="15" font-weight="700">Dense detection &amp; classification — Jun-15</text>
  </g>

  <!-- cluster hubs -->
  <g font-size="13" font-weight="700">
    <rect x="110" y="150" width="180" height="40" rx="8" fill="#1f2937" stroke="#94a3b8"/>
    <text x="200" y="175" text-anchor="middle" fill="#f8fafc">A · Training recipe</text>

    <rect x="375" y="150" width="170" height="40" rx="8" fill="#1f2937" stroke="#94a3b8"/>
    <text x="460" y="175" text-anchor="middle" fill="#f8fafc">B · Plumbing &amp; capacity</text>

    <rect x="630" y="150" width="180" height="40" rx="8" fill="#1f2937" stroke="#94a3b8"/>
    <text x="720" y="175" text-anchor="middle" fill="#f8fafc">C · Classification half</text>
  </g>

  <!-- leaves -->
  <g font-size="12" fill="#f8fafc">
    <!-- A -->
    <rect x="40" y="270" width="160" height="46" rx="8" fill="#3b82f6" stroke="#1d4ed8"/>
    <text x="120" y="291" text-anchor="middle">§3 Label assignment</text>
    <text x="120" y="307" text-anchor="middle">&amp; query matching</text>

    <rect x="120" y="330" width="160" height="46" rx="8" fill="#3b82f6" stroke="#1d4ed8"/>
    <text x="200" y="351" text-anchor="middle">§4 Detection loss</text>
    <text x="200" y="367" text-anchor="middle">functions</text>

    <rect x="200" y="270" width="160" height="46" rx="8" fill="#3b82f6" stroke="#1d4ed8"/>
    <text x="280" y="291" text-anchor="middle">§5 Data augmentation</text>
    <text x="280" y="307" text-anchor="middle">(mosaic · copy-paste)</text>

    <!-- B -->
    <rect x="320" y="270" width="160" height="46" rx="8" fill="#10b981" stroke="#047857"/>
    <text x="400" y="291" text-anchor="middle">§6 Neck / feature</text>
    <text x="400" y="307" text-anchor="middle">fusion design</text>

    <rect x="440" y="270" width="160" height="46" rx="8" fill="#10b981" stroke="#047857"/>
    <text x="520" y="291" text-anchor="middle">§7 Mixture-of-Experts</text>
    <text x="520" y="307" text-anchor="middle">backbones</text>
  </g>

  <!-- C leaves (pink: dark text) -->
  <g font-size="12" fill="#1f2937">
    <rect x="560" y="270" width="160" height="46" rx="8" fill="#f472b6" stroke="#be185d"/>
    <text x="640" y="291" text-anchor="middle">§8 Efficient edge</text>
    <text x="640" y="307" text-anchor="middle">backbones</text>

    <rect x="720" y="270" width="170" height="46" rx="8" fill="#f472b6" stroke="#be185d"/>
    <text x="805" y="291" text-anchor="middle">§9 Zero-shot / open-vocab</text>
    <text x="805" y="307" text-anchor="middle">VLM classifiers</text>
  </g>

  <!-- D domain -->
  <g font-size="13" font-weight="700">
    <rect x="630" y="430" width="180" height="46" rx="8" fill="#f59e0b" stroke="#b45309"/>
    <text x="720" y="451" text-anchor="middle" fill="#1f2937">D · Geometry</text>
    <text x="720" y="468" text-anchor="middle" fill="#1f2937" font-weight="400" font-size="12">§10 Panoramic / fisheye / 360°</text>
  </g>

  <!-- legend -->
  <g font-size="11">
    <rect x="40" y="430" width="14" height="14" rx="3" fill="#3b82f6"/><text x="60" y="442" fill="#64748b">Training recipe</text>
    <rect x="40" y="452" width="14" height="14" rx="3" fill="#10b981"/><text x="60" y="464" fill="#64748b">Architecture plumbing</text>
    <rect x="40" y="474" width="14" height="14" rx="3" fill="#f472b6"/><text x="60" y="486" fill="#64748b">Classification half</text>
    <rect x="40" y="496" width="14" height="14" rx="3" fill="#f59e0b"/><text x="60" y="508" fill="#64748b">Geometry / sensor</text>
  </g>
</svg>
