<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" role="img" aria-label="Three paired bar comparisons of author-reported wind turbine blade results, each pair under one protocol. Boxes2Pixels versus SegFormer-B2 on the DTU drone test split, both trained only on SAM pseudo-masks from boxes: 76.61 versus 72.31 mIoU. Decoupled detector plus small language model report generation versus a zero-shot monolithic vision-language model: expert score 8.6 versus 3.3 out of 10, shown scaled to 86 versus 33. Multispectral YOLO ensemble versus a single YOLOv8: 93 versus 91 mAP at 0.5. Numbers within a pair share a protocol; numbers across pairs do not.">
  <title>Where blade-inspection gains come from</title>
  <rect x="0" y="0" width="960" height="430" rx="10" fill="#f4f6fb" stroke="#cbd5e1"/>
  <text x="24" y="34" fill="#334155" font-size="17" font-weight="800">Where blade-inspection gains come from (author-reported; compare within a pair only)</text>
  <text x="24" y="54" fill="#64748b" font-size="11.5">Bar length = score on a 0–100 scale. Dark bar = new method, light bar = baseline under the same protocol.</text>

  <g font-size="11.5">
    <line x1="300" y1="80" x2="300" y2="370" stroke="#94a3b8"/>
    <line x1="300" y1="370" x2="900" y2="370" stroke="#94a3b8"/>
    <text x="300" y="388" fill="#64748b" text-anchor="middle">0</text>
    <text x="600" y="388" fill="#64748b" text-anchor="middle">50</text>
    <text x="900" y="388" fill="#64748b" text-anchor="middle">100</text>
    <line x1="600" y1="80" x2="600" y2="370" stroke="#cbd5e1" stroke-dasharray="3 4"/>

    <!-- pair 1: Boxes2Pixels -->
    <text x="24" y="104" fill="#334155" font-weight="800">Weak labels · box → mask</text>
    <text x="24" y="122" fill="#64748b">DTU test, mIoU, SAM pseudo-masks</text>
    <rect x="300" y="88" width="459.7" height="20" rx="3" fill="#2f6fd6"/>
    <text x="754" y="103" fill="#ffffff" font-weight="700" text-anchor="end">76.61 Boxes2Pixels</text>
    <rect x="300" y="112" width="433.9" height="20" rx="3" fill="#93b4ea"/>
    <text x="741" y="127" fill="#334155" font-weight="700">72.31 SegFormer-B2</text>

    <!-- pair 2: report generation -->
    <text x="24" y="194" fill="#334155" font-weight="800">Report writing · expert score</text>
    <text x="24" y="212" fill="#64748b">out of 10, shown ×10</text>
    <rect x="300" y="178" width="516" height="20" rx="3" fill="#c2410c"/>
    <text x="810" y="193" fill="#ffffff" font-weight="700" text-anchor="end">8.6 YOLO-obb + small LM</text>
    <rect x="300" y="202" width="198" height="20" rx="3" fill="#f0a77f"/>
    <text x="505" y="217" fill="#334155" font-weight="700">3.3 zero-shot VLM</text>

    <!-- pair 3: multispectral ensemble -->
    <text x="24" y="284" fill="#334155" font-weight="800">RGB + thermal fusion</text>
    <text x="24" y="302" fill="#64748b">UAV set, mAP@0.5 ×100</text>
    <rect x="300" y="268" width="558" height="20" rx="3" fill="#15803d"/>
    <text x="852" y="283" fill="#ffffff" font-weight="700" text-anchor="end">93 YOLO ensemble</text>
    <rect x="300" y="292" width="546" height="20" rx="3" fill="#86c99b"/>
    <text x="840" y="307" fill="#334155" font-weight="700" text-anchor="end">91 single YOLOv8</text>
  </g>
  <text x="24" y="410" fill="#334155" font-size="11.5">Read: structure (decoupling detection from language) moved the score most; label tricks help a few points; fusion gains are small.</text>
</svg>
