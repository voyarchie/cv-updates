<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 620" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" role="img" aria-label="Topic map of the six MRI dense-detection and classification threads arranged around the MRI signal primitive">
  <title>MRI — six dense-detection &amp; classification threads around one primitive</title>
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#94a3b8"/>
    </marker>
  </defs>
  <!-- edges -->
  <g stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#ah)">
    <line x1="460" y1="310" x2="180" y2="120"/>
    <line x1="460" y1="310" x2="460" y2="118"/>
    <line x1="460" y1="310" x2="740" y2="120"/>
    <line x1="460" y1="310" x2="180" y2="502"/>
    <line x1="460" y1="310" x2="460" y2="504"/>
    <line x1="460" y1="310" x2="740" y2="502"/>
  </g>
  <!-- hub -->
  <g>
    <rect x="326" y="264" width="268" height="94" rx="12" fill="#1e293b" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="460" y="294" text-anchor="middle" fill="#f8fafc" font-size="15" font-weight="700">The MRI signal</text>
    <text x="460" y="316" text-anchor="middle" fill="#cbd5e1" font-size="12">a volumetric stack of contrasts</text>
    <text x="460" y="334" text-anchor="middle" fill="#cbd5e1" font-size="12">whose intensity is not calibrated</text>
  </g>
  <!-- nodes -->
  <g>
    <!-- 1 dense segmentation -->
    <rect x="30" y="64" width="300" height="96" rx="10" fill="#4f46e5" stroke="#3730a3"/>
    <text x="45" y="88" fill="#ffffff" font-size="12.5" font-weight="700">1 &#183; Dense segmentation (&#167;4)</text>
    <text x="45" y="107" fill="#e0e7ff" font-size="11">per-voxel labels are the native task</text>
    <text x="45" y="124" fill="#e0e7ff" font-size="11">nnU-Net incumbency &#183; MedNeXt &#183; Mamba</text>
    <text x="45" y="141" fill="#e0e7ff" font-size="11">BraTS &#183; cardiac &#183; MS &#183; stroke</text>

    <!-- 2 lesion detection -->
    <rect x="310" y="60" width="300" height="96" rx="10" fill="#0f766e" stroke="#115e59"/>
    <text x="325" y="84" fill="#ffffff" font-size="12.5" font-weight="700">2 &#183; Lesion detection (&#167;5)</text>
    <text x="325" y="103" fill="#ccfbf1" font-size="11">segment &#8594; connected components</text>
    <text x="325" y="120" fill="#ccfbf1" font-size="11">PI-CAI prostate csPCa &#183; breast MRI</text>
    <text x="325" y="137" fill="#ccfbf1" font-size="11">the per-patient false-positive tax</text>

    <!-- 3 classification -->
    <rect x="590" y="64" width="300" height="96" rx="10" fill="#be123c" stroke="#9f1239"/>
    <text x="605" y="88" fill="#ffffff" font-size="12.5" font-weight="700">3 &#183; Classification &amp; grading (&#167;6)</text>
    <text x="605" y="107" fill="#ffe4e6" font-size="11">tumour subtype &#183; molecular status</text>
    <text x="605" y="124" fill="#ffe4e6" font-size="11">PI-RADS / BI-RADS &#183; staging</text>
    <text x="605" y="141" fill="#ffe4e6" font-size="11">the label lives in cross-contrast ratios</text>

    <!-- 4 foundation models -->
    <rect x="30" y="460" width="300" height="96" rx="10" fill="#b45309" stroke="#92400e"/>
    <text x="45" y="484" fill="#ffffff" font-size="12.5" font-weight="700">4 &#183; 3D foundation models (&#167;7)</text>
    <text x="45" y="503" fill="#fde68a" font-size="11">SAM-Med3D &#183; SegVol &#183; VISTA3D</text>
    <text x="45" y="520" fill="#fde68a" font-size="11">BiomedParse &#183; volumetric SSL / MAE</text>
    <text x="45" y="537" fill="#fde68a" font-size="11">and why nnU-Net still often wins</text>

    <!-- 5 k-space / reconstruction -->
    <rect x="310" y="464" width="300" height="96" rx="10" fill="#7c3aed" stroke="#5b21b6"/>
    <text x="325" y="488" fill="#ffffff" font-size="12.5" font-weight="700">5 &#183; Reconstruction &#8596; recognition (&#167;8)</text>
    <text x="325" y="507" fill="#ede9fe" font-size="11">fastMRI &#183; diffusion / unrolled recon</text>
    <text x="325" y="524" fill="#ede9fe" font-size="11">task-driven recon &#183; k-space to labels</text>
    <text x="325" y="541" fill="#ede9fe" font-size="11">acquisition time as a real budget</text>

    <!-- 6 harmonization & language -->
    <rect x="590" y="460" width="300" height="96" rx="10" fill="#0891b2" stroke="#0e7490"/>
    <text x="605" y="484" fill="#ffffff" font-size="12.5" font-weight="700">6 &#183; Harmonization &amp; language (&#167;9)</text>
    <text x="605" y="503" fill="#cffafe" font-size="11">cross-scanner / field-strength drift</text>
    <text x="605" y="520" fill="#cffafe" font-size="11">style-transfer &amp; domain generalization</text>
    <text x="605" y="537" fill="#cffafe" font-size="11">3D radiology VLMs &#183; report + VQA</text>
  </g>
</svg>
