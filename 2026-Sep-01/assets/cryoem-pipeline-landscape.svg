<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 560" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" role="img" aria-label="The deep-learning landscape of single-particle cryo-EM and cryo-electron tomography, laid out as a pipeline of computer-vision tasks. Stage one, restoration: raw detector movies are motion-corrected, CTF-estimated and denoised by Warp, MotionCor and Topaz-Denoise. Stage two, dense detection: particle picking by Topaz, crYOLO, CryoTransformer, CryoSegNet, UPicker and the annotation-free cryo-EMMAE, with contamination masking by MicrographCleaner and CRISP. Stage three, classification: 2-D class averaging separates clean particle views from junk. Stage four, the inverse problem: ab-initio reconstruction and amortized pose inference by CryoAI, CryoFIRE, cryoDRGN-AI and the classical RELION and cryoSPARC engines, with preferred-orientation correction by spIsoNet and CryoPROS. Stage five, dense classification over conformation: continuous heterogeneity is mapped by cryoDRGN, 3DFlex, RECOVAR, cryoSTAR, DynaMight and OPUS-DSD. A parallel lower branch handles in-cell cryo-electron tomography: 3-D particle localization by DeepFinder, TomoTwin, DeePiCt and DeepETPicker, denoising and missing-wedge recovery by CryoCARE, IsoNet and DeepDeWedge, in-situ heterogeneity by tomoDRGN and cryoDRGN-ET, benchmarked by the 2024 to 2025 CZII Kaggle challenge. A foundation-model band, Cryo-IEF and CryoEngine, now pretrains across the whole pipeline.">
  <title>The deep-learning cryo-EM / cryo-ET pipeline: restoration, dense particle detection, 2-D classification, the pose-and-volume inverse problem, and conformational heterogeneity</title>
  <rect x="0" y="0" width="980" height="560" rx="10" fill="#f4f6fb" stroke="#cbd5e1" stroke-width="1"/>
  <text x="22" y="30" fill="#334155" font-size="16" font-weight="800">The cryo-EM / cryo-ET pipeline is a chain of dense-vision tasks &#8212; each stage now has its own learned model</text>

  <!-- stage color key strip -->
  <g font-size="10.5">
    <rect x="22" y="42" width="12" height="12" rx="2" fill="#0ea5e9"/><text x="38" y="52" fill="#475569">restoration</text>
    <rect x="120" y="42" width="12" height="12" rx="2" fill="#34d399"/><text x="136" y="52" fill="#475569">dense detection</text>
    <rect x="250" y="42" width="12" height="12" rx="2" fill="#fbbf24"/><text x="266" y="52" fill="#475569">classification</text>
    <rect x="360" y="42" width="12" height="12" rx="2" fill="#f472b6"/><text x="376" y="52" fill="#475569">inverse problem (pose + volume)</text>
    <rect x="560" y="42" width="12" height="12" rx="2" fill="#a78bfa"/><text x="576" y="52" fill="#475569">dense classification over conformation</text>
  </g>

  <!-- ===================== TOP ROW: single-particle pipeline ===================== -->
  <!-- connecting spine -->
  <line x1="60" y1="132" x2="920" y2="132" stroke="#cbd5e1" stroke-width="2"/>
  <g stroke="#94a3b8" stroke-width="1.5" marker-end="url(#a2)" fill="none">
    <line x1="190" y1="132" x2="214" y2="132"/><line x1="366" y1="132" x2="390" y2="132"/>
    <line x1="536" y1="132" x2="560" y2="132"/><line x1="740" y1="132" x2="764" y2="132"/>
  </g>

  <!-- 1 restoration -->
  <g>
    <rect x="62" y="82" width="128" height="100" rx="8" fill="#0b1220" stroke="#0ea5e9" stroke-width="1.6"/>
    <text x="74" y="102" fill="#38bdf8" font-size="11.5" font-weight="700">1 &#183; movies &#8594; images</text>
    <text x="74" y="120" fill="#cbd5e1" font-size="9.5">motion / CTF / denoise</text>
    <text x="74" y="138" fill="#e2e8f0" font-size="10">Warp &#183; MotionCor</text>
    <text x="74" y="153" fill="#e2e8f0" font-size="10">Topaz-Denoise</text>
    <text x="74" y="171" fill="#64748b" font-size="9">restore SNR before anything</text>
  </g>

  <!-- 2 dense detection -->
  <g>
    <rect x="216" y="72" width="150" height="120" rx="8" fill="#0b1220" stroke="#34d399" stroke-width="1.6"/>
    <text x="228" y="92" fill="#6ee7b7" font-size="11.5" font-weight="700">2 &#183; particle picking</text>
    <text x="228" y="110" fill="#cbd5e1" font-size="9.5">dense detection @ &#8776;0 dB</text>
    <text x="228" y="128" fill="#e2e8f0" font-size="10">Topaz &#183; crYOLO</text>
    <text x="228" y="143" fill="#e2e8f0" font-size="10">CryoTransformer</text>
    <text x="228" y="158" fill="#e2e8f0" font-size="10">CryoSegNet &#183; UPicker</text>
    <text x="228" y="173" fill="#e2e8f0" font-size="10">cryo-EMMAE (label-free)</text>
    <text x="228" y="188" fill="#f87171" font-size="8.5">mask junk: MicrographCleaner &#183; CRISP</text>
  </g>

  <!-- 3 classification -->
  <g>
    <rect x="392" y="82" width="144" height="100" rx="8" fill="#0b1220" stroke="#fbbf24" stroke-width="1.6"/>
    <text x="404" y="102" fill="#fcd34d" font-size="11.5" font-weight="700">3 &#183; 2-D classification</text>
    <text x="404" y="120" fill="#cbd5e1" font-size="9.5">group by pose, average</text>
    <text x="404" y="138" fill="#e2e8f0" font-size="10">clean views vs. junk</text>
    <text x="404" y="156" fill="#e2e8f0" font-size="10">RELION / cryoSPARC 2D</text>
    <text x="404" y="174" fill="#64748b" font-size="9">second false-positive filter</text>
  </g>

  <!-- 4 inverse problem -->
  <g>
    <rect x="562" y="72" width="178" height="120" rx="8" fill="#0b1220" stroke="#f472b6" stroke-width="1.6"/>
    <text x="574" y="92" fill="#f9a8d4" font-size="11.5" font-weight="700">4 &#183; pose + volume</text>
    <text x="574" y="110" fill="#cbd5e1" font-size="9.5">amortized ab-initio inference</text>
    <text x="574" y="128" fill="#e2e8f0" font-size="10">CryoAI &#183; CryoFIRE</text>
    <text x="574" y="143" fill="#e2e8f0" font-size="10">cryoDRGN-AI &#183; ACE-EM</text>
    <text x="574" y="158" fill="#e2e8f0" font-size="10">RELION / cryoSPARC refine</text>
    <text x="574" y="176" fill="#c4b5fd" font-size="9">orientation bias: spIsoNet &#183; CryoPROS</text>
  </g>

  <!-- 5 heterogeneity -->
  <g>
    <rect x="766" y="72" width="154" height="120" rx="8" fill="#0b1220" stroke="#a78bfa" stroke-width="1.6"/>
    <text x="778" y="92" fill="#c4b5fd" font-size="11.5" font-weight="700">5 &#183; heterogeneity</text>
    <text x="778" y="110" fill="#cbd5e1" font-size="9.5">a landscape, not one map</text>
    <text x="778" y="128" fill="#e2e8f0" font-size="10">cryoDRGN &#183; 3DFlex</text>
    <text x="778" y="143" fill="#e2e8f0" font-size="10">RECOVAR &#183; cryoSTAR</text>
    <text x="778" y="158" fill="#e2e8f0" font-size="10">DynaMight &#183; OPUS-DSD</text>
    <text x="778" y="176" fill="#64748b" font-size="9">continuous motion &amp; composition</text>
  </g>

  <!-- ===================== branch down to cryo-ET ===================== -->
  <path d="M291 192 C291 240 120 236 120 286" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#a2)"/>
  <text x="150" y="250" fill="#64748b" font-size="10" font-style="italic">particles in a cell, not purified &#8594; go 3-D</text>

  <!-- ===================== MIDDLE ROW: cryo-ET branch ===================== -->
  <rect x="40" y="286" width="900" height="150" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.4"/>
  <text x="56" y="308" fill="#93c5fd" font-size="12.5" font-weight="800">In-cell branch &#183; cryo-electron tomography (cryo-ET): dense 3-D detection &amp; classification inside crowded native cells</text>

  <g>
    <rect x="56" y="322" width="200" height="100" rx="8" fill="#0b1220" stroke="#34d399" stroke-width="1.4"/>
    <text x="68" y="342" fill="#6ee7b7" font-size="11" font-weight="700">3-D particle localization</text>
    <text x="68" y="360" fill="#cbd5e1" font-size="9.5">detect complexes in a tomogram</text>
    <text x="68" y="378" fill="#e2e8f0" font-size="10">DeepFinder &#183; DeePiCt</text>
    <text x="68" y="393" fill="#e2e8f0" font-size="10">TomoTwin (metric-learning)</text>
    <text x="68" y="408" fill="#e2e8f0" font-size="10">DeepETPicker (weakly sup.)</text>
  </g>
  <g>
    <rect x="272" y="322" width="196" height="100" rx="8" fill="#0b1220" stroke="#0ea5e9" stroke-width="1.4"/>
    <text x="284" y="342" fill="#38bdf8" font-size="11" font-weight="700">denoise + missing wedge</text>
    <text x="284" y="360" fill="#cbd5e1" font-size="9.5">the anisotropic-PSF problem</text>
    <text x="284" y="378" fill="#e2e8f0" font-size="10">CryoCARE (even/odd N2N)</text>
    <text x="284" y="393" fill="#e2e8f0" font-size="10">IsoNet (self-sup. isotropy)</text>
    <text x="284" y="408" fill="#e2e8f0" font-size="10">DeepDeWedge</text>
  </g>
  <g>
    <rect x="484" y="322" width="196" height="100" rx="8" fill="#0b1220" stroke="#a78bfa" stroke-width="1.4"/>
    <text x="496" y="342" fill="#c4b5fd" font-size="11" font-weight="700">in-situ heterogeneity</text>
    <text x="496" y="360" fill="#cbd5e1" font-size="9.5">subtomogram states, in a cell</text>
    <text x="496" y="378" fill="#e2e8f0" font-size="10">tomoDRGN</text>
    <text x="496" y="393" fill="#e2e8f0" font-size="10">cryoDRGN-ET</text>
    <text x="496" y="408" fill="#64748b" font-size="9">per-particle composition + motion</text>
  </g>
  <g>
    <rect x="696" y="322" width="228" height="100" rx="8" fill="#0b1220" stroke="#fbbf24" stroke-width="1.4"/>
    <text x="708" y="342" fill="#fcd34d" font-size="11" font-weight="700">benchmark that reset the field</text>
    <text x="708" y="360" fill="#cbd5e1" font-size="9.5">CZII CryoET Object ID (Kaggle)</text>
    <text x="708" y="378" fill="#e2e8f0" font-size="10">Nov 2024 &#8211; Feb 2025 &#183; ~932 teams</text>
    <text x="708" y="393" fill="#e2e8f0" font-size="10">6 particle classes, F&#946;=4 (recall)</text>
    <text x="708" y="408" fill="#e2e8f0" font-size="10">U-Net segmentation swept the top</text>
  </g>

  <!-- ===================== FOUNDATION BAND ===================== -->
  <rect x="40" y="452" width="900" height="82" rx="10" fill="#111a2e" stroke="#475569" stroke-width="1.4"/>
  <text x="56" y="474" fill="#fbbf24" font-size="12" font-weight="800">Foundation / self-supervised models now pretrain across the whole chain</text>
  <text x="56" y="494" fill="#cbd5e1" font-size="10.5">Cryo-IEF (~65M particles, unsupervised) + CryoWizard automate SPA &#183; CryoEngine / APT-ViT synthetic subtomogram pretraining &#183; MAE / JEPA latents (cryo-EMMAE, CryoLVM)</text>
  <text x="56" y="514" fill="#94a3b8" font-size="10">Direction of travel: from one hand-tuned model per protein &#8594; one pretrained backbone adapted with a few labels &#8212; the same shift seen in natural-image detection, arriving late but arriving.</text>
  <text x="56" y="529" fill="#64748b" font-size="9">Every box above shares one enemy: dose-limited SNR near or below 0 dB. Every design choice &#8212; PU learning, metric learning, denoise-then-pick, physics decoders &#8212; is a way to buy signal back.</text>

  <defs>
    <marker id="a2" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 z" fill="#94a3b8"/>
    </marker>
  </defs>
</svg>
