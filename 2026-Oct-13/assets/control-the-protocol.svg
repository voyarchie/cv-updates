<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" role="img" aria-label="Two author-reported results. Left, ElecVQA-Bench seven-way defect typing: the lead of InternVL3.5-8B over a vision backbone. ResNet-50 at 224 pixels: 20.53 points; ResNet-50 at the matched pixel budget: minus 0.57 points. Swin-T at 224 pixels: 23.67 points; Swin-T at the matched pixel budget: 4.70 points. Right, CMAFNet modality ablation on TL-RGBD, mAP at 0.5: RGB only 0.193, depth only 0.151, RGB plus depth 0.244.">
  <title>Controlling the protocol: resolution and modality</title>
  <rect x="0" y="0" width="960" height="400" rx="10" fill="#f4f6fb" stroke="#cbd5e1"/>
  <text x="24" y="32" fill="#334155" font-size="16.5" font-weight="800">Two numbers that change once the protocol is controlled</text>
  <text x="24" y="52" fill="#64748b" font-size="11.5">Author-reported, abstract/snippet level. Compare bars only within a panel.</text>

  <!-- Panel A -->
  <text x="24" y="84" fill="#334155" font-size="13" font-weight="800">A · ElecVQA-Bench, 7-way defect typing</text>
  <text x="24" y="101" fill="#64748b" font-size="11">Lead of InternVL3.5-8B over a vision backbone (points)</text>
  <line x1="150" y1="112" x2="150" y2="330" stroke="#64748b" stroke-width="1.2"/>
  <g stroke="#cbd5e1" stroke-dasharray="3 3">
    <line x1="250" y1="112" x2="250" y2="330"/>
    <line x1="350" y1="112" x2="350" y2="330"/>
  </g>
  <g font-size="11.5">
    <text x="36" y="128" fill="#334155" font-weight="700">ResNet-50 · 224 px</text>
    <rect x="150" y="134" width="205.3" height="20" rx="3" fill="#94a3b8"/>
    <text x="362" y="149" fill="#334155" font-weight="700">+20.53</text>

    <text x="36" y="180" fill="#334155" font-weight="700">ResNet-50 · matched pixels</text>
    <rect x="144.3" y="186" width="5.7" height="20" rx="2" fill="#2f6fd6"/>
    <text x="158" y="201" fill="#2f6fd6" font-weight="700">−0.57 (backbone ahead)</text>

    <text x="36" y="232" fill="#334155" font-weight="700">Swin-T · 224 px</text>
    <rect x="150" y="238" width="236.7" height="20" rx="3" fill="#94a3b8"/>
    <text x="393" y="253" fill="#334155" font-weight="700">+23.67</text>

    <text x="36" y="284" fill="#334155" font-weight="700">Swin-T · matched pixels</text>
    <rect x="150" y="290" width="47" height="20" rx="3" fill="#2f6fd6"/>
    <text x="204" y="305" fill="#2f6fd6" font-weight="700">+4.70</text>
  </g>
  <g font-size="10.5" fill="#64748b" text-anchor="middle">
    <text x="150" y="346">0</text><text x="250" y="346">10</text><text x="350" y="346">20</text>
  </g>
  <text x="24" y="372" fill="#64748b" font-size="10.5">Grey: backbone at 224 px. Blue: backbone fed the VLM's pixel budget.</text>

  <line x1="480" y1="72" x2="480" y2="380" stroke="#cbd5e1"/>

  <!-- Panel B -->
  <text x="500" y="84" fill="#334155" font-size="13" font-weight="800">B · CMAFNet on TL-RGBD (94.5 % small objects)</text>
  <text x="500" y="101" fill="#64748b" font-size="11">mAP@0.5 by input modality</text>
  <line x1="600" y1="112" x2="600" y2="300" stroke="#64748b" stroke-width="1.2"/>
  <g stroke="#cbd5e1" stroke-dasharray="3 3">
    <line x1="700" y1="112" x2="700" y2="300"/>
    <line x1="800" y1="112" x2="800" y2="300"/>
    <line x1="900" y1="112" x2="900" y2="300"/>
  </g>
  <g font-size="11.5">
    <text x="592" y="144" fill="#334155" font-weight="700" text-anchor="end">RGB only</text>
    <rect x="600" y="130" width="193" height="20" rx="3" fill="#94a3b8"/>
    <text x="800" y="145" fill="#334155" font-weight="700">0.193</text>

    <text x="592" y="204" fill="#334155" font-weight="700" text-anchor="end">Depth only</text>
    <rect x="600" y="190" width="151" height="20" rx="3" fill="#94a3b8"/>
    <text x="758" y="205" fill="#334155" font-weight="700">0.151</text>

    <text x="592" y="264" fill="#334155" font-weight="700" text-anchor="end">RGB + Depth</text>
    <rect x="600" y="250" width="244" height="20" rx="3" fill="#2e8b57"/>
    <text x="851" y="265" fill="#257349" font-weight="700">0.244</text>
  </g>
  <g font-size="10.5" fill="#64748b" text-anchor="middle">
    <text x="600" y="316">0</text><text x="700" y="316">0.1</text><text x="800" y="316">0.2</text><text x="900" y="316">0.3</text>
  </g>
  <text x="500" y="346" fill="#64748b" font-size="10.5">Absolute mAP is low: tiny defects stay hard even with depth.</text>
  <text x="500" y="364" fill="#64748b" font-size="10.5">mAP@0.5:0.95 follows the same order (0.089 / 0.060 / 0.103).</text>
</svg>
