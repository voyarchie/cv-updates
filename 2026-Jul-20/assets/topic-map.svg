    <text x="316" y="548" fill="#ede9fe" font-size="11">grounding vs. hallucination</text>

    <rect x="588" y="470" width="268" height="96" rx="10" fill="#0d9488" stroke="#0f766e"/>
    <text x="602" y="494" fill="#f8fafc" font-size="12.5" font-weight="700">7 · Geometry below the pixel</text>
    <text x="602" y="514" fill="#ccfbf1" font-size="11">Depth Anything (endoscopy) · Endo3R</text>
    <text x="602" y="531" fill="#ccfbf1" font-size="11">EndoGaussian / EndoGS 4D tissue</text>
    <text x="602" y="548" fill="#ccfbf1" font-size="11">monocular SLAM · scale-aware depth</text>

    <rect x="732" y="470" width="252" height="96" rx="10" fill="#0d9488" stroke="#0f766e"/>
    <text x="746" y="494" fill="#f8fafc" font-size="12.5" font-weight="700">8 · Capsule endoscopy</text>
    <text x="746" y="514" fill="#ccfbf1" font-size="11">ultralong passive video (50k+ frames)</text>
    <text x="746" y="531" fill="#ccfbf1" font-size="11">small-bowel bleed / ulcer / Crohn's</text>
    <text x="746" y="548" fill="#ccfbf1" font-size="11">reading-time cut · CE-YOLO</text>
