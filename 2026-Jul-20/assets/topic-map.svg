    <text x="508" y="334" text-anchor="middle" fill="#cbd5e1" font-size="12">real-time · in-body · self-illuminated</text>
    <text x="508" y="352" text-anchor="middle" fill="#cbd5e1" font-size="12">dense detection + classification</text>
  </g>
  <!-- nodes -->
  <g>
    <!-- top row -->
    <rect x="16" y="54" width="268" height="96" rx="10" fill="#4f46e5" stroke="#3730a3"/>
    <text x="30" y="78" fill="#f8fafc" font-size="12.5" font-weight="700">1 · The primitive</text>
