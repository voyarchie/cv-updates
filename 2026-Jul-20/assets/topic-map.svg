    <text x="30" y="115" fill="#e0e7ff" font-size="11">specular glare · smoke · blood · bubbles</text>
    <text x="30" y="132" fill="#e0e7ff" font-size="11">deformable lumen · self-lit · no fixed geometry</text>

    <rect x="302" y="54" width="268" height="96" rx="10" fill="#4f46e5" stroke="#3730a3"/>
    <text x="316" y="78" fill="#f8fafc" font-size="12.5" font-weight="700">2 · Video foundation models</text>
    <text x="316" y="98" fill="#e0e7ff" font-size="11">Endo-FM · EndoFM-LV (13M frames)</text>
    <text x="316" y="115" fill="#e0e7ff" font-size="11">EndoMamba · GSViT · SurgVISTA</text>
    <text x="316" y="132" fill="#e0e7ff" font-size="11">pretrain once → classify/segment/detect</text>

    <rect x="588" y="54" width="268" height="96" rx="10" fill="#0891b2" stroke="#0e7490"/>
    <text x="602" y="78" fill="#f8fafc" font-size="12.5" font-weight="700">3 · Colonoscopy CADe/CADx</text>
