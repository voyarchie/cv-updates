<svg xmlns="http://www.w3.org/2000/svg" width="860" height="250" viewBox="0 0 860 250" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="Architectural lineage of human pose and dense-prediction models">
  <title>From heatmaps to foundation models: the pose / dense-prediction lineage</title>
  <!-- connectors: mid-gray reads on both light and dark backgrounds -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#888888"/>
    </marker>
  </defs>
  <line x1="160" y1="80" x2="200" y2="80" stroke="#888888" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="360" y1="80" x2="400" y2="80" stroke="#888888" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="560" y1="80" x2="600" y2="80" stroke="#888888" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="430" y1="118" x2="430" y2="160" stroke="#888888" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Stage 1: heatmaps / PAF -->
  <rect x="20" y="50" width="140" height="60" rx="10" fill="#2563eb" stroke="#1e40af" stroke-width="2"/>
  <text x="90" y="76" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="700">Heatmaps / PAF</text>
  <text x="90" y="95" text-anchor="middle" fill="#ffffff" font-size="11">OpenPose · HRNet</text>

  <!-- Stage 2: coord regression/classification -->
  <rect x="200" y="50" width="160" height="60" rx="10" fill="#0891b2" stroke="#0e7490" stroke-width="2"/>
  <text x="280" y="76" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="700">Coord. regress/class.</text>
  <text x="280" y="95" text-anchor="middle" fill="#ffffff" font-size="11">RTMPose (SimCC)</text>

  <!-- Stage 3: transformer set-prediction -->
  <rect x="400" y="50" width="160" height="60" rx="10" fill="#7c3aed" stroke="#6d28d9" stroke-width="2"/>
  <text x="480" y="76" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="700">Transformer queries</text>
  <text x="480" y="95" text-anchor="middle" fill="#ffffff" font-size="11">PETR · ED-Pose · GroupPose</text>

  <!-- Stage 4: foundation / promptable -->
  <rect x="600" y="50" width="160" height="60" rx="10" fill="#059669" stroke="#047857" stroke-width="2"/>
  <text x="680" y="76" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="700">Foundation / promptable</text>
  <text x="680" y="95" text-anchor="middle" fill="#ffffff" font-size="11">X-Pose · Sapiens</text>

  <!-- Dense correspondence branch -->
  <rect x="350" y="160" width="160" height="60" rx="10" fill="#b45309" stroke="#92400e" stroke-width="2"/>
  <text x="430" y="186" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="700">Dense UV / surface</text>
  <text x="430" y="205" text-anchor="middle" fill="#ffffff" font-size="11">DensePose · CSE</text>

  <!-- caption -->
  <text x="430" y="30" text-anchor="middle" fill="#888888" font-size="13" font-weight="700">Human pose &amp; dense human prediction: four architectural eras</text>
</svg>
