<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" role="img" aria-label="How a 360-degree camera turns the viewing sphere into pixels and why the projection distorts">
  <title>The omnidirectional primitive: sphere &#8594; projection &#8594; distortion &#8594; dense tasks</title>
  <defs>
    <marker id="oa" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#94a3b8"/>
    </marker>
  </defs>

  <!-- Stage 1: the viewing sphere -->
  <g>
    <rect x="20" y="40" width="200" height="200" rx="12" fill="#0f172a" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="120" y="30" text-anchor="middle" fill="#e2e8f0" font-size="13" font-weight="700">1 &#183; Viewing sphere</text>
    <circle cx="120" cy="140" r="72" fill="none" stroke="#38bdf8" stroke-width="2"/>
    <!-- latitude lines -->
    <ellipse cx="120" cy="140" rx="72" ry="24" fill="none" stroke="#38bdf8" stroke-width="1" opacity="0.7"/>
    <ellipse cx="120" cy="140" rx="60" ry="60" fill="none" stroke="#38bdf8" stroke-width="0.7" opacity="0.4"/>
    <ellipse cx="120" cy="140" rx="30" ry="72" fill="none" stroke="#38bdf8" stroke-width="1" opacity="0.7"/>
    <circle cx="120" cy="140" r="3" fill="#f8fafc"/>
    <text x="120" y="228" text-anchor="middle" fill="#cbd5e1" font-size="10.5">full 4&#960; sr &#183; no image border</text>
  </g>

  <!-- Stage 2: equirectangular -->
  <g>
    <rect x="270" y="40" width="230" height="200" rx="12" fill="#1e293b" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="385" y="30" text-anchor="middle" fill="#e2e8f0" font-size="13" font-weight="700">2 &#183; Equirectangular (ERP)</text>
    <rect x="292" y="70" width="186" height="120" fill="none" stroke="#a78bfa" stroke-width="1.6"/>
    <!-- grid getting stretched toward top/bottom -->
    <line x1="292" y1="100" x2="478" y2="100" stroke="#a78bfa" stroke-width="0.7" opacity="0.5"/>
    <line x1="292" y1="130" x2="478" y2="130" stroke="#a78bfa" stroke-width="0.9" opacity="0.8"/>
    <line x1="292" y1="160" x2="478" y2="160" stroke="#a78bfa" stroke-width="0.7" opacity="0.5"/>
    <line x1="322" y1="70" x2="322" y2="190" stroke="#a78bfa" stroke-width="0.6" opacity="0.4"/>
    <line x1="385" y1="70" x2="385" y2="190" stroke="#a78bfa" stroke-width="0.9" opacity="0.8"/>
    <line x1="448" y1="70" x2="448" y2="190" stroke="#a78bfa" stroke-width="0.6" opacity="0.4"/>
    <text x="385" y="86" text-anchor="middle" fill="#fca5a5" font-size="9.5">pole: 1 point &#8594; whole row</text>
    <text x="385" y="182" text-anchor="middle" fill="#fca5a5" font-size="9.5">pole: extreme stretch</text>
    <text x="385" y="135" text-anchor="middle" fill="#bbf7d0" font-size="9.5">equator ~undistorted</text>
    <text x="385" y="212" text-anchor="middle" fill="#cbd5e1" font-size="10.5">distortion grows with |latitude|;</text>
    <text x="385" y="228" text-anchor="middle" fill="#cbd5e1" font-size="10.5">left &#8596; right edges are continuous</text>
  </g>

  <!-- Stage 3: alternative projections -->
  <g>
    <rect x="550" y="40" width="330" height="200" rx="12" fill="#1e293b" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="715" y="30" text-anchor="middle" fill="#e2e8f0" font-size="13" font-weight="700">3 &#183; Distortion-fighting representations</text>
    <rect x="566" y="66" width="145" height="70" rx="8" fill="#0369a1" stroke="#075985"/>
    <text x="638" y="88" text-anchor="middle" fill="#e0f2fe" font-size="11" font-weight="700">Cubemap</text>
    <text x="638" y="106" text-anchor="middle" fill="#e0f2fe" font-size="9.5">6 pinhole faces,</text>
    <text x="638" y="120" text-anchor="middle" fill="#e0f2fe" font-size="9.5">seams at cube edges</text>
    <rect x="719" y="66" width="145" height="70" rx="8" fill="#0f766e" stroke="#115e59"/>
    <text x="791" y="88" text-anchor="middle" fill="#ccfbf1" font-size="11" font-weight="700">Tangent images</text>
    <text x="791" y="106" text-anchor="middle" fill="#ccfbf1" font-size="9.5">icosahedral / gnomonic</text>
    <text x="791" y="120" text-anchor="middle" fill="#ccfbf1" font-size="9.5">patches, low local warp</text>
    <rect x="566" y="146" width="145" height="70" rx="8" fill="#7c3aed" stroke="#6b21a8"/>
    <text x="638" y="168" text-anchor="middle" fill="#f3e8ff" font-size="11" font-weight="700">Spherical kernels</text>
    <text x="638" y="186" text-anchor="middle" fill="#f3e8ff" font-size="9.5">SphereNet / KTN /</text>
    <text x="638" y="200" text-anchor="middle" fill="#f3e8ff" font-size="9.5">distortion-adaptive conv</text>
    <rect x="719" y="146" width="145" height="70" rx="8" fill="#b45309" stroke="#92400e"/>
    <text x="791" y="168" text-anchor="middle" fill="#fde68a" font-size="11" font-weight="700">Spherical boxes</text>
    <text x="791" y="186" text-anchor="middle" fill="#fde68a" font-size="9.5">FoV/BFoV, Sph2Pob,</text>
    <text x="791" y="200" text-anchor="middle" fill="#fde68a" font-size="9.5">unbiased spherical IoU</text>
  </g>

  <!-- arrows between stages -->
  <g stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#oa)">
    <line x1="222" y1="140" x2="266" y2="140"/>
    <line x1="502" y1="140" x2="546" y2="140"/>
  </g>

  <!-- bottom: dense tasks -->
  <g>
    <rect x="20" y="300" width="860" height="140" rx="12" fill="#0f172a" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="450" y="292" text-anchor="middle" fill="#e2e8f0" font-size="13" font-weight="700">4 &#183; Dense tasks on the sphere &#8212; every one must respect the geometry above</text>
    <g font-size="10.5">
      <rect x="40" y="322" width="195" height="46" rx="8" fill="#4f46e5" stroke="#3730a3"/>
      <text x="137" y="341" text-anchor="middle" fill="#e0e7ff" font-size="11" font-weight="700">Distortion-aware detection</text>
      <text x="137" y="357" text-anchor="middle" fill="#e0e7ff">spherical / rotated boxes</text>

      <rect x="245" y="322" width="195" height="46" rx="8" fill="#0f766e" stroke="#115e59"/>
      <text x="342" y="341" text-anchor="middle" fill="#ccfbf1" font-size="11" font-weight="700">Panoramic segmentation</text>
      <text x="342" y="357" text-anchor="middle" fill="#ccfbf1">semantic / instance / panoptic</text>

      <rect x="450" y="322" width="195" height="46" rx="8" fill="#9333ea" stroke="#6b21a8"/>
      <text x="547" y="341" text-anchor="middle" fill="#f3e8ff" font-size="11" font-weight="700">Pinhole &#8594; pano adaptation</text>
      <text x="547" y="357" text-anchor="middle" fill="#f3e8ff">domain shift + label scarcity</text>

      <rect x="655" y="322" width="205" height="46" rx="8" fill="#b45309" stroke="#92400e"/>
      <text x="757" y="341" text-anchor="middle" fill="#fde68a" font-size="11" font-weight="700">Depth / layout / 3D</text>
      <text x="757" y="357" text-anchor="middle" fill="#fde68a">monocular 360 depth, rooms</text>

      <rect x="40" y="380" width="290" height="46" rx="8" fill="#0369a1" stroke="#075985"/>
      <text x="185" y="399" text-anchor="middle" fill="#e0f2fe" font-size="11" font-weight="700">Fisheye / surround-view driving</text>
      <text x="185" y="415" text-anchor="middle" fill="#e0f2fe">near-field perception, WoodScape</text>

      <rect x="340" y="380" width="270" height="46" rx="8" fill="#be123c" stroke="#9f1239"/>
      <text x="475" y="399" text-anchor="middle" fill="#ffe4e6" font-size="11" font-weight="700">Foundation models on 360</text>
      <text x="475" y="415" text-anchor="middle" fill="#ffe4e6">SAM / depth / VLM adapted to the sphere</text>

      <rect x="620" y="380" width="240" height="46" rx="8" fill="#334155" stroke="#94a3b8"/>
      <text x="740" y="399" text-anchor="middle" fill="#e2e8f0" font-size="11" font-weight="700">Data &amp; benchmarks</text>
      <text x="740" y="415" text-anchor="middle" fill="#cbd5e1">DensePASS, SynPASS, 360+x &#8230;</text>
    </g>
  </g>
</svg>
