<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" role="img" aria-label="Three views of the atomic-resolution electron micrograph as a dense-detection surface. Left: a HAADF-STEM image in which every bright spot is an atomic column; brightness scales roughly with atomic number to the power 1.7, so a vacancy is a missing spot and a heavy dopant is an extra-bright spot. The same defect can look different at a different beam energy, detector angle or sample thickness, so the label depends on acquisition metadata as well as on pixels. Middle: in 4D-STEM each probe position records a full two-dimensional diffraction pattern, giving a four-dimensional data cube; the class of each real-space pixel, such as polarization direction, phase or grain orientation, is read from its diffraction pattern. Right: over time the scan drifts and the beam damages the sample, so frame-to-frame changes mix real atomic motion, geometric drift and signal loss.">
  <title>The atomic-resolution electron micrograph as a dense scene: atom columns, diffraction cubes, and a sample the beam is destroying</title>
  <rect x="0" y="0" width="960" height="580" rx="10" fill="#f4f6fb" stroke="#cbd5e1" stroke-width="1"/>
  <text x="24" y="32" fill="#334155" font-size="16.5" font-weight="800">One specimen, three surfaces: atom columns &#8594; a 4D diffraction cube &#8594; a beam-altered time series</text>

  <!-- ============ Panel 1: HAADF atom columns ============ -->
  <g>
    <rect x="24" y="52" width="292" height="500" rx="8" fill="#ffffff" stroke="#94a3b8"/>
    <text x="40" y="78" fill="#0f172a" font-size="14" font-weight="800">1 · HAADF-STEM: each spot is an object</text>
    <text x="40" y="96" fill="#475569" font-size="11.5">Z-contrast: intensity &#8733; Z^~1.7 per column</text>

    <rect x="44" y="110" width="252" height="200" rx="4" fill="#0f172a"/>
    <!-- lattice: 7 cols x 5 rows -->
    <g fill="#cbd5e1">
      <circle cx="68" cy="130" r="8"/><circle cx="104" cy="130" r="8"/><circle cx="140" cy="130" r="8"/><circle cx="176" cy="130" r="8"/><circle cx="212" cy="130" r="8"/><circle cx="248" cy="130" r="8"/><circle cx="278" cy="130" r="8"/>
      <circle cx="86" cy="168" r="5" fill="#64748b"/><circle cx="122" cy="168" r="5" fill="#64748b"/><circle cx="158" cy="168" r="5" fill="#64748b"/><circle cx="194" cy="168" r="5" fill="#64748b"/><circle cx="230" cy="168" r="5" fill="#64748b"/><circle cx="264" cy="168" r="5" fill="#64748b"/>
      <circle cx="68" cy="206" r="8"/><circle cx="104" cy="206" r="8"/><circle cx="176" cy="206" r="8"/><circle cx="212" cy="206" r="8"/><circle cx="248" cy="206" r="8"/><circle cx="278" cy="206" r="8"/>
      <circle cx="86" cy="244" r="5" fill="#64748b"/><circle cx="122" cy="244" r="5" fill="#64748b"/><circle cx="158" cy="244" r="5" fill="#64748b"/><circle cx="230" cy="244" r="5" fill="#64748b"/><circle cx="264" cy="244" r="5" fill="#64748b"/>
      <circle cx="68" cy="282" r="8"/><circle cx="104" cy="282" r="8"/><circle cx="140" cy="282" r="8"/><circle cx="176" cy="282" r="8"/><circle cx="212" cy="282" r="8"/><circle cx="248" cy="282" r="8"/><circle cx="278" cy="282" r="8"/>
    </g>
    <!-- vacancy at 140,206 -->
    <circle cx="140" cy="206" r="11" fill="none" stroke="#f97316" stroke-width="2.2" stroke-dasharray="3 2"/>
    <!-- heavy dopant replacing light site at 194,244 -->
    <circle cx="194" cy="244" r="9" fill="#fde047"/>
    <circle cx="194" cy="244" r="13" fill="none" stroke="#eab308" stroke-width="2.2"/>

    <g font-size="11.5" fill="#334155">
      <circle cx="52" cy="330" r="6" fill="none" stroke="#f97316" stroke-width="2" stroke-dasharray="3 2"/>
      <text x="64" y="334">vacancy = a missing spot</text>
      <circle cx="52" cy="352" r="6" fill="#fde047" stroke="#eab308" stroke-width="2"/>
      <text x="64" y="356">heavy dopant = an extra-bright spot</text>
    </g>

    <rect x="40" y="374" width="260" height="164" rx="6" fill="#fff7ed" stroke="#fdba74"/>
    <text x="52" y="394" fill="#9a3412" font-size="12" font-weight="800">The label is not only in the pixels</text>
    <text x="52" y="414" fill="#7c2d12" font-size="11.5">The same defect changes contrast with</text>
    <text x="52" y="430" fill="#7c2d12" font-size="11.5">beam energy (kV), detector inner/outer</text>
    <text x="52" y="446" fill="#7c2d12" font-size="11.5">angles, thickness, defocus and dose.</text>
    <text x="52" y="468" fill="#7c2d12" font-size="11.5">&#8594; condition the classifier on metadata</text>
    <text x="52" y="484" fill="#7c2d12" font-size="11.5">(context-aware STEM defect classifier,</text>
    <text x="52" y="500" fill="#7c2d12" font-size="11.5">CIMP image&#8596;metadata pretraining)</text>
    <text x="52" y="522" fill="#7c2d12" font-size="11.5">&#8594; train on simulation, test on real</text>
  </g>

  <!-- ============ Panel 2: 4D-STEM ============ -->
  <g>
    <rect x="334" y="52" width="292" height="500" rx="8" fill="#ffffff" stroke="#94a3b8"/>
    <text x="350" y="78" fill="#0f172a" font-size="14" font-weight="800">2 · 4D-STEM: a pattern per pixel</text>
    <text x="350" y="96" fill="#475569" font-size="11.5">scan (x, y) &#215; diffraction (kx, ky) = 4D</text>

    <!-- real-space scan grid -->
    <g stroke="#94a3b8" stroke-width="1">
      <rect x="354" y="116" width="120" height="120" fill="#e0f2fe"/>
      <line x1="384" y1="116" x2="384" y2="236"/><line x1="414" y1="116" x2="414" y2="236"/><line x1="444" y1="116" x2="444" y2="236"/>
      <line x1="354" y1="146" x2="474" y2="146"/><line x1="354" y1="176" x2="474" y2="176"/><line x1="354" y1="206" x2="474" y2="206"/>
    </g>
    <!-- domains colored -->
    <rect x="354" y="116" width="60" height="60" fill="#0ea5e9" opacity="0.55"/>
    <rect x="414" y="116" width="60" height="120" fill="#a855f7" opacity="0.45"/>
    <rect x="354" y="176" width="60" height="60" fill="#14b8a6" opacity="0.5"/>
    <rect x="384" y="146" width="30" height="30" fill="none" stroke="#0f172a" stroke-width="2.5"/>
    <text x="354" y="254" fill="#334155" font-size="11">real space: domains / phases</text>

    <!-- arrow to DP -->
    <line x1="414" y1="161" x2="500" y2="161" stroke="#0f172a" stroke-width="1.6"/>
    <polygon points="500,156 510,161 500,166" fill="#0f172a"/>

    <!-- diffraction pattern -->
    <circle cx="560" cy="161" r="50" fill="#0f172a"/>
    <circle cx="560" cy="161" r="8" fill="#f8fafc"/>
    <g fill="#7dd3fc">
      <circle cx="560" cy="131" r="4"/><circle cx="560" cy="191" r="4"/><circle cx="530" cy="161" r="4"/><circle cx="590" cy="161" r="4"/>
      <circle cx="538" cy="139" r="3"/><circle cx="582" cy="183" r="3"/><circle cx="582" cy="139" r="2"/><circle cx="538" cy="183" r="2"/>
    </g>
    <text x="516" y="228" fill="#334155" font-size="11">one diffraction pattern</text>
    <text x="516" y="243" fill="#334155" font-size="11">per probe position</text>

    <rect x="350" y="270" width="260" height="268" rx="6" fill="#f0f9ff" stroke="#7dd3fc"/>
    <text x="362" y="290" fill="#075985" font-size="12" font-weight="800">Dense classification = per-pixel DP</text>
    <text x="362" y="310" fill="#0c4a6e" font-size="11.5">&#8226; polarization direction in (K,Na)NbO&#8323;</text>
    <text x="362" y="326" fill="#0c4a6e" font-size="11.5">  (ResNet / VGG / CNN / PCA-kNN)</text>
    <text x="362" y="344" fill="#0c4a6e" font-size="11.5">&#8226; phase / orientation / strain maps</text>
    <text x="362" y="362" fill="#0c4a6e" font-size="11.5">&#8226; unsupervised contour clustering</text>
    <text x="362" y="378" fill="#0c4a6e" font-size="11.5">  (py4DSTEM; 4D &amp; 5D-STEM)</text>
    <text x="362" y="396" fill="#0c4a6e" font-size="11.5">&#8226; ptychography: DPs &#8594; phase image</text>
    <text x="362" y="412" fill="#0c4a6e" font-size="11.5">  (learned, ~10&#215; faster than ePIE)</text>
    <text x="362" y="436" fill="#075985" font-size="11.5" font-weight="700">Data scale is the constraint:</text>
    <text x="362" y="452" fill="#0c4a6e" font-size="11.5">256&#178; probes &#215; 256&#178; detector px</text>
    <text x="362" y="468" fill="#0c4a6e" font-size="11.5">&#8776; 4&#215;10&#8313; values per scan, before</text>
    <text x="362" y="484" fill="#0c4a6e" font-size="11.5">focal series or time (5D).</text>
    <text x="362" y="508" fill="#075985" font-size="11.5" font-weight="700">Sim&#8594;real gap is the barrier</text>
    <text x="362" y="524" fill="#0c4a6e" font-size="11.5">(thickness, tilt, dynamical scattering)</text>
  </g>

  <!-- ============ Panel 3: time, drift, damage ============ -->
  <g>
    <rect x="644" y="52" width="292" height="500" rx="8" fill="#ffffff" stroke="#94a3b8"/>
    <text x="660" y="78" fill="#0f172a" font-size="14" font-weight="800">3 · Time: the probe is destructive</text>
    <text x="660" y="96" fill="#475569" font-size="11.5">frame t vs t+&#916;t under the same beam</text>

    <!-- frame t -->
    <rect x="664" y="112" width="112" height="112" rx="3" fill="#0f172a"/>
    <g fill="#cbd5e1">
      <circle cx="684" cy="132" r="6"/><circle cx="712" cy="132" r="6"/><circle cx="740" cy="132" r="6"/><circle cx="764" cy="132" r="6"/>
      <circle cx="684" cy="160" r="6"/><circle cx="712" cy="160" r="6"/><circle cx="740" cy="160" r="6"/><circle cx="764" cy="160" r="6"/>
      <circle cx="684" cy="188" r="6"/><circle cx="712" cy="188" r="6"/><circle cx="740" cy="188" r="6"/><circle cx="764" cy="188" r="6"/>
      <circle cx="684" cy="214" r="6"/><circle cx="712" cy="214" r="6"/><circle cx="740" cy="214" r="6"/><circle cx="764" cy="214" r="6"/>
    </g>
    <text x="696" y="240" fill="#334155" font-size="11">frame t</text>

    <!-- frame t+dt : shifted & sheared, dimmer, one atom lost -->
    <rect x="804" y="112" width="112" height="112" rx="3" fill="#0f172a"/>
    <g fill="#94a3b8" transform="translate(6,4) skewX(-5)">
      <circle cx="834" cy="130" r="6"/><circle cx="862" cy="130" r="6"/><circle cx="890" cy="130" r="6"/>
      <circle cx="834" cy="158" r="6"/><circle cx="890" cy="158" r="6"/>
      <circle cx="834" cy="186" r="6"/><circle cx="862" cy="186" r="6"/><circle cx="890" cy="186" r="5" fill="#64748b"/>
      <circle cx="834" cy="212" r="5" fill="#64748b"/><circle cx="862" cy="212" r="5" fill="#64748b"/><circle cx="890" cy="212" r="4" fill="#475569"/>
    </g>
    <circle cx="853" cy="162" r="10" fill="none" stroke="#f97316" stroke-width="2" stroke-dasharray="3 2"/>
    <text x="826" y="240" fill="#334155" font-size="11">frame t+&#916;t</text>

    <g font-size="11.5">
      <rect x="664" y="258" width="12" height="12" fill="#6366f1"/>
      <text x="684" y="269" fill="#334155">drift: affine shift / shear (geometry)</text>
      <rect x="664" y="280" width="12" height="12" fill="#64748b"/>
      <text x="684" y="291" fill="#334155">beam damage: spatially varying decay</text>
      <rect x="664" y="302" width="12" height="12" fill="#f97316"/>
      <text x="684" y="313" fill="#334155">real event: an atom leaves its site</text>
    </g>

    <rect x="660" y="330" width="260" height="208" rx="6" fill="#eef2ff" stroke="#a5b4fc"/>
    <text x="672" y="350" fill="#3730a3" font-size="12" font-weight="800">Disentangle before you detect</text>
    <text x="672" y="370" fill="#312e81" font-size="11.5">AtomDiffuser predicts an affine drift</text>
    <text x="672" y="386" fill="#312e81" font-size="11.5">+ a decay map between any two frames,</text>
    <text x="672" y="402" fill="#312e81" font-size="11.5">so remaining change is physics.</text>
    <text x="672" y="426" fill="#312e81" font-size="11.5">Dose is the real budget: low dose =</text>
    <text x="672" y="442" fill="#312e81" font-size="11.5">Poisson-limited frames with no clean</text>
    <text x="672" y="458" fill="#312e81" font-size="11.5">ground truth &#8594; self-supervised and</text>
    <text x="672" y="474" fill="#312e81" font-size="11.5">metadata-conditioned denoising.</text>
    <text x="672" y="498" fill="#312e81" font-size="11.5">In situ (liquid-cell, heating, irradiation)</text>
    <text x="672" y="514" fill="#312e81" font-size="11.5">turns detection into tracking of objects</text>
    <text x="672" y="530" fill="#312e81" font-size="11.5">that nucleate, merge and vanish.</text>
  </g>

  <text x="24" y="570" fill="#64748b" font-size="11">Schematic, not to scale. Colours are fixed on an opaque card so the figure reads the same in light and dark themes.</text>
</svg>
