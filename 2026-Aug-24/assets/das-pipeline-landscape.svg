<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" role="img" aria-label="The DAS deep-learning stack in four layers. Layer one, the raw channel-by-time strain-rate record, is noisy and huge. Layer two is preprocessing and denoising: band-pass and f-k filtering, self-supervised Noise2Noise style denoisers, and time-frequency or wavelet transforms. Layer three is the model family: one-dimensional CNNs over single channels, two-dimensional CNNs and U-Nets treating the waterfall as an image, transformers such as PhaseNet-DAS, and self-supervised or foundation models such as DAS-MAE and cross-modal video pretraining. Layer four is the task and its output: detection and phase picking, semantic segmentation of the waterfall, event classification into vehicle, footstep, digger, earthquake or whale, and kinematic regression of speed and location. Below, five application verticals: geophysics and earthquake early warning, traffic and infrastructure monitoring, perimeter and pipeline security, marine mammal and ocean monitoring, and structural and railway health.">
  <title>The DAS deep-learning stack: raw record to task, across five verticals</title>
  <rect x="0" y="0" width="960" height="500" rx="10" fill="#f4f6fb" stroke="#cbd5e1" stroke-width="1"/>
  <text x="24" y="30" fill="#334155" font-size="17" font-weight="800">From strain record to decision: the DAS learning stack</text>

  <!-- Layer 1 -->
  <rect x="24" y="46" width="912" height="58" rx="8" fill="#0b1220" stroke="#334155" stroke-width="2"/>
  <text x="40" y="70" fill="#f8fafc" font-size="13" font-weight="800">1 &#183; Raw record</text>
  <text x="40" y="90" fill="#94a3b8" font-size="11.5">channel &#215; time strain-rate matrix &#8212; huge (TB/day), low SNR, strong coherent + optical noise, unlabeled</text>

  <!-- Layer 2 -->
  <rect x="24" y="116" width="912" height="66" rx="8" fill="#0b1220" stroke="#334155" stroke-width="2"/>
  <text x="40" y="140" fill="#f8fafc" font-size="13" font-weight="800">2 &#183; Preprocess &amp; denoise</text>
  <g font-size="11">
    <rect x="230" y="126" width="150" height="46" rx="6" fill="#164e63" stroke="#22d3ee"/>
    <text x="305" y="146" fill="#cffafe" text-anchor="middle" font-weight="700">band-pass / f&#8211;k</text>
    <text x="305" y="162" fill="#a5f3fc" text-anchor="middle">remove optical noise</text>
    <rect x="392" y="126" width="180" height="46" rx="6" fill="#164e63" stroke="#22d3ee"/>
    <text x="482" y="146" fill="#cffafe" text-anchor="middle" font-weight="700">self-sup. denoise</text>
    <text x="482" y="162" fill="#a5f3fc" text-anchor="middle">DAS-N2N / diffusion</text>
    <rect x="584" y="126" width="180" height="46" rx="6" fill="#164e63" stroke="#22d3ee"/>
    <text x="674" y="146" fill="#cffafe" text-anchor="middle" font-weight="700">time&#8211;frequency</text>
    <text x="674" y="162" fill="#a5f3fc" text-anchor="middle">STFT / wavelet packet</text>
  </g>

  <!-- Layer 3 -->
  <rect x="24" y="194" width="912" height="98" rx="8" fill="#0b1220" stroke="#334155" stroke-width="2"/>
  <text x="40" y="218" fill="#f8fafc" font-size="13" font-weight="800">3 &#183; Model family</text>
  <g font-size="10.5">
    <rect x="40" y="230" width="200" height="52" rx="6" fill="#3730a3" stroke="#6366f1"/>
    <text x="140" y="250" fill="#e0e7ff" text-anchor="middle" font-weight="700">1-D CNN / RNN</text>
    <text x="140" y="266" fill="#c7d2fe" text-anchor="middle">per-channel time series</text>
    <rect x="252" y="230" width="210" height="52" rx="6" fill="#3730a3" stroke="#6366f1"/>
    <text x="357" y="250" fill="#e0e7ff" text-anchor="middle" font-weight="700">2-D CNN / U-Net</text>
    <text x="357" y="266" fill="#c7d2fe" text-anchor="middle">waterfall as an image</text>
    <rect x="474" y="230" width="210" height="52" rx="6" fill="#3730a3" stroke="#6366f1"/>
    <text x="579" y="250" fill="#e0e7ff" text-anchor="middle" font-weight="700">transformer</text>
    <text x="579" y="266" fill="#c7d2fe" text-anchor="middle">PhaseNet-DAS, ST-attention</text>
    <rect x="696" y="230" width="224" height="52" rx="6" fill="#4c1d95" stroke="#a78bfa"/>
    <text x="808" y="250" fill="#ede9fe" text-anchor="middle" font-weight="700">self-sup / foundation</text>
    <text x="808" y="266" fill="#ddd6fe" text-anchor="middle">DAS-MAE, cross-modal video</text>
  </g>

  <!-- Layer 4 -->
  <rect x="24" y="304" width="912" height="66" rx="8" fill="#0b1220" stroke="#334155" stroke-width="2"/>
  <text x="40" y="328" fill="#f8fafc" font-size="13" font-weight="800">4 &#183; Task &amp; output</text>
  <g font-size="11">
    <rect x="230" y="314" width="150" height="46" rx="6" fill="#0f766e" stroke="#2dd4bf"/>
    <text x="305" y="334" fill="#ccfbf1" text-anchor="middle" font-weight="700">detect / pick</text>
    <text x="305" y="350" fill="#99f6e4" text-anchor="middle">onset, moveout</text>
    <rect x="392" y="314" width="150" height="46" rx="6" fill="#0f766e" stroke="#2dd4bf"/>
    <text x="467" y="334" fill="#ccfbf1" text-anchor="middle" font-weight="700">segment</text>
    <text x="467" y="350" fill="#99f6e4" text-anchor="middle">footprint mask</text>
    <rect x="554" y="314" width="150" height="46" rx="6" fill="#0f766e" stroke="#2dd4bf"/>
    <text x="629" y="334" fill="#ccfbf1" text-anchor="middle" font-weight="700">classify</text>
    <text x="629" y="350" fill="#99f6e4" text-anchor="middle">event type</text>
    <rect x="716" y="314" width="150" height="46" rx="6" fill="#0f766e" stroke="#2dd4bf"/>
    <text x="791" y="334" fill="#ccfbf1" text-anchor="middle" font-weight="700">regress</text>
    <text x="791" y="350" fill="#99f6e4" text-anchor="middle">speed, location</text>
  </g>

  <!-- flow arrows between layers -->
  <g stroke="#475569" stroke-width="2" fill="none">
    <path d="M480,104 L480,116" marker-end="url(#ah2)"/>
    <path d="M480,182 L480,194" marker-end="url(#ah2)"/>
    <path d="M480,292 L480,304" marker-end="url(#ah2)"/>
  </g>

  <!-- verticals -->
  <text x="40" y="398" fill="#334155" font-size="12.5" font-weight="800">Deployed verticals</text>
  <g font-size="10.5" font-weight="700">
    <rect x="40" y="410" width="172" height="66" rx="7" fill="#1e293b" stroke="#f59e0b"/>
    <text x="126" y="436" fill="#fbbf24" text-anchor="middle">Geophysics</text>
    <text x="126" y="454" fill="#fde68a" text-anchor="middle" font-weight="400">quakes, EEW, volcano</text>
    <rect x="222" y="410" width="172" height="66" rx="7" fill="#1e293b" stroke="#f472b6"/>
    <text x="308" y="436" fill="#f9a8d4" text-anchor="middle">Traffic / infra</text>
    <text x="308" y="454" fill="#fbcfe8" text-anchor="middle" font-weight="400">vehicles, bridges</text>
    <rect x="404" y="410" width="152" height="66" rx="7" fill="#1e293b" stroke="#22d3ee"/>
    <text x="480" y="436" fill="#67e8f9" text-anchor="middle">Security</text>
    <text x="480" y="454" fill="#a5f3fc" text-anchor="middle" font-weight="400">perimeter, pipeline</text>
    <rect x="566" y="410" width="172" height="66" rx="7" fill="#1e293b" stroke="#2dd4bf"/>
    <text x="652" y="436" fill="#5eead4" text-anchor="middle">Marine</text>
    <text x="652" y="454" fill="#99f6e4" text-anchor="middle" font-weight="400">whales, vessels</text>
    <rect x="748" y="410" width="172" height="66" rx="7" fill="#1e293b" stroke="#a78bfa"/>
    <text x="834" y="436" fill="#c4b5fd" text-anchor="middle">Structural / rail</text>
    <text x="834" y="454" fill="#ddd6fe" text-anchor="middle" font-weight="400">SHM, train tracking</text>
  </g>

  <defs>
    <marker id="ah2" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#475569"/>
    </marker>
  </defs>
</svg>
