<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 620" role="img" aria-label="Topic map for the 2026-Jun-22 CV update">
  <title>Topic map — 2026-Jun-22 CV update</title>
  <desc>A radial topic map showing eight geometric / correspondence dense-vision threads grouped under four families: per-pixel geometry from one image (monocular depth estimation and optical flow / dense motion); human-centric structure (2D human pose and 3D human pose / mesh recovery); correspondence and multi-view 3D (local feature matching with pointmap models, and stereo matching / multi-view stereo); and 3D recognition and place (monocular 3D object detection and visual place recognition).</desc>
  <style>
    .hub    { fill: none; stroke: currentColor; stroke-width: 1.7; }
    .spoke  { fill: none; stroke: currentColor; stroke-width: 1.1; opacity: 0.5; }
    .node   { stroke: currentColor; stroke-width: 1.3; }
    .geo    { fill: rgba(59,130,246,0.16); }
    .hum    { fill: rgba(168,85,247,0.16); }
    .corr   { fill: rgba(16,185,129,0.16); }
    .rec    { fill: rgba(245,158,11,0.16); }
    .lbl    { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 13px; fill: currentColor; }
    .sub    { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 10.5px; fill: currentColor; opacity: 0.72; }
    .hublbl { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 13px; font-weight: 600; fill: currentColor; }
    .keylbl { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 11px; font-weight: 600; fill: currentColor; letter-spacing: 0.03em; }
    .swatch { stroke: currentColor; stroke-width: 1; }
  </style>

  <!-- spokes -->
  <line class="spoke" x1="480" y1="285" x2="480" y2="92"/>
  <line class="spoke" x1="480" y1="285" x2="722" y2="150"/>
  <line class="spoke" x1="480" y1="285" x2="800" y2="285"/>
  <line class="spoke" x1="480" y1="285" x2="722" y2="420"/>
  <line class="spoke" x1="480" y1="285" x2="480" y2="478"/>
  <line class="spoke" x1="480" y1="285" x2="238" y2="420"/>
  <line class="spoke" x1="480" y1="285" x2="160" y2="285"/>
  <line class="spoke" x1="480" y1="285" x2="238" y2="150"/>

  <!-- hub -->
  <circle class="hub" cx="480" cy="285" r="54"/>
  <text class="hublbl" x="480" y="281" text-anchor="middle">Geometric &amp;</text>
  <text class="hublbl" x="480" y="298" text-anchor="middle">dense vision</text>

  <!-- N: Monocular depth (geo) -->
  <rect class="node geo" x="374" y="67" width="212" height="50" rx="9"/>
  <text class="lbl" x="480" y="88" text-anchor="middle">Monocular depth</text>
  <text class="sub" x="480" y="105" text-anchor="middle">Depth Anything · Metric3D · Depth Pro</text>

  <!-- NE: Optical flow / motion (geo) -->
  <rect class="node geo" x="616" y="125" width="212" height="50" rx="9"/>
  <text class="lbl" x="722" y="146" text-anchor="middle">Optical flow &amp; motion</text>
  <text class="sub" x="722" y="163" text-anchor="middle">RAFT · GMFlow · SEA-RAFT · CoTracker</text>

  <!-- E: 2D human pose (hum) -->
  <rect class="node hum" x="694" y="260" width="212" height="50" rx="9"/>
  <text class="lbl" x="800" y="281" text-anchor="middle">2D human pose</text>
  <text class="sub" x="800" y="298" text-anchor="middle">ViTPose · RTMPose · Sapiens</text>

  <!-- SE: 3D pose / mesh recovery (hum) -->
  <rect class="node hum" x="616" y="395" width="212" height="50" rx="9"/>
  <text class="lbl" x="722" y="416" text-anchor="middle">3D pose &amp; mesh (HMR)</text>
  <text class="sub" x="722" y="433" text-anchor="middle">HMR2.0 · CLIFF · WHAM · SMPLer-X</text>

  <!-- S: Feature matching / pointmaps (corr) -->
  <rect class="node corr" x="374" y="453" width="212" height="50" rx="9"/>
  <text class="lbl" x="480" y="474" text-anchor="middle">Matching &amp; pointmaps</text>
  <text class="sub" x="480" y="491" text-anchor="middle">LoFTR · RoMa · DUSt3R · VGGT</text>

  <!-- SW: Stereo & MVS (corr) -->
  <rect class="node corr" x="132" y="395" width="212" height="50" rx="9"/>
  <text class="lbl" x="238" y="416" text-anchor="middle">Stereo &amp; MVS</text>
  <text class="sub" x="238" y="433" text-anchor="middle">RAFT-Stereo · IGEV · FoundationStereo</text>

  <!-- W: Monocular 3D detection (rec) -->
  <rect class="node rec" x="54" y="260" width="212" height="50" rx="9"/>
  <text class="lbl" x="160" y="281" text-anchor="middle">Monocular 3D detection</text>
  <text class="sub" x="160" y="298" text-anchor="middle">MonoDETR · MonoLSS · DetAny3D</text>

  <!-- NW: Visual place recognition (rec) -->
  <rect class="node rec" x="132" y="125" width="212" height="50" rx="9"/>
  <text class="lbl" x="238" y="146" text-anchor="middle">Visual place recognition</text>
  <text class="sub" x="238" y="163" text-anchor="middle">NetVLAD · MixVPR · SALAD · BoQ</text>

  <!-- legend -->
  <text class="keylbl" x="60" y="556">FAMILIES</text>
  <rect class="swatch geo" x="60"  y="568" width="16" height="12" rx="2"/>
  <text class="sub" x="84"  y="578">Per-pixel geometry (depth &amp; flow)</text>
  <rect class="swatch hum" x="330" y="568" width="16" height="12" rx="2"/>
  <text class="sub" x="354" y="578">Human pose &amp; mesh</text>
  <rect class="swatch corr" x="540" y="568" width="16" height="12" rx="2"/>
  <text class="sub" x="564" y="578">Correspondence &amp; multi-view 3D</text>
  <rect class="swatch rec" x="800" y="568" width="16" height="12" rx="2"/>
  <text class="sub" x="824" y="578">3D detection &amp; place</text>
</svg>
