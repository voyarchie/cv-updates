<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 620" role="img" aria-label="Topic map for the 2026-Jul-08 CV update">
  <title>Topic map — 2026-Jul-08 CV update</title>
  <desc>A radial topic map of six threads in subsea (underwater optical + sonar) dense detection and classification: the two subsea primitives and why each breaks natural-image vision; optical underwater detection and the enhancement-versus-detection debate; sonar detection across forward-looking, side-scan and synthetic-aperture modalities; beating the data wall with simulation, diffusion synthesis and in-domain self-supervision; foundation, open-vocabulary and promptable models for the marine domain; and datasets, metrics and the classification and monitoring side.</desc>
  <style>
    .lbl { font-family: ui-sans-serif, system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .edge { stroke: #94a3b8; stroke-width: 2; }
    .node { stroke-width: 1.5; }
    .nt { fill: #f8fafc; font-weight: 600; }
    .ns { fill: #e2e8f0; }
  </style>
  <!-- edges -->
  <g class="edge" fill="none">
    <line x1="490" y1="310" x2="315" y2="150"/>
    <line x1="490" y1="310" x2="665" y2="150"/>
    <line x1="490" y1="310" x2="255" y2="310"/>
    <line x1="490" y1="310" x2="725" y2="310"/>
    <line x1="490" y1="310" x2="315" y2="470"/>
    <line x1="490" y1="310" x2="665" y2="470"/>
  </g>
  <!-- hub -->
  <g class="lbl">
    <rect x="368" y="266" width="244" height="88" rx="12" fill="#1f2937" stroke="#94a3b8" class="node"/>
    <text x="490" y="298" text-anchor="middle" class="nt" font-size="15">Subsea imaging</text>
    <text x="490" y="319" text-anchor="middle" class="nt" font-size="15">dense detection</text>
    <text x="490" y="340" text-anchor="middle" class="ns" font-size="12.5">+ classification</text>
  </g>
  <!-- T1 primitive (shared / green) -->
  <g class="lbl">
    <rect x="118" y="86" width="248" height="92" rx="12" fill="#15803d" stroke="#166534" class="node"/>
    <text x="242" y="116" text-anchor="middle" class="nt" font-size="13.5">1 · Two subsea primitives</text>
    <text x="242" y="136" text-anchor="middle" class="ns" font-size="12">light vs sound · colour cast</text>
    <text x="242" y="154" text-anchor="middle" class="ns" font-size="12">shadow-as-signal · scarce labels</text>
  </g>
  <!-- T2 optical detection (blue) -->
  <g class="lbl">
    <rect x="614" y="86" width="248" height="92" rx="12" fill="#0369a1" stroke="#075985" class="node"/>
    <text x="738" y="116" text-anchor="middle" class="nt" font-size="13.5">2 · Optical detection</text>
    <text x="738" y="136" text-anchor="middle" class="ns" font-size="12">enhance-vs-detect debate</text>
    <text x="738" y="154" text-anchor="middle" class="ns" font-size="12">YOLO/DETR · freq-domain · DG</text>
  </g>
  <!-- T3 sonar detection (amber) -->
  <g class="lbl">
    <rect x="8" y="264" width="248" height="92" rx="12" fill="#b45309" stroke="#92400e" class="node"/>
    <text x="132" y="294" text-anchor="middle" class="nt" font-size="13.5">3 · Sonar detection</text>
    <text x="132" y="314" text-anchor="middle" class="ns" font-size="12">FLS · SSS · SAS · multibeam</text>
    <text x="132" y="332" text-anchor="middle" class="ns" font-size="12">sonar DETRs · shadow-aware · MCM</text>
  </g>
  <!-- T4 data wall (green) -->
  <g class="lbl">
    <rect x="724" y="264" width="248" height="92" rx="12" fill="#15803d" stroke="#166534" class="node"/>
    <text x="848" y="294" text-anchor="middle" class="nt" font-size="13.5">4 · Beating the data wall</text>
    <text x="848" y="314" text-anchor="middle" class="ns" font-size="12">physics sim · diffusion synth</text>
    <text x="848" y="332" text-anchor="middle" class="ns" font-size="12">in-domain SSL · JEPA · few-shot</text>
  </g>
  <!-- T5 foundation / open-vocab (green) -->
  <g class="lbl">
    <rect x="118" y="442" width="248" height="92" rx="12" fill="#15803d" stroke="#166534" class="node"/>
    <text x="242" y="472" text-anchor="middle" class="nt" font-size="13.5">5 · Foundation &amp; open-vocab</text>
    <text x="242" y="492" text-anchor="middle" class="ns" font-size="12">SAM/SAM2/SAM3 · SonarSAM</text>
    <text x="242" y="510" text-anchor="middle" class="ns" font-size="12">BioCLIP · MarineDet · MARIS</text>
  </g>
  <!-- T6 data / metrics / classification (green) -->
  <g class="lbl">
    <rect x="614" y="442" width="248" height="92" rx="12" fill="#15803d" stroke="#166534" class="node"/>
    <text x="738" y="472" text-anchor="middle" class="nt" font-size="13.5">6 · Data · metrics · monitoring</text>
    <text x="738" y="492" text-anchor="middle" class="ns" font-size="12">DUO/RUOD-R · UATD · Pd/Pfa</text>
    <text x="738" y="510" text-anchor="middle" class="ns" font-size="12">species ID · counting · coral</text>
  </g>
</svg>
