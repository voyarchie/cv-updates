<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" role="img" aria-label="Diagram of the pharmaceutical inspection image. Left: four views. First, a parenteral vial or syringe imaged as a spin-stop sequence of about 20 frames, where moving particles must be separated from bubbles and glass marks. Second, the container and lyophilized cake, imaged by several cameras around a glass vial with specular highlights; defects include cracks, collapsed or shrunken cake and fill-level errors. Third, tablets and capsules on a press or sorter, with chips, cracks, coating defects and contamination. Fourth, the blister pack, with missing or broken tablets, foreign tablets and seal or print defects under a reflective lidding film. Middle: the shared primitive is a rare-defect, high-throughput, reflective or transparent image where each unit gets an accept or reject decision. Right: outputs are an accept or reject per unit, a defect class for trending, and a validated, locked model with a human-checked reject zone, as required by USP 1790, the FDA draft guidance and draft EU GMP Annex 22.">
  <title>The pharmaceutical inspection image: four views, one reject gate</title>
  <rect x="0" y="0" width="960" height="540" rx="10" fill="#f4f6fb" stroke="#cbd5e1"/>
  <text x="24" y="34" fill="#334155" font-size="17" font-weight="800">The pharmaceutical inspection image: four views, one reject gate</text>
  <text x="24" y="54" fill="#64748b" font-size="11.5">Defects are rare (ppm), glass and film are reflective, throughput is 300–600 units/min, and every reject decision must be validated</text>

  <g font-size="12" fill="#334155">
    <!-- 1 particles in liquid -->
    <rect x="24" y="72" width="330" height="104" rx="8" fill="#ffffff" stroke="#94a3b8"/>
    <text x="36" y="92" font-weight="700">1 · Liquid in vial / syringe (spin-stop)</text>
    <g>
      <rect x="40" y="102" width="34" height="60" rx="6" fill="#dbeafe" stroke="#1d4ed8"/>
      <rect x="47" y="96" width="20" height="8" fill="#94a3b8"/>
      <circle cx="52" cy="140" r="2.5" fill="#b91c1c"/>
      <circle cx="62" cy="122" r="4" fill="none" stroke="#0369a1"/>
      <rect x="82" y="102" width="34" height="60" rx="6" fill="#dbeafe" stroke="#1d4ed8"/>
      <rect x="89" y="96" width="20" height="8" fill="#94a3b8"/>
      <circle cx="96" cy="146" r="2.5" fill="#b91c1c"/>
      <circle cx="104" cy="116" r="4" fill="none" stroke="#0369a1"/>
      <rect x="124" y="102" width="34" height="60" rx="6" fill="#dbeafe" stroke="#1d4ed8"/>
      <rect x="131" y="96" width="20" height="8" fill="#94a3b8"/>
      <circle cx="140" cy="152" r="2.5" fill="#b91c1c"/>
      <circle cx="146" cy="110" r="4" fill="none" stroke="#0369a1"/>
      <text x="166" y="136" font-size="14" fill="#64748b">…</text>
    </g>
    <text x="188" y="114" font-size="10" fill="#475569">~20 frames per unit;</text>
    <text x="188" y="128" font-size="10" fill="#b91c1c">particle sinks / moves</text>
    <text x="188" y="142" font-size="10" fill="#0369a1">bubble rises (not a defect)</text>
    <text x="188" y="156" font-size="10" fill="#475569">glass mark stays fixed</text>

    <!-- 2 container & lyo cake -->
    <rect x="24" y="186" width="330" height="104" rx="8" fill="#ffffff" stroke="#94a3b8"/>
    <text x="36" y="206" font-weight="700">2 · Container &amp; lyophilized cake</text>
    <rect x="44" y="218" width="44" height="60" rx="6" fill="#e0f2fe" stroke="#0369a1"/>
    <rect x="48" y="246" width="36" height="28" fill="#fef3c7" stroke="#b45309"/>
    <path d="M50 246 L60 252 L70 246 L82 250" stroke="#b45309" fill="none"/>
    <line x1="58" y1="222" x2="54" y2="236" stroke="#ffffff" stroke-width="3"/>
    <rect x="102" y="218" width="44" height="60" rx="6" fill="#e0f2fe" stroke="#0369a1"/>
    <path d="M110 274 L112 258 L136 262 L138 274 Z" fill="#fef3c7" stroke="#b45309"/>
    <path d="M128 224 l6 10 l-4 4 l6 8" stroke="#b91c1c" fill="none" stroke-width="1.5"/>
    <text x="160" y="228" font-size="10" fill="#475569">specular highlights,</text>
    <text x="160" y="242" font-size="10" fill="#475569">cracks, cosmetic marks;</text>
    <text x="160" y="256" font-size="10" fill="#b45309">collapsed / shrunken /</text>
    <text x="160" y="270" font-size="10" fill="#b45309">split cake, fill level</text>

    <!-- 3 tablets & capsules -->
    <rect x="24" y="300" width="330" height="104" rx="8" fill="#ffffff" stroke="#94a3b8"/>
    <text x="36" y="320" font-weight="700">3 · Tablets &amp; capsules (press / sorter)</text>
    <ellipse cx="62" cy="356" rx="20" ry="13" fill="#f8fafc" stroke="#64748b"/>
    <ellipse cx="112" cy="356" rx="20" ry="13" fill="#f8fafc" stroke="#64748b"/>
    <path d="M124 346 l8 6 l-6 6" fill="#f4f6fb" stroke="#b91c1c"/>
    <ellipse cx="162" cy="356" rx="20" ry="13" fill="#f8fafc" stroke="#64748b"/>
    <circle cx="156" cy="352" r="3" fill="#7c3aed"/>
    <rect x="52" y="378" width="46" height="16" rx="8" fill="#fca5a5" stroke="#b91c1c"/>
    <rect x="75" y="378" width="23" height="16" rx="0" fill="#fde68a" stroke="#b45309"/>
    <rect x="110" y="378" width="46" height="16" rx="8" fill="#fca5a5" stroke="#b91c1c"/>
    <path d="M140 380 l4 6 l-4 6" stroke="#334155" fill="none"/>
    <text x="196" y="346" font-size="10" fill="#475569">chips, cracks, capping,</text>
    <text x="196" y="360" font-size="10" fill="#475569">spots, coating defects;</text>
    <text x="196" y="374" font-size="10" fill="#475569">dented / split capsules</text>
    <text x="196" y="388" font-size="10" fill="#7c3aed">few labelled defects</text>

    <!-- 4 blister -->
    <rect x="24" y="414" width="330" height="104" rx="8" fill="#ffffff" stroke="#94a3b8"/>
    <text x="36" y="434" font-weight="700">4 · Blister pack &amp; print</text>
    <rect x="40" y="444" width="140" height="64" rx="4" fill="#e2e8f0" stroke="#64748b"/>
    <g fill="#ffffff" stroke="#64748b">
      <circle cx="62" cy="462" r="9"/><circle cx="92" cy="462" r="9"/><circle cx="122" cy="462" r="9"/><circle cx="152" cy="462" r="9"/>
      <circle cx="62" cy="490" r="9"/><circle cx="92" cy="490" r="9"/><circle cx="122" cy="490" r="9"/><circle cx="152" cy="490" r="9"/>
    </g>
    <g fill="#f8fafc" stroke="#475569">
      <ellipse cx="62" cy="462" rx="6" ry="4"/><ellipse cx="92" cy="462" rx="6" ry="4"/><ellipse cx="152" cy="462" rx="6" ry="4"/>
      <ellipse cx="62" cy="490" rx="6" ry="4"/><ellipse cx="92" cy="490" rx="6" ry="4"/><ellipse cx="122" cy="490" rx="6" ry="4"/>
    </g>
    <ellipse cx="152" cy="490" rx="6" ry="4" fill="#fca5a5" stroke="#b91c1c"/>
    <path d="M118 458 l8 8 M126 458 l-8 8" stroke="#b91c1c"/>
    <text x="194" y="460" font-size="10" fill="#b91c1c">empty pocket, wrong</text>
    <text x="194" y="474" font-size="10" fill="#b91c1c">or broken tablet;</text>
    <text x="194" y="488" font-size="10" fill="#475569">reflective foil / PVC,</text>
    <text x="194" y="502" font-size="10" fill="#475569">seal &amp; print / OCR</text>
  </g>

  <!-- arrows -->
  <g stroke="#64748b" stroke-width="1.6" fill="none">
    <path d="M354 124 C 380 124, 380 250, 404 270"/>
    <path d="M354 238 C 380 238, 384 270, 404 280"/>
    <path d="M354 352 C 380 352, 384 300, 404 292"/>
    <path d="M354 466 C 380 466, 380 320, 404 302"/>
  </g>

  <!-- middle primitive -->
  <rect x="404" y="196" width="250" height="176" rx="10" fill="#ede9fe" stroke="#7c3aed"/>
  <text x="418" y="220" font-size="13" font-weight="800" fill="#4c1d95">Shared primitive</text>
  <g font-size="11" fill="#3b0764">
    <text x="418" y="242">• one unit → one accept / reject</text>
    <text x="418" y="260">• defects at ppm rates; classes rare</text>
    <text x="418" y="278">• transparent / reflective surfaces</text>
    <text x="418" y="296">• motion separates particle from</text>
    <text x="431" y="312">bubble or glass artefact</text>
    <text x="418" y="330">• false rejects cost product;</text>
    <text x="431" y="346">misses reach a patient</text>
    <text x="418" y="364">• model must be locked &amp; validated</text>
  </g>

  <g stroke="#64748b" stroke-width="1.6" fill="none">
    <path d="M654 250 L 690 170"/>
    <path d="M654 284 L 690 284"/>
    <path d="M654 320 L 690 400"/>
  </g>

  <!-- outputs -->
  <g font-size="11.5">
    <rect x="690" y="120" width="246" height="96" rx="8" fill="#dcfce7" stroke="#15803d"/>
    <text x="704" y="142" font-weight="700" fill="#14532d">Reject gate</text>
    <text x="704" y="162" fill="#166534">accept / reject / re-inspect</text>
    <text x="704" y="180" fill="#166534">rule-based AVI + DL second opinion</text>
    <text x="704" y="198" fill="#166534">grey zone → human (USP &lt;1790&gt;)</text>

    <rect x="690" y="236" width="246" height="96" rx="8" fill="#fef3c7" stroke="#b45309"/>
    <text x="704" y="258" font-weight="700" fill="#78350f">Defect class &amp; trend</text>
    <text x="704" y="278" fill="#92400e">critical / major / minor</text>
    <text x="704" y="296" fill="#92400e">particle type, cake, cosmetic</text>
    <text x="704" y="314" fill="#92400e">→ batch trending, root cause</text>

    <rect x="690" y="352" width="246" height="96" rx="8" fill="#e0f2fe" stroke="#0369a1"/>
    <text x="704" y="374" font-weight="700" fill="#0c4a6e">Validated model record</text>
    <text x="704" y="394" fill="#075985">static weights, Knapp-style test sets</text>
    <text x="704" y="412" fill="#075985">change control on retraining</text>
    <text x="704" y="430" fill="#075985">(draft EU GMP Annex 22, FDA)</text>
  </g>

  <text x="690" y="478" font-size="10" fill="#64748b">Sources: see §10. Throughput from Syntegon AIM9</text>
  <text x="690" y="492" font-size="10" fill="#64748b">(up to 600 vials/min); defect taxonomy after</text>
  <text x="690" y="506" font-size="10" fill="#64748b">USP &lt;1790&gt; and lyophilization CNN patents.</text>
</svg>
