<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" role="img" aria-label="The ISIC 2024 triage pipeline for 3D total-body photography. A 3D total-body scan yields hundreds of candidate lesion tiles per patient; the SLICE-3D training set has about 400,000 tiles from about 1,000 patients and the test set about 500,000 more. Each tile gets an image-model score from vision transformers and CNN hybrids plus lesion metadata such as size, colour and location. Patient-normalised features compare each lesion with the same patient's other lesions, which is the ugly duckling sign. A gradient-boosted tree ensemble produces a ranked list. The winner scored partial AUC above 80 percent true positive rate of 0.1726 and full AUC 0.9668, with about 52 lesions to review per cancer found at 80 percent sensitivity and about 98 at 90 percent.">
  <title>ISIC 2024 — whole-body lesion triage pipeline</title>
  <rect x="0" y="0" width="960" height="400" rx="10" fill="#f4f6fb" stroke="#cbd5e1"/>
  <text x="24" y="32" fill="#334155" font-size="16.5" font-weight="800">From a body scan to a ranked shortlist: how ISIC 2024 was won</text>
  <text x="24" y="52" fill="#64748b" font-size="11.5">SLICE-3D / ISIC 2024 (Kaggle, Jun–Sep 2024; analysis in npj Digital Medicine, Nov 2025). The patient, not the lesion, is the unit of context.</text>

  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#64748b"/></marker>
  </defs>

  <g font-size="12">
    <rect x="24" y="78" width="160" height="150" rx="8" fill="#334155" stroke="#94a3b8"/>
    <text x="104" y="102" text-anchor="middle" fill="#f8fafc" font-weight="800" font-size="13">3D TBP scan</text>
    <text x="104" y="124" text-anchor="middle" fill="#e2e8f0">candidate detector</text>
    <text x="104" y="142" text-anchor="middle" fill="#e2e8f0">→ 100s of tiles</text>
    <text x="104" y="160" text-anchor="middle" fill="#e2e8f0">per patient</text>
    <text x="104" y="190" text-anchor="middle" fill="#cbd5e1" font-size="11">train ≈ 400 K tiles</text>
    <text x="104" y="206" text-anchor="middle" fill="#cbd5e1" font-size="11">test ≈ 500 K tiles</text>

    <rect x="214" y="78" width="170" height="150" rx="8" fill="#075985" stroke="#38bdf8"/>
    <text x="299" y="102" text-anchor="middle" fill="#e0f2fe" font-weight="800" font-size="13">Per-lesion signals</text>
    <text x="299" y="124" text-anchor="middle" fill="#e0f2fe">image score:</text>
    <text x="299" y="142" text-anchor="middle" fill="#e0f2fe">ViT / CNN-ViT hybrids</text>
    <text x="299" y="166" text-anchor="middle" fill="#e0f2fe">+ tile metadata:</text>
    <text x="299" y="184" text-anchor="middle" fill="#e0f2fe">size, colour, shape,</text>
    <text x="299" y="202" text-anchor="middle" fill="#e0f2fe">site, age, sex</text>

    <rect x="414" y="78" width="180" height="150" rx="8" fill="#9f1239" stroke="#fb7185"/>
    <text x="504" y="102" text-anchor="middle" fill="#ffe4e6" font-weight="800" font-size="13">Patient context</text>
    <text x="504" y="124" text-anchor="middle" fill="#ffe4e6">normalise every feature</text>
    <text x="504" y="142" text-anchor="middle" fill="#ffe4e6">against the same</text>
    <text x="504" y="160" text-anchor="middle" fill="#ffe4e6">patient's other lesions</text>
    <text x="504" y="190" text-anchor="middle" fill="#fecdd3" font-size="11.5" font-weight="700">= the "ugly duckling"</text>
    <text x="504" y="206" text-anchor="middle" fill="#fecdd3" font-size="11.5" font-weight="700">sign, as tabular features</text>

    <rect x="624" y="78" width="140" height="150" rx="8" fill="#0f766e" stroke="#2dd4bf"/>
    <text x="694" y="102" text-anchor="middle" fill="#ccfbf1" font-weight="800" font-size="13">GBDT ensemble</text>
    <text x="694" y="124" text-anchor="middle" fill="#ccfbf1">LightGBM /</text>
    <text x="694" y="142" text-anchor="middle" fill="#ccfbf1">XGBoost /</text>
    <text x="694" y="160" text-anchor="middle" fill="#ccfbf1">CatBoost-style</text>
    <text x="694" y="184" text-anchor="middle" fill="#99f6e4" font-size="11">image score is</text>
    <text x="694" y="200" text-anchor="middle" fill="#99f6e4" font-size="11">one input column</text>

    <rect x="794" y="78" width="142" height="150" rx="8" fill="#6d28d9" stroke="#c4b5fd"/>
    <text x="865" y="102" text-anchor="middle" fill="#ede9fe" font-weight="800" font-size="13">Ranked list</text>
    <text x="865" y="124" text-anchor="middle" fill="#ede9fe">top-k lesions</text>
    <text x="865" y="142" text-anchor="middle" fill="#ede9fe">sent for</text>
    <text x="865" y="160" text-anchor="middle" fill="#ede9fe">dermoscopy /</text>
    <text x="865" y="178" text-anchor="middle" fill="#ede9fe">expert review</text>
  </g>

  <g stroke="#64748b" stroke-width="2" marker-end="url(#ah)">
    <line x1="186" y1="153" x2="210" y2="153"/>
    <line x1="386" y1="153" x2="410" y2="153"/>
    <line x1="596" y1="153" x2="620" y2="153"/>
    <line x1="766" y1="153" x2="790" y2="153"/>
  </g>

  <!-- results strip -->
  <rect x="24" y="252" width="912" height="126" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="44" y="278" fill="#334155" font-size="13.5" font-weight="800">Winning entry (private leaderboard)</text>
  <g font-size="12.5" fill="#1e293b">
    <text x="44" y="306"><tspan font-weight="800" fill="#9f1239">pAUC (TPR ≥ 80%) = 0.1726</tspan>  of a possible 0.20 · full AUC = 0.9668</text>
    <text x="44" y="330"><tspan font-weight="800" fill="#075985">≈ 52</tspan> lesions reviewed per cancer found at 80% sensitivity · <tspan font-weight="800" fill="#075985">≈ 98</tspan> at 90% sensitivity</text>
    <text x="44" y="354" fill="#475569">Metric choice matters: pAUC only scores the high-sensitivity region, which is where a screening tool must operate.</text>
  </g>
</svg>
