<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" role="img" aria-label="Three ways to answer a clinical question about a panoramic dental X-ray. Pattern A, end-to-end VLM: the image goes straight into a general or dental-tuned vision-language model, which answers fluently but often names the wrong tooth; GPT-4o scored 41.45 percent on MMOral-Bench. Pattern B, tool-calling VLM: a model trained with reinforcement learning calls zoom-in and mirror-compare tools and re-inspects regions, as in OralGPT-Plus. Pattern C, tool-evidence injection: seven dense detectors and segmenters run first (tooth numbering, bone loss, periapical lesions, caries, jaw structures, dental history, impacted teeth); their outputs are mapped to FDI tooth numbers and written into a structured evidence table; a frozen VLM answers using only that table. AgenTeeth reports 65.66 percent on open-ended VQA versus 45.35 percent for OralGPT-Plus, and gains of 12.9 to 23.0 points across four backbones on MMOral-OPG-Bench.">
  <title>Dense detectors as evidence for dental VLMs</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#64748b"/></marker>
  </defs>
  <rect x="0" y="0" width="960" height="420" rx="10" fill="#f4f6fb" stroke="#cbd5e1"/>
  <text x="24" y="32" fill="#334155" font-size="16.5" font-weight="800">Three ways to answer "what is wrong with tooth 36?" on a panoramic X-ray</text>
  <text x="24" y="52" fill="#64748b" font-size="11.5">Numbers are abstract-level claims from the cited papers; benchmarks differ between rows.</text>

  <g font-size="11.5">
    <!-- row A -->
    <text x="24" y="92" fill="#334155" font-size="12.5" font-weight="800">A · End-to-end VLM</text>
    <rect x="24" y="102" width="110" height="44" rx="6" fill="#334155"/>
    <text x="40" y="129" fill="#f8fafc" font-weight="800">OPG image</text>
    <path d="M134 124 L192 124" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
    <rect x="194" y="102" width="200" height="44" rx="6" fill="#e2e8f0" stroke="#94a3b8"/>
    <text x="206" y="122" fill="#334155" font-weight="800">VLM (general or dental SFT)</text>
    <text x="206" y="138" fill="#64748b" font-size="10.5">single forward pass</text>
    <path d="M394 124 L452 124" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
    <rect x="454" y="102" width="482" height="44" rx="6" fill="#ffe4e6" stroke="#9f1239"/>
    <text x="466" y="122" fill="#9f1239" font-weight="800">Fluent report, often the wrong tooth</text>
    <text x="466" y="138" fill="#334155" font-size="10.5">GPT-4o 41.45% on MMOral-Bench; OralGPT SFT 21.46 → 46.19% (one epoch)</text>

    <!-- row B -->
    <text x="24" y="182" fill="#334155" font-size="12.5" font-weight="800">B · Tool-calling VLM (trained)</text>
    <rect x="24" y="192" width="110" height="44" rx="6" fill="#334155"/>
    <text x="40" y="219" fill="#f8fafc" font-weight="800">OPG image</text>
    <path d="M134 214 L192 214" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
    <rect x="194" y="192" width="200" height="44" rx="6" fill="#e2e8f0" stroke="#94a3b8"/>
    <text x="206" y="212" fill="#334155" font-weight="800">RL-tuned VLM agent</text>
    <text x="206" y="228" fill="#64748b" font-size="10.5">calls Zoom-In / Mirror-In, re-inspects</text>
    <path d="M300 236 C 300 256, 240 256, 240 238" stroke="#64748b" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
    <text x="254" y="262" fill="#64748b" font-size="10">loop</text>
    <path d="M394 214 L452 214" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
    <rect x="454" y="192" width="482" height="44" rx="6" fill="#fef3c7" stroke="#b45309"/>
    <text x="466" y="212" fill="#92400e" font-weight="800">Looks again, like a dentist (OralGPT-Plus, CVPR 2026)</text>
    <text x="466" y="228" fill="#334155" font-size="10.5">reported above GPT-5 on MMOral-X; still learns its own localisation</text>

    <!-- row C -->
    <text x="24" y="292" fill="#334155" font-size="12.5" font-weight="800">C · Tool-evidence injection (frozen VLM)</text>
    <rect x="24" y="302" width="110" height="96" rx="6" fill="#334155"/>
    <text x="40" y="354" fill="#f8fafc" font-weight="800">OPG image</text>
    <path d="M134 350 L162 350" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
    <rect x="164" y="302" width="200" height="96" rx="6" fill="#ccfbf1" stroke="#0f766e"/>
    <text x="176" y="320" fill="#134e4a" font-weight="800">7 dense experts</text>
    <text x="176" y="337" fill="#334155" font-size="10.5">FDI numbering · bone loss</text>
    <text x="176" y="351" fill="#334155" font-size="10.5">periapical lesion · caries</text>
    <text x="176" y="365" fill="#334155" font-size="10.5">jaw structures · history</text>
    <text x="176" y="379" fill="#334155" font-size="10.5">impacted teeth</text>
    <path d="M364 350 L392 350" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
    <rect x="394" y="302" width="180" height="96" rx="6" fill="#f8fafc" stroke="#0f766e"/>
    <text x="406" y="320" fill="#134e4a" font-weight="800">Evidence table</text>
    <text x="406" y="338" fill="#334155" font-size="10.5" font-family="ui-monospace,Menlo,Consolas,monospace">36: caries, PA lesion</text>
    <text x="406" y="354" fill="#334155" font-size="10.5" font-family="ui-monospace,Menlo,Consolas,monospace">38: impacted</text>
    <text x="406" y="370" fill="#334155" font-size="10.5" font-family="ui-monospace,Menlo,Consolas,monospace">46: root-canal fill</text>
    <text x="406" y="388" fill="#64748b" font-size="10">deterministic box→tooth map</text>
    <path d="M574 350 L602 350" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
    <rect x="604" y="302" width="332" height="96" rx="6" fill="#dcfce7" stroke="#15803d"/>
    <text x="616" y="322" fill="#166534" font-weight="800">Frozen VLM answers from evidence only</text>
    <text x="616" y="342" fill="#334155" font-size="10.5">AgenTeeth: 65.66% open-ended VQA vs 45.35% OralGPT-Plus</text>
    <text x="616" y="358" fill="#334155" font-size="10.5">+12.9 to +23.0 pts on 4 backbones (MMOral-OPG-Bench)</text>
    <text x="616" y="374" fill="#334155" font-size="10.5">DentAgent: evidence blackboard over 5 modality agents</text>
    <text x="616" y="390" fill="#64748b" font-size="10">localisation is done by detectors, not by the LLM</text>
  </g>
</svg>
