<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 532" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" role="img" aria-label="Reported areas under the ROC curve for lung-nodule malignancy and lung-cancer risk models on low-dose CT, 2025 to 2026. LUNA25 indeterminate 5 to 15 millimetre nodules: AI 0.78 versus 65 radiologists 0.70. Bronchosolve automated model 0.898 versus Brock 0.783 versus Lung-RADS 0.669. Sybil in 18,057 Asian adults: 0.91 at 1 year and 0.74 at 6 years. Sybil-Epi 0.84 versus Sybil 0.82 at 6 years when a nodule is present. Never-smokers single baseline LDCT 6-year risk 0.79. Concept-bottleneck models from CT foundation models 0.86 on the LUNA25 internal test, similar to nodule size alone. ConfTriage, a language model reading nodule attributes on LIDC-IDRI, 0.92. Beyond Size and Growth ensemble 0.98 internal and 0.945 external. Rows use different tasks, cohorts and references and should not be ranked against each other.">
  <title>Malignancy and risk AUCs on LDCT, 2025–26</title>
  <rect x="0" y="0" width="960" height="532" rx="10" fill="#f4f6fb" stroke="#cbd5e1"/>
  <text x="24" y="32" fill="#334155" font-size="16.5" font-weight="800">Reported AUCs on screening CT, 2025–26: model vs comparator</text>
  <text x="24" y="52" fill="#64748b" font-size="11.5">Abstract-level numbers. Different tasks (nodule malignancy vs future scan-level risk), cohorts and references — compare within a row, not across rows.</text>
  <g font-size="11" fill="#64748b">
    <line x1="300" y1="76" x2="300" y2="428" stroke="#cbd5e1"/>
    <text x="300" y="444" text-anchor="middle">0.6</text>
    <line x1="450" y1="76" x2="450" y2="428" stroke="#cbd5e1"/>
    <text x="450" y="444" text-anchor="middle">0.7</text>
    <line x1="600" y1="76" x2="600" y2="428" stroke="#cbd5e1"/>
    <text x="600" y="444" text-anchor="middle">0.8</text>
    <line x1="750" y1="76" x2="750" y2="428" stroke="#cbd5e1"/>
    <text x="750" y="444" text-anchor="middle">0.9</text>
    <line x1="900" y1="76" x2="900" y2="428" stroke="#cbd5e1"/>
    <text x="900" y="444" text-anchor="middle">1.0</text>
    <text x="600" y="462" text-anchor="middle" fill="#475569">AUC (ROC)</text>
  </g>
  <rect x="16" y="76" width="928" height="44" fill="#e8edf6" opacity="0.6"/>
  <text x="24" y="95" fill="#334155" font-size="12" font-weight="700">LUNA25 · 5–15 mm nodules, NLST</text>
  <text x="24" y="111" fill="#64748b" font-size="11">AI vs 65 radiologists</text>
  <line x1="450.0" y1="98" x2="570.0" y2="98" stroke="#94a3b8" stroke-width="2"/>
  <circle cx="570.0" cy="98" r="6" fill="#2563eb" stroke="#1e3a8a"/>
  <text x="570.0" y="88" text-anchor="middle" fill="#334155" font-size="10.5">0.78</text>
  <rect x="445.0" y="93" width="10" height="10" transform="rotate(45 450.0 98)" fill="#fdba74" stroke="#c2410c"/>
  <text x="450.0" y="116" text-anchor="middle" fill="#334155" font-size="10.5">readers 0.70</text>
  <text x="24" y="139" fill="#334155" font-size="12" font-weight="700">Bronchosolve · screening nodules</text>
  <text x="24" y="155" fill="#64748b" font-size="11">AI vs Brock vs Lung-RADS</text>
  <line x1="403.5" y1="142" x2="747.0" y2="142" stroke="#94a3b8" stroke-width="2"/>
  <circle cx="747.0" cy="142" r="6" fill="#2563eb" stroke="#1e3a8a"/>
  <text x="747.0" y="132" text-anchor="middle" fill="#334155" font-size="10.5">0.898</text>
  <rect x="569.5" y="137" width="10" height="10" transform="rotate(45 574.5 142)" fill="#fdba74" stroke="#c2410c"/>
  <text x="574.5" y="160" text-anchor="middle" fill="#334155" font-size="10.5">Brock 0.783</text>
  <rect x="398.5" y="137" width="10" height="10" transform="rotate(45 403.5 142)" fill="#fdba74" stroke="#c2410c"/>
  <text x="403.5" y="160" text-anchor="middle" fill="#334155" font-size="10.5">Lung-RADS 0.669</text>
  <rect x="16" y="164" width="928" height="44" fill="#e8edf6" opacity="0.6"/>
  <text x="24" y="183" fill="#334155" font-size="12" font-weight="700">Sybil · 18,057 Asian adults</text>
  <text x="24" y="199" fill="#64748b" font-size="11">1-year vs 6-year risk</text>
  <line x1="510.0" y1="186" x2="765.0" y2="186" stroke="#94a3b8" stroke-width="2"/>
  <circle cx="765.0" cy="186" r="6" fill="#2563eb" stroke="#1e3a8a"/>
  <text x="765.0" y="176" text-anchor="middle" fill="#334155" font-size="10.5">1 y 0.91</text>
  <circle cx="510.0" cy="186" r="6" fill="#2563eb" stroke="#1e3a8a"/>
  <text x="510.0" y="176" text-anchor="middle" fill="#334155" font-size="10.5">6 y 0.74</text>
  <text x="24" y="227" fill="#334155" font-size="12" font-weight="700">Sybil-Epi vs Sybil · 6 y, nodule present</text>
  <text x="24" y="243" fill="#64748b" font-size="11">image + clinical vs image</text>
  <line x1="630.0" y1="230" x2="660.0" y2="230" stroke="#94a3b8" stroke-width="2"/>
  <circle cx="660.0" cy="230" r="6" fill="#2563eb" stroke="#1e3a8a"/>
  <text x="660.0" y="220" text-anchor="middle" fill="#334155" font-size="10.5">0.84</text>
  <rect x="625.0" y="225" width="10" height="10" transform="rotate(45 630.0 230)" fill="#fdba74" stroke="#c2410c"/>
  <text x="630.0" y="248" text-anchor="middle" fill="#334155" font-size="10.5">Sybil 0.82</text>
  <rect x="16" y="252" width="928" height="44" fill="#e8edf6" opacity="0.6"/>
  <text x="24" y="271" fill="#334155" font-size="12" font-weight="700">Never-smokers · single baseline LDCT</text>
  <text x="24" y="287" fill="#64748b" font-size="11">6-year lung-cancer risk</text>
  <circle cx="585.0" cy="274" r="6" fill="#2563eb" stroke="#1e3a8a"/>
  <text x="585.0" y="264" text-anchor="middle" fill="#334155" font-size="10.5">0.79</text>
  <text x="24" y="315" fill="#334155" font-size="12" font-weight="700">Concept bottleneck (CT-FM / FMCIB)</text>
  <text x="24" y="331" fill="#64748b" font-size="11">LUNA25 internal test</text>
  <circle cx="690.0" cy="318" r="6" fill="#2563eb" stroke="#1e3a8a"/>
  <text x="690.0" y="308" text-anchor="middle" fill="#334155" font-size="10.5">0.86</text>
  <rect x="16" y="340" width="928" height="44" fill="#e8edf6" opacity="0.6"/>
  <text x="24" y="359" fill="#334155" font-size="12" font-weight="700">ConfTriage · LLM on nodule attributes</text>
  <text x="24" y="375" fill="#64748b" font-size="11">LIDC-IDRI</text>
  <circle cx="780.0" cy="362" r="6" fill="#2563eb" stroke="#1e3a8a"/>
  <text x="780.0" y="352" text-anchor="middle" fill="#334155" font-size="10.5">0.92</text>
  <text x="24" y="403" fill="#334155" font-size="12" font-weight="700">Beyond Size &amp; Growth · LEM ensemble</text>
  <text x="24" y="419" fill="#64748b" font-size="11">internal vs external</text>
  <line x1="817.5" y1="406" x2="870.0" y2="406" stroke="#94a3b8" stroke-width="2"/>
  <circle cx="870.0" cy="406" r="6" fill="#2563eb" stroke="#1e3a8a"/>
  <text x="870.0" y="396" text-anchor="middle" fill="#334155" font-size="10.5">int 0.98</text>
  <circle cx="817.5" cy="406" r="6" fill="#2563eb" stroke="#1e3a8a"/>
  <text x="817.5" y="424" text-anchor="middle" fill="#334155" font-size="10.5">ext 0.945</text>
  <circle cx="40" cy="478" r="6" fill="#2563eb" stroke="#1e3a8a"/><text x="52" y="482" fill="#334155" font-size="11.5">AI model (this row's headline system)</text>
  <rect x="335" y="473" width="10" height="10" transform="rotate(45 340 478)" fill="#fdba74" stroke="#c2410c"/><text x="354" y="482" fill="#334155" font-size="11.5">comparator (radiologists, clinical model or guideline)</text>
</svg>
