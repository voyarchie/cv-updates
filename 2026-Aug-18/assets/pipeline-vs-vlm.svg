<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" role="img" aria-label="Two paradigms for parsing a document page: a modular detect-then-recognize pipeline of specialist models versus a single vision-language model that generates the structured page end-to-end, with a converging grounded-OCR middle ground">
  <title>Modular pipeline vs. end-to-end VLM parsing, and the grounded-OCR convergence</title>

  <defs>
    <marker id="pv-a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <!-- input page -->
  <rect x="24" y="196" width="96" height="78" rx="7" fill="#ffffff" stroke="#334155" stroke-width="1.8"/>
  <g fill="#334155"><rect x="34" y="206" width="60" height="6" rx="3"/><rect x="34" y="218" width="76" height="5" rx="2.5"/><rect x="34" y="228" width="76" height="5" rx="2.5"/><rect x="34" y="238" width="60" height="5" rx="2.5"/><rect x="34" y="252" width="76" height="14" rx="2" fill="#94a3b8"/></g>
  <text x="72" y="288" text-anchor="middle" fill="#64748b" font-size="10.5" font-weight="700">page image</text>

  <!-- ============ TOP LANE: modular pipeline ============ -->
  <text x="150" y="52" fill="#0369a1" font-size="13.5" font-weight="800">A &#183; Modular pipeline &#8212; detect, then recognize, then assemble</text>

  <g>
    <rect x="150" y="66" width="150" height="66" rx="8" fill="#0369a1" stroke="#075985"/>
    <text x="225" y="90" text-anchor="middle" fill="#ffffff" font-size="11.5" font-weight="700">Layout detector</text>
    <text x="225" y="107" text-anchor="middle" fill="#e0f2fe" font-size="9.5">DocLayout-YOLO,</text>
    <text x="225" y="120" text-anchor="middle" fill="#e0f2fe" font-size="9.5">PP-/RT-DocLayout</text>

    <rect x="322" y="66" width="150" height="66" rx="8" fill="#0f766e" stroke="#115e59"/>
    <text x="397" y="90" text-anchor="middle" fill="#ffffff" font-size="11.5" font-weight="700">Text spotter</text>
    <text x="397" y="107" text-anchor="middle" fill="#ccfbf1" font-size="9.5">DPText-DETR,</text>
    <text x="397" y="120" text-anchor="middle" fill="#ccfbf1" font-size="9.5">DeepSolo / GOT-OCR</text>

    <rect x="494" y="66" width="150" height="66" rx="8" fill="#be123c" stroke="#9f1239"/>
    <text x="569" y="90" text-anchor="middle" fill="#ffffff" font-size="11.5" font-weight="700">Table + formula</text>
    <text x="569" y="107" text-anchor="middle" fill="#ffe4e6" font-size="9.5">TATR / POTATR,</text>
    <text x="569" y="120" text-anchor="middle" fill="#ffe4e6" font-size="9.5">UniTabNet</text>

    <rect x="666" y="66" width="150" height="66" rx="8" fill="#7c3aed" stroke="#5b21b6"/>
    <text x="741" y="90" text-anchor="middle" fill="#ffffff" font-size="11.5" font-weight="700">Reading order</text>
    <text x="741" y="107" text-anchor="middle" fill="#ede9fe" font-size="9.5">LayoutReader,</text>
    <text x="741" y="120" text-anchor="middle" fill="#ede9fe" font-size="9.5">UniHDSA relations</text>

    <line x1="300" y1="99" x2="322" y2="99" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#pv-a)"/>
    <line x1="472" y1="99" x2="494" y2="99" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#pv-a)"/>
    <line x1="644" y1="99" x2="666" y2="99" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#pv-a)"/>
  </g>
  <text x="483" y="152" text-anchor="middle" fill="#64748b" font-size="10">+ interpretable, editable, swappable parts &#8226; &#8722; error compounds across stages, heavy to maintain</text>

  <!-- ============ BOTTOM LANE: end-to-end VLM ============ -->
  <text x="150" y="330" fill="#b45309" font-size="13.5" font-weight="800">B &#183; End-to-end VLM &#8212; the page is generated as one structured sequence</text>

  <rect x="150" y="344" width="300" height="80" rx="9" fill="#b45309" stroke="#92400e"/>
  <text x="300" y="372" text-anchor="middle" fill="#ffffff" font-size="12.5" font-weight="700">Single vision-language model</text>
  <text x="300" y="392" text-anchor="middle" fill="#fef3c7" font-size="10">dots.ocr &#183; MinerU2.5 &#183; PaddleOCR-VL</text>
  <text x="300" y="408" text-anchor="middle" fill="#fef3c7" font-size="10">DeepSeek-OCR &#183; olmOCR-2 &#183; Granite-Docling</text>

  <rect x="500" y="344" width="316" height="80" rx="9" fill="#1e293b" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="658" y="368" text-anchor="middle" fill="#f8fafc" font-size="11.5" font-weight="700">emits Markdown / HTML / JSON</text>
  <text x="658" y="387" text-anchor="middle" fill="#cbd5e1" font-size="10">boxes, cells, formulas &amp; order in one decode;</text>
  <text x="658" y="403" text-anchor="middle" fill="#cbd5e1" font-size="10">detection reframed as <tspan font-weight="700" fill="#fde68a">next-token generation</tspan></text>
  <line x1="450" y1="384" x2="500" y2="384" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#pv-a)"/>
  <text x="483" y="444" text-anchor="middle" fill="#64748b" font-size="10">+ one model, learns global structure &#8226; &#8722; hallucination, no hard boxes, token cost on dense pages</text>

  <!-- input feeds both lanes -->
  <path d="M120 214 C 138 150, 138 120, 150 99" fill="none" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#pv-a)"/>
  <path d="M120 256 C 138 330, 138 360, 150 384" fill="none" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#pv-a)"/>

  <!-- middle convergence band -->
  <rect x="150" y="188" width="666" height="60" rx="9" fill="#334155" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="483" y="212" text-anchor="middle" fill="#f8fafc" font-size="12.5" font-weight="700">Converging middle ground: grounded / box-emitting OCR</text>
  <text x="483" y="232" text-anchor="middle" fill="#e2e8f0" font-size="10.5">VLMs are trained to output coordinates with their text &#8212; regaining the pipeline's auditable boxes without its stages (&#167;7&#8211;8)</text>
</svg>
