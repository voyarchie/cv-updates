<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" role="img" aria-label="A single-photon image shown as a dense detection-and-classification scene. A single-photon camera (a SPAD array or a quanta image sensor) detects individual photons. Because a biological or low-light scene delivers only a few photons per pixel, each captured frame is a sparse binary pattern of ones and zeros. A high-speed stack of these binary frames forms a photon-cube, with no read noise but limited only by Poisson shot noise. Two readouts are extracted: passively, summing or aligning-and-merging the frames yields a high-dynamic-range intensity image; actively, time-correlating each detected photon against a pulsed laser builds a per-pixel time-of-arrival histogram whose peak gives depth. On this surface the dense-vision jobs are reconstruction and denoising, per-pixel depth and 3-D object detection from probabilistic point clouds, classification at well under one photon per pixel, and non-line-of-sight imaging that reconstructs a scene hidden around a corner from faint multiply-scattered returns.">
  <title>A single-photon image is a sparse photon-cube to reconstruct, range, detect, classify, and even see around corners</title>
  <rect x="0" y="0" width="960" height="520" rx="10" fill="#f4f6fb" stroke="#cbd5e1" stroke-width="1"/>
  <text x="24" y="32" fill="#334155" font-size="16" font-weight="800">Individual photons &#8594; a sparse binary photon-cube &#8594; intensity &amp; time-of-arrival &#8594; reconstruct, range, detect, classify, see around corners</text>

  <!-- ============ Panel 1: photons -> SPAD/QIS -> binary photon-cube ============ -->
  <g>
    <rect x="24" y="52" width="292" height="440" rx="8" fill="#0b1220" stroke="#334155" stroke-width="2"/>
    <text x="38" y="74" fill="#94a3b8" font-size="11.5">1 &#183; count single photons &#8594; binary frames</text>

    <!-- sparse incident photons -->
    <g fill="#fbbf24">
      <circle cx="70" cy="96" r="3"/><circle cx="150" cy="88" r="3"/><circle cx="232" cy="100" r="3"/>
      <circle cx="110" cy="112" r="3"/><circle cx="200" cy="90" r="3"/>
    </g>
    <g stroke="#f59e0b" stroke-width="1" opacity="0.6">
      <line x1="70" y1="96" x2="78" y2="150"/><line x1="150" y1="88" x2="150" y2="150"/>
      <line x1="232" y1="100" x2="224" y2="150"/><line x1="110" y1="112" x2="118" y2="150"/>
    </g>
    <text x="38" y="94" fill="#fcd34d" font-size="10">a few photons / pixel (dose- or light-starved)</text>

    <!-- SPAD / QIS pixel array -->
    <rect x="40" y="150" width="260" height="34" rx="5" fill="#12324a" stroke="#38bdf8" stroke-width="1.4"/>
    <text x="52" y="171" fill="#7dd3fc" font-size="10.5">SPAD array / quanta image sensor &#8212; no read noise</text>

    <!-- binary frame stack (the photon-cube) -->
    <text x="38" y="208" fill="#7dd3fc" font-size="10">photon-cube: binary frames at 10&#8211;100 kHz</text>
    <g>
      <rect x="150" y="214" width="120" height="90" rx="4" fill="#0f2233" stroke="#334155"/>
      <rect x="132" y="228" width="120" height="90" rx="4" fill="#0f2233" stroke="#334155"/>
      <rect x="114" y="242" width="120" height="90" rx="4" fill="#111a2e" stroke="#38bdf8" stroke-width="1.3"/>
      <!-- 0/1 grid on front frame -->
      <g fill="#5eead4" font-size="9" font-family="monospace">
        <text x="122" y="258">1 0 0 1 0 0</text>
        <text x="122" y="272">0 0 1 0 0 1</text>
        <text x="122" y="286">0 1 0 0 1 0</text>
        <text x="122" y="300">1 0 0 1 0 0</text>
        <text x="122" y="314">0 0 1 0 0 0</text>
      </g>
    </g>
    <text x="38" y="352" fill="#cbd5e1" font-size="10">each pixel: 1 = photon detected, 0 = none</text>

    <text x="38" y="382" fill="#cbd5e1" font-size="10.5" font-weight="700">the noise is Poisson, not Gaussian:</text>
    <text x="38" y="400" fill="#94a3b8" font-size="10">variance = mean, and there is</text>
    <text x="38" y="416" fill="#94a3b8" font-size="10">no read noise to average away.</text>
    <text x="38" y="444" fill="#f59e0b" font-size="10.5" font-weight="700">every photon carries time &amp; space &#8212;</text>
    <text x="38" y="460" fill="#fbbf24" font-size="10">a picosecond-tagged spatio-temporal</text>
    <text x="38" y="476" fill="#fbbf24" font-size="10">event, not a well-integrated exposure</text>
  </g>

  <!-- ============ Panel 2: two readouts ============ -->
  <g>
    <rect x="332" y="52" width="292" height="440" rx="8" fill="#0b1220" stroke="#334155" stroke-width="2"/>
    <text x="346" y="74" fill="#94a3b8" font-size="11.5">2 &#183; two readouts from the same cube</text>

    <!-- passive intensity -->
    <text x="346" y="98" fill="#6ee7b7" font-size="10.5" font-weight="700">passive &#183; align + merge &#8594; HDR intensity</text>
    <rect x="348" y="106" width="260" height="86" rx="6" fill="#111a2e" stroke="#334155"/>
    <path d="M362 178 Q420 118 470 150 T602 130" fill="none" stroke="#34d399" stroke-width="2"/>
    <g fill="#e2e8f0" opacity="0.85">
      <circle cx="400" cy="150" r="9"/><circle cx="470" cy="150" r="9"/><circle cx="540" cy="146" r="9"/>
    </g>
    <text x="356" y="122" fill="#94a3b8" font-size="9">quanta burst &#183; SoDaCam &#183; QIS-Net</text>

    <!-- active depth via TCSPC histogram -->
    <text x="346" y="214" fill="#7dd3fc" font-size="10.5" font-weight="700">active &#183; time-of-arrival histogram &#8594; depth</text>
    <rect x="348" y="222" width="260" height="120" rx="6" fill="#111a2e" stroke="#334155"/>
    <!-- axes -->
    <line x1="366" y1="330" x2="596" y2="330" stroke="#475569" stroke-width="1"/>
    <line x1="366" y1="238" x2="366" y2="330" stroke="#475569" stroke-width="1"/>
    <text x="360" y="342" fill="#64748b" font-size="8.5">time-of-flight bins (depth)  &#8594;</text>
    <!-- background counts -->
    <g fill="#334155">
      <rect x="378" y="322" width="6" height="8"/><rect x="398" y="324" width="6" height="6"/>
      <rect x="430" y="323" width="6" height="7"/><rect x="470" y="325" width="6" height="5"/>
      <rect x="512" y="322" width="6" height="8"/><rect x="556" y="324" width="6" height="6"/>
    </g>
    <!-- signal peak -->
    <rect x="486" y="262" width="6" height="68" fill="#38bdf8"/>
    <rect x="480" y="286" width="6" height="44" fill="#0ea5e9"/>
    <rect x="492" y="290" width="6" height="40" fill="#0ea5e9"/>
    <text x="470" y="256" fill="#7dd3fc" font-size="9">peak = range</text>
    <text x="356" y="238" fill="#94a3b8" font-size="9">photon counts</text>

    <text x="346" y="366" fill="#cbd5e1" font-size="10.5" font-weight="700">the hard case: signal &#8776; background.</text>
    <text x="346" y="384" fill="#94a3b8" font-size="10">at SBR &#8776; 0.05 the true peak is one</text>
    <text x="346" y="400" fill="#94a3b8" font-size="10">bin among a flat sea of dark &amp; ambient</text>
    <text x="346" y="416" fill="#94a3b8" font-size="10">counts &#8212; and mixed pixels straddle</text>
    <text x="346" y="432" fill="#94a3b8" font-size="10">two depths at every object edge.</text>
    <text x="346" y="462" fill="#fbbf24" font-size="10">deep unrolling &#183; multi-scale-histogram nets</text>
    <text x="346" y="478" fill="#fbbf24" font-size="10">&#183; risk-guided &amp; context-aware depth</text>
  </g>

  <!-- ============ Panel 3: dense tasks ============ -->
  <g>
    <rect x="640" y="52" width="296" height="440" rx="8" fill="#0b1220" stroke="#334155" stroke-width="2"/>
    <text x="654" y="74" fill="#94a3b8" font-size="11.5">3 &#183; the dense-vision jobs</text>

    <!-- 3D detection from probabilistic point cloud -->
    <text x="654" y="98" fill="#7dd3fc" font-size="10">3-D detection on a probabilistic point cloud</text>
    <rect x="654" y="106" width="266" height="92" rx="6" fill="#0f2233" stroke="#334155"/>
    <g fill="#38bdf8" opacity="0.7">
      <circle cx="690" cy="150" r="1.6"/><circle cx="705" cy="140" r="1.6"/><circle cx="700" cy="160" r="1.6"/>
      <circle cx="720" cy="150" r="1.6"/><circle cx="712" cy="168" r="1.6"/>
      <circle cx="820" cy="145" r="1.6"/><circle cx="835" cy="155" r="1.6"/><circle cx="828" cy="135" r="1.6"/>
      <circle cx="845" cy="150" r="1.6"/><circle cx="838" cy="166" r="1.6"/>
    </g>
    <rect x="678" y="128" width="58" height="52" rx="3" fill="none" stroke="#34d399" stroke-width="2"/>
    <rect x="806" y="124" width="54" height="56" rx="3" fill="none" stroke="#34d399" stroke-width="2"/>
    <text x="682" y="192" fill="#6ee7b7" font-size="8.5">car</text>
    <text x="810" y="192" fill="#6ee7b7" font-size="8.5">pedestrian</text>

    <!-- photon-efficient classification -->
    <text x="654" y="220" fill="#7dd3fc" font-size="10">classify at &#8810; 1 photon / pixel</text>
    <rect x="654" y="228" width="266" height="58" rx="6" fill="#0f1b30" stroke="#334155"/>
    <g fill="#fbbf24" opacity="0.9">
      <circle cx="680" cy="258" r="2"/><circle cx="700" cy="250" r="2"/><circle cx="694" cy="268" r="2"/>
      <circle cx="716" cy="256" r="2"/>
    </g>
    <path d="M740 258 l16 0" stroke="#64748b" stroke-width="1.4" marker-end="url(#ah2)"/>
    <rect x="764" y="242" width="140" height="30" rx="4" fill="#12324a" stroke="#38bdf8"/>
    <text x="772" y="261" fill="#e2e8f0" font-size="9.5">in-sensor / neuromorphic net</text>
    <text x="662" y="280" fill="#94a3b8" font-size="8.5">PANS &#183; in-sensor computing &#183; active learning</text>

    <!-- NLOS -->
    <text x="654" y="308" fill="#7dd3fc" font-size="10">non-line-of-sight: see around a corner</text>
    <rect x="654" y="316" width="266" height="110" rx="6" fill="#0f2233" stroke="#334155"/>
    <!-- wall -->
    <rect x="666" y="330" width="150" height="10" rx="2" fill="#334155"/>
    <text x="670" y="352" fill="#64748b" font-size="8.5">relay wall</text>
    <!-- occluder -->
    <rect x="700" y="360" width="10" height="56" fill="#475569"/>
    <text x="694" y="424" fill="#64748b" font-size="8">occluder</text>
    <!-- hidden object -->
    <path d="M770 392 l0 -18 l12 0" transform="rotate(25 776 383)" fill="none" stroke="#f472b6" stroke-width="2"/>
    <text x="762" y="410" fill="#f9a8d4" font-size="8.5">hidden target</text>
    <!-- scattered light -->
    <g stroke="#a78bfa" stroke-width="1" opacity="0.7">
      <path d="M740 335 L776 383" fill="none"/><path d="M760 335 L776 383" fill="none"/>
      <path d="M740 335 L690 420" fill="none"/>
    </g>
    <text x="662" y="360" fill="#c4b5fd" font-size="8.5">faint 3-bounce returns &#8594; reconstruct / track</text>
    <text x="654" y="446" fill="#94a3b8" font-size="9">NLOST &#183; NeTF &#183; CMFormer &#183; PathFinder</text>
    <text x="654" y="470" fill="#fbbf24" font-size="10">one modality, five dense tasks &#8212; all on a</text>
    <text x="654" y="484" fill="#fbbf24" font-size="10">stream of individually counted photons</text>
  </g>

  <defs>
    <marker id="ah2" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 z" fill="#64748b"/>
    </marker>
  </defs>
</svg>
