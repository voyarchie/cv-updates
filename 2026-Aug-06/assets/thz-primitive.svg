<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" role="img" aria-label="The terahertz imaging primitive: the terahertz gap on the electromagnetic spectrum, the source-object-detector chain, the two readout modes, and the dense vision tasks">
  <title>The terahertz imaging primitive</title>
  <!-- transparent canvas: no background rect, so it reads on light and dark -->

  <!-- ============ EM SPECTRUM STRIP ============ -->
  <g transform="translate(40,28)">
    <rect x="0" y="0" width="880" height="30" rx="6" fill="#1e293b" stroke="#64748b" stroke-width="1"/>
    <text x="12" y="20" fill="#f8fafc" font-size="14" font-weight="700">The electromagnetic spectrum</text>
    <!-- bands -->
    <g font-size="11" text-anchor="middle">
      <rect x="0"   y="38" width="250" height="26" rx="4" fill="#7c3aed"/>
      <text x="125" y="55" fill="#ede9fe">Microwave / mmWave  ·  ↑ frequency →</text>
      <rect x="258" y="38" width="230" height="26" rx="4" fill="#0e7490"/>
      <text x="373" y="55" fill="#cffafe" font-weight="700">TERAHERTZ  0.1–10 THz</text>
      <rect x="496" y="38" width="180" height="26" rx="4" fill="#b45309"/>
      <text x="586" y="55" fill="#fde68a">Infrared</text>
      <rect x="684" y="38" width="196" height="26" rx="4" fill="#be123c"/>
      <text x="782" y="55" fill="#ffe4e6">Visible · UV · X-ray</text>
    </g>
    <text x="373" y="84" text-anchor="middle" fill="#94a3b8" font-size="11">λ ≈ 3 mm–30 µm  ·  photon energy ~meV (non-ionizing)  ·  the historical "terahertz gap"</text>
  </g>

  <!-- ============ SIGNAL CHAIN ============ -->
  <g transform="translate(40,150)">
    <rect x="0" y="0" width="880" height="26" rx="6" fill="#1e293b" stroke="#64748b" stroke-width="1"/>
    <text x="12" y="18" fill="#f8fafc" font-size="13" font-weight="700">What terahertz measures</text>

    <!-- source -->
    <rect x="0" y="40" width="150" height="86" rx="8" fill="#4f46e5" stroke="#3730a3"/>
    <text x="75" y="66" text-anchor="middle" fill="#e0e7ff" font-size="13" font-weight="700">THz source</text>
    <text x="75" y="86" text-anchor="middle" fill="#c7d2fe" font-size="10.5">active illumination</text>
    <text x="75" y="102" text-anchor="middle" fill="#c7d2fe" font-size="10.5">(or passive: emitted</text>
    <text x="75" y="116" text-anchor="middle" fill="#c7d2fe" font-size="10.5">/reflected warmth)</text>

    <!-- wave arrow -->
    <path d="M152 83 h44" stroke="#22d3ee" stroke-width="2" fill="none"/>
    <path d="M196 83 l-9 -5 v10 z" fill="#22d3ee"/>

    <!-- object -->
    <rect x="200" y="30" width="200" height="106" rx="8" fill="#0f766e" stroke="#115e59"/>
    <text x="300" y="52" text-anchor="middle" fill="#ccfbf1" font-size="13" font-weight="700">Object under fabric</text>
    <text x="300" y="72" text-anchor="middle" fill="#99f6e4" font-size="10.5">penetrates: cloth, paper,</text>
    <text x="300" y="87" text-anchor="middle" fill="#99f6e4" font-size="10.5">plastic, ceramic, foam</text>
    <text x="300" y="106" text-anchor="middle" fill="#fca5a5" font-size="10.5">blocked: metal (reflects)</text>
    <text x="300" y="121" text-anchor="middle" fill="#fca5a5" font-size="10.5">absorbed: liquid water</text>

    <!-- arrow -->
    <path d="M402 83 h44" stroke="#22d3ee" stroke-width="2" fill="none"/>
    <path d="M446 83 l-9 -5 v10 z" fill="#22d3ee"/>

    <!-- detector -->
    <rect x="450" y="40" width="150" height="86" rx="8" fill="#4f46e5" stroke="#3730a3"/>
    <text x="525" y="66" text-anchor="middle" fill="#e0e7ff" font-size="13" font-weight="700">Detector</text>
    <text x="525" y="86" text-anchor="middle" fill="#c7d2fe" font-size="10.5">array or single-pixel</text>
    <text x="525" y="102" text-anchor="middle" fill="#c7d2fe" font-size="10.5">raster scan</text>
    <text x="525" y="116" text-anchor="middle" fill="#c7d2fe" font-size="10.5">→ pixel value</text>

    <!-- properties column -->
    <rect x="630" y="30" width="250" height="106" rx="8" fill="#334155" stroke="#64748b"/>
    <text x="755" y="50" text-anchor="middle" fill="#f1f5f9" font-size="12" font-weight="700">Why it is a hard primitive</text>
    <text x="646" y="70" fill="#e2e8f0" font-size="10.5">• diffraction-limited: mm-scale spot,</text>
    <text x="656" y="84" fill="#94a3b8" font-size="10.5">low spatial resolution</text>
    <text x="646" y="100" fill="#e2e8f0" font-size="10.5">• low SNR / low contrast, slow scan</text>
    <text x="646" y="116" fill="#e2e8f0" font-size="10.5">• class label lives in the spectrum,</text>
    <text x="656" y="130" fill="#94a3b8" font-size="10.5">not the shape</text>
  </g>

  <!-- ============ TWO READOUT MODES ============ -->
  <g transform="translate(40,330)">
    <rect x="0" y="0" width="880" height="26" rx="6" fill="#1e293b" stroke="#64748b" stroke-width="1"/>
    <text x="12" y="18" fill="#f8fafc" font-size="13" font-weight="700">Two readout modes</text>

    <!-- imaging mode -->
    <rect x="0" y="40" width="430" height="118" rx="8" fill="#1d4ed8" stroke="#1e40af"/>
    <text x="16" y="64" fill="#dbeafe" font-size="13" font-weight="700">A · Imaging (one number per pixel)</text>
    <text x="16" y="86" fill="#bfdbfe" font-size="11">Intensity / reflectance map → a 2-D image.</text>
    <text x="16" y="104" fill="#bfdbfe" font-size="11">Active (illuminated) or passive (body-warmth).</text>
    <text x="16" y="122" fill="#bfdbfe" font-size="11">The "object" is a low-res, noisy blob.</text>
    <text x="16" y="144" fill="#93c5fd" font-size="10.5">→ detection · segmentation · super-resolution</text>

    <!-- spectroscopy mode -->
    <rect x="450" y="40" width="430" height="118" rx="8" fill="#7c3aed" stroke="#6d28d9"/>
    <text x="466" y="64" fill="#ede9fe" font-size="13" font-weight="700">B · Spectroscopy (a waveform per pixel)</text>
    <text x="466" y="86" fill="#ddd6fe" font-size="11">THz-TDS: record the full E-field pulse in time.</text>
    <text x="466" y="104" fill="#ddd6fe" font-size="11">FFT → per-pixel absorption spectrum =</text>
    <text x="466" y="122" fill="#ddd6fe" font-size="11">molecular fingerprint = the class label.</text>
    <text x="466" y="144" fill="#c4b5fd" font-size="10.5">→ material / chemical ID · NDT depth gating</text>
  </g>

  <!-- ============ DENSE TASKS ============ -->
  <g transform="translate(40,512)">
    <rect x="0" y="0" width="880" height="26" rx="6" fill="#0f172a" stroke="#64748b" stroke-width="1"/>
    <text x="12" y="18" fill="#f8fafc" font-size="13" font-weight="700">Dense vision tasks decoded from the terahertz signal</text>
    <g font-size="11" text-anchor="middle">
      <rect x="0"   y="38" width="168" height="46" rx="6" fill="#be123c" stroke="#9f1239"/>
      <text x="84"  y="60" fill="#ffe4e6" font-weight="700">Concealed-threat</text>
      <text x="84"  y="76" fill="#fecdd3">detection §4</text>
      <rect x="178" y="38" width="168" height="46" rx="6" fill="#0e7490" stroke="#155e75"/>
      <text x="262" y="60" fill="#cffafe" font-weight="700">Spectral material</text>
      <text x="262" y="76" fill="#a5f3fc">classification §5</text>
      <rect x="356" y="38" width="168" height="46" rx="6" fill="#4338ca" stroke="#3730a3"/>
      <text x="440" y="60" fill="#e0e7ff" font-weight="700">Super-res &amp;</text>
      <text x="440" y="76" fill="#c7d2fe">denoising §6</text>
      <rect x="534" y="38" width="168" height="46" rx="6" fill="#b45309" stroke="#92400e"/>
      <text x="618" y="60" fill="#fde68a" font-weight="700">NDT defect</text>
      <text x="618" y="76" fill="#fcd34d">detection §7</text>
      <rect x="712" y="38" width="168" height="46" rx="6" fill="#0f766e" stroke="#115e59"/>
      <text x="796" y="60" fill="#ccfbf1" font-weight="700">Biomedical</text>
      <text x="796" y="76" fill="#99f6e4">margins §7</text>
    </g>
  </g>
</svg>
