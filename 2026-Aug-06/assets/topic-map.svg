<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 600" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" role="img" aria-label="Topic map: six terahertz dense-detection and classification threads arranged around the terahertz imaging primitive">
  <title>Topic map — terahertz dense detection &amp; classification</title>

  <!-- connectors first so nodes sit on top -->
  <g stroke="#64748b" stroke-width="2" fill="none" opacity="0.9">
    <path d="M470 300 L215 130"/>
    <path d="M470 300 L725 130"/>
    <path d="M470 300 L120 300"/>
    <path d="M470 300 L820 300"/>
    <path d="M470 300 L215 470"/>
    <path d="M470 300 L725 470"/>
  </g>

  <!-- hub -->
  <circle cx="470" cy="300" r="86" fill="#0e7490" stroke="#22d3ee" stroke-width="2.5"/>
  <text x="470" y="286" text-anchor="middle" fill="#ecfeff" font-size="16" font-weight="700">Terahertz</text>
  <text x="470" y="308" text-anchor="middle" fill="#cffafe" font-size="13">image &amp; TDS</text>
  <text x="470" y="328" text-anchor="middle" fill="#a5f3fc" font-size="11">the 0.1–10 THz gap</text>

  <!-- node template: rounded rect w=250 h=94 -->
  <!-- §4 concealed threat (top-left) -->
  <g transform="translate(90,84)">
    <rect width="250" height="96" rx="10" fill="#be123c" stroke="#9f1239"/>
    <text x="16" y="26" fill="#ffe4e6" font-size="13.5" font-weight="700">§4 Concealed-threat detection</text>
    <text x="16" y="47" fill="#fecdd3" font-size="10.8">the security workhorse: weapons /</text>
    <text x="16" y="62" fill="#fecdd3" font-size="10.8">explosives under clothing</text>
    <text x="16" y="82" fill="#fda4af" font-size="10.3">Active-THz dataset · YOLO/transformer · SSD</text>
  </g>

  <!-- §5 spectral classification (top-right) -->
  <g transform="translate(600,84)">
    <rect width="250" height="96" rx="10" fill="#0e7490" stroke="#155e75"/>
    <text x="16" y="26" fill="#cffafe" font-size="13.5" font-weight="700">§5 Spectral classification</text>
    <text x="16" y="47" fill="#a5f3fc" font-size="10.8">THz-TDS fingerprint → material /</text>
    <text x="16" y="62" fill="#a5f3fc" font-size="10.8">chemical / biological class</text>
    <text x="16" y="82" fill="#67e8f9" font-size="10.3">SVM/RF/XGBoost · pixel-level explosive ID</text>
  </g>

  <!-- §6 super-res / denoising (left) -->
  <g transform="translate(0,253)">
    <rect width="250" height="96" rx="10" fill="#4338ca" stroke="#3730a3"/>
    <text x="16" y="26" fill="#e0e7ff" font-size="13.5" font-weight="700">§6 Super-res &amp; restoration</text>
    <text x="16" y="47" fill="#c7d2fe" font-size="10.8">beat the diffraction limit &amp; low SNR</text>
    <text x="16" y="62" fill="#c7d2fe" font-size="10.8">denoise · deblur · reconstruct</text>
    <text x="16" y="82" fill="#a5b4fc" font-size="10.3">RCAN/GAN · physics-guided · self-supervised</text>
  </g>

  <!-- §7a NDT (right) -->
  <g transform="translate(690,253)">
    <rect width="250" height="96" rx="10" fill="#b45309" stroke="#92400e"/>
    <text x="16" y="26" fill="#fde68a" font-size="13.5" font-weight="700">§7 NDT defect detection</text>
    <text x="16" y="47" fill="#fcd34d" font-size="10.8">delamination / voids in composites,</text>
    <text x="16" y="62" fill="#fcd34d" font-size="10.8">coatings, art, pharma</text>
    <text x="16" y="82" fill="#fbbf24" font-size="10.3">Faster R-CNN · DyHRMADet · signal CNN</text>
  </g>

  <!-- §7b biomedical (bottom-left) -->
  <g transform="translate(90,420)">
    <rect width="250" height="96" rx="10" fill="#0f766e" stroke="#115e59"/>
    <text x="16" y="26" fill="#ccfbf1" font-size="13.5" font-weight="700">§7 Biomedical imaging</text>
    <text x="16" y="47" fill="#99f6e4" font-size="10.8">water-contrast: tumour margins,</text>
    <text x="16" y="62" fill="#99f6e4" font-size="10.8">burns, skin-cancer screening</text>
    <text x="16" y="82" fill="#5eead4" font-size="10.3">DECANet · metasurface biosensors</text>
  </g>

  <!-- §8 data/physics/foundation (bottom-right) -->
  <g transform="translate(600,420)">
    <rect width="250" height="96" rx="10" fill="#7c3aed" stroke="#6d28d9"/>
    <text x="16" y="26" fill="#ede9fe" font-size="13.5" font-weight="700">§8 Physics, data &amp; models</text>
    <text x="16" y="47" fill="#ddd6fe" font-size="10.8">the scarce-data problem: simulation,</text>
    <text x="16" y="62" fill="#ddd6fe" font-size="10.8">physics priors, transfer learning</text>
    <text x="16" y="82" fill="#c4b5fd" font-size="10.3">physics-enhanced NN · ML-for-THz reviews</text>
  </g>
</svg>
