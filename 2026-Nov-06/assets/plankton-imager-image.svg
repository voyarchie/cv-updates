<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" role="img" aria-label="Diagram of the plankton imager image. Four views: a flow imager such as IFCB, FlowCam or CytoSense that captures one particle per frame plus scatter and fluorescence traces; a benchtop scanner such as ZooScan or PlanktoScope where hundreds of preserved organisms touch and must be declumped; an in situ shadowgraph or line-scan imager such as ISIIS, UVP6 or the Plankton Imager where most segments are marine snow; and a digital holographic imager where organisms appear as fringe patterns and can be detected without full reconstruction. All feed an open-set, shift-aware classifier whose counts are corrected by quantification into concentration per taxon per cubic metre, used for harmful algal bloom alerts and ecosystem time series.">
  <title>The plankton imager image: four views, one concentration estimate</title>
  <rect x="0" y="0" width="960" height="500" rx="10" fill="#f4f6fb" stroke="#cbd5e1"/>
  <text x="24" y="34" fill="#334155" font-size="17" font-weight="800">The plankton imager image: four views, one concentration estimate</text>
  <text x="24" y="54" fill="#64748b" font-size="11.5">10³–10⁷ objects per hour; most are detritus or marine snow; long-tailed, drifting class mix; output is individuals per taxon per litre or m³</text>

  <g font-size="12" fill="#334155">
    <!-- 1 flow imager -->
    <rect x="24" y="72" width="216" height="262" rx="8" fill="#e0e7ff" stroke="#6366f1"/>
    <text x="36" y="94" font-weight="700">① Flow imager</text>
    <text x="36" y="110" font-size="10.5" fill="#475569">IFCB · FlowCam · CytoSense</text>
    <rect x="40" y="120" width="184" height="96" rx="4" fill="#ffffff" stroke="#94a3b8"/>
    <line x1="132" y1="120" x2="132" y2="216" stroke="#cbd5e1" stroke-dasharray="3 3"/>
    <!-- a diatom chain in frame -->
    <g fill="#bbf7d0" stroke="#15803d" stroke-width="1">
      <rect x="62" y="158" width="14" height="22" rx="3"/><rect x="78" y="158" width="14" height="22" rx="3"/><rect x="94" y="158" width="14" height="22" rx="3"/>
    </g>
    <text x="52" y="208" font-size="10" fill="#475569">1 ROI per trigger</text>
    <!-- scatter / fluorescence trace -->
    <polyline points="140,200 150,198 158,170 164,140 170,176 178,196 216,200" fill="none" stroke="#2563eb" stroke-width="1.6"/>
    <polyline points="140,204 152,203 160,188 168,160 176,190 186,203 216,204" fill="none" stroke="#dc2626" stroke-width="1.4"/>
    <text x="140" y="134" font-size="9.5" fill="#475569">scatter / chl-a</text>
    <text x="36" y="236" font-size="11">Not a detection problem:</text>
    <text x="36" y="252" font-size="11">the trigger does the</text>
    <text x="36" y="268" font-size="11">localising. Hard part is</text>
    <text x="36" y="284" font-size="11">fine-grained, long-tailed</text>
    <text x="36" y="300" font-size="11">classes + profile fusion.</text>
    <text x="36" y="322" font-size="10.5" fill="#4338ca" font-weight="700">~10⁴ ROIs / hour</text>

    <!-- 2 benchtop scanner -->
    <rect x="252" y="72" width="216" height="262" rx="8" fill="#fef3c7" stroke="#d97706"/>
    <text x="264" y="94" font-weight="700">② Benchtop scanner</text>
    <text x="264" y="110" font-size="10.5" fill="#475569">ZooScan · PlanktoScope · stereo</text>
    <rect x="268" y="120" width="184" height="96" rx="4" fill="#ffffff" stroke="#94a3b8"/>
    <g fill="#e2e8f0" stroke="#334155" stroke-width="1">
      <ellipse cx="292" cy="146" rx="10" ry="5"/><ellipse cx="303" cy="151" rx="9" ry="4.5" transform="rotate(30 303 151)"/>
      <ellipse cx="340" cy="140" rx="11" ry="5"/><ellipse cx="380" cy="160" rx="10" ry="5" transform="rotate(-20 380 160)"/>
      <ellipse cx="392" cy="166" rx="9" ry="4.5" transform="rotate(40 392 166)"/><ellipse cx="420" cy="138" rx="10" ry="5"/>
      <ellipse cx="300" cy="192" rx="10" ry="5"/><ellipse cx="350" cy="196" rx="11" ry="5" transform="rotate(15 350 196)"/>
      <ellipse cx="430" cy="196" rx="10" ry="5"/>
    </g>
    <g stroke="#334155" stroke-width="0.8">
      <line x1="282" y1="146" x2="272" y2="136"/><line x1="282" y1="146" x2="272" y2="154"/>
      <line x1="370" y1="164" x2="360" y2="176"/><line x1="410" y1="138" x2="400" y2="128"/>
    </g>
    <rect x="280" y="136" width="36" height="24" fill="none" stroke="#dc2626" stroke-width="1.2" stroke-dasharray="3 2"/>
    <rect x="366" y="148" width="40" height="28" fill="none" stroke="#dc2626" stroke-width="1.2" stroke-dasharray="3 2"/>
    <text x="276" y="210" font-size="10" fill="#b91c1c">touching pairs = 1 vignette</text>
    <text x="264" y="236" font-size="11">Dense instance problem:</text>
    <text x="264" y="252" font-size="11">1,000–2,000 vignettes</text>
    <text x="264" y="268" font-size="11">per scan, clumps hand-</text>
    <text x="264" y="284" font-size="11">split today. Declumping</text>
    <text x="264" y="300" font-size="11">+ masks give size spectra.</text>
    <text x="264" y="322" font-size="10.5" fill="#b45309" font-weight="700">preserved net sample</text>

    <!-- 3 in situ line scan -->
    <rect x="480" y="72" width="216" height="262" rx="8" fill="#dcfce7" stroke="#16a34a"/>
    <text x="492" y="94" font-weight="700">③ In situ imager</text>
    <text x="492" y="110" font-size="10.5" fill="#475569">ISIIS · UVP6 · Plankton Imager</text>
    <rect x="496" y="120" width="184" height="96" rx="4" fill="#0f172a" stroke="#94a3b8"/>
    <g fill="#94a3b8">
      <circle cx="510" cy="130" r="1.4"/><circle cx="524" cy="150" r="2"/><circle cx="540" cy="135" r="1.2"/><circle cx="556" cy="176" r="2.2"/>
      <circle cx="570" cy="140" r="1.5"/><circle cx="590" cy="200" r="1.8"/><circle cx="604" cy="128" r="1.3"/><circle cx="618" cy="168" r="2.4"/>
      <circle cx="636" cy="146" r="1.4"/><circle cx="650" cy="190" r="2"/><circle cx="664" cy="134" r="1.6"/><circle cx="672" cy="206" r="1.4"/>
      <circle cx="516" cy="196" r="1.6"/><circle cx="534" cy="208" r="1.2"/><circle cx="600" cy="156" r="1.1"/><circle cx="640" cy="210" r="1.5"/>
      <path d="M526 172 q6 -6 12 0 q4 6 -4 8 z"/><path d="M630 124 q8 -4 12 3 q-4 6 -10 2 z"/>
    </g>
    <g fill="none" stroke="#86efac" stroke-width="1.4">
      <path d="M574 182 q10 -16 22 -6 q-6 14 -22 6 z"/>
      <line x1="596" y1="176" x2="608" y2="168"/><line x1="596" y1="178" x2="610" y2="182"/>
    </g>
    <rect x="566" y="164" width="48" height="28" fill="none" stroke="#facc15" stroke-width="1.2"/>
    <text x="504" y="138" font-size="9.5" fill="#cbd5e1">marine snow ≫ organisms</text>
    <text x="492" y="236" font-size="11">Streaming segmentation:</text>
    <text x="492" y="252" font-size="11">thresholding keeps recall</text>
    <text x="492" y="268" font-size="11">but ~1% precision; a CNN</text>
    <text x="492" y="284" font-size="11">filter cuts segments 18×.</text>
    <text x="492" y="300" font-size="11">Floats classify on board.</text>
    <text x="492" y="322" font-size="10.5" fill="#15803d" font-weight="700">up to ~10⁷ objects / hour</text>

    <!-- 4 holography -->
    <rect x="708" y="72" width="228" height="262" rx="8" fill="#fce7f3" stroke="#db2777"/>
    <text x="720" y="94" font-weight="700">④ Digital holography</text>
    <text x="720" y="110" font-size="10.5" fill="#475569">in-line DIH, lensless volume</text>
    <rect x="724" y="120" width="196" height="96" rx="4" fill="#ffffff" stroke="#94a3b8"/>
    <g fill="none" stroke="#9d174d" stroke-width="0.9">
      <circle cx="770" cy="160" r="6"/><circle cx="770" cy="160" r="12"/><circle cx="770" cy="160" r="18" opacity="0.6"/><circle cx="770" cy="160" r="24" opacity="0.35"/>
      <circle cx="870" cy="180" r="5"/><circle cx="870" cy="180" r="10"/><circle cx="870" cy="180" r="15" opacity="0.6"/><circle cx="870" cy="180" r="20" opacity="0.35"/>
    </g>
    <rect x="854" y="164" width="32" height="32" fill="none" stroke="#2563eb" stroke-width="1.2" stroke-dasharray="3 2"/>
    <text x="730" y="210" font-size="10" fill="#475569">fringes, not silhouettes</text>
    <text x="720" y="236" font-size="11">Detect on raw hologram</text>
    <text x="720" y="252" font-size="11">(YOLO + SORT, ~40 fps),</text>
    <text x="720" y="268" font-size="11">reconstruct only the ROIs</text>
    <text x="720" y="284" font-size="11">that need a species label.</text>
    <text x="720" y="300" font-size="11">Depth-of-field is free.</text>
    <text x="720" y="322" font-size="10.5" fill="#be185d" font-weight="700">volume, not a plane</text>
  </g>

  <!-- arrows -->
  <g stroke="#64748b" stroke-width="1.6" fill="none" marker-end="url(#a)">
    <path d="M132 336 L132 360 L440 360 L440 376"/>
    <path d="M360 336 L360 376"/>
    <path d="M588 336 L588 360 L520 360 L520 376"/>
    <path d="M822 336 L822 360 L560 360 L560 376"/>
  </g>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#64748b"/></marker></defs>

  <g font-size="12">
    <rect x="212" y="378" width="536" height="40" rx="8" fill="#e2e8f0" stroke="#64748b"/>
    <text x="480" y="396" text-anchor="middle" fill="#1e293b" font-weight="700">Classifier: compact CNN or SSL backbone (MAE / DINO / diffusion features)</text>
    <text x="480" y="411" text-anchor="middle" fill="#475569" font-size="11">+ open-set "unknown" bin + image ⇄ scatter/fluorescence fusion</text>
    <path d="M480 418 L480 436" stroke="#64748b" stroke-width="1.6" marker-end="url(#a)"/>
    <rect x="212" y="438" width="536" height="44" rx="8" fill="#ffffff" stroke="#64748b"/>
    <text x="480" y="456" text-anchor="middle" fill="#1e293b" font-weight="700">Quantification: adjust counts for shift → individuals · taxon⁻¹ · m⁻³</text>
    <text x="480" y="472" text-anchor="middle" fill="#475569" font-size="11">→ HAB alert (Pseudo-nitzschia, Dinophysis) · size spectra · biogeochemical time series</text>
  </g>
</svg>
