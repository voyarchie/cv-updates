<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" role="img" aria-label="Topic map of the six X-ray transmission-imaging dense-detection threads">
  <title>X-ray transmission imaging — six dense-detection &amp; classification threads</title>
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#94a3b8"/>
    </marker>
  </defs>
  <!-- edges -->
  <g stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#ah)">
    <line x1="450" y1="270" x2="205" y2="130"/>
    <line x1="450" y1="270" x2="450" y2="105"/>
    <line x1="450" y1="270" x2="695" y2="130"/>
    <line x1="450" y1="270" x2="205" y2="410"/>
    <line x1="450" y1="270" x2="450" y2="435"/>
    <line x1="450" y1="270" x2="695" y2="410"/>
  </g>
  <!-- hub -->
  <g>
    <rect x="345" y="230" width="210" height="80" rx="12" fill="#1e293b" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="450" y="260" text-anchor="middle" fill="#f8fafc" font-size="15" font-weight="700">X-ray transmission</text>
    <text x="450" y="282" text-anchor="middle" fill="#cbd5e1" font-size="12.5">dense detection +</text>
    <text x="450" y="299" text-anchor="middle" fill="#cbd5e1" font-size="12.5">classification</text>
  </g>
  <!-- nodes -->
  <g font-size="12" fill="#f8fafc">
    <!-- 1 primitive -->
    <rect x="60" y="80" width="290" height="70" rx="10" fill="#4f46e5" stroke="#3730a3"/>
    <text x="75" y="104" font-size="12.5" font-weight="700">1 · The primitive</text>
    <text x="75" y="122" font-size="11.5" fill="#e0e7ff">superposition not occlusion · dual-energy</text>
    <text x="75" y="138" font-size="11.5" fill="#e0e7ff">material colour · recall@fixed-FPR, not mAP</text>
    <!-- 2 anti-overlap detection -->
    <rect x="305" y="55" width="290" height="70" rx="10" fill="#4f46e5" stroke="#3730a3"/>
    <text x="320" y="79" font-size="12.5" font-weight="700">2 · Anti-overlap detection</text>
    <text x="320" y="97" font-size="11.5" fill="#e0e7ff">DOAM · AO-DETR · MMCL · FOAM</text>
    <text x="320" y="113" font-size="11.5" fill="#e0e7ff">label-aware / frequency / query design</text>
    <!-- 3 material & multi-view -->
    <rect x="610" y="80" width="270" height="70" rx="10" fill="#c026d3" stroke="#a21caf"/>
    <text x="625" y="104" font-size="12.5" font-weight="700">3 · Material &amp; multi-view</text>
    <text x="625" y="122" font-size="11.5" fill="#fae8ff">dual-energy discrimination · colourize</text>
    <text x="625" y="138" font-size="11.5" fill="#fae8ff">dual-view LDXray/Dualray/GSXray</text>
    <!-- 4 datasets & benchmarks -->
    <rect x="60" y="390" width="290" height="70" rx="10" fill="#d97706" stroke="#b45309"/>
    <text x="75" y="414" font-size="12.5" font-weight="700">4 · Datasets &amp; benchmarks</text>
    <text x="75" y="432" font-size="11.5" fill="#fff7ed">SIXray/OPIXray/PIDray/PIXray/CLCXray</text>
    <text x="75" y="448" font-size="11.5" fill="#fff7ed">HiXray · 114Xray · XSeg (masks)</text>
    <!-- 5 open-set & VLM -->
    <rect x="305" y="415" width="290" height="70" rx="10" fill="#059669" stroke="#047857"/>
    <text x="320" y="439" font-size="12.5" font-weight="700">5 · Open-set &amp; VLM</text>
    <text x="320" y="457" font-size="11.5" fill="#d1fae5">OVXD open-vocab · unsup. anomaly</text>
    <text x="320" y="473" font-size="11.5" fill="#d1fae5">STING-BEE · OneFocus assistants</text>
    <!-- 6 synthetic, 3D CT, industrial -->
    <rect x="610" y="390" width="270" height="70" rx="10" fill="#1e293b" stroke="#94a3b8"/>
    <text x="625" y="414" font-size="12.5" font-weight="700" fill="#f8fafc">6 · Synthetic · 3D CT · NDT</text>
    <text x="625" y="432" font-size="11.5" fill="#cbd5e1">TIP/GAN/diffusion (Xsyn) · volumetric CT</text>
    <text x="625" y="448" font-size="11.5" fill="#cbd5e1">castings · welds · batteries · AM porosity</text>
  </g>
</svg>
