<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" role="img" aria-label="A weather-radar volume shown as a dense detection-and-classification scene. A single radar station spins its beam through 360 degrees and steps up in elevation, sampling a cone of the atmosphere. Every range-azimuth-elevation bin carries not one number but a stack of co-registered moments: reflectivity Z, radial velocity V, spectrum width, and the dual-polarization variables differential reflectivity ZDR, specific differential phase KDP, and correlation coefficient rho-hv. Stacked, these form a multi-channel image on a polar grid. In that image a supercell draws a hook echo, a mesocyclone shows a tight couplet of inbound and outbound velocity, hail lowers rho-hv, and a bright band marks the melting layer. The computer-vision jobs are: dense per-pixel classification of what each echo is, detection of storm-scale objects, and dense prediction of the next frames.">
  <title>A weather-radar volume is a multi-channel polar image full of objects to find, label, and forecast</title>
  <rect x="0" y="0" width="960" height="500" rx="10" fill="#f4f6fb" stroke="#cbd5e1" stroke-width="1"/>
  <text x="24" y="32" fill="#334155" font-size="17" font-weight="800">A radar scan = one spinning beam &#8594; a stack of co-registered moment fields &#8594; a dense scene of storms</text>

  <!-- ============ Panel 1: beam sweeps a volume ============ -->
  <g>
    <rect x="24" y="52" width="292" height="416" rx="8" fill="#0b1220" stroke="#334155" stroke-width="2"/>
    <text x="38" y="74" fill="#94a3b8" font-size="11.5">1 &#183; one station scans a cone of air</text>

    <!-- radar site -->
    <circle cx="80" cy="300" r="6" fill="#38bdf8"/>
    <text x="52" y="326" fill="#7dd3fc" font-size="10">WSR-88D / C-band site</text>

    <!-- sweeping beams (azimuth fan) -->
    <g stroke="#334155" stroke-width="1">
      <line x1="80" y1="300" x2="290" y2="150"/>
      <line x1="80" y1="300" x2="290" y2="200"/>
      <line x1="80" y1="300" x2="290" y2="250"/>
      <line x1="80" y1="300" x2="290" y2="300"/>
    </g>
    <!-- elevation tilts -->
    <path d="M80 300 L280 250 A210 210 0 0 0 285 205" fill="none" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="3 3"/>
    <text x="150" y="176" fill="#fbbf24" font-size="9.5">elevation tilts (VCP)</text>
    <text x="150" y="292" fill="#64748b" font-size="9.5">360&#176; azimuth sweep</text>

    <!-- range rings -->
    <g fill="none" stroke="#1e293b" stroke-width="1">
      <circle cx="80" cy="300" r="70"/><circle cx="80" cy="300" r="130"/><circle cx="80" cy="300" r="190"/>
    </g>

    <!-- a storm cell blob out in range -->
    <ellipse cx="210" cy="235" rx="26" ry="18" fill="#ef4444" opacity="0.85"/>
    <ellipse cx="210" cy="235" rx="14" ry="10" fill="#fde047" opacity="0.9"/>
    <text x="168" y="212" fill="#fca5a5" font-size="9.5">convective cell</text>

    <text x="38" y="360" fill="#cbd5e1" font-size="10.5">each (range, azimuth, elevation)</text>
    <text x="38" y="376" fill="#cbd5e1" font-size="10.5">bin returns a pulse-pair estimate</text>
    <text x="38" y="400" fill="#94a3b8" font-size="10.5">~250 m gates, ~0.5&#176; rays,</text>
    <text x="38" y="416" fill="#94a3b8" font-size="10.5">volume every ~5 min</text>
    <text x="38" y="444" fill="#7dd3fc" font-size="10.5" font-weight="700">the sky is the scene &#8212; the beam paints it</text>
  </g>

  <!-- ============ Panel 2: the moment stack ============ -->
  <g>
    <rect x="332" y="52" width="300" height="416" rx="8" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1.5"/>
    <text x="346" y="74" fill="#3730a3" font-size="11.5" font-weight="700">2 &#183; every bin is a multi-channel pixel</text>

    <!-- stacked channel cards -->
    <g>
      <rect x="352" y="88" width="260" height="40" rx="5" fill="#0b1220"/>
      <text x="364" y="105" fill="#f8fafc" font-size="11" font-weight="700">Z &#183; reflectivity</text>
      <text x="364" y="120" fill="#94a3b8" font-size="9.5">how much / how big the scatterers are (dBZ)</text>

      <rect x="352" y="134" width="260" height="40" rx="5" fill="#0b1220"/>
      <text x="364" y="151" fill="#f8fafc" font-size="11" font-weight="700">V &#183; radial velocity</text>
      <text x="364" y="166" fill="#94a3b8" font-size="9.5">Doppler shift &#8594; rotation, convergence, shear</text>

      <rect x="352" y="180" width="260" height="34" rx="5" fill="#0b1220"/>
      <text x="364" y="196" fill="#f8fafc" font-size="11" font-weight="700">&#963;&#7515; &#183; spectrum width</text>
      <text x="364" y="209" fill="#94a3b8" font-size="9.5">turbulence / velocity spread</text>

      <rect x="352" y="220" width="260" height="34" rx="5" fill="#1e1b4b"/>
      <text x="364" y="236" fill="#f8fafc" font-size="11" font-weight="700">Z&#7503;&#7523; &#183; differential reflectivity</text>
      <text x="364" y="249" fill="#c4b5fd" font-size="9.5">oblateness &#8594; drop shape/size</text>

      <rect x="352" y="260" width="260" height="34" rx="5" fill="#1e1b4b"/>
      <text x="364" y="276" fill="#f8fafc" font-size="11" font-weight="700">K&#7504;&#7527; &#183; specific differential phase</text>
      <text x="364" y="289" fill="#c4b5fd" font-size="9.5">liquid-water content, attenuation-robust</text>

      <rect x="352" y="300" width="260" height="34" rx="5" fill="#1e1b4b"/>
      <text x="364" y="316" fill="#f8fafc" font-size="11" font-weight="700">&#961;&#7511;&#7515; &#183; correlation coefficient</text>
      <text x="364" y="329" fill="#c4b5fd" font-size="9.5">uniformity &#8594; hail, debris, non-met echo</text>
    </g>
    <text x="352" y="356" fill="#4338ca" font-size="9.5" font-weight="700">purple = dual-polarization channels</text>

    <text x="352" y="386" fill="#3730a3" font-size="10.5">Stacked &#8594; a 6-channel image on a</text>
    <text x="352" y="402" fill="#3730a3" font-size="10.5">polar grid. The class of an echo is</text>
    <text x="352" y="418" fill="#3730a3" font-size="10.5">written jointly across the channels,</text>
    <text x="352" y="434" fill="#3730a3" font-size="10.5">not in any one of them.</text>
    <text x="352" y="456" fill="#4338ca" font-size="10.5" font-weight="700">rain, hail, birds &amp; ground look alike in Z alone</text>
  </g>

  <!-- ============ Panel 3: the three CV jobs ============ -->
  <g>
    <rect x="648" y="52" width="288" height="416" rx="8" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1.5"/>
    <text x="662" y="74" fill="#065f46" font-size="11.5" font-weight="700">3 &#183; three dense-vision jobs</text>

    <!-- job A: dense classification -->
    <rect x="662" y="88" width="260" height="96" rx="6" fill="#ffffff" stroke="#6ee7b7"/>
    <text x="674" y="108" fill="#047857" font-size="11" font-weight="800">A &#183; per-pixel classification</text>
    <text x="674" y="126" fill="#334155" font-size="9.5">label every bin: rain / snow / hail /</text>
    <text x="674" y="140" fill="#334155" font-size="9.5">melting / clutter / biology / chaff</text>
    <!-- mini classified grid -->
    <g>
      <rect x="800" y="118" width="12" height="12" fill="#38bdf8"/><rect x="812" y="118" width="12" height="12" fill="#38bdf8"/>
      <rect x="824" y="118" width="12" height="12" fill="#f59e0b"/><rect x="836" y="118" width="12" height="12" fill="#ef4444"/>
      <rect x="800" y="130" width="12" height="12" fill="#38bdf8"/><rect x="812" y="130" width="12" height="12" fill="#f59e0b"/>
      <rect x="824" y="130" width="12" height="12" fill="#ef4444"/><rect x="836" y="130" width="12" height="12" fill="#a3a3a3"/>
    </g>
    <text x="674" y="160" fill="#64748b" font-size="9">hydrometeor ID &#183; echo/clutter QC &#183; QPE</text>
    <text x="674" y="175" fill="#64748b" font-size="9">semantic segmentation of the sky</text>

    <!-- job B: object detection -->
    <rect x="662" y="192" width="260" height="112" rx="6" fill="#ffffff" stroke="#6ee7b7"/>
    <text x="674" y="212" fill="#047857" font-size="11" font-weight="800">B &#183; storm-object detection</text>
    <!-- hook echo sketch with box -->
    <path d="M710 250 a26 26 0 1 0 6 -18" fill="none" stroke="#ef4444" stroke-width="6" stroke-linecap="round"/>
    <rect x="686" y="226" width="66" height="60" fill="none" stroke="#10b981" stroke-width="2" stroke-dasharray="4 3"/>
    <!-- velocity couplet -->
    <circle cx="790" cy="250" r="12" fill="#22c55e" opacity="0.7"/><circle cx="812" cy="250" r="12" fill="#ef4444" opacity="0.7"/>
    <text x="770" y="282" fill="#334155" font-size="9">rotation couplet</text>
    <text x="674" y="300" fill="#64748b" font-size="9">tornado &#183; mesocyclone &#183; hail core &#183; MCS &#183; cell track</text>

    <!-- job C: dense prediction -->
    <rect x="662" y="312" width="260" height="140" rx="6" fill="#ffffff" stroke="#6ee7b7"/>
    <text x="674" y="332" fill="#047857" font-size="11" font-weight="800">C &#183; dense prediction (nowcast)</text>
    <text x="674" y="350" fill="#334155" font-size="9.5">observed frames &#8594; next 0&#8211;3 h of frames</text>
    <!-- frame strip -->
    <g>
      <rect x="674" y="360" width="34" height="30" rx="3" fill="#1e293b"/><ellipse cx="691" cy="375" rx="8" ry="6" fill="#ef4444"/>
      <rect x="712" y="360" width="34" height="30" rx="3" fill="#1e293b"/><ellipse cx="731" cy="375" rx="9" ry="6" fill="#ef4444"/>
      <text x="750" y="379" fill="#334155" font-size="14">&#8594;</text>
      <rect x="766" y="360" width="34" height="30" rx="3" fill="#0b1220" stroke="#10b981" stroke-dasharray="3 2"/><ellipse cx="785" cy="375" rx="10" ry="7" fill="#f59e0b"/>
      <rect x="804" y="360" width="34" height="30" rx="3" fill="#0b1220" stroke="#10b981" stroke-dasharray="3 2"/><ellipse cx="825" cy="375" rx="11" ry="7" fill="#f59e0b"/>
    </g>
    <text x="674" y="410" fill="#64748b" font-size="9">observed &#8594;&#8594; forecast (generative video)</text>
    <text x="674" y="428" fill="#334155" font-size="9.5">the hard part: keep it sharp, calibrated,</text>
    <text x="674" y="442" fill="#334155" font-size="9.5">and physically plausible at long lead time</text>
  </g>
</svg>
