<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 430" role="img" aria-label="Topic map for event-camera / neuromorphic dense detection and classification">
  <title>Topic map — event-camera / neuromorphic dense vision (2025–26)</title>
  <desc>A central node, the asynchronous event stream, radiates to six threads covered in this pass: dense-frame backbones (RVT, SSM-ViT, GET); linear-time and fully-sparse backbones (SMamba, SparseVoxelDet, sparse linear attention); spiking-native detectors (EMS-YOLO, SpikeYOLO, SpikeDet); asynchronous and graph-based event-by-event processing (AEGNN, HUGNet v2, Spiking Patches); RGB-event fusion (MCFNet, FlexEvent, HDI-Former); and beyond-boxes tasks and benchmarks (segmentation, action recognition, Gen1 / 1Mpx / eTram / EvDET200K).</desc>
  <style>
    .hub  { fill: rgba(59,130,246,0.20); stroke: currentColor; stroke-width: 1.5; }
    .node { stroke: currentColor; stroke-width: 1.2; }
    .a    { fill: rgba(16,185,129,0.16); }
    .b    { fill: rgba(245,158,11,0.16); }
    .c    { fill: rgba(168,85,247,0.16); }
    .lbl  { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 13px; font-weight: 600; fill: currentColor; }
    .sub  { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 10.5px; fill: currentColor; opacity: 0.78; }
    .hubt { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 14px; font-weight: 700; fill: currentColor; }
    .edge { fill: none; stroke: currentColor; stroke-width: 1.3; opacity: 0.55; }
  </style>

  <!-- edges -->
  <line class="edge" x1="490" y1="215" x2="200" y2="80"/>
  <line class="edge" x1="490" y1="215" x2="780" y2="80"/>
  <line class="edge" x1="490" y1="215" x2="120" y2="215"/>
  <line class="edge" x1="490" y1="215" x2="860" y2="215"/>
  <line class="edge" x1="490" y1="215" x2="200" y2="350"/>
  <line class="edge" x1="490" y1="215" x2="780" y2="350"/>

  <!-- hub -->
  <ellipse class="hub" cx="490" cy="215" rx="118" ry="52"/>
  <text class="hubt" x="490" y="208" text-anchor="middle">Asynchronous</text>
  <text class="hubt" x="490" y="227" text-anchor="middle">event stream</text>
  <text class="sub"  x="490" y="246" text-anchor="middle">µs latency · HDR · sparse</text>

  <!-- 1 dense-frame -->
  <g>
    <rect class="node a" x="60" y="36" width="280" height="78" rx="10"/>
    <text class="lbl" x="200" y="62" text-anchor="middle">1 · Dense-frame backbones</text>
    <text class="sub" x="200" y="82" text-anchor="middle">events → voxel grid → RVT · SSM-ViT</text>
    <text class="sub" x="200" y="99" text-anchor="middle">GET · PMRVT — borrow image nets</text>
  </g>

  <!-- 2 linear/sparse -->
  <g>
    <rect class="node a" x="640" y="36" width="280" height="78" rx="10"/>
    <text class="lbl" x="780" y="62" text-anchor="middle">2 · Linear-time &amp; fully-sparse</text>
    <text class="sub" x="780" y="82" text-anchor="middle">SMamba · SparseVoxelDet</text>
    <text class="sub" x="780" y="99" text-anchor="middle">sparse linear attention · CSSL</text>
  </g>

  <!-- 3 spiking -->
  <g>
    <rect class="node b" x="20" y="176" width="220" height="78" rx="10"/>
    <text class="lbl" x="130" y="202" text-anchor="middle">3 · Spiking-native</text>
    <text class="sub" x="130" y="222" text-anchor="middle">EMS-YOLO · SpikeYOLO</text>
    <text class="sub" x="130" y="239" text-anchor="middle">SpikeDet — neuromorphic HW</text>
  </g>

  <!-- 4 async/graph -->
  <g>
    <rect class="node b" x="740" y="176" width="220" height="78" rx="10"/>
    <text class="lbl" x="850" y="202" text-anchor="middle">4 · Async / graph</text>
    <text class="sub" x="850" y="222" text-anchor="middle">AEGNN · HUGNet v2</text>
    <text class="sub" x="850" y="239" text-anchor="middle">Spiking Patches — event-by-event</text>
  </g>

  <!-- 5 fusion -->
  <g>
    <rect class="node c" x="60" y="316" width="280" height="78" rx="10"/>
    <text class="lbl" x="200" y="342" text-anchor="middle">5 · RGB–Event fusion</text>
    <text class="sub" x="200" y="362" text-anchor="middle">MCFNet · FlexEvent · HDI-Former</text>
    <text class="sub" x="200" y="379" text-anchor="middle">survives night · HDR · blur</text>
  </g>

  <!-- 6 beyond boxes -->
  <g>
    <rect class="node c" x="640" y="316" width="280" height="78" rx="10"/>
    <text class="lbl" x="780" y="342" text-anchor="middle">6 · Beyond boxes &amp; benchmarks</text>
    <text class="sub" x="780" y="362" text-anchor="middle">segmentation · action recognition</text>
    <text class="sub" x="780" y="379" text-anchor="middle">Gen1 · 1Mpx · eTram · EvDET200K</text>
  </g>
</svg>
