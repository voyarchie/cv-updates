<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 400" role="img" aria-label="Radar signal-processing pipeline and where detector families tap in">
  <title>Radar processing pipeline — where detectors tap in</title>
  <desc>A left-to-right radar signal chain: RF front-end and raw ADC samples, then range-Doppler-angle FFT producing a dense radar tensor, then CFAR detection and direction-of-arrival estimation producing a sparse point cloud with per-point Doppler velocity and RCS, then clustering into a BEV grid. Two detector families tap the chain at different stages: tensor detectors (FFT-RadNet, RODNet, ADCNet) operate on the dense tensor and keep all reflected energy but are heavy; point and pillar detectors (RadarPillars, SMURF, RadarNeXt) operate on the CFAR point cloud and are cheap but inherit whatever CFAR thresholding discarded. The choice of where to tap is the accuracy-versus-compute knob unique to radar.</desc>
  <style>
    .stage  { stroke: currentColor; stroke-width: 1.3; fill: rgba(6,182,212,0.14); }
    .det    { stroke: currentColor; stroke-width: 1.3; }
    .detA   { fill: rgba(59,130,246,0.16); }
    .detB   { fill: rgba(16,185,129,0.16); }
    .flow   { fill: none; stroke: currentColor; stroke-width: 1.6; marker-end: url(#ah); }
    .tap    { fill: none; stroke: currentColor; stroke-width: 1.2; stroke-dasharray: 4 3; opacity: 0.75; marker-end: url(#ah); }
    .lbl    { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 12.5px; fill: currentColor; }
    .sub    { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 10px; fill: currentColor; opacity: 0.72; }
    .cap    { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 11px; font-style: italic; fill: currentColor; opacity: 0.8; }
    .hd     { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 12px; font-weight: 600; fill: currentColor; }
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor"/>
    </marker>
  </defs>

  <!-- pipeline stages -->
  <g>
    <rect class="stage" x="20"  y="150" width="170" height="60" rx="9"/>
    <text class="lbl" x="105" y="176" text-anchor="middle">RF front-end</text>
    <text class="sub" x="105" y="193" text-anchor="middle">raw ADC samples</text>
  </g>
  <g>
    <rect class="stage" x="255" y="150" width="180" height="60" rx="9"/>
    <text class="lbl" x="345" y="176" text-anchor="middle">Range–Doppler–angle FFT</text>
    <text class="sub" x="345" y="193" text-anchor="middle">dense radar tensor (RAD)</text>
  </g>
  <g>
    <rect class="stage" x="500" y="150" width="185" height="60" rx="9"/>
    <text class="lbl" x="592" y="172" text-anchor="middle">CFAR + DoA</text>
    <text class="sub" x="592" y="189" text-anchor="middle">sparse point cloud</text>
    <text class="sub" x="592" y="202" text-anchor="middle">(x,y,z, v_r, RCS)</text>
  </g>
  <g>
    <rect class="stage" x="750" y="150" width="170" height="60" rx="9"/>
    <text class="lbl" x="835" y="176" text-anchor="middle">Cluster / BEV grid</text>
    <text class="sub" x="835" y="193" text-anchor="middle">boxes + velocity</text>
  </g>

  <!-- flow arrows -->
  <line class="flow" x1="190" y1="180" x2="252" y2="180"/>
  <line class="flow" x1="435" y1="180" x2="497" y2="180"/>
  <line class="flow" x1="685" y1="180" x2="747" y2="180"/>

  <!-- tensor detector tap (up) -->
  <line class="tap" x1="345" y1="150" x2="345" y2="88"/>
  <g>
    <rect class="det detA" x="215" y="30" width="260" height="58" rx="9"/>
    <text class="hd"  x="345" y="52" text-anchor="middle">Tensor detectors</text>
    <text class="sub" x="345" y="70" text-anchor="middle">FFT-RadNet · RODNet · ADCNet</text>
    <text class="sub" x="345" y="82" text-anchor="middle">keeps all energy · heavy</text>
  </g>

  <!-- point detector tap (down) -->
  <line class="tap" x1="592" y1="210" x2="592" y2="278"/>
  <g>
    <rect class="det detB" x="462" y="278" width="262" height="58" rx="9"/>
    <text class="hd"  x="593" y="300" text-anchor="middle">Point / pillar detectors</text>
    <text class="sub" x="593" y="318" text-anchor="middle">RadarPillars · SMURF · RadarNeXt</text>
    <text class="sub" x="593" y="330" text-anchor="middle">sparse · cheap · inherits CFAR loss</text>
  </g>

  <!-- caption -->
  <text class="cap" x="20" y="368">Where you tap the chain is radar's accuracy-vs-compute knob: CFAR discards weak / occluded targets before the point cloud ever forms.</text>
</svg>
