<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 620" role="img" aria-label="Topic map for the 2026-Jul-04 CV update">
  <title>Topic map — 2026-Jul-04 CV update</title>
  <desc>A radial topic map of six threads in the automotive imaging-radar dense 3D detection stack: why radar is its own primitive and representation choices, radar-only 3D detection, radar-camera fusion, radar-LiDAR fusion and adverse-weather robustness, tasks beyond bounding boxes (occupancy, scene flow, moving-object segmentation, self-supervised, generative), and datasets and benchmarks.</desc>
  <style>
    .hub    { fill: none; stroke: currentColor; stroke-width: 1.7; }
    .spoke  { fill: none; stroke: currentColor; stroke-width: 1.1; opacity: 0.5; }
    .node   { stroke: currentColor; stroke-width: 1.3; }
    .prim   { fill: rgba(6,182,212,0.18); }
    .fuse   { fill: rgba(16,185,129,0.16); }
    .task   { fill: rgba(168,85,247,0.16); }
    .data   { fill: rgba(245,158,11,0.18); }
    .lbl    { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 13px; fill: currentColor; }
    .sub    { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 10.5px; fill: currentColor; opacity: 0.72; }
    .hublbl { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 13px; font-weight: 600; fill: currentColor; }
    .keylbl { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 11px; font-weight: 600; fill: currentColor; letter-spacing: 0.03em; }
    .swatch { stroke: currentColor; stroke-width: 1; }
  </style>

  <!-- spokes -->
  <line class="spoke" x1="480" y1="300" x2="480" y2="96"/>
  <line class="spoke" x1="480" y1="300" x2="768" y2="156"/>
  <line class="spoke" x1="480" y1="300" x2="768" y2="400"/>
  <line class="spoke" x1="480" y1="300" x2="480" y2="468"/>
  <line class="spoke" x1="480" y1="300" x2="192" y2="400"/>
  <line class="spoke" x1="480" y1="300" x2="192" y2="156"/>

  <!-- hub -->
  <circle class="hub" cx="480" cy="300" r="64"/>
  <text class="hublbl" x="480" y="288" text-anchor="middle">Imaging radar</text>
  <text class="hublbl" x="480" y="304" text-anchor="middle">dense 3D detection</text>
  <text class="hublbl" x="480" y="320" text-anchor="middle">+ classification</text>

  <!-- nodes -->
  <g>
    <rect class="node prim" x="356" y="42" width="248" height="58" rx="10"/>
    <text class="lbl" x="480" y="66" text-anchor="middle">1 · The primitive &amp; representation</text>
    <text class="sub" x="480" y="84" text-anchor="middle">sparse · Doppler · RCS · 3D→4D · point vs tensor</text>
  </g>
  <g>
    <rect class="node prim" x="644" y="128" width="256" height="58" rx="10"/>
    <text class="lbl" x="772" y="152" text-anchor="middle">2 · Radar-only 3D detection</text>
    <text class="sub" x="772" y="170" text-anchor="middle">pillars · LiDAR-KD · transformers · tensors</text>
  </g>
  <g>
    <rect class="node data" x="644" y="372" width="256" height="58" rx="10"/>
    <text class="lbl" x="772" y="396" text-anchor="middle">6 · Datasets &amp; benchmarks</text>
    <text class="sub" x="772" y="414" text-anchor="middle">VoD · TJ4DRadSet · K-Radar · Dual-Radar</text>
  </g>
  <g>
    <rect class="node fuse" x="356" y="440" width="248" height="58" rx="10"/>
    <text class="lbl" x="480" y="464" text-anchor="middle">4 · Radar–LiDAR &amp; all-weather</text>
    <text class="sub" x="480" y="482" text-anchor="middle">L4DR · Bi-LRFusion · fog/rain/snow backstop</text>
  </g>
  <g>
    <rect class="node task" x="60" y="372" width="264" height="58" rx="10"/>
    <text class="lbl" x="192" y="396" text-anchor="middle">5 · Beyond boxes</text>
    <text class="sub" x="192" y="414" text-anchor="middle">occupancy · scene flow · MOS · self-sup · gen</text>
  </g>
  <g>
    <rect class="node fuse" x="60" y="128" width="264" height="58" rx="10"/>
    <text class="lbl" x="192" y="152" text-anchor="middle">3 · Radar–camera fusion</text>
    <text class="sub" x="192" y="170" text-anchor="middle">CRN · RCBEVDet · LXL · cheap robust 3D</text>
  </g>

  <!-- legend -->
  <g>
    <rect class="swatch prim"  x="60"  y="560" width="14" height="14" rx="3"/>
    <text class="keylbl" x="80"  y="572">primitive / radar-only</text>
    <rect class="swatch fuse"  x="250" y="560" width="14" height="14" rx="3"/>
    <text class="keylbl" x="270" y="572">fusion</text>
    <rect class="swatch task" x="410" y="560" width="14" height="14" rx="3"/>
    <text class="keylbl" x="430" y="572">tasks beyond boxes</text>
    <rect class="swatch data"  x="640" y="560" width="14" height="14" rx="3"/>
    <text class="keylbl" x="660" y="572">datasets / benchmarks</text>
  </g>
</svg>
