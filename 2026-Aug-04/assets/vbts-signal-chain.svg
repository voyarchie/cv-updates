<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" role="img" aria-label="The vision-based tactile signal chain: contact deforms a lit elastomer photographed by an internal camera, producing a gel image that is decoded into dense height, force, and contact outputs">
  <title>The vision-based tactile signal chain — from contact to dense per-pixel outputs</title>
  <defs>
    <marker id="a2" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#94a3b8"/>
    </marker>
  </defs>

  <!-- edges -->
  <g stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#a2)">
    <line x1="196" y1="235" x2="248" y2="235"/>
    <line x1="470" y1="235" x2="522" y2="235"/>
    <line x1="690" y1="235" x2="742" y2="110"/>
    <line x1="690" y1="235" x2="742" y2="235"/>
    <line x1="690" y1="235" x2="742" y2="360"/>
  </g>

  <!-- 1 contact -->
  <g>
    <rect x="24" y="188" width="172" height="94" rx="10" fill="#1e293b" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="110" y="216" text-anchor="middle" fill="#f8fafc" font-size="13" font-weight="700">Contact</text>
    <text x="110" y="238" text-anchor="middle" fill="#cbd5e1" font-size="11">an object presses</text>
    <text x="110" y="254" text-anchor="middle" fill="#cbd5e1" font-size="11">into the soft gel</text>
    <text x="110" y="272" text-anchor="middle" fill="#cbd5e1" font-size="11">and leaves an imprint</text>
  </g>

  <!-- 2 sensor -->
  <g>
    <rect x="248" y="150" width="222" height="170" rx="12" fill="#4f46e5" stroke="#3730a3"/>
    <text x="359" y="178" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">The sensor</text>
    <text x="359" y="199" text-anchor="middle" fill="#e0e7ff" font-size="11">reflective elastomer skin</text>
    <text x="359" y="215" text-anchor="middle" fill="#e0e7ff" font-size="11">+ tri-colour LED illumination</text>
    <text x="359" y="231" text-anchor="middle" fill="#e0e7ff" font-size="11">+ an internal camera</text>
    <!-- tiny schematic: gel with a dent -->
    <path d="M270 268 Q300 268 320 284 Q340 300 360 284 Q380 268 448 268" fill="none" stroke="#c7d2fe" stroke-width="2.5"/>
    <line x1="270" y1="298" x2="448" y2="298" stroke="#c7d2fe" stroke-width="2"/>
    <text x="359" y="316" text-anchor="middle" fill="#c7d2fe" font-size="10.5">camera sees the skin, never the object</text>
  </g>

  <!-- 3 raw image -->
  <g>
    <rect x="522" y="188" width="168" height="94" rx="10" fill="#0f766e" stroke="#115e59"/>
    <text x="606" y="216" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">Gel image</text>
    <text x="606" y="238" text-anchor="middle" fill="#ccfbf1" font-size="11">a dense RGB frame</text>
    <text x="606" y="254" text-anchor="middle" fill="#ccfbf1" font-size="11">shading + marker field</text>
    <text x="606" y="271" text-anchor="middle" fill="#ccfbf1" font-size="11">encode the deformation</text>
  </g>

  <!-- 4 outputs -->
  <g>
    <rect x="742" y="64" width="196" height="92" rx="10" fill="#be123c" stroke="#9f1239"/>
    <text x="757" y="90" fill="#ffffff" font-size="12.5" font-weight="700">Geometry</text>
    <text x="757" y="110" fill="#ffe4e6" font-size="11">height &amp; surface-normal maps</text>
    <text x="757" y="127" fill="#ffe4e6" font-size="11">via photometric stereo</text>
    <text x="757" y="144" fill="#ffe4e6" font-size="11">dense per-pixel regression</text>

    <rect x="742" y="189" width="196" height="92" rx="10" fill="#b45309" stroke="#92400e"/>
    <text x="757" y="215" fill="#ffffff" font-size="12.5" font-weight="700">Force / shear</text>
    <text x="757" y="235" fill="#fde68a" font-size="11">marker displacement flow</text>
    <text x="757" y="252" fill="#fde68a" font-size="11">&#8594; normal + shear traction</text>
    <text x="757" y="269" fill="#fde68a" font-size="11">a dense vector field</text>

    <rect x="742" y="314" width="196" height="92" rx="10" fill="#0891b2" stroke="#0e7490"/>
    <text x="757" y="340" fill="#ffffff" font-size="12.5" font-weight="700">Contact / slip</text>
    <text x="757" y="360" fill="#cffafe" font-size="11">contact-region mask</text>
    <text x="757" y="377" fill="#cffafe" font-size="11">incipient-slip &amp; event flags</text>
    <text x="757" y="394" fill="#cffafe" font-size="11">dense segment + classify</text>
  </g>

  <!-- caption -->
  <text x="480" y="440" text-anchor="middle" fill="#94a3b8" font-size="12">Touch is a contact-geometry sensor read out as an image: no appearance, no distance &#8212; only the imprint pressed into the gel.</text>
</svg>
