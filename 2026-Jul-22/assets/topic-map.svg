<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" role="img" aria-label="Topic map of the six SAR dense-detection and classification threads">
  <title>Synthetic aperture radar — six dense-detection &amp; classification threads</title>
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#94a3b8"/>
    </marker>
  </defs>
  <!-- edges -->
  <g stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#ah)">
    <line x1="450" y1="300" x2="205" y2="150"/>
    <line x1="450" y1="300" x2="450" y2="128"/>
    <line x1="450" y1="300" x2="695" y2="150"/>
    <line x1="450" y1="300" x2="205" y2="465"/>
    <line x1="450" y1="300" x2="450" y2="488"/>
    <line x1="450" y1="300" x2="695" y2="465"/>
  </g>
  <!-- hub -->
  <g>
    <rect x="326" y="256" width="248" height="88" rx="12" fill="#1e293b" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="450" y="286" text-anchor="middle" fill="#f8fafc" font-size="15" font-weight="700">The coherent microwave image</text>
    <text x="450" y="308" text-anchor="middle" fill="#cbd5e1" font-size="12.5">complex-valued · speckled · geometry-warped</text>
    <text x="450" y="326" text-anchor="middle" fill="#cbd5e1" font-size="12.5">all-weather, day-night, own its terms</text>
  </g>
  <!-- nodes -->
  <g font-size="12" fill="#f8fafc">
    <!-- 1 primitive -->
    <rect x="55" y="92" width="300" height="86" rx="10" fill="#4f46e5" stroke="#3730a3"/>
    <text x="70" y="116" font-size="12.5" font-weight="700">1 · The primitive</text>
    <text x="70" y="134" font-size="11.5" fill="#e0e7ff">backscatter, not appearance · speckle</text>
    <text x="70" y="150" font-size="11.5" fill="#e0e7ff">layover / foreshortening / shadow</text>
    <text x="70" y="166" font-size="11.5" fill="#e0e7ff">amplitude + phase · few labels</text>
    <!-- 2 oriented detection -->
    <rect x="300" y="60" width="300" height="86" rx="10" fill="#4f46e5" stroke="#3730a3"/>
    <text x="315" y="84" font-size="12.5" font-weight="700">2 · Oriented ship / aircraft detection</text>
    <text x="315" y="102" font-size="11.5" fill="#e0e7ff">OBB · angle-boundary discontinuity</text>
    <text x="315" y="118" font-size="11.5" fill="#e0e7ff">GWD / KLD / PSC · sparse proposals</text>
    <text x="315" y="134" font-size="11.5" fill="#e0e7ff">SSDD · HRSID · RSDD · SAR-AIRcraft</text>
    <!-- 3 physics / scattering -->
    <rect x="600" y="92" width="285" height="86" rx="10" fill="#0891b2" stroke="#0e7490"/>
    <text x="615" y="116" font-size="12.5" font-weight="700">3 · Physics- / scattering-informed</text>
    <text x="615" y="134" font-size="11.5" fill="#cffafe">PGD · SFEF-Net · scatter key points</text>
    <text x="615" y="150" font-size="11.5" fill="#cffafe">ASC priors · EM-model adversarial</text>
    <text x="615" y="166" font-size="11.5" fill="#cffafe">put the imaging model in the loss</text>
    <!-- 4 foundation models -->
    <rect x="55" y="418" width="300" height="86" rx="10" fill="#0891b2" stroke="#0e7490"/>
    <text x="70" y="442" font-size="12.5" font-weight="700">4 · Foundation models / SSL</text>
    <text x="70" y="460" font-size="11.5" fill="#cffafe">SARATR-X · SAMBA · SARMAE</text>
    <text x="70" y="476" font-size="11.5" fill="#cffafe">SARDet-100K + MSFA pretraining</text>
    <text x="70" y="492" font-size="11.5" fill="#cffafe">masked-image modelling on radar</text>
    <!-- 5 PolSAR / complex-valued -->
    <rect x="300" y="446" width="300" height="86" rx="10" fill="#4f46e5" stroke="#3730a3"/>
    <text x="315" y="470" font-size="12.5" font-weight="700">5 · PolSAR &amp; complex-valued nets</text>
    <text x="315" y="488" font-size="11.5" fill="#e0e7ff">CV-CNN / CV-ViT · Riemannian</text>
    <text x="315" y="504" font-size="11.5" fill="#e0e7ff">amplitude + phase land-cover classes</text>
    <text x="315" y="520" font-size="11.5" fill="#e0e7ff">scattering-mechanism informed SAM</text>
    <!-- 6 VLM + data problem -->
    <rect x="600" y="418" width="285" height="86" rx="10" fill="#4f46e5" stroke="#3730a3"/>
    <text x="615" y="442" font-size="12.5" font-weight="700">6 · Language + the data problem</text>
    <text x="615" y="460" font-size="11.5" fill="#e0e7ff">SARVLM · SARLANG-1M · FUSAR-KLIP</text>
    <text x="615" y="476" font-size="11.5" fill="#e0e7ff">synthetic-to-measured gap (SAMPLE)</text>
    <text x="615" y="492" font-size="11.5" fill="#e0e7ff">despeckle · diffusion / GAN few-shot</text>
  </g>
</svg>
