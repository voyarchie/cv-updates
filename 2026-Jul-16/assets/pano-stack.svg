<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 470" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" role="img" aria-label="The omnidirectional vision pipeline from sphere to task, with the projection and output-geometry choices that define the field">
  <title>Omnidirectional pipeline: sphere → projection → sphere-aware model → non-planar output → task</title>
  <defs>
    <marker id="ah2" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#94a3b8"/>
    </marker>
  </defs>
  <!-- stage headers -->
  <g font-size="12.5" font-weight="700" text-anchor="middle">
    <text x="95"  y="30" fill="#38bdf8">CAPTURE</text>
    <text x="300" y="30" fill="#a78bfa">PROJECT</text>
    <text x="520" y="30" fill="#34d399">MODEL</text>
    <text x="740" y="30" fill="#fbbf24">OUTPUT GEOMETRY</text>
  </g>

  <!-- capture -->
  <g>
    <rect x="20" y="48" width="150" height="150" rx="10" fill="#0ea5e9" stroke="#0369a1"/>
    <circle cx="95" cy="118" r="42" fill="none" stroke="#e0f2fe" stroke-width="2"/>
    <ellipse cx="95" cy="118" rx="42" ry="16" fill="none" stroke="#bae6fd" stroke-width="1.5"/>
    <line x1="53" y1="118" x2="137" y2="118" stroke="#bae6fd" stroke-width="1.5"/>
    <text x="95" y="182" text-anchor="middle" fill="#f0f9ff" font-size="11.5">360° / fisheye sphere</text>
  </g>

  <!-- project -->
  <g font-size="11" fill="#f5f3ff">
    <rect x="215" y="48" width="170" height="46" rx="8" fill="#7c3aed" stroke="#5b21b6"/>
    <text x="300" y="68" text-anchor="middle" font-weight="700" font-size="11.5">Equirectangular (ERP)</text>
    <text x="300" y="85" text-anchor="middle">1 plane · poles stretched</text>
    <rect x="215" y="102" width="170" height="42" rx="8" fill="#7c3aed" stroke="#5b21b6"/>
    <text x="300" y="120" text-anchor="middle" font-weight="700" font-size="11.5">Cubemap / tangent</text>
    <text x="300" y="136" text-anchor="middle">low-distortion patches</text>
    <rect x="215" y="152" width="170" height="46" rx="8" fill="#7c3aed" stroke="#5b21b6"/>
    <text x="300" y="172" text-anchor="middle" font-weight="700" font-size="11.5">Icosahedral / sphere</text>
    <text x="300" y="189" text-anchor="middle">no projection at all</text>
  </g>

  <!-- model -->
  <g font-size="11" fill="#ecfdf5">
    <rect x="435" y="48" width="170" height="46" rx="8" fill="#059669" stroke="#047857"/>
    <text x="520" y="68" text-anchor="middle" font-weight="700" font-size="11.5">Distortion-aware conv</text>
    <text x="520" y="85" text-anchor="middle">SphereNet · KTN · RDC</text>
    <rect x="435" y="102" width="170" height="42" rx="8" fill="#059669" stroke="#047857"/>
    <text x="520" y="120" text-anchor="middle" font-weight="700" font-size="11.5">Deformable ViT</text>
    <text x="520" y="136" text-anchor="middle">Trans4PASS · Bending Reality</text>
    <rect x="435" y="152" width="170" height="46" rx="8" fill="#059669" stroke="#047857"/>
    <text x="520" y="172" text-anchor="middle" font-weight="700" font-size="11.5">Equivariant / sphere</text>
    <text x="520" y="189" text-anchor="middle">S2CNN · SO3UFormer</text>
  </g>

  <!-- output geometry -->
  <g font-size="11" fill="#fffbeb">
    <rect x="655" y="48" width="240" height="46" rx="8" fill="#d97706" stroke="#b45309"/>
    <text x="775" y="68" text-anchor="middle" font-weight="700" font-size="11.5">Bounding FoV (BFoV / rBFoV)</text>
    <text x="775" y="85" text-anchor="middle">angles on the sphere, not pixels</text>
    <rect x="655" y="102" width="240" height="42" rx="8" fill="#d97706" stroke="#b45309"/>
    <text x="775" y="120" text-anchor="middle" font-weight="700" font-size="11.5">Rotated box · periodic angle</text>
    <text x="775" y="136" text-anchor="middle">RAPiD · ARPD</text>
    <rect x="655" y="152" width="240" height="46" rx="8" fill="#d97706" stroke="#b45309"/>
    <text x="775" y="172" text-anchor="middle" font-weight="700" font-size="11.5">Curved polygon · ellipse</text>
    <text x="775" y="189" text-anchor="middle">FisheyeDetNet · "Bananas"</text>
  </g>

  <!-- flow arrows between stage columns -->
  <g stroke="#94a3b8" stroke-width="2.5" fill="none" marker-end="url(#ah2)">
    <line x1="172" y1="120" x2="212" y2="120"/>
    <line x1="387" y1="120" x2="432" y2="120"/>
    <line x1="607" y1="120" x2="652" y2="120"/>
  </g>

  <!-- tasks band -->
  <g>
    <rect x="20" y="238" width="875" height="92" rx="10" fill="#1e293b" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="40" y="264" fill="#f8fafc" font-size="13" font-weight="700">Dense tasks on the sphere</text>
    <g font-size="11.5" fill="#e2e8f0">
      <text x="40" y="288">• detection / oriented detection</text>
      <text x="270" y="288">• instance &amp; semantic segmentation</text>
      <text x="560" y="288">• salient-object detection + gaze</text>
      <text x="40" y="310">• multi-object tracking</text>
      <text x="270" y="310">• BEV / 3-D near-field perception</text>
      <text x="560" y="310">• captioning · grounding · VQA (MLLM)</text>
    </g>
  </g>
  <line x1="460" y1="208" x2="460" y2="236" stroke="#94a3b8" stroke-width="2.5" fill="none" marker-end="url(#ah2)"/>

  <!-- cross-cutting engine -->
  <g>
    <rect x="20" y="360" width="875" height="88" rx="10" fill="#334155" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="40" y="386" fill="#f8fafc" font-size="13" font-weight="700">The cross-cutting engine — labelled 360° data is scarce</text>
    <g font-size="11.5" fill="#cbd5e1">
      <text x="40" y="410">• pinhole → panoramic unsupervised domain adaptation (DensePASS · Trans4PASS+ · 360SFUDA++)</text>
      <text x="40" y="431">• SAM / foundation-model-assisted transfer (GoodSAM++) · synthetic capture (SynWoodScape) · sphere-native pretraining</text>
    </g>
  </g>
</svg>
