<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 452" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" role="img" aria-label="Signal chain from a commodity Wi-Fi link through raw CSI, sanitization and featurization, reshaping for a network, to dense human-sensing tasks">
  <title>The Wi-Fi CSI signal chain — why a channel measurement is not an image</title>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- Stage 1 -->
  <rect x="18" y="60" width="164" height="96" rx="11" fill="#1e293b" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="100" y="88" text-anchor="middle" fill="#f8fafc" font-size="12.5" font-weight="700">Commodity Wi-Fi</text>
  <text x="100" y="105" text-anchor="middle" fill="#f8fafc" font-size="12.5" font-weight="700">/ RF link (OFDM)</text>
  <text x="100" y="126" text-anchor="middle" fill="#cbd5e1" font-size="10">multi-antenna TX/RX,</text>
  <text x="100" y="141" text-anchor="middle" fill="#cbd5e1" font-size="10">tens of subcarriers</text>

  <!-- Stage 2 -->
  <rect x="222" y="60" width="164" height="96" rx="11" fill="#7c3aed" stroke="#5b21b6" stroke-width="1.5"/>
  <text x="304" y="86" text-anchor="middle" fill="#ffffff" font-size="12.5" font-weight="700">Raw CSI tensor</text>
  <text x="304" y="107" text-anchor="middle" fill="#ede9fe" font-size="10">antenna-pairs &#215;</text>
  <text x="304" y="121" text-anchor="middle" fill="#ede9fe" font-size="10">subcarriers &#215; time,</text>
  <text x="304" y="135" text-anchor="middle" fill="#ede9fe" font-size="10">complex (amp + phase)</text>

  <!-- Stage 3 -->
  <rect x="426" y="60" width="164" height="96" rx="11" fill="#0369a1" stroke="#075985" stroke-width="1.5"/>
  <text x="508" y="84" text-anchor="middle" fill="#ffffff" font-size="12.5" font-weight="700">Sanitize + featurize</text>
  <text x="508" y="104" text-anchor="middle" fill="#e0f2fe" font-size="10">amplitude; phase de-bias</text>
  <text x="508" y="118" text-anchor="middle" fill="#e0f2fe" font-size="10">(CFO/SFO via CSI-ratio);</text>
  <text x="508" y="132" text-anchor="middle" fill="#e0f2fe" font-size="10">Doppler / BVP velocity</text>

  <!-- Stage 4 -->
  <rect x="630" y="60" width="164" height="96" rx="11" fill="#0f766e" stroke="#115e59" stroke-width="1.5"/>
  <text x="712" y="84" text-anchor="middle" fill="#ffffff" font-size="12.5" font-weight="700">Reshape to feed</text>
  <text x="712" y="99" text-anchor="middle" fill="#ffffff" font-size="12.5" font-weight="700">a network</text>
  <text x="712" y="119" text-anchor="middle" fill="#ccfbf1" font-size="10">pseudo-image / spectrogram</text>
  <text x="712" y="133" text-anchor="middle" fill="#ccfbf1" font-size="10">&#8594; CNN/ViT; series &#8594; RNN</text>

  <!-- Stage 5 -->
  <rect x="834" y="44" width="132" height="128" rx="11" fill="#be123c" stroke="#9f1239" stroke-width="1.5"/>
  <text x="900" y="70" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="700">Dense tasks</text>
  <text x="900" y="91" text-anchor="middle" fill="#ffe4e6" font-size="9.5">pose &amp; body mesh</text>
  <text x="900" y="107" text-anchor="middle" fill="#ffe4e6" font-size="9.5">activity / gait ID</text>
  <text x="900" y="123" text-anchor="middle" fill="#ffe4e6" font-size="9.5">localize / count</text>
  <text x="900" y="139" text-anchor="middle" fill="#ffe4e6" font-size="9.5">presence / fall</text>
  <text x="900" y="155" text-anchor="middle" fill="#ffe4e6" font-size="9.5">vital signs</text>

  <!-- arrows -->
  <line x1="182" y1="108" x2="220" y2="108" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="386" y1="108" x2="424" y2="108" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="590" y1="108" x2="628" y2="108" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="794" y1="108" x2="832" y2="108" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- callout: not an image -->
  <rect x="18" y="204" width="772" height="96" rx="11" fill="none" stroke="#f59e0b" stroke-width="1.6" stroke-dasharray="5 4"/>
  <text x="34" y="230" fill="#f59e0b" font-size="12.5" font-weight="700">Why a channel measurement is not an image</text>
  <text x="34" y="252" fill="#a16207" font-size="10.8">Each subcarrier value is the <tspan font-weight="700">coherent sum of every multipath component</tspan> — the direct path plus reflections off</text>
  <text x="34" y="269" fill="#a16207" font-size="10.8">walls, furniture, and the moving body — collapsed into one complex number. There is <tspan font-weight="700">no pixel grid and no range,</tspan></text>
  <text x="34" y="286" fill="#a16207" font-size="10.8"><tspan font-weight="700">azimuth, or elevation axis.</tspan> The measurement is exquisitely tied to room geometry, which is the root of the domain-shift problem.</text>

  <!-- contrast box: vs FMCW radar -->
  <rect x="18" y="330" width="948" height="98" rx="11" fill="#1e293b" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="34" y="356" fill="#f8fafc" font-size="12.5" font-weight="700">Contrast with FMCW imaging radar (covered separately in this log)</text>
  <text x="34" y="379" fill="#cbd5e1" font-size="10.8">An FMCW / mmWave radar transmits chirps and, via mixing, FFTs and a MIMO array, <tspan fill="#fca5a5" font-weight="700">forms an explicit range&#8211;Doppler&#8211;angle image</tspan> or point cloud —</text>
  <text x="34" y="397" fill="#cbd5e1" font-size="10.8">a coherent, calibrated spatial representation. Wi-Fi sensing <tspan fill="#7dd3fc" font-weight="700">repurposes communication hardware and forms no image at all</tspan>: perception is learned</text>
  <text x="34" y="415" fill="#cbd5e1" font-size="10.8">from multipath statistics. The pay-off is ubiquity, low cost, through-wall reach and privacy; the price is coarse resolution and severe environment dependence.</text>
</svg>
