<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" role="img" aria-label="Two pipelines from the same sensor. Top: the conventional path, where a fixed ISP (black level, demosaic, white balance, denoise, color matrix, gamma and tone mapping, 8-bit quantization and JPEG) produces an sRGB image tuned for human viewers, which then feeds an sRGB-pretrained detector. Information discarded includes 10 to 24 bit depth reduced to 8, clipped highlights and crushed shadows, and a noise model distorted by nonlinear steps. Bottom: the RAW path, where the packed Bayer mosaic goes to a small learned front-end trained with the detection loss, then to the detector. The front-end families are sequential differentiable ISP, parallel ISP, minimal gamma, frequency-domain, and sensor-agnostic curve plus grid.">
  <title>Conventional sRGB pipeline versus RAW-domain detection pipeline</title>
  <rect x="0" y="0" width="960" height="440" rx="10" fill="#f4f6fb" stroke="#cbd5e1" stroke-width="1"/>
  <text x="24" y="32" fill="#334155" font-size="16.5" font-weight="800">One sensor, two pipelines: who is the ISP tuned for?</text>

  <!-- sensor -->
  <rect x="24" y="150" width="120" height="120" rx="8" fill="#e2e8f0" stroke="#64748b"/>
  <text x="84" y="176" text-anchor="middle" fill="#1e293b" font-size="13" font-weight="800">Sensor</text>
  <g stroke="#475569" stroke-width="0.6">
    <rect x="50" y="188" width="17" height="17" fill="#fca5a5"/><rect x="67" y="188" width="17" height="17" fill="#86efac"/>
    <rect x="84" y="188" width="17" height="17" fill="#fca5a5"/><rect x="101" y="188" width="17" height="17" fill="#86efac"/>
    <rect x="50" y="205" width="17" height="17" fill="#86efac"/><rect x="67" y="205" width="17" height="17" fill="#93c5fd"/>
    <rect x="84" y="205" width="17" height="17" fill="#86efac"/><rect x="101" y="205" width="17" height="17" fill="#93c5fd"/>
  </g>
  <text x="84" y="242" text-anchor="middle" fill="#334155" font-size="11">Bayer CFA, linear</text>
  <text x="84" y="257" text-anchor="middle" fill="#334155" font-size="11">10–24 bit</text>

  <!-- top pipeline -->
  <text x="176" y="70" fill="#9a3412" font-size="13" font-weight="800">Conventional: made for human eyes</text>
  <rect x="176" y="82" width="430" height="74" rx="8" fill="#fff7ed" stroke="#fb923c"/>
  <text x="190" y="104" fill="#9a3412" font-size="12" font-weight="700">Fixed ISP (hand-tuned)</text>
  <text x="190" y="123" fill="#7c2d12" font-size="11.5">black level → demosaic → WB → denoise → CCM →</text>
  <text x="190" y="140" fill="#7c2d12" font-size="11.5">gamma / tone map → 8-bit → JPEG</text>
  <rect x="624" y="82" width="120" height="74" rx="8" fill="#fff7ed" stroke="#fb923c"/>
  <text x="684" y="112" text-anchor="middle" fill="#9a3412" font-size="12" font-weight="700">sRGB image</text>
  <text x="684" y="130" text-anchor="middle" fill="#7c2d12" font-size="11">8 bit, nonlinear</text>
  <rect x="762" y="82" width="174" height="74" rx="8" fill="#fff7ed" stroke="#fb923c"/>
  <text x="849" y="112" text-anchor="middle" fill="#9a3412" font-size="12" font-weight="700">sRGB-pretrained</text>
  <text x="849" y="130" text-anchor="middle" fill="#7c2d12" font-size="11">detector / segmenter</text>
  <path d="M144 180 C160 180 160 119 174 119" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#a)"/>
  <path d="M606 119 L622 119" stroke="#64748b" stroke-width="1.6" marker-end="url(#a)"/>
  <path d="M744 119 L760 119" stroke="#64748b" stroke-width="1.6" marker-end="url(#a)"/>

  <rect x="176" y="166" width="760" height="44" rx="6" fill="#fef2f2" stroke="#f87171" stroke-dasharray="4 3"/>
  <text x="190" y="185" fill="#991b1b" font-size="11.5" font-weight="700">Lost for the detector:</text>
  <text x="190" y="201" fill="#7f1d1d" font-size="11.5">bit depth (e.g. 24 → 8), clipped highlights / crushed shadows, a simple noise model bent by nonlinear steps, ~13 ms of latency (industry claim)</text>

  <!-- bottom pipeline -->
  <text x="176" y="250" fill="#065f46" font-size="13" font-weight="800">RAW-domain: made for the task loss</text>
  <rect x="176" y="262" width="150" height="74" rx="8" fill="#ecfdf5" stroke="#34d399"/>
  <text x="251" y="292" text-anchor="middle" fill="#065f46" font-size="12" font-weight="700">Packed RAW</text>
  <text x="251" y="310" text-anchor="middle" fill="#064e3b" font-size="11">4 × H/2 × W/2</text>
  <rect x="344" y="262" width="262" height="74" rx="8" fill="#ecfdf5" stroke="#34d399"/>
  <text x="358" y="284" fill="#065f46" font-size="12" font-weight="700">Learned front-end (≈0.003–1 M params)</text>
  <text x="358" y="303" fill="#064e3b" font-size="11">trained end-to-end with the detection loss</text>
  <text x="358" y="320" fill="#064e3b" font-size="11">no human-viewable image required</text>
  <rect x="624" y="262" width="312" height="74" rx="8" fill="#ecfdf5" stroke="#34d399"/>
  <text x="780" y="292" text-anchor="middle" fill="#065f46" font-size="12" font-weight="700">Detector / segmenter</text>
  <text x="780" y="310" text-anchor="middle" fill="#064e3b" font-size="11">sRGB-pretrained + adapters, or RAW-pretrained</text>
  <path d="M144 240 C160 240 160 299 174 299" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#a)"/>
  <path d="M326 299 L342 299" stroke="#64748b" stroke-width="1.6" marker-end="url(#a)"/>
  <path d="M606 299 L622 299" stroke="#64748b" stroke-width="1.6" marker-end="url(#a)"/>

  <!-- families -->
  <text x="24" y="370" fill="#334155" font-size="12.5" font-weight="800">Front-end families (§4)</text>
  <g font-size="11">
    <rect x="24" y="380" width="172" height="42" rx="6" fill="#eef2ff" stroke="#818cf8"/>
    <text x="110" y="397" text-anchor="middle" fill="#3730a3" font-weight="700">Sequential diff. ISP</text>
    <text x="110" y="413" text-anchor="middle" fill="#312e81">RAW-Adapter, Dark-ISP</text>
    <rect x="208" y="380" width="172" height="42" rx="6" fill="#eef2ff" stroke="#818cf8"/>
    <text x="294" y="397" text-anchor="middle" fill="#3730a3" font-weight="700">Parallel ISP + fusion</text>
    <text x="294" y="413" text-anchor="middle" fill="#312e81">RAM (Sony AI)</text>
    <rect x="392" y="380" width="172" height="42" rx="6" fill="#eef2ff" stroke="#818cf8"/>
    <text x="478" y="397" text-anchor="middle" fill="#3730a3" font-weight="700">Minimal</text>
    <text x="478" y="413" text-anchor="middle" fill="#312e81">SimROD (4-param gamma)</text>
    <rect x="576" y="380" width="172" height="42" rx="6" fill="#eef2ff" stroke="#818cf8"/>
    <text x="662" y="397" text-anchor="middle" fill="#3730a3" font-weight="700">Frequency domain</text>
    <text x="662" y="413" text-anchor="middle" fill="#312e81">SFAE, FreqAdapt</text>
    <rect x="760" y="380" width="176" height="42" rx="6" fill="#eef2ff" stroke="#818cf8"/>
    <text x="848" y="397" text-anchor="middle" fill="#3730a3" font-weight="700">Sensor-agnostic</text>
    <text x="848" y="413" text-anchor="middle" fill="#312e81">RAWild, Dr.RAW</text>
  </g>

  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#64748b"/>
    </marker>
  </defs>
</svg>
