<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" role="img" aria-label="Four within-study comparisons of accuracy under shift for in-field crop images. Plant disease: an EfficientNet-B2 scores 99.61 percent on PlantVillage and 66.80 percent on vineyard images; another model scores 99.8 percent on PlantVillage and 61.97 percent on open-field leaves. Weed segmentation on WeedsGalore: 79.33 mIoU when trained on WeedsGalore, about 37 to 39 when trained on other datasets. Weed detection: DINOv3 plus YOLO26 gains 5.4 mAP50 points in season and 11.9 to 14.0 points on other seasons. Weed identification by VLMs on AgroBench: random 17.9, LLaVA-Next-8B 30.05, best model Gemini 1.5 Pro 55.17 percent.">
  <title>In-field accuracy under shift: four within-study comparisons</title>
  <rect x="0" y="0" width="960" height="420" rx="10" fill="#f4f6fb" stroke="#cbd5e1"/>
  <text x="24" y="32" fill="#334155" font-size="16.5" font-weight="800">Leave the field you trained on, and accuracy goes</text>
  <text x="24" y="52" fill="#64748b" font-size="11.5">Each panel compares numbers from one study only. Panels use different tasks and metrics, so do not compare across them. Abstract-level figures.</text>

  <!-- Panel 1: disease lab->field. scale 100% = 220px, baseline y=360 -->
  <rect x="24" y="70" width="218" height="326" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="38" y="94" fill="#334155" font-size="13" font-weight="700">Disease: lab → field</text>
  <text x="38" y="110" fill="#64748b" font-size="10.5">accuracy %, two studies</text>
  <line x1="38" y1="360" x2="228" y2="360" stroke="#94a3b8"/>
  <rect x="46" y="141" width="36" height="219" fill="#2563eb"/>
  <text x="64" y="135" text-anchor="middle" fill="#1e3a8a" font-size="11" font-weight="700">99.61</text>
  <rect x="88" y="213" width="36" height="147" fill="#f59e0b"/>
  <text x="106" y="207" text-anchor="middle" fill="#92400e" font-size="11" font-weight="700">66.80</text>
  <rect x="142" y="140" width="36" height="220" fill="#2563eb"/>
  <text x="160" y="134" text-anchor="middle" fill="#1e3a8a" font-size="11" font-weight="700">99.8</text>
  <rect x="184" y="224" width="36" height="136" fill="#f59e0b"/>
  <text x="202" y="218" text-anchor="middle" fill="#92400e" font-size="11" font-weight="700">61.97</text>
  <text x="85" y="376" text-anchor="middle" fill="#475569" font-size="10">grapevine</text>
  <text x="181" y="376" text-anchor="middle" fill="#475569" font-size="10">open-field leaves</text>
  <text x="38" y="390" fill="#475569" font-size="9.5"><tspan fill="#2563eb">■</tspan> PlantVillage  <tspan fill="#f59e0b">■</tspan> field images</text>

  <!-- Panel 2: WeedsGalore cross-dataset mIoU -->
  <rect x="254" y="70" width="218" height="326" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="268" y="94" fill="#334155" font-size="13" font-weight="700">Weed masks: other data</text>
  <text x="268" y="110" fill="#64748b" font-size="10.5">mIoU on WeedsGalore test set</text>
  <line x1="268" y1="360" x2="458" y2="360" stroke="#94a3b8"/>
  <rect x="282" y="185" width="44" height="175" fill="#16a34a"/>
  <text x="304" y="179" text-anchor="middle" fill="#14532d" font-size="11" font-weight="700">79.33</text>
  <rect x="386" y="276" width="44" height="84" fill="#f59e0b"/>
  <text x="408" y="270" text-anchor="middle" fill="#92400e" font-size="11" font-weight="700">~37–39</text>
  <text x="304" y="376" text-anchor="middle" fill="#475569" font-size="10">train: own</text>
  <text x="400" y="376" text-anchor="middle" fill="#475569" font-size="10">train: PhenoBench,</text>
  <text x="400" y="388" text-anchor="middle" fill="#475569" font-size="10">CropAndWeed, MaizeOrWeed</text>

  <!-- Panel 3: DINOv3-YOLO26 gains in pts mAP50, scale 1pt = 12px -->
  <rect x="484" y="70" width="218" height="326" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="498" y="94" fill="#334155" font-size="13" font-weight="700">Weed boxes: SSL backbone</text>
  <text x="498" y="110" fill="#64748b" font-size="10.5">mAP50 gain over YOLO26-L, points</text>
  <line x1="498" y1="360" x2="688" y2="360" stroke="#94a3b8"/>
  <rect x="510" y="295" width="44" height="65" fill="#2563eb"/>
  <text x="532" y="289" text-anchor="middle" fill="#1e3a8a" font-size="11" font-weight="700">+5.4</text>
  <rect x="570" y="217" width="44" height="143" fill="#7c3aed"/>
  <text x="592" y="211" text-anchor="middle" fill="#4c1d95" font-size="11" font-weight="700">+11.9</text>
  <rect x="630" y="192" width="44" height="168" fill="#7c3aed"/>
  <text x="652" y="186" text-anchor="middle" fill="#4c1d95" font-size="11" font-weight="700">+14.0</text>
  <text x="532" y="376" text-anchor="middle" fill="#475569" font-size="10">2025 (same)</text>
  <text x="592" y="376" text-anchor="middle" fill="#475569" font-size="10">2024</text>
  <text x="652" y="376" text-anchor="middle" fill="#475569" font-size="10">2021–23</text>
  <text x="498" y="390" fill="#475569" font-size="9.5">gain grows as seasons get further away</text>

  <!-- Panel 4: AgroBench weed ID, scale 100% = 220 -->
  <rect x="714" y="70" width="222" height="326" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="728" y="94" fill="#334155" font-size="13" font-weight="700">VLMs: weed ID</text>
  <text x="728" y="110" fill="#64748b" font-size="10.5">AgroBench WID accuracy %</text>
  <line x1="728" y1="360" x2="922" y2="360" stroke="#94a3b8"/>
  <rect x="740" y="321" width="44" height="39" fill="#94a3b8"/>
  <text x="762" y="315" text-anchor="middle" fill="#334155" font-size="11" font-weight="700">17.9</text>
  <rect x="800" y="294" width="44" height="66" fill="#f59e0b"/>
  <text x="822" y="288" text-anchor="middle" fill="#92400e" font-size="11" font-weight="700">30.05</text>
  <rect x="860" y="239" width="44" height="121" fill="#16a34a"/>
  <text x="882" y="233" text-anchor="middle" fill="#14532d" font-size="11" font-weight="700">55.17</text>
  <text x="762" y="372" text-anchor="middle" fill="#475569" font-size="10">random</text>
  <text x="822" y="372" text-anchor="middle" fill="#475569" font-size="10">LLaVA-Next</text><text x="822" y="383" text-anchor="middle" fill="#475569" font-size="10">8B</text>
  <text x="882" y="372" text-anchor="middle" fill="#475569" font-size="10">Gemini</text><text x="882" y="383" text-anchor="middle" fill="#475569" font-size="10">1.5 Pro</text>
  <text x="728" y="393" fill="#475569" font-size="9.5">best model, still below 56 %</text>
</svg>
