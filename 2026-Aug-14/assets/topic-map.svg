<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 680" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" role="img" aria-label="Topic map of six light-field dense-detection and classification threads arranged around the 4D light-field primitive">
  <title>Light-field imaging — six dense-detection &amp; classification threads around one primitive</title>
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#94a3b8"/>
    </marker>
  </defs>
  <!-- edges -->
  <g stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#ah)">
    <line x1="460" y1="340" x2="200" y2="150"/>
    <line x1="460" y1="340" x2="460" y2="150"/>
    <line x1="460" y1="340" x2="720" y2="150"/>
    <line x1="460" y1="340" x2="200" y2="536"/>
    <line x1="460" y1="340" x2="460" y2="536"/>
    <line x1="460" y1="340" x2="720" y2="536"/>
  </g>
  <!-- hub -->
  <g>
    <rect x="298" y="276" width="324" height="132" rx="12" fill="#1e293b" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="460" y="302" text-anchor="middle" fill="#f8fafc" font-size="15" font-weight="700">The 4D light field</text>
    <text x="460" y="324" text-anchor="middle" fill="#cbd5e1" font-size="11.5">record ray intensity AND direction:</text>
    <text x="460" y="341" text-anchor="middle" fill="#cbd5e1" font-size="11.5">L(x, y, u, v) &#8212; spatial (x,y) + angular (u,v)</text>
    <text x="460" y="358" text-anchor="middle" fill="#cbd5e1" font-size="11.5">in one sensor, one exposure. Buys depth,</text>
    <text x="460" y="375" text-anchor="middle" fill="#cbd5e1" font-size="11.5">refocus, occlusion &amp; view parallax &#8212;</text>
    <text x="460" y="394" text-anchor="middle" fill="#93c5fd" font-size="11">but spends spatial resolution to get angular</text>
  </g>
  <!-- nodes -->
  <g>
    <!-- 1 representations -->
    <rect x="45" y="46" width="310" height="108" rx="10" fill="#0891b2" stroke="#0e7490"/>
    <text x="200" y="74" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="700">S4 &#183; Representations</text>
    <text x="200" y="97" text-anchor="middle" fill="#e0f2fe" font-size="11">sub-aperture views vs macro-pixel</text>
    <text x="200" y="113" text-anchor="middle" fill="#e0f2fe" font-size="11">vs EPI (slope &#8733; depth) vs focal</text>
    <text x="200" y="129" text-anchor="middle" fill="#e0f2fe" font-size="11">stack; disentangling spatial &amp; angular</text>
    <!-- 2 dense detection -->
    <rect x="305" y="44" width="310" height="108" rx="10" fill="#4f46e5" stroke="#3730a3"/>
    <text x="460" y="72" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="700">S5 &#183; Detection &amp; segmentation</text>
    <text x="460" y="95" text-anchor="middle" fill="#e0e7ff" font-size="11">light-field salient object detection:</text>
    <text x="460" y="111" text-anchor="middle" fill="#e0e7ff" font-size="11">focal-stack + angular cues beat 2D on</text>
    <text x="460" y="127" text-anchor="middle" fill="#e0e7ff" font-size="11">occlusion &amp; camouflage (CMA-Net &#8594; SAMNet)</text>
    <!-- 3 classification -->
    <rect x="565" y="46" width="310" height="108" rx="10" fill="#0f766e" stroke="#115e59"/>
    <text x="720" y="74" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="700">S6 &#183; Classification</text>
    <text x="720" y="97" text-anchor="middle" fill="#ccfbf1" font-size="11">angular reflectance &#8594; material ID;</text>
    <text x="720" y="113" text-anchor="middle" fill="#ccfbf1" font-size="11">depth/focus parallax defeats 2D</text>
    <text x="720" y="129" text-anchor="middle" fill="#ccfbf1" font-size="11">print/replay face spoofing (PAD)</text>
    <!-- 4 geometry -->
    <rect x="45" y="528" width="310" height="108" rx="10" fill="#b45309" stroke="#92400e"/>
    <text x="200" y="556" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="700">S7 &#183; Depth &amp; geometry</text>
    <text x="200" y="579" text-anchor="middle" fill="#fef3c7" font-size="11">EPI-slope disparity, disentangled</text>
    <text x="200" y="595" text-anchor="middle" fill="#fef3c7" font-size="11">DistgDisp, spatial+angular super-</text>
    <text x="200" y="611" text-anchor="middle" fill="#fef3c7" font-size="11">resolution (NTIRE) &#8212; the substrate</text>
    <!-- 5 data / FM -->
    <rect x="305" y="530" width="310" height="108" rx="10" fill="#be123c" stroke="#9f1239"/>
    <text x="460" y="558" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="700">S8 &#183; Data &amp; foundation models</text>
    <text x="460" y="581" text-anchor="middle" fill="#ffe4e6" font-size="11">datasets in the hundreds, not millions;</text>
    <text x="460" y="597" text-anchor="middle" fill="#ffe4e6" font-size="11">synthetic LF + SAM / CLIP / Mamba</text>
    <text x="460" y="613" text-anchor="middle" fill="#ffe4e6" font-size="11">transfer to fill the label gap</text>
    <!-- 6 capture / apps -->
    <rect x="565" y="528" width="310" height="108" rx="10" fill="#7c3aed" stroke="#5b21b6"/>
    <text x="720" y="556" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="700">S9 &#183; Capture &amp; applications</text>
    <text x="720" y="579" text-anchor="middle" fill="#ede9fe" font-size="11">microlens (Lytro) vs camera array vs</text>
    <text x="720" y="595" text-anchor="middle" fill="#ede9fe" font-size="11">Raytrix; light-field microscopy for</text>
    <text x="720" y="611" text-anchor="middle" fill="#ede9fe" font-size="11">single-shot volumes; lensless/compressive</text>
  </g>
</svg>
