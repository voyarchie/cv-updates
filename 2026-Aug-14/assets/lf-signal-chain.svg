<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" role="img" aria-label="How a scene's rays are encoded as a 4D light field and re-expressed as sub-aperture views, EPIs, or a focal stack before a dense task">
  <title>Light-field signal chain: from rays through a microlens array to a 4D field, then to the representation a task needs</title>
  <defs>
    <marker id="a2" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#94a3b8"/>
    </marker>
  </defs>

  <!-- front-end chain -->
  <g>
    <rect x="16" y="180" width="150" height="104" rx="10" fill="#b45309" stroke="#92400e"/>
    <text x="91" y="210" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">Scene rays</text>
    <text x="91" y="233" text-anchor="middle" fill="#fef3c7" font-size="10.5">radiance along</text>
    <text x="91" y="249" text-anchor="middle" fill="#fef3c7" font-size="10.5">each direction, not</text>
    <text x="91" y="265" text-anchor="middle" fill="#fef3c7" font-size="10.5">just each point</text>

    <rect x="196" y="180" width="176" height="104" rx="10" fill="#be123c" stroke="#9f1239"/>
    <text x="284" y="206" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">Microlens array</text>
    <text x="284" y="228" text-anchor="middle" fill="#ffe4e6" font-size="10.5">each lenslet images</text>
    <text x="284" y="245" text-anchor="middle" fill="#ffe4e6" font-size="10.5">the aperture &#8594; angle</text>
    <text x="284" y="262" text-anchor="middle" fill="#ffe4e6" font-size="10.5">encoded next to</text>
    <text x="284" y="278" text-anchor="middle" fill="#ffe4e6" font-size="10.5">position on sensor</text>

    <rect x="402" y="180" width="176" height="104" rx="10" fill="#1e293b" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="490" y="206" text-anchor="middle" fill="#f8fafc" font-size="13" font-weight="700">4D light field</text>
    <text x="490" y="228" text-anchor="middle" fill="#cbd5e1" font-size="10.5">decode raw lenslet</text>
    <text x="490" y="245" text-anchor="middle" fill="#cbd5e1" font-size="10.5">image &#8594; L(x, y, u, v)</text>
    <text x="490" y="262" text-anchor="middle" fill="#93c5fd" font-size="10.5">spatial &amp; angular are</text>
    <text x="490" y="278" text-anchor="middle" fill="#93c5fd" font-size="10.5">entangled per macro-pixel</text>
  </g>

  <!-- fork edges -->
  <g stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#a2)">
    <line x1="166" y1="232" x2="192" y2="232"/>
    <line x1="372" y1="232" x2="398" y2="232"/>
    <path d="M578 206 C 614 206, 614 92, 650 92"/>
    <path d="M578 232 C 620 232, 620 232, 650 232"/>
    <path d="M578 258 C 614 258, 614 372, 650 372"/>
    <path d="M852 92 C 892 92, 892 210, 908 224" stroke="#64748b"/>
    <path d="M852 232 C 884 232, 884 232, 908 232" stroke="#64748b"/>
    <path d="M852 372 C 892 372, 892 258, 908 244" stroke="#64748b"/>
  </g>

  <!-- representation branches -->
  <g>
    <rect x="652" y="52" width="200" height="80" rx="10" fill="#0891b2" stroke="#0e7490"/>
    <text x="752" y="78" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="700">Sub-aperture views</text>
    <text x="752" y="98" text-anchor="middle" fill="#e0f2fe" font-size="10.5">a grid of tiny parallax-</text>
    <text x="752" y="114" text-anchor="middle" fill="#e0f2fe" font-size="10.5">shifted images (refocus)</text>

    <rect x="652" y="192" width="200" height="80" rx="10" fill="#4f46e5" stroke="#3730a3"/>
    <text x="752" y="218" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="700">Epipolar plane image</text>
    <text x="752" y="238" text-anchor="middle" fill="#e0e7ff" font-size="10.5">line slope &#8733; depth &#8212;</text>
    <text x="752" y="254" text-anchor="middle" fill="#e0e7ff" font-size="10.5">geometry made explicit</text>

    <rect x="652" y="332" width="200" height="80" rx="10" fill="#0f766e" stroke="#115e59"/>
    <text x="752" y="358" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="700">Focal stack</text>
    <text x="752" y="378" text-anchor="middle" fill="#ccfbf1" font-size="10.5">re-focus to each depth &#8212;</text>
    <text x="752" y="394" text-anchor="middle" fill="#ccfbf1" font-size="10.5">what SOD networks feed on</text>
  </g>

  <!-- task head -->
  <g>
    <rect x="856" y="192" width="98" height="80" rx="10" fill="#7c3aed" stroke="#5b21b6"/>
    <text x="905" y="222" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="700">Task</text>
    <text x="905" y="242" text-anchor="middle" fill="#ede9fe" font-size="10">detect / seg /</text>
    <text x="905" y="256" text-anchor="middle" fill="#ede9fe" font-size="10">classify</text>
  </g>

  <!-- captions -->
  <text x="330" y="330" text-anchor="middle" fill="#64748b" font-size="11" font-style="italic">One capture, three views of the same 4D data. The representation you choose is the</text>
  <text x="330" y="348" text-anchor="middle" fill="#64748b" font-size="11" font-style="italic">design decision: it fixes what geometry is explicit and what the network must recover.</text>
</svg>
