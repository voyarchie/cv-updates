<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 600" role="img" aria-label="Topic map for the 2026-Jun-23 CV update">
  <title>Topic map — 2026-Jun-23 CV update</title>
  <desc>A radial topic map of six agent-facing and open-ended dense-detection threads grouped under three families: on-screen perception for computer-use agents (GUI screen-element detection and GUI visual grounding), open-ended and generative detection (detection-as-next-token, and localized region understanding), and structured-document detection plus the benchmarks that score screen grounding.</desc>
  <style>
    .hub    { fill: none; stroke: currentColor; stroke-width: 1.7; }
    .spoke  { fill: none; stroke: currentColor; stroke-width: 1.1; opacity: 0.5; }
    .node   { stroke: currentColor; stroke-width: 1.3; }
    .gui    { fill: rgba(59,130,246,0.16); }
    .open   { fill: rgba(168,85,247,0.16); }
    .struct { fill: rgba(16,185,129,0.16); }
    .lbl    { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 13px; fill: currentColor; }
    .sub    { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 10.5px; fill: currentColor; opacity: 0.72; }
    .hublbl { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 13px; font-weight: 600; fill: currentColor; }
    .keylbl { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 11px; font-weight: 600; fill: currentColor; letter-spacing: 0.03em; }
    .swatch { stroke: currentColor; stroke-width: 1; }
  </style>

  <!-- spokes -->
  <line class="spoke" x1="480" y1="280" x2="480" y2="92"/>
  <line class="spoke" x1="480" y1="280" x2="760" y2="160"/>
  <line class="spoke" x1="480" y1="280" x2="760" y2="400"/>
  <line class="spoke" x1="480" y1="280" x2="480" y2="468"/>
  <line class="spoke" x1="480" y1="280" x2="200" y2="400"/>
  <line class="spoke" x1="480" y1="280" x2="200" y2="160"/>

  <!-- hub -->
  <circle class="hub" cx="480" cy="280" r="54"/>
  <text class="hublbl" x="480" y="276" text-anchor="middle">Agent-facing &amp;</text>
  <text class="hublbl" x="480" y="292" text-anchor="middle">open-ended detection</text>

  <!-- nodes -->
  <g>
    <rect class="node gui" x="360" y="40" width="240" height="56" rx="10"/>
    <text class="lbl" x="480" y="64" text-anchor="middle">1 · Screen-element detection</text>
    <text class="sub" x="480" y="82" text-anchor="middle">OmniParser v2 · OS-Atlas</text>
  </g>
  <g>
    <rect class="node gui" x="648" y="128" width="240" height="56" rx="10"/>
    <text class="lbl" x="768" y="152" text-anchor="middle">2 · GUI visual grounding</text>
    <text class="sub" x="768" y="170" text-anchor="middle">UGround · UI-TARS · GUI-Actor</text>
  </g>
  <g>
    <rect class="node struct" x="648" y="372" width="240" height="56" rx="10"/>
    <text class="lbl" x="768" y="396" text-anchor="middle">6 · Document structure</text>
    <text class="sub" x="768" y="414" text-anchor="middle">TATR · HTTD · graph DLA</text>
  </g>
  <g>
    <rect class="node struct" x="360" y="476" width="240" height="56" rx="10"/>
    <text class="lbl" x="480" y="500" text-anchor="middle">3 · Grounding benchmarks</text>
    <text class="sub" x="480" y="518" text-anchor="middle">ScreenSpot · -v2 · -Pro</text>
  </g>
  <g>
    <rect class="node open" x="72" y="372" width="240" height="56" rx="10"/>
    <text class="lbl" x="192" y="396" text-anchor="middle">5 · Region understanding</text>
    <text class="sub" x="192" y="414" text-anchor="middle">Describe Anything · DINO-X</text>
  </g>
  <g>
    <rect class="node open" x="72" y="128" width="240" height="56" rx="10"/>
    <text class="lbl" x="192" y="152" text-anchor="middle">4 · Detection-as-tokens</text>
    <text class="sub" x="192" y="170" text-anchor="middle">Rex-Omni · ChatRex</text>
  </g>

  <!-- legend -->
  <g transform="translate(40,560)">
    <rect class="swatch gui"    x="0"   y="-11" width="14" height="14" rx="3"/>
    <text class="keylbl" x="20"  y="0">On-screen perception</text>
    <rect class="swatch open"   x="220" y="-11" width="14" height="14" rx="3"/>
    <text class="keylbl" x="240" y="0">Open-ended / generative</text>
    <rect class="swatch struct" x="470" y="-11" width="14" height="14" rx="3"/>
    <text class="keylbl" x="490" y="0">Structure &amp; benchmarks</text>
  </g>
</svg>
