<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" role="img" aria-label="Cross-section of a vision-based tactile sensor and its two readout modes">
  <title>The gel-camera tactile primitive: an inward-looking camera images a self-illuminated elastomer membrane deformed by contact</title>
  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#94a3b8"/>
    </marker>
    <marker id="arg" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#f59e0b"/>
    </marker>
  </defs>

  <!-- ===================== LEFT: sensor cross-section ===================== -->
  <g>
    <rect x="18" y="20" width="404" height="460" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <text x="220" y="48" text-anchor="middle" fill="#f8fafc" font-size="15" font-weight="700">The sensor: a camera that images touch</text>

    <!-- pressed object with texture (top) -->
    <path d="M120 78 q60 -22 120 0 q30 8 60 0 l0 20 q-90 26 -180 0 Z" fill="#64748b" stroke="#cbd5e1" stroke-width="1.2"/>
    <text x="220" y="72" text-anchor="middle" fill="#e2e8f0" font-size="11.5">object surface (ridges, edge, texture)</text>

    <!-- deformable gel, deformed by the object -->
    <path d="M70 120 h300 v70 q-40 0 -60 -14 q-90 -60 -180 0 q-25 16 -60 14 Z" fill="#14b8a6" fill-opacity="0.32" stroke="#2dd4bf" stroke-width="1.5"/>
    <!-- reflective membrane top edge -->
    <path d="M70 120 h35 q120 -46 200 0 h35" fill="none" stroke="#f8fafc" stroke-width="2"/>
    <text x="392" y="132" text-anchor="end" fill="#99f6e4" font-size="11">soft elastomer gel</text>
    <text x="392" y="147" text-anchor="end" fill="#f8fafc" font-size="10.5">reflective/painted skin</text>

    <!-- embedded markers (dots) in the gel -->
    <g fill="#fca5a5">
      <circle cx="120" cy="150" r="3.2"/><circle cx="160" cy="158" r="3.2"/>
      <circle cx="205" cy="162" r="3.2"/><circle cx="250" cy="158" r="3.2"/>
      <circle cx="295" cy="150" r="3.2"/><circle cx="335" cy="146" r="3.2"/>
    </g>
    <text x="70" y="176" fill="#fecaca" font-size="10">tracked markers &#8594; displacement field</text>

    <!-- RGB LEDs at the sides -->
    <g>
      <rect x="60" y="196" width="24" height="14" rx="3" fill="#ef4444"/>
      <rect x="60" y="214" width="24" height="14" rx="3" fill="#22c55e"/>
      <rect x="356" y="196" width="24" height="14" rx="3" fill="#3b82f6"/>
      <rect x="356" y="214" width="24" height="14" rx="3" fill="#eab308"/>
    </g>
    <!-- light rays grazing the membrane -->
    <g stroke="#fbbf24" stroke-width="1.2" stroke-opacity="0.8">
      <line x1="86" y1="200" x2="180" y2="150"/>
      <line x1="354" y1="200" x2="260" y2="150"/>
    </g>
    <text x="220" y="204" text-anchor="middle" fill="#fde68a" font-size="10.5">colored LEDs graze the skin at fixed angles</text>

    <!-- camera housing -->
    <rect x="90" y="300" width="260" height="150" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1.3"/>
    <!-- lens -->
    <circle cx="220" cy="330" r="20" fill="#0ea5e9" stroke="#e0f2fe" stroke-width="2"/>
    <circle cx="220" cy="330" r="8" fill="#0f172a"/>
    <text x="220" y="380" text-anchor="middle" fill="#e2e8f0" font-size="12" font-weight="600">inward-looking camera</text>
    <text x="220" y="400" text-anchor="middle" fill="#94a3b8" font-size="10.5">records the illuminated, deformed skin</text>
    <text x="220" y="420" text-anchor="middle" fill="#94a3b8" font-size="10.5">as an ordinary RGB image</text>

    <!-- field of view cone -->
    <path d="M220 330 L120 250 L320 250 Z" fill="#38bdf8" fill-opacity="0.10" stroke="#38bdf8" stroke-opacity="0.5" stroke-dasharray="4 3"/>
  </g>

  <!-- arrow to outputs -->
  <line x1="430" y1="250" x2="470" y2="250" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#ar)"/>

  <!-- ===================== RIGHT: two readouts ===================== -->
  <g>
    <!-- output A: height / normal map -->
    <rect x="480" y="34" width="402" height="196" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <text x="500" y="60" fill="#f8fafc" font-size="13.5" font-weight="700">Readout A &#183; photometric stereo</text>
    <text x="500" y="79" fill="#cbd5e1" font-size="11">per-pixel color &#8594; surface normal &#8594; height map</text>
    <!-- little heightmap grid -->
    <g>
      <rect x="500" y="92" width="150" height="118" rx="6" fill="#020617" stroke="#1e293b"/>
      <!-- a "bump" rendered as contour rings -->
      <ellipse cx="575" cy="151" rx="58" ry="44" fill="none" stroke="#4f46e5" stroke-width="2"/>
      <ellipse cx="575" cy="151" rx="40" ry="30" fill="none" stroke="#7c3aed" stroke-width="2"/>
      <ellipse cx="575" cy="151" rx="22" ry="16" fill="none" stroke="#a78bfa" stroke-width="2"/>
      <circle cx="575" cy="151" r="5" fill="#e0e7ff"/>
    </g>
    <text x="668" y="120" fill="#e0e7ff" font-size="11">dense sub-millimetre</text>
    <text x="668" y="138" fill="#e0e7ff" font-size="11">geometry of the</text>
    <text x="668" y="156" fill="#e0e7ff" font-size="11">contact patch &#8212;</text>
    <text x="668" y="174" fill="#e0e7ff" font-size="11">independent of the</text>
    <text x="668" y="192" fill="#e0e7ff" font-size="11">object's albedo/color</text>

    <!-- output B: force / shear field -->
    <rect x="480" y="248" width="402" height="220" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <text x="500" y="274" fill="#f8fafc" font-size="13.5" font-weight="700">Readout B &#183; marker displacement</text>
    <text x="500" y="293" fill="#cbd5e1" font-size="11">tracked-dot flow &#8594; shear &amp; normal force field, slip</text>
    <!-- quiver field -->
    <g stroke="#f59e0b" stroke-width="1.6" marker-end="url(#arg)">
      <line x1="520" y1="330" x2="536" y2="326"/>
      <line x1="565" y1="330" x2="585" y2="322"/>
      <line x1="610" y1="330" x2="636" y2="318"/>
      <line x1="520" y1="370" x2="534" y2="368"/>
      <line x1="565" y1="370" x2="586" y2="364"/>
      <line x1="610" y1="370" x2="638" y2="360"/>
      <line x1="520" y1="410" x2="532" y2="409"/>
      <line x1="565" y1="410" x2="583" y2="407"/>
      <line x1="610" y1="410" x2="634" y2="403"/>
    </g>
    <text x="690" y="345" fill="#fde68a" font-size="11">divergence of the flow</text>
    <text x="690" y="363" fill="#fde68a" font-size="11">&#8594; normal force;</text>
    <text x="690" y="386" fill="#fde68a" font-size="11">tangential drift at the</text>
    <text x="690" y="404" fill="#fde68a" font-size="11">contact edge &#8594; incipient</text>
    <text x="690" y="422" fill="#fde68a" font-size="11">slip, before it is felt</text>
  </g>
</svg>
