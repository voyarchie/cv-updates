<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" role="img" aria-label="Diagram of the waste-sorting image. Left: four views of a recycling conveyor. First, the RGB top-down camera on a material recovery facility belt, showing piled, crushed and overlapping packaging. Second, the NIR or MWIR hyperspectral line scan, which gives a spectrum per pixel and identifies polymer type, but fails on carbon-black plastics in NIR. Third, the X-ray view, which sees through layers to find lithium batteries and dense metals. Fourth, the RGB-D view for robot picking, which provides depth for suction or grasp points. Middle: the shared primitive is a dense, cluttered pile of deformed, dirty, overlapping objects whose class is a material, not a shape, and that move at belt speed. Right: outputs are an air-jet or robot pick decision, a per-object material and polymer class, and a composition log used for audits and compliance reporting.">
  <title>The waste-sorting image: four views, one belt</title>
  <rect x="0" y="0" width="960" height="540" rx="10" fill="#f4f6fb" stroke="#cbd5e1"/>
  <text x="24" y="34" fill="#334155" font-size="17" font-weight="800">The waste-sorting image: four views, one belt</text>
  <text x="24" y="54" fill="#64748b" font-size="11.5">Crushed, dirty, overlapping items; the label is a material, not a shape; the belt moves at metres per second and the ejector fires once</text>

  <g font-size="12" fill="#334155">
    <!-- 1 RGB MRF -->
    <rect x="24" y="72" width="330" height="104" rx="8" fill="#ffffff" stroke="#94a3b8"/>
    <text x="36" y="92" font-weight="700">1 · RGB top-down (MRF belt)</text>
    <rect x="36" y="102" width="200" height="62" fill="#475569" rx="3"/>
    <rect x="46" y="110" width="44" height="28" fill="#d6a76c" transform="rotate(-8 68 124)"/>
    <ellipse cx="112" cy="132" rx="26" ry="11" fill="#93c5fd" stroke="#1d4ed8"/>
    <rect x="130" y="112" width="30" height="40" fill="#e2e8f0" stroke="#64748b" transform="rotate(14 145 132)"/>
    <circle cx="186" cy="128" r="13" fill="#cbd5e1" stroke="#334155"/>
    <path d="M196 146 q16 -18 32 -4" stroke="#f472b6" stroke-width="5" fill="none"/>
    <text x="244" y="116" font-size="10" fill="#475569">cardboard, PET,</text>
    <text x="244" y="130" font-size="10" fill="#475569">film, cans, cartons;</text>
    <text x="244" y="144" font-size="10" fill="#475569">heavy overlap</text>

    <!-- 2 HSI -->
    <rect x="24" y="186" width="330" height="104" rx="8" fill="#ffffff" stroke="#94a3b8"/>
    <text x="36" y="206" font-weight="700">2 · NIR / MWIR hyperspectral line scan</text>
    <g>
      <rect x="40" y="218" width="60" height="60" fill="#c4b5fd" stroke="#6d28d9"/>
      <rect x="48" y="226" width="60" height="60" fill="#ddd6fe" stroke="#6d28d9" opacity="0.9"/>
      <rect x="56" y="234" width="44" height="44" fill="#ede9fe" stroke="#6d28d9" opacity="0.9"/>
    </g>
    <path d="M130 270 L150 250 L165 262 L180 228 L196 256 L214 240 L232 266" stroke="#7c3aed" stroke-width="2" fill="none"/>
    <path d="M130 278 H236" stroke="#94a3b8"/>
    <text x="244" y="230" font-size="10" fill="#475569">spectrum per pixel</text>
    <text x="244" y="244" font-size="10" fill="#475569">→ PET / PP / PE / PS</text>
    <text x="244" y="258" font-size="10" fill="#b91c1c">NIR blind to</text>
    <text x="244" y="272" font-size="10" fill="#b91c1c">carbon-black plastic</text>

    <!-- 3 X-ray -->
    <rect x="24" y="300" width="330" height="104" rx="8" fill="#ffffff" stroke="#94a3b8"/>
    <text x="36" y="320" font-weight="700">3 · X-ray (WEEE, packaging, bulky)</text>
    <rect x="36" y="330" width="200" height="62" fill="#e2e8f0" rx="3"/>
    <rect x="52" y="340" width="60" height="40" fill="#cbd5e1" stroke="#64748b"/>
    <rect x="70" y="350" width="22" height="14" fill="#1e293b"/>
    <rect x="130" y="344" width="80" height="30" fill="#cbd5e1" stroke="#64748b"/>
    <rect x="186" y="350" width="16" height="16" fill="#1e293b"/>
    <rect x="66" y="346" width="30" height="22" fill="none" stroke="#dc2626" stroke-width="2"/>
    <rect x="182" y="346" width="24" height="24" fill="none" stroke="#dc2626" stroke-width="2"/>
    <text x="244" y="344" font-size="10" fill="#475569">sees through layers;</text>
    <text x="244" y="358" font-size="10" fill="#475569">hidden Li-ion cells</text>
    <text x="244" y="372" font-size="10" fill="#475569">= fire risk</text>

    <!-- 4 RGB-D -->
    <rect x="24" y="414" width="330" height="104" rx="8" fill="#ffffff" stroke="#94a3b8"/>
    <text x="36" y="434" font-weight="700">4 · RGB-D for robot picking</text>
    <path d="M40 500 L80 470 L110 486 L150 456 L190 480 L230 466" stroke="#0f766e" stroke-width="2" fill="none"/>
    <path d="M150 444 V454" stroke="#0f766e" stroke-width="3"/>
    <circle cx="150" cy="456" r="4" fill="#0f766e"/>
    <text x="244" y="456" font-size="10" fill="#475569">depth → planar</text>
    <text x="244" y="470" font-size="10" fill="#475569">suction / grasp point</text>
    <text x="244" y="484" font-size="10" fill="#475569">on crushed items</text>
  </g>

  <!-- arrows to centre -->
  <g stroke="#64748b" stroke-width="1.6" fill="none">
    <path d="M354 124 L410 240"/>
    <path d="M354 238 L410 260"/>
    <path d="M354 352 L410 290"/>
    <path d="M354 466 L410 310"/>
  </g>

  <!-- centre primitive -->
  <rect x="410" y="196" width="250" height="150" rx="10" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5"/>
  <text x="535" y="222" text-anchor="middle" fill="#0c4a6e" font-size="13.5" font-weight="800">Shared primitive</text>
  <g font-size="11" fill="#0c4a6e">
    <text x="424" y="246">• dense, cluttered, overlapping pile</text>
    <text x="424" y="264">• deformed, dirty, often transparent</text>
    <text x="424" y="282">• class = material / polymer / grade</text>
    <text x="424" y="300">• long-tailed: few metals, rare batteries</text>
    <text x="424" y="318">• moves at belt speed; one ejection</text>
    <text x="424" y="336">• every plant's stream drifts</text>
  </g>

  <path d="M660 270 L716 270" stroke="#64748b" stroke-width="1.6"/>
  <path d="M710 265 L716 270 L710 275" stroke="#64748b" stroke-width="1.6" fill="none"/>

  <!-- outputs -->
  <g font-size="12">
    <rect x="716" y="150" width="220" height="70" rx="8" fill="#dcfce7" stroke="#15803d"/>
    <text x="728" y="172" fill="#14532d" font-weight="700">Act</text>
    <text x="728" y="190" fill="#14532d" font-size="11">air-jet valve or robot pick</text>
    <text x="728" y="206" fill="#14532d" font-size="11">(purity vs. recovery trade-off)</text>

    <rect x="716" y="236" width="220" height="70" rx="8" fill="#fef3c7" stroke="#b45309"/>
    <text x="728" y="258" fill="#78350f" font-weight="700">Classify</text>
    <text x="728" y="276" fill="#78350f" font-size="11">material, polymer, food-grade,</text>
    <text x="728" y="292" fill="#78350f" font-size="11">hazard (battery, gas canister)</text>

    <rect x="716" y="322" width="220" height="70" rx="8" fill="#fae8ff" stroke="#a21caf"/>
    <text x="728" y="344" fill="#701a75" font-weight="700">Count &amp; report</text>
    <text x="728" y="362" fill="#701a75" font-size="11">composition per shift / bale;</text>
    <text x="728" y="378" fill="#701a75" font-size="11">used in compliance reporting</text>
  </g>
</svg>
