<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" role="img" aria-label="The colour fundus photograph as a primitive. Left: a schematic 45 degree fundus field showing the optic disc, the fovea, arteries and veins, and four diabetic-retinopathy lesion types: microaneurysms, haemorrhages, hard exudates and a cotton-wool spot. Right: approximate lesion sizes compared with pixel size at three input resolutions. A 45 degree field spans roughly 12.5 millimetres of retina, so a 3000 pixel image samples about 4 micrometres per pixel, a 512 pixel input about 24 micrometres, and a 224 pixel input about 56 micrometres. A microaneurysm of 25 to 125 micrometres covers 6 to 30 pixels natively but only about half a pixel to 2 pixels at 224. The optic disc of about 1.8 millimetres stays around 32 pixels even at 224. Bottom: five label layers used on fundus images: image-level grade, lesion boxes and masks, anatomy, pixel-level quality, and systemic targets.">
  <title>Fundus photograph: lesion scale and label layers</title>
  <rect x="0" y="0" width="960" height="560" rx="10" fill="#f4f6fb" stroke="#cbd5e1"/>
  <text x="24" y="32" fill="#334155" font-size="16.5" font-weight="800">The fundus photograph: a 2-D colour view of the retina where the decisive lesions are a few pixels wide</text>
  <text x="24" y="52" fill="#64748b" font-size="11.5">Schematic, not to scale on the left. Sizes on the right are approximate textbook ranges; pixel pitch assumes a 45° field ≈ 12.5 mm of retina.</text>

  <!-- fundus schematic -->
  <g>
    <circle cx="190" cy="220" r="140" fill="#7c2d12"/>
    <circle cx="190" cy="220" r="140" fill="none" stroke="#334155" stroke-width="2"/>
    <circle cx="190" cy="220" r="128" fill="#9a3412" opacity="0.55"/>
    <!-- macula / fovea -->
    <circle cx="160" cy="226" r="26" fill="#7c2d12" opacity="0.8"/>
    <circle cx="160" cy="226" r="4" fill="#fde68a"/>
    <!-- optic disc and cup -->
    <circle cx="262" cy="214" r="22" fill="#fcd34d"/>
    <circle cx="265" cy="213" r="10" fill="#fef9c3"/>
    <!-- vessels: arteries (lighter) and veins (darker) -->
    <g fill="none" stroke-linecap="round">
      <path d="M262 200 C 230 140, 170 120, 95 140" stroke="#fb923c" stroke-width="3"/>
      <path d="M262 228 C 230 290, 170 312, 95 296" stroke="#fb923c" stroke-width="3"/>
      <path d="M258 196 C 220 120, 160 105, 80 118" stroke="#450a0a" stroke-width="4.5"/>
      <path d="M258 232 C 220 310, 160 330, 80 318" stroke="#450a0a" stroke-width="4.5"/>
      <path d="M270 198 C 290 150, 300 120, 312 110" stroke="#fb923c" stroke-width="2.5"/>
      <path d="M270 230 C 292 280, 302 310, 312 326" stroke="#450a0a" stroke-width="3.5"/>
    </g>
    <!-- lesions -->
    <g>
      <circle cx="130" cy="190" r="2.2" fill="#dc2626"/>
      <circle cx="140" cy="262" r="2.2" fill="#dc2626"/>
      <circle cx="186" cy="200" r="2.2" fill="#dc2626"/>
      <ellipse cx="118" cy="244" rx="7" ry="5" fill="#991b1b"/>
      <ellipse cx="205" cy="268" rx="6" ry="4" fill="#991b1b"/>
      <circle cx="176" cy="252" r="2.6" fill="#fde047"/>
      <circle cx="182" cy="256" r="2.6" fill="#fde047"/>
      <circle cx="171" cy="259" r="2.2" fill="#fde047"/>
      <ellipse cx="214" cy="164" rx="9" ry="6" fill="#f5f5f4" opacity="0.85"/>
    </g>
    <!-- callouts -->
    <g font-size="11" fill="#334155">
      <line x1="265" y1="190" x2="300" y2="80" stroke="#64748b"/>
      <text x="270" y="74">optic disc + cup (glaucoma)</text>
      <line x1="160" y1="226" x2="60" y2="380" stroke="#64748b"/>
      <text x="24" y="394">fovea / macula (DME, AMD)</text>
      <line x1="130" y1="190" x2="40" y2="92" stroke="#64748b"/>
      <text x="24" y="86">microaneurysms</text>
      <line x1="118" y1="244" x2="40" y2="350" stroke="#64748b"/>
      <text x="24" y="364">haemorrhage</text>
      <line x1="182" y1="256" x2="230" y2="388" stroke="#64748b"/>
      <text x="196" y="402">hard exudates</text>
      <line x1="214" y1="164" x2="190" y2="70" stroke="#64748b"/>
      <text x="140" y="66">cotton-wool spot</text>
      <text x="290" y="402" fill="#64748b">(arteries light, veins dark)</text>
    </g>
  </g>

  <!-- scale ladder -->
  <g font-size="11.5">
    <text x="400" y="88" fill="#334155" font-size="13" font-weight="800">Approximate size in pixels at three input resolutions</text>
    <text x="400" y="106" fill="#64748b">native ≈3000 px (~4 µm/px)  ·  512 px (~24 µm/px)  ·  224 px (~56 µm/px)</text>

    <!-- header -->
    <text x="400" y="132" fill="#334155" font-weight="700">structure (size)</text>
    <text x="640" y="132" fill="#334155" font-weight="700">native</text>
    <text x="730" y="132" fill="#334155" font-weight="700">512</text>
    <text x="820" y="132" fill="#334155" font-weight="700">224</text>

    <g>
      <rect x="396" y="142" width="530" height="30" rx="5" fill="#fee2e2"/>
      <text x="404" y="162" fill="#7f1d1d">microaneurysm (25–125 µm)</text>
      <text x="640" y="162" fill="#7f1d1d">6–30</text>
      <text x="730" y="162" fill="#7f1d1d">1–5</text>
      <text x="820" y="162" fill="#7f1d1d" font-weight="800">0.5–2</text>
    </g>
    <g>
      <rect x="396" y="178" width="530" height="30" rx="5" fill="#fef3c7"/>
      <text x="404" y="198" fill="#78350f">hard exudate (~50–500 µm)</text>
      <text x="640" y="198" fill="#78350f">12–120</text>
      <text x="730" y="198" fill="#78350f">2–20</text>
      <text x="820" y="198" fill="#78350f">1–9</text>
    </g>
    <g>
      <rect x="396" y="214" width="530" height="30" rx="5" fill="#ffedd5"/>
      <text x="404" y="234" fill="#7c2d12">dot/blot haemorrhage (~100–1000 µm)</text>
      <text x="640" y="234" fill="#7c2d12">25–250</text>
      <text x="730" y="234" fill="#7c2d12">4–40</text>
      <text x="820" y="234" fill="#7c2d12">2–18</text>
    </g>
    <g>
      <rect x="396" y="250" width="530" height="30" rx="5" fill="#e2e8f0"/>
      <text x="404" y="270" fill="#0f172a">major vessel calibre (~100–150 µm)</text>
      <text x="640" y="270" fill="#0f172a">25–35</text>
      <text x="730" y="270" fill="#0f172a">4–6</text>
      <text x="820" y="270" fill="#0f172a">2–3</text>
    </g>
    <g>
      <rect x="396" y="286" width="530" height="30" rx="5" fill="#dcfce7"/>
      <text x="404" y="306" fill="#14532d">optic disc (~1.8 mm)</text>
      <text x="640" y="306" fill="#14532d">~450</text>
      <text x="730" y="306" fill="#14532d">~75</text>
      <text x="820" y="306" fill="#14532d">~32</text>
    </g>
    <text x="400" y="340" fill="#334155" font-size="11.5">→ Image-level graders survive 224 px because the disc, haemorrhages and exudates do.</text>
    <text x="400" y="358" fill="#334155" font-size="11.5">→ The earliest DR sign (microaneurysms) does not: lesion detectors tile or run at native size.</text>
    <text x="400" y="376" fill="#334155" font-size="11.5">→ Ultra-widefield (~200°) spreads a similar sensor over far more retina, so pitch gets worse.</text>
  </g>

  <!-- label layers -->
  <g font-size="11.5">
    <text x="24" y="440" fill="#334155" font-size="13" font-weight="800">Five label layers on the same photograph</text>
    <rect x="24" y="452" width="174" height="84" rx="8" fill="#e2e8f0" stroke="#475569"/>
    <text x="34" y="472" fill="#0f172a" font-weight="800">1 · Image grade</text>
    <text x="34" y="490" fill="#0f172a">ICDR 0–4, referable DR,</text>
    <text x="34" y="506" fill="#0f172a">DME, glaucoma suspect,</text>
    <text x="34" y="522" fill="#0f172a">multi-disease (RFMiD 46)</text>

    <rect x="208" y="452" width="174" height="84" rx="8" fill="#fee2e2" stroke="#b91c1c"/>
    <text x="218" y="472" fill="#7f1d1d" font-weight="800">2 · Lesions</text>
    <text x="218" y="490" fill="#7f1d1d">boxes / masks for MA,</text>
    <text x="218" y="506" fill="#7f1d1d">HE, EX, SE (IDRiD, DDR)</text>
    <text x="218" y="522" fill="#7f1d1d">→ PRISM-DR (§3)</text>

    <rect x="392" y="452" width="174" height="84" rx="8" fill="#dcfce7" stroke="#15803d"/>
    <text x="402" y="472" fill="#14532d" font-weight="800">3 · Anatomy</text>
    <text x="402" y="490" fill="#14532d">artery/vein graph, disc</text>
    <text x="402" y="506" fill="#14532d">and cup, fovea; UWF</text>
    <text x="402" y="522" fill="#14532d">zones (§3, §7)</text>

    <rect x="576" y="452" width="174" height="84" rx="8" fill="#ccfbf1" stroke="#0f766e"/>
    <text x="586" y="472" fill="#134e4a" font-weight="800">4 · Quality map</text>
    <text x="586" y="490" fill="#134e4a">per-pixel good / usable /</text>
    <text x="586" y="506" fill="#134e4a">bad (FunPiQ); label-free</text>
    <text x="586" y="522" fill="#134e4a">EFIQA (§6)</text>

    <rect x="760" y="452" width="174" height="84" rx="8" fill="#fef3c7" stroke="#b45309"/>
    <text x="770" y="472" fill="#78350f" font-weight="800">5 · Systemic targets</text>
    <text x="770" y="490" fill="#78350f">retinal age gap, CVD,</text>
    <text x="770" y="506" fill="#78350f">dementia, Parkinson's —</text>
    <text x="770" y="522" fill="#78350f">no visible lesion (§8)</text>
  </g>
</svg>
