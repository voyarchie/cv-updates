<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 580" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" role="img" aria-label="Topic map of the six SAR dense-detection and classification threads">
  <title>Synthetic Aperture Radar — six dense-detection &amp; classification threads</title>
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#94a3b8"/>
    </marker>
  </defs>
  <!-- edges -->
  <g stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#ah)">
    <line x1="450" y1="290" x2="205" y2="140"/>
    <line x1="450" y1="290" x2="450" y2="118"/>
    <line x1="450" y1="290" x2="695" y2="140"/>
    <line x1="450" y1="290" x2="205" y2="445"/>
    <line x1="450" y1="290" x2="450" y2="468"/>
    <line x1="450" y1="290" x2="695" y2="445"/>
  </g>
  <!-- hub -->
  <g>
    <rect x="336" y="246" width="228" height="88" rx="12" fill="#1e293b" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="450" y="276" text-anchor="middle" fill="#f8fafc" font-size="15" font-weight="700">The SAR image</text>
    <text x="450" y="298" text-anchor="middle" fill="#cbd5e1" font-size="12.5">coherent · complex-valued · all-weather</text>
    <text x="450" y="316" text-anchor="middle" fill="#cbd5e1" font-size="12.5">dense detection + classification</text>
  </g>
  <!-- nodes -->
  <g font-size="12" fill="#f8fafc">
    <!-- 1 primitive -->
    <rect x="55" y="86" width="300" height="80" rx="10" fill="#4f46e5" stroke="#3730a3"/>
    <text x="70" y="110" font-size="12.5" font-weight="700">1 · The primitive</text>
    <text x="70" y="128" font-size="11.5" fill="#e0e7ff">active microwave · side-looking geometry</text>
    <text x="70" y="144" font-size="11.5" fill="#e0e7ff">speckle · layover/shadow · amplitude+phase</text>
    <text x="70" y="160" font-size="11.5" fill="#e0e7ff">day/night, cloud-penetrating, sub-metre</text>
    <!-- 2 foundation models -->
    <rect x="300" y="58" width="300" height="80" rx="10" fill="#4f46e5" stroke="#3730a3"/>
    <text x="315" y="82" font-size="12.5" font-weight="700">2 · Foundation models &amp; pretraining</text>
    <text x="315" y="100" font-size="11.5" fill="#e0e7ff">SARATR-X · SAR-JEPA · FG-MAE</text>
    <text x="315" y="116" font-size="11.5" fill="#e0e7ff">SARDet-100K + MSFA · RingMo</text>
    <text x="315" y="132" font-size="11.5" fill="#e0e7ff">gradient-target MIM over speckle</text>
    <!-- 3 ship & oriented detection -->
    <rect x="600" y="86" width="285" height="80" rx="10" fill="#0891b2" stroke="#0e7490"/>
    <text x="615" y="110" font-size="12.5" font-weight="700">3 · Ship &amp; oriented detection</text>
    <text x="615" y="128" font-size="11.5" fill="#cffafe">SSDD · HRSID · RSDD-SAR · LS-SSDD</text>
    <text x="615" y="144" font-size="11.5" fill="#cffafe">oriented DETR/YOLO · inshore clutter</text>
    <text x="615" y="160" font-size="11.5" fill="#cffafe">tiny-target, near-shore false alarms</text>
    <!-- 4 ATR / aircraft / complex-valued -->
    <rect x="55" y="414" width="300" height="86" rx="10" fill="#0891b2" stroke="#0e7490"/>
    <text x="70" y="438" font-size="12.5" font-weight="700">4 · ATR, aircraft &amp; complex-valued</text>
    <text x="70" y="456" font-size="11.5" fill="#cffafe">MSTAR · SAMPLE · SAR-AIRcraft-1.0</text>
    <text x="70" y="472" font-size="11.5" fill="#cffafe">few-shot · synthetic→measured gap</text>
    <text x="70" y="488" font-size="11.5" fill="#cffafe">phase-aware nets · scattering centres</text>
    <!-- 5 PolSAR & despeckling -->
    <rect x="300" y="440" width="300" height="86" rx="10" fill="#7c3aed" stroke="#5b21b6"/>
    <text x="315" y="464" font-size="12.5" font-weight="700">5 · PolSAR &amp; the speckle problem</text>
    <text x="315" y="482" font-size="11.5" fill="#ede9fe">complex CNN/Transformer/Mamba PolSAR</text>
    <text x="315" y="498" font-size="11.5" fill="#ede9fe">self-supervised despeckling (MERLIN)</text>
    <text x="315" y="514" font-size="11.5" fill="#ede9fe">diffusion &amp; transformer denoisers</text>
    <!-- 6 VLM / cross-modal / generative -->
    <rect x="600" y="414" width="285" height="86" rx="10" fill="#7c3aed" stroke="#5b21b6"/>
    <text x="615" y="438" font-size="12.5" font-weight="700">6 · VLM · cross-modal · generative</text>
    <text x="615" y="456" font-size="11.5" fill="#ede9fe">SARChat-Bench · captioning/VQA</text>
    <text x="615" y="472" font-size="11.5" fill="#ede9fe">optical↔SAR fusion &amp; translation</text>
    <text x="615" y="488" font-size="11.5" fill="#ede9fe">diffusion synthesis · SAR change detection</text>
  </g>
  <text x="450" y="558" text-anchor="middle" fill="#94a3b8" font-size="11">Six threads in SAR dense detection &amp; classification — 2026-Jul-19 CV-updates pass</text>
</svg>
