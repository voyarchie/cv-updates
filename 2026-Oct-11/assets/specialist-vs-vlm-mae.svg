<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 450" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" role="img" aria-label="Mean absolute error, lower is better. Panel A, ShanghaiTech Part A: CrowdDiff 47.4, ZIP-B 47.8, CLIP-EBC 55.0, Qwen2.5-VL-7B with LoRA fine-tuning 70.17, smallest ZIP model with 0.81 million parameters 71.1. Panel B, CrowdCue overall MAE on its four-dataset split: specialist alone 84.45, fine-tuned VLM 81.64, VLM given the specialist count as text 72.04, VLM given the count rendered as a digit image 62.65.">
  <title>Crowd counting MAE: specialists vs a fine-tuned VLM</title>
  <rect x="0" y="0" width="960" height="450" rx="10" fill="#f4f6fb" stroke="#cbd5e1"/>
  <text x="24" y="32" fill="#334155" font-size="16.5" font-weight="800">A 7B VLM counts crowds about as well as a 0.81M-parameter specialist</text>
  <text x="24" y="52" fill="#64748b" font-size="11.5">Mean absolute error, lower is better. Specialists in blue, VLM variants in orange. Author-reported numbers; compare within a panel only.</text>

  <g stroke="#cbd5e1" stroke-width="1">
    <line x1="300" y1="72" x2="300" y2="352"/>
    <line x1="440" y1="72" x2="440" y2="352" stroke-dasharray="3 3"/>
    <line x1="580" y1="72" x2="580" y2="352" stroke-dasharray="3 3"/>
    <line x1="720" y1="72" x2="720" y2="352" stroke-dasharray="3 3"/>
    <line x1="860" y1="72" x2="860" y2="352" stroke-dasharray="3 3"/>
  </g>
  <g font-size="10.5" fill="#64748b" text-anchor="middle">
    <text x="300" y="368">0</text><text x="440" y="368">20</text><text x="580" y="368">40</text><text x="720" y="368">60</text><text x="860" y="368">80</text>
  </g>
  <text x="580" y="384" font-size="10.5" fill="#64748b" text-anchor="middle">MAE (people per image)</text>

  <g font-size="11.5">
    <text x="24" y="86" fill="#334155" font-size="12.5" font-weight="800">A · ShanghaiTech Part A</text>

    <text x="24" y="108" fill="#334155">CrowdDiff (diffusion)</text>
    <rect x="300" y="98" width="331.8" height="13" fill="#2f6fd6"/><text x="638" y="109" fill="#334155">47.4</text>

    <text x="24" y="130" fill="#334155">ZIP-B</text>
    <rect x="300" y="120" width="334.6" height="13" fill="#2f6fd6"/><text x="641" y="131" fill="#334155">47.8</text>

    <text x="24" y="152" fill="#334155">CLIP-EBC</text>
    <rect x="300" y="142" width="385.0" height="13" fill="#2f6fd6"/><text x="691" y="153" fill="#334155">55.0</text>

    <text x="24" y="174" fill="#334155">Qwen2.5-VL-7B + LoRA SFT</text>
    <rect x="300" y="164" width="491.2" height="13" fill="#d9822b"/><text x="797" y="175" fill="#334155">70.17</text>

    <text x="24" y="196" fill="#334155">ZIP, smallest (0.81M params)</text>
    <rect x="300" y="186" width="497.7" height="13" fill="#2f6fd6"/><text x="804" y="197" fill="#334155">71.1</text>

    <text x="24" y="236" fill="#334155" font-size="12.5" font-weight="800">B · CrowdCue, overall MAE (4 datasets)</text>

    <text x="24" y="258" fill="#334155">Specialist alone</text>
    <rect x="300" y="248" width="591.2" height="13" fill="#2f6fd6"/><text x="897" y="259" fill="#334155">84.45</text>

    <text x="24" y="280" fill="#334155">VLM, LoRA SFT baseline</text>
    <rect x="300" y="270" width="571.5" height="13" fill="#d9822b"/><text x="877" y="281" fill="#334155">81.64</text>

    <text x="24" y="302" fill="#334155">VLM + specialist count as text</text>
    <rect x="300" y="292" width="504.3" height="13" fill="#d9822b"/><text x="810" y="303" fill="#334155">72.04</text>

    <text x="24" y="324" fill="#334155">VLM + count rendered as digits</text>
    <rect x="300" y="314" width="438.6" height="13" fill="#d9822b"/><text x="745" y="325" fill="#334155">62.65</text>
  </g>

  <g font-size="10.5" fill="#64748b">
    <text x="24" y="408">Panel A: Qwen, CLIP-EBC and CrowdDiff figures as quoted in CrowdCue (arXiv 2609.23012); ZIP figures from ZIP (arXiv 2506.19955).</text>
    <text x="24" y="424">Panel B: CrowdCue's own split (ShanghaiTech A/B, UCF-QNRF, NWPU-Crowd). Feeding a density heatmap as an image did not help in any encoding tried.</text>
  </g>
</svg>
