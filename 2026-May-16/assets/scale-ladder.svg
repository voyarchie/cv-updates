<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 360" role="img" aria-label="Scale ladder: object size definitions across dense-detection benchmarks">
  <title>Scale ladder across small-object benchmarks (2026)</title>
  <desc>Horizontal bands showing the pixel-area ranges defining 'tiny', 'small', 'medium', 'large' objects across COCO, SODA-D, AI-TOD, DOTA-v2 and VisDrone.</desc>
  <style>
    .axis  { stroke: currentColor; stroke-width: 1.2; fill: none; opacity: 0.7; }
    .tick  { stroke: currentColor; stroke-width: 0.8; opacity: 0.45; }
    .lbl   { font: 12px ui-sans-serif, system-ui, sans-serif; fill: currentColor; }
    .hdr   { font: 600 13px ui-sans-serif, system-ui, sans-serif; fill: currentColor; }
    .bench { font: 600 12px ui-sans-serif, system-ui, sans-serif; fill: currentColor; }
    .cap   { font: 11px ui-sans-serif, system-ui, sans-serif; fill: currentColor; opacity: 0.78; }
    .band  { stroke: currentColor; stroke-width: 0.6; }
    .b1 { fill: rgba(99,102,241,0.55); }
    .b2 { fill: rgba(16,185,129,0.55); }
    .b3 { fill: rgba(245,158,11,0.55); }
    .b4 { fill: rgba(239,68,68,0.55); }
    .note  { font: italic 11px ui-sans-serif, system-ui, sans-serif; fill: currentColor; opacity: 0.7; }
  </style>

  <!-- title row -->
  <text class="hdr" x="20"  y="24">Pixel-area ranges defining object scale (log axis, √area in pixels)</text>

  <!-- legend -->
  <g transform="translate(20,40)">
    <rect class="band b1" x="0"   y="0" width="16" height="12"/>
    <text class="lbl" x="22"  y="10">tiny</text>
    <rect class="band b2" x="80"  y="0" width="16" height="12"/>
    <text class="lbl" x="102" y="10">small</text>
    <rect class="band b3" x="170" y="0" width="16" height="12"/>
    <text class="lbl" x="192" y="10">medium</text>
    <rect class="band b4" x="270" y="0" width="16" height="12"/>
    <text class="lbl" x="292" y="10">large</text>
  </g>

  <!-- axis (log scale, in √area) -->
  <line class="axis" x1="180" y1="320" x2="800" y2="320"/>
  <g>
    <!-- ticks at √area = 4, 8, 16, 32, 64, 96, 128, 256 -->
    <g>
      <line class="tick" x1="200" y1="320" x2="200" y2="312"/>
      <text class="lbl"  x="200" y="338" text-anchor="middle">4</text>
      <line class="tick" x1="280" y1="320" x2="280" y2="312"/>
      <text class="lbl"  x="280" y="338" text-anchor="middle">8</text>
      <line class="tick" x1="360" y1="320" x2="360" y2="312"/>
      <text class="lbl"  x="360" y="338" text-anchor="middle">16</text>
      <line class="tick" x1="500" y1="320" x2="500" y2="312"/>
      <text class="lbl"  x="500" y="338" text-anchor="middle">32</text>
      <line class="tick" x1="620" y1="320" x2="620" y2="312"/>
      <text class="lbl"  x="620" y="338" text-anchor="middle">64</text>
      <line class="tick" x1="700" y1="320" x2="700" y2="312"/>
      <text class="lbl"  x="700" y="338" text-anchor="middle">96</text>
      <line class="tick" x1="760" y1="320" x2="760" y2="312"/>
      <text class="lbl"  x="760" y="338" text-anchor="middle">≥128</text>
    </g>
    <text class="lbl" x="490" y="354" text-anchor="middle">√(bounding-box area), pixels</text>
  </g>

  <!-- rows -->
  <!-- COCO -->
  <g transform="translate(0,80)">
    <text class="bench" x="20"  y="14">COCO</text>
    <text class="cap"   x="20"  y="30">small / medium / large only</text>
    <rect class="band b1" x="180" y="0"   width="0"   height="20"/>
    <rect class="band b2" x="200" y="0"   width="300" height="20"/>
    <rect class="band b3" x="500" y="0"   width="200" height="20"/>
    <rect class="band b4" x="700" y="0"   width="100" height="20"/>
  </g>

  <!-- SODA-D -->
  <g transform="translate(0,130)">
    <text class="bench" x="20"  y="14">SODA-D / SODA-A</text>
    <text class="cap"   x="20"  y="30">eXtra-Small adds the ≤6² band</text>
    <rect class="band b1" x="200" y="0"   width="160" height="20"/>
    <rect class="band b2" x="360" y="0"   width="140" height="20"/>
    <rect class="band b3" x="500" y="0"   width="200" height="20"/>
    <rect class="band b4" x="700" y="0"   width="100" height="20"/>
  </g>

  <!-- AI-TOD -->
  <g transform="translate(0,180)">
    <text class="bench" x="20"  y="14">AI-TOD-v2</text>
    <text class="cap"   x="20"  y="30">mean object ≈ 12.8 px</text>
    <rect class="band b1" x="200" y="0"   width="160" height="20"/>
    <rect class="band b2" x="360" y="0"   width="140" height="20"/>
    <rect class="band b3" x="500" y="0"   width="120" height="20"/>
    <rect class="band b4" x="620" y="0"   width="40"  height="20"/>
  </g>

  <!-- VisDrone -->
  <g transform="translate(0,230)">
    <text class="bench" x="20"  y="14">VisDrone-DET</text>
    <text class="cap"   x="20"  y="30">≈ 50 % of objects ≤ 32 px</text>
    <rect class="band b1" x="200" y="0"   width="160" height="20"/>
    <rect class="band b2" x="360" y="0"   width="140" height="20"/>
    <rect class="band b3" x="500" y="0"   width="200" height="20"/>
    <rect class="band b4" x="700" y="0"   width="80"  height="20"/>
  </g>

  <!-- DOTA-v2 -->
  <g transform="translate(0,280)">
    <text class="bench" x="20"  y="14">DOTA-v2 (OBB)</text>
    <text class="cap"   x="20"  y="30">long-tail of large vehicles + tiny ships</text>
    <rect class="band b1" x="200" y="0"   width="80"  height="20"/>
    <rect class="band b2" x="280" y="0"   width="160" height="20"/>
    <rect class="band b3" x="440" y="0"   width="220" height="20"/>
    <rect class="band b4" x="660" y="0"   width="140" height="20"/>
  </g>
</svg>
