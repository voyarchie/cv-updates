<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" role="img" aria-label="Two dense-vision tasks unique to radio astronomy. Left panel: radio-frequency interference flagging, a per-pixel segmentation of the time-frequency dynamic spectrum. Persistent narrow-band transmitters appear as horizontal stripes, broadband bursts as vertical stripes, and satellite or aircraft signals as diagonal or blob-shaped tracks; a flag mask must label every corrupted pixel before imaging, an extreme structured-noise segmentation problem. Right panel: radio-source morphological classification, a fine-grained recognition task. Classes shown are a compact unresolved source, a Fanaroff-Riley type I galaxy that is brightest at its core and fades outward, a Fanaroff-Riley type II galaxy that is edge-brightened with hotspots at the ends of its lobes, a bent-tail source whose lobes are swept back, and an odd radio circle, a ring-shaped source class first found at scale by machine object detection. Morphology is defined by shape at arbitrary orientation, so the classifier must be rotation invariant and a bounding box is a poor target.">
  <title>Two radio-only dense tasks: RFI flagging as segmentation, and morphology as fine-grained class</title>

  <!-- self-contained light card -->
  <rect x="0" y="0" width="1000" height="470" rx="10" fill="#f4f6fb" stroke="#cbd5e1" stroke-width="1"/>

  <!-- ================= LEFT: RFI dynamic spectrum ================= -->
  <text x="24" y="34" fill="#334155" font-size="15" font-weight="800">RFI flagging = segmenting the dynamic spectrum</text>
  <text x="24" y="52" fill="#64748b" font-size="11">structured noise must be masked per pixel before an image can be made</text>

  <g>
    <rect x="24" y="64" width="300" height="300" rx="6" fill="#070b16" stroke="#334155" stroke-width="2"/>
    <text x="34" y="82" fill="#94a3b8" font-size="10">frequency &#8593;   /   time &#8594;</text>
    <!-- faint astronomical background speckle -->
    <g fill="#1e293b">
      <rect x="60" y="120" width="6" height="6"/><rect x="130" y="180" width="6" height="6"/>
      <rect x="220" y="140" width="6" height="6"/><rect x="180" y="300" width="6" height="6"/>
      <rect x="90" y="330" width="6" height="6"/><rect x="270" y="250" width="6" height="6"/>
    </g>
    <!-- persistent narrow-band transmitters: horizontal stripes -->
    <rect x="34" y="118" width="280" height="7" fill="#f43f5e" fill-opacity="0.85"/>
    <rect x="34" y="200" width="280" height="5" fill="#f43f5e" fill-opacity="0.75"/>
    <rect x="34" y="286" width="280" height="6" fill="#f43f5e" fill-opacity="0.8"/>
    <!-- broadband bursts: vertical stripes -->
    <rect x="120" y="94" width="8" height="260" fill="#fb923c" fill-opacity="0.8"/>
    <rect x="240" y="94" width="6" height="260" fill="#fb923c" fill-opacity="0.7"/>
    <!-- satellite / aircraft: diagonal track -->
    <line x1="60" y1="340" x2="300" y2="150" stroke="#a78bfa" stroke-width="7" stroke-opacity="0.8" stroke-linecap="round"/>
    <text x="34" y="352" fill="#64748b" font-size="9.5">raw visibilities: astronomy buried under RFI</text>
  </g>

  <!-- arrow to mask -->
  <text x="335" y="210" fill="#64748b" font-size="10">flag</text>
  <path d="M330,220 L356,220" stroke="#64748b" stroke-width="2" marker-end="url(#rm-arr)"/>
  <defs>
    <marker id="rm-arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- mask -->
  <g>
    <rect x="360" y="64" width="120" height="300" rx="6" fill="#0b1220" stroke="#334155" stroke-width="2"/>
    <text x="370" y="82" fill="#5eead4" font-size="10">flag mask</text>
    <rect x="365" y="118" width="110" height="7" fill="#2dd4bf" fill-opacity="0.9"/>
    <rect x="365" y="200" width="110" height="5" fill="#2dd4bf" fill-opacity="0.9"/>
    <rect x="365" y="286" width="110" height="6" fill="#2dd4bf" fill-opacity="0.9"/>
    <rect x="420" y="94" width="8" height="260" fill="#2dd4bf" fill-opacity="0.9"/>
    <line x1="385" y1="340" x2="470" y2="150" stroke="#2dd4bf" stroke-width="7" stroke-opacity="0.9" stroke-linecap="round"/>
    <text x="370" y="352" fill="#64748b" font-size="9">1 = corrupted</text>
  </g>

  <!-- ================= RIGHT: morphology classes ================= -->
  <line x1="510" y1="64" x2="510" y2="364" stroke="#cbd5e1" stroke-width="1"/>
  <text x="536" y="34" fill="#334155" font-size="15" font-weight="800">Morphology is the class — and the sky has no &#8220;up&#8221;</text>
  <text x="536" y="52" fill="#64748b" font-size="11">fine-grained recognition at arbitrary orientation, so no boxes, rotation-invariant</text>

  <!-- class icons row 1 -->
  <g>
    <!-- compact -->
    <rect x="536" y="72" width="140" height="132" rx="8" fill="#070b16" stroke="#334155" stroke-width="1.5"/>
    <circle cx="606" cy="130" r="14" fill="url(#rm-hot)"/>
    <text x="546" y="192" fill="#cbd5e1" font-size="11" font-weight="600">compact</text>
    <text x="546" y="90" fill="#64748b" font-size="9">unresolved</text>

    <!-- FR-I -->
    <rect x="690" y="72" width="140" height="132" rx="8" fill="#070b16" stroke="#334155" stroke-width="1.5"/>
    <ellipse cx="740" cy="138" rx="20" ry="9" fill="url(#rm-warm)"/>
    <ellipse cx="785" cy="120" rx="20" ry="9" fill="url(#rm-warm)"/>
    <circle cx="762" cy="129" r="9" fill="url(#rm-hot)"/>
    <text x="700" y="192" fill="#cbd5e1" font-size="11" font-weight="600">FR-I</text>
    <text x="700" y="90" fill="#64748b" font-size="9">core-bright, fades out</text>

    <!-- FR-II -->
    <rect x="844" y="72" width="132" height="132" rx="8" fill="#070b16" stroke="#334155" stroke-width="1.5"/>
    <circle cx="910" cy="130" r="5" fill="#fde68a"/>
    <line x1="876" y1="150" x2="944" y2="112" stroke="#f59e0b" stroke-width="3" stroke-opacity="0.5"/>
    <circle cx="876" cy="150" r="12" fill="url(#rm-hot)"/>
    <circle cx="944" cy="112" r="12" fill="url(#rm-hot)"/>
    <text x="854" y="192" fill="#cbd5e1" font-size="11" font-weight="600">FR-II</text>
    <text x="854" y="90" fill="#64748b" font-size="9">edge-bright hotspots</text>
  </g>

  <!-- class icons row 2 -->
  <g>
    <!-- bent-tail -->
    <rect x="536" y="216" width="200" height="132" rx="8" fill="#070b16" stroke="#334155" stroke-width="1.5"/>
    <circle cx="636" cy="248" r="9" fill="url(#rm-hot)"/>
    <path d="M636,248 Q590,290 566,320" fill="none" stroke="#60a5fa" stroke-width="10" stroke-opacity="0.6" stroke-linecap="round"/>
    <path d="M636,248 Q686,290 710,320" fill="none" stroke="#60a5fa" stroke-width="10" stroke-opacity="0.6" stroke-linecap="round"/>
    <text x="546" y="336" fill="#cbd5e1" font-size="11" font-weight="600">bent-tail</text>
    <text x="546" y="234" fill="#64748b" font-size="9">lobes swept back by cluster gas</text>

    <!-- ORC -->
    <rect x="750" y="216" width="226" height="132" rx="8" fill="#070b16" stroke="#334155" stroke-width="1.5"/>
    <circle cx="840" cy="282" r="34" fill="none" stroke="#a78bfa" stroke-width="7" stroke-opacity="0.8"/>
    <circle cx="840" cy="282" r="5" fill="url(#rm-hot)"/>
    <text x="760" y="336" fill="#cbd5e1" font-size="11" font-weight="600">odd radio circle (ORC)</text>
    <text x="760" y="234" fill="#64748b" font-size="9">new class found by ML object detection</text>
  </g>

  <defs>
    <radialGradient id="rm-hot" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff7ed"/>
      <stop offset="45%" stop-color="#fb923c" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#fb923c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="rm-warm" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fecaca"/>
      <stop offset="55%" stop-color="#f87171" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#f87171" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- bottom caption -->
  <text x="24" y="392" fill="#334155" font-size="12" font-weight="700">Both tasks are structurally unlike natural-image vision:</text>
  <text x="24" y="414" fill="#475569" font-size="11.5">RFI flagging is precision segmentation of adversarial structured noise at extreme class imbalance — the &#8220;hard-negative&#8221; step that gates every image.</text>
  <text x="24" y="434" fill="#475569" font-size="11.5">Morphology is a rotation-invariant, shape-defined fine-grained class over extended, multi-component sources — which is why the field went to segmentation</text>
  <text x="24" y="452" fill="#475569" font-size="11.5">and component-association models, group-equivariant CNNs, and self-supervised backbones rather than axis-aligned box detectors.</text>
</svg>
