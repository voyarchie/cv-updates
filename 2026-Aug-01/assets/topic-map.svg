<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" role="img" aria-label="Topic map of the six PET / molecular-imaging dense-detection and classification threads in this report">
  <title>PET / molecular imaging &#8212; six dense-detection &amp; classification threads</title>
  <defs>
    <marker id="tm" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#94a3b8"/>
    </marker>
  </defs>
  <!-- edges -->
  <g stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#tm)">
    <line x1="450" y1="320" x2="205" y2="140"/>
    <line x1="450" y1="320" x2="450" y2="118"/>
    <line x1="450" y1="320" x2="695" y2="140"/>
    <line x1="450" y1="320" x2="205" y2="500"/>
    <line x1="450" y1="320" x2="450" y2="522"/>
    <line x1="450" y1="320" x2="695" y2="500"/>
  </g>
  <!-- hub -->
  <g>
    <rect x="304" y="272" width="292" height="96" rx="12" fill="#0f172a" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="450" y="302" text-anchor="middle" fill="#f8fafc" font-size="15" font-weight="700">The tracer-uptake image</text>
    <text x="450" y="324" text-anchor="middle" fill="#cbd5e1" font-size="12.5">function on anatomy &#183; SUV &#183; physiologic</text>
    <text x="450" y="342" text-anchor="middle" fill="#cbd5e1" font-size="12.5">uptake as structured background &#183;</text>
    <text x="450" y="360" text-anchor="middle" fill="#cbd5e1" font-size="12.5">tracer- &amp; scanner-dependent domain shift</text>
  </g>
  <!-- nodes -->
  <g>
    <!-- 1 primitive (top-left) -->
    <rect x="45" y="80" width="300" height="92" rx="10" fill="#4f46e5" stroke="#3730a3"/>
    <text x="60" y="104" fill="#f8fafc" font-size="12.5" font-weight="700">1 &#183; The primitive (&#167;3)</text>
    <text x="60" y="123" fill="#e0e7ff" font-size="11.5">positron decay &#8594; 511 keV pair &#8594; SUV</text>
    <text x="60" y="140" fill="#e0e7ff" font-size="11.5">PET/CT &amp; PET/MR fusion; count noise</text>
    <text x="60" y="157" fill="#e0e7ff" font-size="11.5">partial-volume; why bright &#8800; lesion</text>

    <!-- 2 lesion detection (top-center) -->
    <rect x="300" y="28" width="300" height="92" rx="10" fill="#0f766e" stroke="#115e59"/>
    <text x="315" y="52" fill="#f8fafc" font-size="12.5" font-weight="700">2 &#183; Whole-body lesion seg (&#167;4)</text>
    <text x="315" y="71" fill="#ccfbf1" font-size="11.5">autoPET I&#8211;III &#183; nnU-Net dominance</text>
    <text x="315" y="88" fill="#ccfbf1" font-size="11.5">FP-volume / FN-volume metrics</text>
    <text x="315" y="105" fill="#ccfbf1" font-size="11.5">physiologic-uptake false positives</text>

    <!-- 3 head&neck (top-right) -->
    <rect x="555" y="80" width="300" height="92" rx="10" fill="#9333ea" stroke="#6b21a8"/>
    <text x="570" y="104" fill="#f8fafc" font-size="12.5" font-weight="700">3 &#183; Head &amp; neck / GTV (&#167;5)</text>
    <text x="570" y="123" fill="#f3e8ff" font-size="11.5">HECKTOR PET/CT tumour + node seg</text>
    <text x="570" y="140" fill="#f3e8ff" font-size="11.5">recurrence-free-survival prediction</text>
    <text x="570" y="157" fill="#f3e8ff" font-size="11.5">registered dual-channel GTV heads</text>

    <!-- 4 classification/staging (bottom-left) -->
    <rect x="45" y="500" width="300" height="92" rx="10" fill="#b45309" stroke="#92400e"/>
    <text x="60" y="524" fill="#f8fafc" font-size="12.5" font-weight="700">4 &#183; Classification &amp; staging (&#167;6)</text>
    <text x="60" y="543" fill="#fde68a" font-size="11.5">lymphoma Deauville &#183; PSMA miTNM</text>
    <text x="60" y="560" fill="#fde68a" font-size="11.5">amyloid / FDG-brain dementia</text>
    <text x="60" y="577" fill="#fde68a" font-size="11.5">outcome / response prognosis</text>

    <!-- 5 foundation/VLM (bottom-center) -->
    <rect x="300" y="522" width="300" height="92" rx="10" fill="#be123c" stroke="#9f1239"/>
    <text x="315" y="546" fill="#f8fafc" font-size="12.5" font-weight="700">5 &#183; FMs, SAM &amp; VLMs (&#167;7)</text>
    <text x="315" y="565" fill="#ffe4e6" font-size="11.5">promptable PET lesion FMs</text>
    <text x="315" y="582" fill="#ffe4e6" font-size="11.5">report generation &#183; PET VQA</text>
    <text x="315" y="599" fill="#ffe4e6" font-size="11.5">SAM adapted to 3D uptake</text>

    <!-- 6 domain/total-body (bottom-right) -->
    <rect x="555" y="500" width="300" height="92" rx="10" fill="#0369a1" stroke="#075985"/>
    <text x="570" y="524" fill="#f8fafc" font-size="12.5" font-weight="700">6 &#183; Shift, total-body, denoise (&#167;8)</text>
    <text x="570" y="543" fill="#e0f2fe" font-size="11.5">FDG&#8596;PSMA&#8596;FAPI generalisation</text>
    <text x="570" y="560" fill="#e0f2fe" font-size="11.5">total-body (uEXPLORER) &amp; dynamic</text>
    <text x="570" y="577" fill="#e0f2fe" font-size="11.5">low-dose denoising feeding detection</text>
  </g>
</svg>
