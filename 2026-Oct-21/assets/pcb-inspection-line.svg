<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" role="img" aria-label="Diagram of the PCB inspection image along an electronics assembly line. Five inspection points, left to right: bare-board AOI on the fabricated board, where defects are copper-pattern faults such as open, short, mouse bite, spur and spurious copper, found by comparing against a golden reference or CAD; solder paste inspection (SPI) after printing, a 3D height map of each paste deposit measuring volume, area, height and offset; pre-reflow AOI after component placement, checking missing, shifted, rotated or wrong components; post-reflow AOI, a multi-angle colour and 3D image of each solder joint, where the task is to separate true defects such as bridge, insufficient solder, tombstone or lifted lead from false calls; and automated X-ray inspection for hidden joints such as BGA voids. A bar at the bottom shows that machine calls drop sharply after the AI false-call filter before the human review station, and that SPI and AOI measurements can be linked per pad to predict defects before reflow.">
  <title>The PCB inspection image: five checkpoints on one assembly line</title>
  <rect x="0" y="0" width="960" height="420" rx="10" fill="#f4f6fb" stroke="#cbd5e1"/>
  <text x="24" y="34" fill="#334155" font-size="17" font-weight="800">The PCB inspection image: five checkpoints, one board</text>
  <text x="24" y="54" fill="#64748b" font-size="11.5">Each checkpoint sees a different image of the same board; the label space changes from copper geometry to paste volume to joint shape.</text>

  <!-- conveyor -->
  <line x1="24" y1="250" x2="936" y2="250" stroke="#94a3b8" stroke-width="3"/>
  <polygon points="936,244 948,250 936,256" fill="#94a3b8"/>

  <g font-size="11" text-anchor="middle">
    <!-- 1 bare board -->
    <rect x="24" y="72" width="170" height="160" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="109" y="94" fill="#334155" font-size="13" font-weight="700">① Bare-board AOI</text>
    <text x="109" y="110" fill="#64748b">2D · golden ref. / CAD</text>
    <rect x="44" y="122" width="130" height="58" fill="#e2e8f0" stroke="#94a3b8"/>
    <g stroke="#0e7490" stroke-width="4" fill="none">
      <line x1="52" y1="136" x2="166" y2="136"/>
      <line x1="52" y1="152" x2="100" y2="152"/><line x1="110" y1="152" x2="166" y2="152"/>
      <line x1="52" y1="168" x2="166" y2="168"/>
    </g>
    <circle cx="105" cy="152" r="9" fill="none" stroke="#b45309" stroke-width="2"/>
    <text x="109" y="198" fill="#334155">open · short · mouse bite</text>
    <text x="109" y="214" fill="#64748b">spur · spurious copper</text>

    <!-- 2 SPI -->
    <rect x="206" y="72" width="170" height="160" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="291" y="94" fill="#334155" font-size="13" font-weight="700">② SPI (3D)</text>
    <text x="291" y="110" fill="#64748b">height map per deposit</text>
    <rect x="226" y="122" width="130" height="58" fill="#e2e8f0" stroke="#94a3b8"/>
    <g fill="#0e7490">
      <rect x="240" y="150" width="20" height="22"/><rect x="270" y="142" width="20" height="30"/>
      <rect x="300" y="160" width="20" height="12" fill="#b45309"/><rect x="330" y="146" width="16" height="26"/>
    </g>
    <text x="291" y="198" fill="#334155">volume · area · height</text>
    <text x="291" y="214" fill="#64748b">offset · bridging paste</text>

    <!-- 3 pre-reflow -->
    <rect x="388" y="72" width="170" height="160" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="473" y="94" fill="#334155" font-size="13" font-weight="700">③ Pre-reflow AOI</text>
    <text x="473" y="110" fill="#64748b">placement check</text>
    <rect x="408" y="122" width="130" height="58" fill="#e2e8f0" stroke="#94a3b8"/>
    <rect x="420" y="136" width="34" height="18" fill="#475569"/>
    <rect x="470" y="134" width="34" height="18" fill="#475569" transform="rotate(14 487 143)"/>
    <rect x="420" y="160" width="34" height="14" fill="none" stroke="#b45309" stroke-width="2" stroke-dasharray="4 3"/>
    <text x="473" y="198" fill="#334155">missing · shifted</text>
    <text x="473" y="214" fill="#64748b">rotated · wrong part</text>

    <!-- 4 post-reflow -->
    <rect x="570" y="72" width="170" height="160" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="655" y="94" fill="#334155" font-size="13" font-weight="700">④ Post-reflow AOI</text>
    <text x="655" y="110" fill="#64748b">multi-angle RGB + 3D</text>
    <rect x="590" y="122" width="130" height="58" fill="#e2e8f0" stroke="#94a3b8"/>
    <rect x="625" y="138" width="60" height="22" fill="#475569"/>
    <path d="M605 172 Q615 152 625 160 L625 172 Z" fill="#0e7490"/>
    <path d="M685 160 Q695 152 705 172 L685 172 Z" fill="#0e7490"/>
    <rect x="640" y="164" width="30" height="8" fill="#b45309"/>
    <text x="655" y="198" fill="#334155">bridge · insufficient</text>
    <text x="655" y="214" fill="#64748b">tombstone · lifted lead</text>

    <!-- 5 AXI -->
    <rect x="752" y="72" width="184" height="160" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="844" y="94" fill="#334155" font-size="13" font-weight="700">⑤ X-ray (AXI)</text>
    <text x="844" y="110" fill="#64748b">2D / 2.5D / CT</text>
    <rect x="779" y="122" width="130" height="58" fill="#e2e8f0" stroke="#94a3b8"/>
    <g fill="#64748b">
      <circle cx="806" cy="140" r="9"/><circle cx="834" cy="140" r="9"/><circle cx="862" cy="140" r="9"/><circle cx="890" cy="140" r="9"/>
      <circle cx="806" cy="164" r="9"/><circle cx="834" cy="164" r="9"/><circle cx="862" cy="164" r="9"/><circle cx="890" cy="164" r="9"/>
    </g>
    <circle cx="862" cy="164" r="4" fill="#f4f6fb"/><circle cx="836" cy="138" r="3" fill="#f4f6fb"/>
    <text x="844" y="198" fill="#334155">BGA voids · head-in-pillow</text>
    <text x="844" y="214" fill="#64748b">hidden-joint bridges</text>
  </g>

  <!-- bottom: false-call funnel -->
  <text x="24" y="284" fill="#334155" font-size="13" font-weight="700">What the line actually optimises</text>
  <g font-size="11.5">
    <rect x="24" y="296" width="430" height="26" rx="4" fill="#0e7490" opacity="0.18" stroke="#0e7490"/>
    <text x="34" y="314" fill="#334155">Machine calls from ④ (rule-based thresholds, tuned for zero escapes)</text>
    <rect x="24" y="328" width="190" height="26" rx="4" fill="#0e7490" opacity="0.35" stroke="#0e7490"/>
    <text x="34" y="346" fill="#334155">After AI false-call filter</text>
    <rect x="24" y="360" width="56" height="26" rx="4" fill="#b45309" opacity="0.35" stroke="#b45309"/>
    <text x="90" y="378" fill="#334155">True defects → rework</text>

    <rect x="490" y="296" width="446" height="90" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="506" y="318" fill="#334155" font-weight="700">Closed loop (per pad / per component)</text>
    <text x="506" y="338" fill="#64748b">② paste measurements + ③ placement offsets → predict ④ outcome</text>
    <text x="506" y="356" fill="#64748b">before reflow (e.g. PADS); ④ results feed back to printer and</text>
    <text x="506" y="374" fill="#64748b">mounter settings. Metric: escapes and false calls, not mAP.</text>
  </g>
</svg>
