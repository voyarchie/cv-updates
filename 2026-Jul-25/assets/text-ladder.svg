<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" role="img" aria-label="The text-in-image pipeline: object hierarchy to detect to spot to parse the whole page">
  <title>From glyph to page — the four rungs of dense text understanding</title>
  <defs>
    <marker id="a2" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#94a3b8"/>
    </marker>
  </defs>

  <!-- title strip (dark band so white text reads on light OR dark pages) -->
  <rect x="12" y="8" width="876" height="54" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  <text x="26" y="32" fill="#f8fafc" font-size="15" font-weight="700">The object is a string of glyphs, and it nests</text>
  <text x="26" y="52" fill="#cbd5e1" font-size="12">an open-vocabulary label (the transcription) attached to an arbitrarily-shaped region that lives inside a larger region</text>

  <!-- stage 1: hierarchy -->
  <g>
    <rect x="20" y="78" width="185" height="300" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
    <text x="112" y="104" text-anchor="middle" fill="#f8fafc" font-size="13" font-weight="700">1 &#183; The hierarchy</text>
    <text x="112" y="122" text-anchor="middle" fill="#94a3b8" font-size="10.5">glyph &#8834; word &#8834; line &#8834; region</text>
    <!-- nested boxes -->
    <rect x="40" y="140" width="146" height="210" rx="6" fill="none" stroke="#b45309" stroke-width="1.6" stroke-dasharray="4 3"/>
    <text x="46" y="156" fill="#fbbf24" font-size="9.5">region / paragraph</text>
    <rect x="50" y="166" width="126" height="40" rx="4" fill="none" stroke="#7c3aed" stroke-width="1.6"/>
    <text x="55" y="180" fill="#c4b5fd" font-size="9">text line</text>
    <rect x="56" y="186" width="52" height="14" rx="2" fill="#0369a1"/>
    <rect x="112" y="186" width="40" height="14" rx="2" fill="#0369a1"/>
    <rect x="50" y="216" width="126" height="40" rx="4" fill="none" stroke="#7c3aed" stroke-width="1.6"/>
    <rect x="56" y="236" width="70" height="14" rx="2" fill="#0369a1"/>
    <rect x="130" y="236" width="22" height="14" rx="2" fill="#0369a1"/>
    <!-- word broken to glyphs -->
    <rect x="50" y="272" width="126" height="60" rx="4" fill="none" stroke="#0d9488" stroke-width="1.6"/>
    <text x="55" y="286" fill="#5eead4" font-size="9">word &#8594; glyphs</text>
    <g fill="#0d9488">
      <rect x="56" y="294" width="16" height="26" rx="2"/>
      <rect x="76" y="294" width="16" height="26" rx="2"/>
      <rect x="96" y="294" width="16" height="26" rx="2"/>
      <rect x="116" y="294" width="16" height="26" rx="2"/>
    </g>
    <text x="112" y="366" text-anchor="middle" fill="#cbd5e1" font-size="9.5">reading order links them</text>
  </g>
  <line x1="210" y1="228" x2="251" y2="228" stroke="#94a3b8" stroke-width="2" marker-end="url(#a2)"/>

  <!-- stage 2: detect -->
  <g>
    <rect x="256" y="78" width="180" height="300" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
    <text x="346" y="104" text-anchor="middle" fill="#f8fafc" font-size="13" font-weight="700">2 &#183; Detect</text>
    <text x="346" y="122" text-anchor="middle" fill="#94a3b8" font-size="10.5">localise arbitrary shape</text>
    <!-- curved text region + polygon -->
    <path d="M280,190 Q346,150 412,190 Q346,168 280,190 Z" fill="#0d9488" opacity="0.85"/>
    <path d="M280,190 Q346,150 412,190 L406,214 Q346,178 286,214 Z" fill="none" stroke="#f8fafc" stroke-width="1.4" stroke-dasharray="3 2"/>
    <text x="346" y="236" text-anchor="middle" fill="#5eead4" font-size="9.5">contour / Bezier polygon</text>
    <!-- seg map -->
    <rect x="286" y="256" width="120" height="56" rx="5" fill="#334155" stroke="#64748b"/>
    <g fill="#38bdf8">
      <rect x="296" y="266" width="40" height="10" rx="2"/>
      <rect x="296" y="282" width="60" height="10" rx="2"/>
      <rect x="296" y="298" width="30" height="10" rx="2"/>
    </g>
    <text x="346" y="330" text-anchor="middle" fill="#cbd5e1" font-size="9">shrink-mask (DBNet++) or</text>
    <text x="346" y="344" text-anchor="middle" fill="#cbd5e1" font-size="9">point queries (DPText-DETR)</text>
  </g>
  <line x1="441" y1="228" x2="482" y2="228" stroke="#94a3b8" stroke-width="2" marker-end="url(#a2)"/>

  <!-- stage 3: spot -->
  <g>
    <rect x="487" y="78" width="180" height="300" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
    <text x="577" y="104" text-anchor="middle" fill="#f8fafc" font-size="13" font-weight="700">3 &#183; Spot</text>
    <text x="577" y="122" text-anchor="middle" fill="#94a3b8" font-size="10.5">detect + recognise, one decoder</text>
    <rect x="507" y="150" width="140" height="44" rx="6" fill="#0369a1" stroke="#075985"/>
    <text x="577" y="178" text-anchor="middle" fill="#f8fafc" font-size="18" font-weight="700" letter-spacing="3">SALE</text>
    <text x="577" y="212" text-anchor="middle" fill="#e0f2fe" font-size="10">polygon &#8594; "SALE" (transcription)</text>
    <!-- point queries -->
    <g fill="#38bdf8">
      <circle cx="522" cy="240" r="4"/><circle cx="542" cy="238" r="4"/>
      <circle cx="562" cy="238" r="4"/><circle cx="582" cy="238" r="4"/>
      <circle cx="602" cy="238" r="4"/><circle cx="622" cy="240" r="4"/>
    </g>
    <text x="577" y="262" text-anchor="middle" fill="#cbd5e1" font-size="9.5">ordered point queries carry</text>
    <text x="577" y="276" text-anchor="middle" fill="#cbd5e1" font-size="9.5">both shape &amp; characters</text>
    <text x="577" y="304" text-anchor="middle" fill="#94a3b8" font-size="9">DeepSolo &#183; ESTextSpotter</text>
    <text x="577" y="318" text-anchor="middle" fill="#94a3b8" font-size="9">SPTS (single point) &#183; UNITS</text>
    <text x="577" y="344" text-anchor="middle" fill="#94a3b8" font-size="9">open-vocab: any glyph string</text>
  </g>
  <line x1="672" y1="228" x2="713" y2="228" stroke="#94a3b8" stroke-width="2" marker-end="url(#a2)"/>

  <!-- stage 4: parse -->
  <g>
    <rect x="718" y="78" width="162" height="300" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
    <text x="799" y="104" text-anchor="middle" fill="#f8fafc" font-size="13" font-weight="700">4 &#183; Parse the page</text>
    <text x="799" y="122" text-anchor="middle" fill="#94a3b8" font-size="10.5">layout + order + structure</text>
    <!-- page with regions -->
    <rect x="736" y="140" width="60" height="90" rx="4" fill="#0f172a" stroke="#64748b"/>
    <rect x="742" y="148" width="48" height="8" rx="2" fill="#7c3aed"/>
    <rect x="742" y="160" width="48" height="20" rx="2" fill="#be123c"/>
    <rect x="742" y="184" width="22" height="40" rx="2" fill="#0369a1"/>
    <rect x="768" y="184" width="22" height="40" rx="2" fill="#0369a1"/>
    <text x="740" y="244" fill="#94a3b8" font-size="8.5">title/table/cols</text>
    <!-- arrow to structured output -->
    <line x1="800" y1="188" x2="820" y2="188" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#a2)"/>
    <rect x="810" y="150" width="62" height="80" rx="4" fill="#be123c" stroke="#9f1239"/>
    <text x="841" y="168" text-anchor="middle" fill="#ffe4e6" font-size="8.5"># Markdown</text>
    <text x="841" y="182" text-anchor="middle" fill="#ffe4e6" font-size="8.5">&lt;table&gt;</text>
    <text x="841" y="196" text-anchor="middle" fill="#ffe4e6" font-size="8.5">$\LaTeX$</text>
    <text x="841" y="210" text-anchor="middle" fill="#ffe4e6" font-size="8.5">JSON</text>
    <text x="799" y="264" text-anchor="middle" fill="#cbd5e1" font-size="9">modular pipeline&#8230;</text>
    <text x="799" y="282" text-anchor="middle" fill="#cbd5e1" font-size="9">or one VLM reads it all</text>
    <text x="799" y="300" text-anchor="middle" fill="#fca5a5" font-size="9">GOT-OCR2.0 &#183; Qwen2.5-VL</text>
    <text x="799" y="314" text-anchor="middle" fill="#fca5a5" font-size="9">olmOCR &#183; dots.ocr &#183; MinerU</text>
    <text x="799" y="340" text-anchor="middle" fill="#94a3b8" font-size="9">TEDS / edit-distance judge it</text>
  </g>

  <text x="20" y="410" fill="#64748b" font-size="10.5">Each rung adds a harder output: a box, then a box+string, then a whole reading-ordered document tree. The label space is open — you predict text, not a class id.</text>
  <text x="20" y="430" fill="#64748b" font-size="10.5">The 2024&#8211;2026 shift: rungs 2&#8211;4 are collapsing into a single sequence-generation model, trading pipeline control for end-to-end coverage (and new failure modes).</text>
</svg>
