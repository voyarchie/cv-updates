<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" role="img" aria-label="Topic map of the six text-in-image dense-detection and classification threads">
  <title>Text-in-image (the page) — six dense-detection &amp; classification threads</title>
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#94a3b8"/>
    </marker>
  </defs>
  <!-- edges -->
  <g stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#ah)">
    <line x1="450" y1="300" x2="180" y2="152"/>
    <line x1="450" y1="300" x2="452" y2="128"/>
    <line x1="450" y1="300" x2="740" y2="152"/>
    <line x1="450" y1="300" x2="180" y2="464"/>
    <line x1="450" y1="300" x2="452" y2="490"/>
    <line x1="450" y1="300" x2="740" y2="464"/>
  </g>
  <!-- hub -->
  <g>
    <rect x="316" y="256" width="268" height="88" rx="12" fill="#1e293b" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="450" y="286" text-anchor="middle" fill="#f8fafc" font-size="15" font-weight="700">The page / text-in-image</text>
    <text x="450" y="308" text-anchor="middle" fill="#cbd5e1" font-size="12.5">glyph &#8594; word &#8594; line &#8594; region</text>
    <text x="450" y="326" text-anchor="middle" fill="#cbd5e1" font-size="12.5">the densest detection problem there is</text>
  </g>
  <!-- nodes -->
  <g>
    <!-- 1 primitive -->
    <rect x="35" y="92" width="270" height="86" rx="10" fill="#4f46e5" stroke="#3730a3"/>
    <text x="50" y="116" fill="#f8fafc" font-size="12.5" font-weight="700">1 &#183; The primitive (&#167;3)</text>
    <text x="50" y="134" font-size="11.5" fill="#e0e7ff">arbitrary shape &#183; extreme aspect ratio</text>
    <text x="50" y="150" font-size="11.5" fill="#e0e7ff">tiny + dense &#183; reading order</text>
    <text x="50" y="166" font-size="11.5" fill="#e0e7ff">open vocab of glyph strings, not classes</text>
    <!-- 2 detection -->
    <rect x="325" y="92" width="255" height="86" rx="10" fill="#0d9488" stroke="#0f766e"/>
    <text x="340" y="116" fill="#f8fafc" font-size="12.5" font-weight="700">2 &#183; Scene-text detection (&#167;4)</text>
    <text x="340" y="134" font-size="11.5" fill="#ccfbf1">segmentation (DBNet++) &#183; contour</text>
    <text x="340" y="150" font-size="11.5" fill="#ccfbf1">(FCENet / TextBPN++)</text>
    <text x="340" y="166" font-size="11.5" fill="#ccfbf1">query set (DPText-DETR)</text>
    <!-- 3 spotting -->
    <rect x="600" y="92" width="285" height="86" rx="10" fill="#0369a1" stroke="#075985"/>
    <text x="615" y="116" fill="#f8fafc" font-size="12.5" font-weight="700">3 &#183; End-to-end spotting (&#167;5)</text>
    <text x="615" y="134" font-size="11.5" fill="#e0f2fe">detect + recognise, one decoder</text>
    <text x="615" y="150" font-size="11.5" fill="#e0f2fe">DeepSolo &#183; ESTextSpotter &#183; SPTS</text>
    <text x="615" y="166" font-size="11.5" fill="#e0f2fe">Bridging Text Spotting &#183; UNITS</text>
    <!-- 4 layout -->
    <rect x="35" y="424" width="270" height="86" rx="10" fill="#7c3aed" stroke="#6d28d9"/>
    <text x="50" y="448" fill="#f8fafc" font-size="12.5" font-weight="700">4 &#183; Layout, tables &amp; formulas (&#167;6)</text>
    <text x="50" y="466" font-size="11.5" fill="#ede9fe">DocLayout-YOLO &#183; DiT &#183; VGT</text>
    <text x="50" y="482" font-size="11.5" fill="#ede9fe">TATR / UniTable (TEDS) &#183; reading order</text>
    <text x="50" y="498" font-size="11.5" fill="#ede9fe">math: UniMERNet &#183; pix2tex</text>
    <!-- 5 monolithic -->
    <rect x="325" y="424" width="255" height="86" rx="10" fill="#be123c" stroke="#9f1239"/>
    <text x="340" y="448" fill="#f8fafc" font-size="12.5" font-weight="700">5 &#183; Monolithic VLM parsing (&#167;7)</text>
    <text x="340" y="466" font-size="11.5" fill="#ffe4e6">OCR-free, one model reads the page</text>
    <text x="340" y="482" font-size="11.5" fill="#ffe4e6">GOT-OCR2.0 &#183; Qwen2.5-VL</text>
    <text x="340" y="498" font-size="11.5" fill="#ffe4e6">olmOCR &#183; dots.ocr &#183; DeepSeek-OCR</text>
    <!-- 6 benchmarks -->
    <rect x="600" y="424" width="285" height="86" rx="10" fill="#b45309" stroke="#92400e"/>
    <text x="615" y="448" fill="#f8fafc" font-size="12.5" font-weight="700">6 &#183; Benchmarks &amp; open problems (&#167;8)</text>
    <text x="615" y="466" font-size="11.5" fill="#fef3c7">HierText &#183; OmniDocBench &#183; OCRBench v2</text>
    <text x="615" y="482" font-size="11.5" fill="#fef3c7">dense-tiny &#183; multilingual &#183; reading order</text>
    <text x="615" y="498" font-size="11.5" fill="#fef3c7">VLM hallucination &#183; TEDS / 1-NED metrics</text>
  </g>
  <text x="450" y="565" text-anchor="middle" fill="#94a3b8" font-size="11">Six threads: from where the objects live &#8594; detect &#8594; spot &#8594; lay out &#8594; read the whole page &#8594; measure it</text>
</svg>
