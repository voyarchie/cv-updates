<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" role="img" aria-label="The deep-learning landscape over a gravitational-wave observation, drawn as four pipeline stages left to right with a timeline of method families beneath. Stage one, data conditioning and denoising: whitening and power-spectral-density estimation, deep noise regression such as DeepClean that subtracts witness-sensor noise, and glitch subtraction such as BayesWave. Stage two, detection: from matched filtering against a template bank in PyCBC and GstLAL and the coherent WaveBurst unmodelled search, to convolutional deep-filtering detectors, to residual networks like AResGW that work on real detector noise, benchmarked by the MLGWSC-1 mock data challenge, plus low-latency binary-neutron-star early warning and multi-detector coherence. Stage three, glitch classification: from the Gravity Spy citizen-science convolutional classifier of about twenty glitch morphologies, to multi-view and Gravity Spy 2.0, to self-supervised representation learning and clustering, to anomaly detection of novel glitches, and GWSkyNet for real-signal versus glitch classification of candidate events. Stage four, parameter estimation as inference: from Bayesian Markov-chain and nested sampling in LALInference and Bilby, to conditional variational autoencoders like VItamin, to normalizing-flow simulation-based inference such as DINGO and its low-latency binary-neutron-star variant DINGO-BNS. Beneath runs a timeline: matched filtering and the first direct detection around 2015, convolutional detection and Gravity Spy around 2017 to 2018, normalizing-flow parameter estimation and the MLGWSC-1 challenge around 2020 to 2022, and transformers, self-supervised foundation models and next-generation Einstein Telescope, Cosmic Explorer and LISA machine-learning challenges from 2023 to 2026.">
  <title>The gravitational-wave deep-learning landscape: denoising, detection, glitch classification, parameter estimation, over a timeline of method families</title>
  <rect x="0" y="0" width="960" height="540" rx="10" fill="#f4f6fb" stroke="#cbd5e1" stroke-width="1"/>
  <text x="24" y="30" fill="#334155" font-size="16.5" font-weight="800">Where deep learning enters a gravitational-wave pipeline &#8212; and the arc of model families over time</text>
  <text x="24" y="50" fill="#64748b" font-size="11">One upstream job (denoise/condition) feeds three dense-vision jobs (detect, classify glitches, infer parameters).</text>

  <!-- flow arrows between stage cards -->
  <g stroke="#94a3b8" stroke-width="2" fill="#94a3b8">
    <line x1="238" y1="230" x2="252" y2="230"/><path d="M252 225 l8 5 -8 5 z"/>
    <line x1="468" y1="230" x2="482" y2="230"/><path d="M482 225 l8 5 -8 5 z"/>
    <line x1="698" y1="230" x2="712" y2="230"/><path d="M712 225 l8 5 -8 5 z"/>
  </g>

  <!-- ===== Stage 1: denoising ===== -->
  <g>
    <rect x="24" y="70" width="214" height="320" rx="8" fill="#0b1220" stroke="#334155" stroke-width="1.5"/>
    <text x="36" y="92" fill="#7dd3fc" font-size="12" font-weight="800">1 &#183; condition &amp; denoise</text>
    <text x="36" y="109" fill="#94a3b8" font-size="9">tame non-Gaussian, drifting noise</text>
    <text x="36" y="121" fill="#94a3b8" font-size="9">before anything downstream</text>
    <rect x="36" y="134" width="190" height="52" rx="4" fill="#1e293b"/>
    <text x="46" y="152" fill="#e2e8f0" font-size="10" font-weight="700">classical</text>
    <text x="46" y="168" fill="#94a3b8" font-size="9">whitening, PSD estimation,</text>
    <text x="46" y="180" fill="#94a3b8" font-size="9">gating, Q-transform imaging</text>
    <rect x="36" y="194" width="190" height="52" rx="4" fill="#0e2a3f"/>
    <text x="46" y="212" fill="#7dd3fc" font-size="10" font-weight="700">deep noise regression</text>
    <text x="46" y="228" fill="#94a3b8" font-size="9">DeepClean: subtract witness-</text>
    <text x="46" y="240" fill="#94a3b8" font-size="9">sensor noise from strain</text>
    <rect x="36" y="254" width="190" height="60" rx="4" fill="#3b0764"/>
    <text x="46" y="272" fill="#e9d5ff" font-size="10" font-weight="700">glitch subtraction</text>
    <text x="46" y="288" fill="#c4b5fd" font-size="9">BayesWave / learned models</text>
    <text x="46" y="300" fill="#c4b5fd" font-size="9">clean a glitch off a real event</text>
    <text x="36" y="336" fill="#64748b" font-size="9">the PSD is never stationary;</text>
    <text x="36" y="352" fill="#64748b" font-size="9">whitening must track it</text>
    <text x="36" y="374" fill="#cbd5e1" font-size="9.5" font-weight="700">the noise floor is the adversary</text>
  </g>

  <!-- ===== Stage 2: detection ===== -->
  <g>
    <rect x="254" y="70" width="214" height="320" rx="8" fill="#0b1220" stroke="#334155" stroke-width="1.5"/>
    <text x="266" y="92" fill="#6ee7b7" font-size="12" font-weight="800">2 &#183; detection</text>
    <text x="266" y="109" fill="#94a3b8" font-size="9">find the signal &amp; confirm it</text>
    <text x="266" y="121" fill="#94a3b8" font-size="9">coherently across detectors</text>
    <rect x="266" y="134" width="190" height="52" rx="4" fill="#1e293b"/>
    <text x="276" y="152" fill="#e2e8f0" font-size="10" font-weight="700">classical</text>
    <text x="276" y="168" fill="#94a3b8" font-size="9">matched filter (PyCBC, GstLAL);</text>
    <text x="276" y="180" fill="#94a3b8" font-size="9">coherent WaveBurst (unmodelled)</text>
    <rect x="266" y="194" width="190" height="52" rx="4" fill="#064e3b"/>
    <text x="276" y="212" fill="#6ee7b7" font-size="10" font-weight="700">CNN &#8220;deep filtering&#8221;</text>
    <text x="276" y="228" fill="#a7f3d0" font-size="9">learn the template response;</text>
    <text x="276" y="240" fill="#a7f3d0" font-size="9">ResNets on real noise (AResGW)</text>
    <rect x="266" y="254" width="190" height="60" rx="4" fill="#3b0764"/>
    <text x="276" y="272" fill="#e9d5ff" font-size="10" font-weight="700">MLGWSC-1 &#183; early warning</text>
    <text x="276" y="288" fill="#c4b5fd" font-size="9">benchmarked search challenge;</text>
    <text x="276" y="300" fill="#c4b5fd" font-size="9">pre-merger BNS alerts in ms</text>
    <text x="266" y="336" fill="#f59e0b" font-size="9" font-weight="700">the bank is huge; ML is cheap</text>
    <text x="266" y="352" fill="#64748b" font-size="9">at inference &#8212; if it stays as</text>
    <text x="266" y="368" fill="#64748b" font-size="9">sensitive as matched filtering</text>
  </g>

  <!-- ===== Stage 3: glitch classification ===== -->
  <g>
    <rect x="484" y="70" width="214" height="320" rx="8" fill="#0b1220" stroke="#334155" stroke-width="1.5"/>
    <text x="496" y="92" fill="#6ee7b7" font-size="12" font-weight="800">3 &#183; glitch classification</text>
    <text x="496" y="109" fill="#94a3b8" font-size="9">the clearest dense-classification</text>
    <text x="496" y="121" fill="#94a3b8" font-size="9">task: many glitch morphologies</text>
    <rect x="496" y="134" width="190" height="52" rx="4" fill="#1e293b"/>
    <text x="506" y="152" fill="#e2e8f0" font-size="10" font-weight="700">classical</text>
    <text x="506" y="168" fill="#94a3b8" font-size="9">by-hand vetoes; Omega/Q-scan</text>
    <text x="506" y="180" fill="#94a3b8" font-size="9">inspection by operators</text>
    <rect x="496" y="194" width="190" height="52" rx="4" fill="#064e3b"/>
    <text x="506" y="212" fill="#6ee7b7" font-size="10" font-weight="700">Gravity Spy CNN</text>
    <text x="506" y="228" fill="#a7f3d0" font-size="9">citizen science + CNN over ~20</text>
    <text x="506" y="240" fill="#a7f3d0" font-size="9">classes; multi-view, v2.0</text>
    <rect x="496" y="254" width="190" height="60" rx="4" fill="#3b0764"/>
    <text x="506" y="272" fill="#e9d5ff" font-size="10" font-weight="700">SSL / anomaly / GWSkyNet</text>
    <text x="506" y="288" fill="#c4b5fd" font-size="9">cluster &amp; discover new classes;</text>
    <text x="506" y="300" fill="#c4b5fd" font-size="9">real-signal vs glitch on events</text>
    <text x="496" y="336" fill="#f87171" font-size="9" font-weight="700">new glitch classes keep appearing</text>
    <text x="496" y="352" fill="#64748b" font-size="9">each run &#8594; open-set problem</text>
    <text x="496" y="368" fill="#64748b" font-size="9">labels lag the instrument</text>
  </g>

  <!-- ===== Stage 4: parameter estimation ===== -->
  <g>
    <rect x="714" y="70" width="214" height="320" rx="8" fill="#0b1220" stroke="#334155" stroke-width="1.5"/>
    <text x="726" y="92" fill="#6ee7b7" font-size="12" font-weight="800">4 &#183; parameter estimation</text>
    <text x="726" y="109" fill="#94a3b8" font-size="9">infer masses, spins, distance,</text>
    <text x="726" y="121" fill="#94a3b8" font-size="9">sky position: a full posterior</text>
    <rect x="726" y="134" width="190" height="52" rx="4" fill="#1e293b"/>
    <text x="736" y="152" fill="#e2e8f0" font-size="10" font-weight="700">classical</text>
    <text x="736" y="168" fill="#94a3b8" font-size="9">MCMC / nested sampling</text>
    <text x="736" y="180" fill="#94a3b8" font-size="9">(LALInference, Bilby): hours&#8211;days</text>
    <rect x="726" y="194" width="190" height="52" rx="4" fill="#064e3b"/>
    <text x="736" y="212" fill="#6ee7b7" font-size="10" font-weight="700">CVAE (VItamin)</text>
    <text x="736" y="228" fill="#a7f3d0" font-size="9">amortized approximate posteriors</text>
    <text x="736" y="240" fill="#a7f3d0" font-size="9">in a fraction of a second</text>
    <rect x="726" y="254" width="190" height="60" rx="4" fill="#3b0764"/>
    <text x="736" y="272" fill="#e9d5ff" font-size="10" font-weight="700">normalizing flows (DINGO)</text>
    <text x="736" y="288" fill="#c4b5fd" font-size="9">simulation-based inference with</text>
    <text x="736" y="300" fill="#c4b5fd" font-size="9">importance-sampling checks; -BNS</text>
    <text x="726" y="336" fill="#64748b" font-size="9">must match Bilby to be trusted;</text>
    <text x="726" y="352" fill="#64748b" font-size="9">importance weights give a check</text>
    <text x="726" y="374" fill="#cbd5e1" font-size="9.5" font-weight="700">inference is now a forward pass</text>
  </g>

  <!-- ===== timeline band ===== -->
  <g>
    <rect x="24" y="404" width="904" height="118" rx="8" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1.5"/>
    <text x="36" y="424" fill="#3730a3" font-size="11.5" font-weight="800">arc of method families</text>
    <line x1="60" y1="470" x2="900" y2="470" stroke="#94a3b8" stroke-width="1.5"/>
    <g fill="#c7d2fe">
      <circle cx="150" cy="470" r="3"/><circle cx="380" cy="470" r="3"/><circle cx="600" cy="470" r="3"/><circle cx="820" cy="470" r="3"/>
    </g>
    <g font-size="9.5">
      <rect x="80" y="440" width="164" height="22" rx="4" fill="#1e293b"/>
      <text x="88" y="455" fill="#e2e8f0">matched filter &#183; GW150914</text>
      <text x="122" y="490" fill="#475569" font-size="9">~2015 first detection</text>

      <rect x="308" y="440" width="146" height="22" rx="4" fill="#064e3b"/>
      <text x="316" y="455" fill="#6ee7b7">CNNs &#183; Gravity Spy</text>
      <text x="336" y="490" fill="#475569" font-size="9">2017&#8211;2018</text>

      <rect x="528" y="440" width="166" height="22" rx="4" fill="#0e2a3f"/>
      <text x="536" y="455" fill="#7dd3fc">flow PE &#183; MLGWSC-1</text>
      <text x="556" y="490" fill="#475569" font-size="9">2020&#8211;2022</text>

      <rect x="736" y="440" width="182" height="22" rx="4" fill="#3b0764"/>
      <text x="744" y="455" fill="#e9d5ff">transformers &#183; SSL &#183; ET/CE/LISA</text>
      <text x="762" y="490" fill="#475569" font-size="9">2023&#8211;2026</text>
    </g>
    <text x="36" y="512" fill="#4338ca" font-size="10">The through-line: match or beat matched filtering on real, non-stationary noise; deliver calibrated posteriors fast; and stay honest about glitches you have never seen.</text>
  </g>
</svg>
