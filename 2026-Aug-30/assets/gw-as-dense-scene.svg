<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" role="img" aria-label="A gravitational-wave detector's output shown as a dense detection-and-classification scene. A kilometre-scale laser interferometer splits a laser beam down two perpendicular arms; a passing gravitational wave stretches one arm and squeezes the other by a strain of order ten to the minus twenty-one, read out as a one-dimensional strain time series that is buried in non-Gaussian, non-stationary noise. Whitening and a Q-transform turn that time series into a time-frequency spectrogram, the image: an astrophysical binary merger appears as a rising chirp track, while instrumental glitches such as blips, scattered-light arches and koi-fish appear as their own distinct shapes. On that image the computer-vision jobs are: detect the faint astrophysical signal buried in noise and confirm it coherently across the detector network; classify the many morphological classes of instrumental glitch; and infer the source parameters, masses, spins and distance, by amortized simulation-based inference. The defining constraint is that real labelled signals number in the low hundreds while glitches and noise are effectively unlimited, so ground truth comes almost entirely from simulated waveforms injected into real noise.">
  <title>A gravitational-wave detector: a strain time series becomes a time-frequency image full of chirps and glitches to detect, classify, and infer</title>
  <rect x="0" y="0" width="960" height="520" rx="10" fill="#f4f6fb" stroke="#cbd5e1" stroke-width="1"/>
  <text x="24" y="32" fill="#334155" font-size="16.5" font-weight="800">An interferometer reads strain h(t) &#8594; a whitened Q-transform image of chirps &amp; glitches &#8594; detect, classify, infer</text>

  <!-- ============ Panel 1: the instrument ============ -->
  <g>
    <rect x="24" y="52" width="292" height="440" rx="8" fill="#0b1220" stroke="#334155" stroke-width="2"/>
    <text x="38" y="74" fill="#94a3b8" font-size="11.5">1 &#183; a km-scale interferometer measures strain</text>

    <!-- laser -->
    <rect x="40" y="150" width="26" height="16" rx="2" fill="#ef4444"/>
    <text x="40" y="144" fill="#f87171" font-size="9">laser</text>
    <!-- beam to splitter -->
    <line x1="66" y1="158" x2="120" y2="158" stroke="#f59e0b" stroke-width="1.6"/>
    <!-- beamsplitter -->
    <rect x="116" y="150" width="10" height="16" rx="1" fill="#cbd5e1" transform="rotate(45 121 158)"/>
    <text x="98" y="182" fill="#94a3b8" font-size="8.5">beam-splitter</text>
    <!-- arm X (horizontal) -->
    <line x1="126" y1="158" x2="270" y2="158" stroke="#f59e0b" stroke-width="1.6"/>
    <rect x="270" y="146" width="6" height="24" rx="1" fill="#e2e8f0"/>
    <text x="196" y="150" fill="#7dd3fc" font-size="8.5">arm X (4 km) &#8594; stretched</text>
    <!-- arm Y (vertical) -->
    <line x1="121" y1="158" x2="121" y2="300" stroke="#f59e0b" stroke-width="1.6"/>
    <rect x="109" y="300" width="24" height="6" rx="1" fill="#e2e8f0"/>
    <text x="132" y="250" fill="#7dd3fc" font-size="8.5">arm Y &#8595; squeezed</text>
    <!-- photodetector -->
    <line x1="126" y1="166" x2="126" y2="196" stroke="#f59e0b" stroke-width="1.2" stroke-dasharray="3 3"/>
    <rect x="116" y="196" width="20" height="12" rx="2" fill="#38bdf8"/>
    <text x="140" y="206" fill="#7dd3fc" font-size="8.5">photodetector</text>

    <!-- incoming GW -->
    <g stroke="#a78bfa" stroke-width="1.4" opacity="0.9" fill="none">
      <path d="M210 330 q10 -8 20 0 q10 8 20 0 q10 -8 20 0"/>
      <path d="M210 344 q10 -8 20 0 q10 8 20 0 q10 -8 20 0"/>
    </g>
    <text x="150" y="368" fill="#c4b5fd" font-size="9">a passing wave: h = &#916;L / L</text>
    <text x="150" y="382" fill="#c4b5fd" font-size="9">&#8776; 10&#8315;&#178;&#185; (a proton width over 4 km)</text>

    <!-- strain trace -->
    <rect x="40" y="398" width="236" height="52" rx="4" fill="#020617" stroke="#334155"/>
    <text x="48" y="412" fill="#94a3b8" font-size="8.5">strain h(t): a 1-D series buried in noise</text>
    <polyline points="46,432 60,428 72,436 84,424 96,438 108,426 120,434 132,420 144,440 156,418 168,442 180,414 192,446 204,410 216,448 228,424 240,436 252,428 266,434" fill="none" stroke="#64748b" stroke-width="1"/>
    <text x="40" y="472" fill="#e2e8f0" font-size="10.5">no beam to aim, no image formed &#8212;</text>
    <text x="40" y="486" fill="#7dd3fc" font-size="10.5" font-weight="700">you read a single ruler flexing by 10&#8315;&#178;&#185;</text>
  </g>

  <!-- ============ Panel 2: the image ============ -->
  <g>
    <rect x="332" y="52" width="300" height="440" rx="8" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1.5"/>
    <text x="346" y="74" fill="#3730a3" font-size="11.5" font-weight="700">2 &#183; whiten + Q-transform &#8594; a time&#8211;freq image</text>

    <!-- spectrogram card -->
    <rect x="352" y="86" width="260" height="176" rx="5" fill="#020617" stroke="#334155"/>
    <text x="362" y="102" fill="#94a3b8" font-size="9">frequency &#8593;   vs   time &#8594;</text>
    <!-- chirp track (rising, sweeping up in freq) -->
    <path d="M372 236 C 440 232, 500 210, 540 150 C 552 132, 558 118, 560 110" fill="none" stroke="#f59e0b" stroke-width="3"/>
    <text x="372" y="254" fill="#fbbf24" font-size="8.5">astrophysical chirp: a binary inspiral sweeping up</text>
    <!-- glitch: blip -->
    <ellipse cx="410" cy="150" rx="6" ry="14" fill="#ef4444" opacity="0.85"/>
    <text x="392" y="128" fill="#fca5a5" font-size="8">blip</text>
    <!-- glitch: scattered-light arches -->
    <text x="466" y="196" fill="#f9a8d4" font-size="8">scattered light</text>
    <g fill="none" stroke="#f472b6" stroke-width="1.6" opacity="0.9">
      <path d="M470 236 q10 -26 20 0"/>
      <path d="M492 236 q10 -30 20 0"/>
      <path d="M514 236 q10 -34 20 0"/>
    </g>

    <text x="346" y="286" fill="#3730a3" font-size="10.5" font-weight="700">the noise is the hard part:</text>
    <text x="346" y="303" fill="#3730a3" font-size="10">&#183; non-Gaussian &amp; non-stationary; the PSD drifts</text>
    <text x="346" y="319" fill="#3730a3" font-size="10">&#183; thousands of instrumental &#8220;glitches&#8221; per day,</text>
    <text x="360" y="334" fill="#3730a3" font-size="10">each with its own morphology &amp; cause</text>
    <text x="346" y="350" fill="#3730a3" font-size="10">&#183; a glitch can mimic or hide a real merger</text>

    <!-- glitch zoo strip -->
    <rect x="352" y="362" width="260" height="66" rx="5" fill="#0b1220"/>
    <text x="362" y="378" fill="#94a3b8" font-size="9">a morphological zoo (Gravity Spy: ~20+ classes)</text>
    <g>
      <ellipse cx="378" cy="405" rx="4" ry="12" fill="#ef4444"/><text x="368" y="424" fill="#94a3b8" font-size="7">blip</text>
      <path d="M418 414 q8 -22 16 0" fill="none" stroke="#f472b6" stroke-width="1.6"/><text x="410" y="424" fill="#94a3b8" font-size="7">scatter</text>
      <path d="M470 414 C 476 396, 486 396, 492 414" fill="none" stroke="#38bdf8" stroke-width="1.6"/><text x="462" y="424" fill="#94a3b8" font-size="7">koi&#8209;fish</text>
      <line x1="540" y1="396" x2="540" y2="414" stroke="#fbbf24" stroke-width="2"/><text x="524" y="424" fill="#94a3b8" font-size="7">line/tomte</text>
    </g>

    <text x="346" y="452" fill="#4338ca" font-size="10.5" font-weight="700">the signal and the noise share the image</text>
    <text x="346" y="470" fill="#3730a3" font-size="10">and often the same shapes &#8212; separating them</text>
    <text x="346" y="484" fill="#3730a3" font-size="10">is the whole game</text>
  </g>

  <!-- ============ Panel 3: the CV jobs ============ -->
  <g>
    <rect x="640" y="52" width="296" height="440" rx="8" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1.5"/>
    <text x="654" y="74" fill="#065f46" font-size="11.5" font-weight="700">3 &#183; the dense-vision jobs</text>

    <!-- A detect -->
    <rect x="656" y="86" width="264" height="118" rx="5" fill="#0b1220"/>
    <text x="668" y="106" fill="#f8fafc" font-size="11" font-weight="700">A &#183; detect the buried signal</text>
    <text x="668" y="124" fill="#94a3b8" font-size="9">find a faint chirp/burst under the noise, then</text>
    <text x="668" y="137" fill="#94a3b8" font-size="9">confirm it coherently across &#8805; 2 detectors</text>
    <!-- two-detector coincidence -->
    <g stroke="#34d399" stroke-width="1.6" fill="none">
      <path d="M672 176 C 700 172, 720 160, 730 146"/>
      <path d="M672 190 C 700 186, 720 174, 730 160"/>
    </g>
    <text x="740" y="170" fill="#6ee7b7" font-size="8.5">H1</text><text x="740" y="184" fill="#6ee7b7" font-size="8.5">L1 &#8594; coincident</text>
    <text x="668" y="200" fill="#64748b" font-size="8.5">vs matched filtering over a template bank</text>

    <!-- B classify -->
    <rect x="656" y="214" width="264" height="106" rx="5" fill="#0b1220"/>
    <text x="668" y="234" fill="#f8fafc" font-size="11" font-weight="700">B &#183; classify glitches</text>
    <text x="668" y="252" fill="#94a3b8" font-size="9">assign each transient a morphology class;</text>
    <text x="668" y="265" fill="#94a3b8" font-size="9">route it to the instrumental fault, or veto it</text>
    <g font-size="8.5" font-weight="700">
      <rect x="668" y="276" width="66" height="30" rx="3" fill="#7f1d1d"/><text x="676" y="295" fill="#fca5a5">blip</text>
      <rect x="740" y="276" width="80" height="30" rx="3" fill="#831843"/><text x="748" y="295" fill="#f9a8d4">scattered</text>
      <rect x="826" y="276" width="86" height="30" rx="3" fill="#0e3a5f"/><text x="834" y="295" fill="#7dd3fc">koi-fish&#8230;</text>
    </g>

    <!-- C infer -->
    <rect x="656" y="330" width="264" height="104" rx="5" fill="#0b1220"/>
    <text x="668" y="350" fill="#f8fafc" font-size="11" font-weight="700">C &#183; infer source parameters</text>
    <text x="668" y="368" fill="#94a3b8" font-size="9">amortized simulation-based inference:</text>
    <text x="668" y="381" fill="#94a3b8" font-size="9">masses, spins, distance, sky position &#8212; a full</text>
    <text x="668" y="394" fill="#94a3b8" font-size="9">Bayesian posterior in seconds, not days</text>
    <!-- posterior blob -->
    <ellipse cx="720" cy="416" rx="26" ry="12" fill="#134e4a"/><ellipse cx="720" cy="416" rx="14" ry="6" fill="#2dd4bf"/>
    <text x="756" y="420" fill="#5eead4" font-size="8.5">posterior p(&#952;|data)</text>

    <text x="654" y="458" fill="#065f46" font-size="10">low hundreds of real signals, unlimited noise &#8212;</text>
    <text x="654" y="473" fill="#065f46" font-size="10">ground truth is simulated waveforms in real noise</text>
    <text x="654" y="488" fill="#047857" font-size="10.5" font-weight="700">detection where the whole sky rings a single wire</text>
  </g>
</svg>
