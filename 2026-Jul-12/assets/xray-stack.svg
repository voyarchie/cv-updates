<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" role="img" aria-label="The X-ray security screening pipeline from dual-energy source to the certification gate">
  <title>X-ray security screening pipeline: source to certification gate</title>
  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#94a3b8"/>
    </marker>
    <marker id="arR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#e11d48"/>
    </marker>
  </defs>

  <!-- main flow arrows -->
  <g stroke="#94a3b8" stroke-width="2.5" fill="none" marker-end="url(#ar)">
    <line x1="128" y1="222" x2="158" y2="222"/>
    <line x1="276" y1="222" x2="306" y2="222"/>
    <line x1="424" y1="222" x2="454" y2="222"/>
    <line x1="572" y1="222" x2="602" y2="222"/>
    <line x1="720" y1="222" x2="750" y2="222"/>
  </g>

  <!-- stage boxes -->
  <g font-size="11.5">
    <!-- S1 source -->
    <rect x="12" y="175" width="116" height="95" rx="10" fill="#475569" stroke="#334155"/>
    <text x="70" y="205" text-anchor="middle" fill="#f8fafc" font-size="12.5" font-weight="700">Source</text>
    <text x="70" y="226" text-anchor="middle" fill="#e2e8f0">dual-energy</text>
    <text x="70" y="243" text-anchor="middle" fill="#e2e8f0">X-ray tube</text>
    <text x="70" y="260" text-anchor="middle" fill="#cbd5e1" font-size="10">high + low kVp</text>

    <!-- S2 object / superposition (primitive) -->
    <rect x="160" y="175" width="116" height="95" rx="10" fill="#ea580c" stroke="#c2410c"/>
    <text x="218" y="203" text-anchor="middle" fill="#fff7ed" font-size="12.5" font-weight="700">Bag / object</text>
    <text x="218" y="223" text-anchor="middle" fill="#ffedd5">Beer–Lambert</text>
    <text x="218" y="240" text-anchor="middle" fill="#ffedd5">superposition</text>
    <text x="218" y="258" text-anchor="middle" fill="#fed7aa" font-size="10">(overlap, not occlude)</text>

    <!-- S3 detector -->
    <rect x="308" y="175" width="116" height="95" rx="10" fill="#2563eb" stroke="#1d4ed8"/>
    <text x="366" y="205" text-anchor="middle" fill="#f8fafc" font-size="12.5" font-weight="700">Detector</text>
    <text x="366" y="226" text-anchor="middle" fill="#dbeafe">high + low</text>
    <text x="366" y="243" text-anchor="middle" fill="#dbeafe">energy channels</text>
    <text x="366" y="260" text-anchor="middle" fill="#bfdbfe" font-size="10">→ effective Z</text>

    <!-- S4 pseudo-color -->
    <rect x="456" y="175" width="116" height="95" rx="10" fill="#0d9488" stroke="#0f766e"/>
    <text x="514" y="202" text-anchor="middle" fill="#f0fdfa" font-size="12.5" font-weight="700">Pseudo-colour</text>
    <text x="514" y="220" text-anchor="middle" fill="#ccfbf1" font-size="10">material, not surface</text>
    <g>
      <rect x="470" y="228" width="30" height="14" rx="3" fill="#f97316"/>
      <rect x="499" y="228" width="30" height="14" rx="3" fill="#22c55e"/>
      <rect x="528" y="228" width="30" height="14" rx="3" fill="#3b82f6"/>
    </g>
    <text x="514" y="258" text-anchor="middle" fill="#ccfbf1" font-size="10">organic · mixed · metal</text>

    <!-- S5 ATR -->
    <rect x="604" y="175" width="116" height="95" rx="10" fill="#0891b2" stroke="#0e7490"/>
    <text x="662" y="205" text-anchor="middle" fill="#f0fdff" font-size="12.5" font-weight="700">ATR detector</text>
    <text x="662" y="226" text-anchor="middle" fill="#cffafe">2D projection</text>
    <text x="662" y="243" text-anchor="middle" fill="#cffafe">or 3D CT volume</text>
    <text x="662" y="260" text-anchor="middle" fill="#a5f3fc" font-size="10">CNN · DETR · 3D</text>

    <!-- S6 gate -->
    <rect x="752" y="175" width="132" height="95" rx="10" fill="#1e293b" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="818" y="202" text-anchor="middle" fill="#f8fafc" font-size="12.5" font-weight="700">Certification gate</text>
    <text x="818" y="221" text-anchor="middle" fill="#cbd5e1" font-size="10.5">Pd at fixed Pfa</text>
    <text x="818" y="238" text-anchor="middle" fill="#cbd5e1" font-size="10.5">ECAC EDS / TSA</text>
    <text x="818" y="256" text-anchor="middle" fill="#94a3b8" font-size="10">throughput-bounded</text>
  </g>

  <!-- adversary bubble feeding the object stage -->
  <g>
    <rect x="150" y="52" width="136" height="72" rx="10" fill="#e11d48" stroke="#be123c"/>
    <text x="218" y="78" text-anchor="middle" fill="#fff1f2" font-size="12" font-weight="700">Active adversary</text>
    <text x="218" y="97" text-anchor="middle" fill="#ffe4e6" font-size="10.5">conceal · shield</text>
    <text x="218" y="113" text-anchor="middle" fill="#ffe4e6" font-size="10.5">disassemble · novel threats</text>
    <line x1="218" y1="124" x2="218" y2="171" stroke="#e11d48" stroke-width="2.5" fill="none" marker-end="url(#arR)" stroke-dasharray="5 4"/>
  </g>

  <!-- operator + TIP loop feeding the gate -->
  <g>
    <rect x="604" y="352" width="132" height="66" rx="10" fill="#7c3aed" stroke="#6d28d9"/>
    <text x="670" y="378" text-anchor="middle" fill="#f5f3ff" font-size="12" font-weight="700">Operator + TIP</text>
    <text x="670" y="396" text-anchor="middle" fill="#ede9fe" font-size="10.5">human-in-the-loop;</text>
    <text x="670" y="411" text-anchor="middle" fill="#ede9fe" font-size="10.5">projected threats monitor Pd</text>
    <path d="M662 270 L662 352" stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#ar)"/>
    <path d="M736 385 L818 385 L818 272" stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#ar)"/>
  </g>

  <!-- bottom caption -->
  <text x="300" y="440" text-anchor="middle" fill="#64748b" font-size="11.5" font-style="italic">The deployed system is algorithm + operator; the deliverable is an operating point, not a mean-AP leaderboard row.</text>
</svg>
