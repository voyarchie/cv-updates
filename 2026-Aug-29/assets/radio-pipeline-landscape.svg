<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" role="img" aria-label="The deep-learning landscape over a radio-interferometric dataset, drawn as four stages over one observation. Stage one, RFI flagging and calibration, treats the time-frequency dynamic spectrum as an image to segment, using U-Net variants such as RFI-Net and RFI-DRUnet and Segment-Anything. Stage two, imaging and deconvolution, solves the ill-posed inverse problem from visibilities to a sky image, evolving from CLEAN through deep image priors and unrolled optimization to diffusion and score-based priors and POLISH super-resolution. Stage three, source finding, detects and characterizes sources at survey scale, evolving from classical tools like PyBDSF and Aegean through Mask R-CNN detectors like ClaRAN to YOLO-CIANNA and U-Net segmentation that won the SKA Science Data Challenge 2. Stage four, morphological classification and host cross-identification, evolves from supervised CNNs through rotation-equivariant networks to self-supervised foundation models pre-trained on Radio Galaxy Zoo. A time arc beneath shows the model families shifting from convolutional to self-supervised, foundation, and generative diffusion approaches from roughly 2018 to 2026.">
  <title>The learning landscape over a radio interferometric observation: flag, image, find, classify</title>
  <rect x="0" y="0" width="960" height="560" rx="10" fill="#f4f6fb" stroke="#cbd5e1" stroke-width="1"/>
  <text x="24" y="32" fill="#334155" font-size="16.5" font-weight="800">One observation, four dense-vision stages &#8212; each with its own model-family arc</text>
  <text x="24" y="52" fill="#64748b" font-size="11.5">visibilities &#8594; flagged &amp; calibrated data &#8594; deconvolved sky image &#8594; source catalogue &#8594; typed, host-matched galaxies</text>

  <!-- stage columns -->
  <!-- Stage 1: RFI / calibration -->
  <g>
    <rect x="24" y="72" width="222" height="300" rx="8" fill="#0b1220" stroke="#334155" stroke-width="2"/>
    <text x="38" y="94" fill="#38bdf8" font-size="12" font-weight="800">1 &#183; RFI flag + calibrate</text>
    <text x="38" y="112" fill="#94a3b8" font-size="9.5">segment the time&#8211;frequency plane</text>
    <!-- dynamic spectrum mini -->
    <rect x="38" y="122" width="194" height="80" rx="4" fill="#020617" stroke="#334155"/>
    <g fill="#334155"><rect x="38" y="122" width="194" height="80" opacity="0.2"/></g>
    <!-- RFI streaks -->
    <rect x="70" y="122" width="4" height="80" fill="#ef4444" opacity="0.85"/>
    <rect x="132" y="122" width="3" height="80" fill="#ef4444" opacity="0.75"/>
    <rect x="38" y="150" width="194" height="4" fill="#f59e0b" opacity="0.8"/>
    <circle cx="180" cy="176" r="6" fill="#fbbf24" opacity="0.8"/>
    <text x="44" y="196" fill="#cbd5e1" font-size="8">freq &#8593; / time &#8594; &#8212; RFI = bright streaks &amp; blobs</text>
    <text x="38" y="224" fill="#e2e8f0" font-size="9.5">per-pixel binary/instance mask</text>
    <text x="38" y="246" fill="#7dd3fc" font-size="9.5" font-weight="700">RFI-Net &#183; RFI-DRUnet</text>
    <text x="38" y="262" fill="#7dd3fc" font-size="9.5" font-weight="700">U-Net &#183; SAM for RFI</text>
    <text x="38" y="286" fill="#94a3b8" font-size="9">flag &#8594; restore corrupted samples;</text>
    <text x="38" y="300" fill="#94a3b8" font-size="9">learn without clean labels</text>
    <text x="38" y="330" fill="#64748b" font-size="9">the human-made signal is</text>
    <text x="38" y="344" fill="#64748b" font-size="9">structured noise to be removed</text>
  </g>

  <!-- Stage 2: imaging / deconvolution -->
  <g>
    <rect x="256" y="72" width="222" height="300" rx="8" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1.5"/>
    <text x="270" y="94" fill="#3730a3" font-size="12" font-weight="800">2 &#183; image / deconvolve</text>
    <text x="270" y="112" fill="#6366f1" font-size="9.5">ill-posed inverse: vis &#8594; sky</text>
    <rect x="270" y="122" width="194" height="66" rx="4" fill="#ffffff" stroke="#c7d2fe"/>
    <ellipse cx="320" cy="155" rx="10" ry="10" fill="#fca5a5"/>
    <g stroke="#f59e0b" stroke-width="1" fill="none" opacity="0.7"><ellipse cx="320" cy="155" rx="20" ry="18"/></g>
    <text x="352" y="150" fill="#334155" font-size="13">&#8594;</text>
    <ellipse cx="420" cy="155" rx="7" ry="7" fill="#6ee7b7"/><circle cx="440" cy="140" r="2.5" fill="#6ee7b7"/>
    <text x="270" y="206" fill="#4338ca" font-size="9.5" font-weight="700">classical &#8594; learned &#8594; generative</text>
    <text x="270" y="224" fill="#3730a3" font-size="9.5">&#8226; CLEAN (H&#246;gbom / multiscale)</text>
    <text x="270" y="240" fill="#3730a3" font-size="9.5">&#8226; RESOLVE / Bayesian priors</text>
    <text x="270" y="256" fill="#3730a3" font-size="9.5">&#8226; deep image prior &#183; unrolled</text>
    <text x="270" y="272" fill="#3730a3" font-size="9.5">&#8226; diffusion / score-based priors</text>
    <text x="270" y="288" fill="#3730a3" font-size="9.5">&#8226; POLISH super-resolution</text>
    <rect x="270" y="300" width="194" height="30" rx="5" fill="#1e1b4b"/>
    <text x="282" y="319" fill="#c4b5fd" font-size="9" font-weight="700">learn the prior; keep the physics in the loop</text>
    <text x="270" y="352" fill="#6366f1" font-size="9">uncertainty matters: no ground truth</text>
  </g>

  <!-- Stage 3: source finding -->
  <g>
    <rect x="488" y="72" width="222" height="300" rx="8" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1.5"/>
    <text x="502" y="94" fill="#065f46" font-size="12" font-weight="800">3 &#183; find sources</text>
    <text x="502" y="112" fill="#059669" font-size="9.5">detect + deblend + measure</text>
    <rect x="502" y="122" width="194" height="66" rx="4" fill="#ffffff" stroke="#a7f3d0"/>
    <circle cx="536" cy="150" r="7" fill="#38bdf8"/><rect x="524" y="138" width="24" height="24" fill="none" stroke="#10b981" stroke-dasharray="3 2"/>
    <ellipse cx="600" cy="158" rx="15" ry="6" fill="#38bdf8" opacity="0.7"/><rect x="580" y="144" width="40" height="26" fill="none" stroke="#10b981" stroke-dasharray="3 2"/>
    <circle cx="660" cy="145" r="3.5" fill="#38bdf8"/><circle cx="676" cy="162" r="2.5" fill="#38bdf8"/>
    <text x="502" y="208" fill="#047857" font-size="9.5" font-weight="700">classical &#8594; detector &#8594; segmentor</text>
    <text x="502" y="226" fill="#065f46" font-size="9.5">&#8226; PyBDSF &#183; Aegean &#183; ProFound</text>
    <text x="502" y="242" fill="#065f46" font-size="9.5">&#8226; ClaRAN (Mask R-CNN)</text>
    <text x="502" y="258" fill="#065f46" font-size="9.5">&#8226; U-Net (FORSKA) &#183; DeepSource</text>
    <text x="502" y="274" fill="#065f46" font-size="9.5">&#8226; YOLO-CIANNA (3D)</text>
    <rect x="502" y="286" width="194" height="30" rx="5" fill="#064e3b"/>
    <text x="514" y="305" fill="#6ee7b7" font-size="9" font-weight="700">SKA SDC2 won by an ML ensemble</text>
    <text x="502" y="338" fill="#059669" font-size="9">component &#8594; source association</text>
    <text x="502" y="352" fill="#059669" font-size="9">is itself a graph/vision problem</text>
  </g>

  <!-- Stage 4: classification -->
  <g>
    <rect x="720" y="72" width="216" height="300" rx="8" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.5"/>
    <text x="734" y="94" fill="#9a3412" font-size="12" font-weight="800">4 &#183; classify + cross-ID</text>
    <text x="734" y="112" fill="#c2410c" font-size="9.5">morphology &amp; host galaxy</text>
    <rect x="734" y="122" width="188" height="66" rx="4" fill="#ffffff" stroke="#fed7aa"/>
    <text x="742" y="138" fill="#334155" font-size="8.5" font-weight="700">FR-I</text>
    <circle cx="760" cy="158" r="5" fill="#f59e0b"/><ellipse cx="744" cy="158" rx="8" ry="3" fill="#fca5a5" opacity="0.7"/><ellipse cx="776" cy="158" rx="8" ry="3" fill="#fca5a5" opacity="0.7"/>
    <text x="838" y="138" fill="#334155" font-size="8.5" font-weight="700">FR-II</text>
    <circle cx="858" cy="158" r="2.5" fill="#f59e0b"/><circle cx="838" cy="158" r="5" fill="#ef4444"/><circle cx="878" cy="158" r="5" fill="#ef4444"/>
    <text x="734" y="208" fill="#9a3412" font-size="9.5" font-weight="700">supervised &#8594; equivariant &#8594; SSL</text>
    <text x="734" y="226" fill="#7c2d12" font-size="9.5">&#8226; CNN on MiraBest / RGZ</text>
    <text x="734" y="242" fill="#7c2d12" font-size="9.5">&#8226; rotation-equivariant nets</text>
    <text x="734" y="258" fill="#7c2d12" font-size="9.5">&#8226; BYOL / contrastive pre-train</text>
    <text x="734" y="274" fill="#7c2d12" font-size="9.5">&#8226; radio foundation models</text>
    <rect x="734" y="286" width="188" height="30" rx="5" fill="#7c2d12"/>
    <text x="746" y="305" fill="#fed7aa" font-size="9" font-weight="700">few labels, exabytes unlabeled</text>
    <text x="734" y="338" fill="#c2410c" font-size="9">calibrated uncertainty on</text>
    <text x="734" y="352" fill="#c2410c" font-size="9">ambiguous / novel morphologies</text>
  </g>

  <!-- flow arrows between stages -->
  <g fill="#94a3b8">
    <path d="M246 222 l10 -6 l0 12 z"/>
    <path d="M478 222 l10 -6 l0 12 z"/>
    <path d="M710 222 l10 -6 l0 12 z"/>
  </g>

  <!-- ============ time arc: model families ============ -->
  <g>
    <rect x="24" y="392" width="912" height="150" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="40" y="414" fill="#334155" font-size="12" font-weight="800">Model-family arc &#8212; what the field reaches for, over time</text>
    <!-- baseline -->
    <line x1="60" y1="500" x2="900" y2="500" stroke="#cbd5e1" stroke-width="2"/>
    <path d="M900 500 l-10 -5 l0 10 z" fill="#cbd5e1"/>
    <!-- year ticks -->
    <g fill="#94a3b8" font-size="9" text-anchor="middle">
      <text x="120" y="518">~2018</text><text x="300" y="518">2021</text><text x="500" y="518">2023</text><text x="700" y="518">2025</text><text x="870" y="518">2026</text>
    </g>
    <!-- arc curve -->
    <path d="M80 492 C 260 470, 420 452, 560 446 S 820 436, 900 432" fill="none" stroke="#6366f1" stroke-width="2.5" stroke-dasharray="1 0"/>
    <!-- nodes -->
    <g>
      <circle cx="110" cy="484" r="5" fill="#38bdf8"/><text x="110" y="470" fill="#0369a1" font-size="9" text-anchor="middle" font-weight="700">CNN / U-Net</text>
      <circle cx="300" cy="466" r="5" fill="#10b981"/><text x="300" y="452" fill="#047857" font-size="9" text-anchor="middle" font-weight="700">Mask R-CNN / detectors</text>
      <circle cx="500" cy="450" r="5" fill="#f59e0b"/><text x="500" y="436" fill="#b45309" font-size="9" text-anchor="middle" font-weight="700">equivariant + self-supervised</text>
      <circle cx="700" cy="442" r="5" fill="#a855f7"/><text x="700" y="428" fill="#7c3aed" font-size="9" text-anchor="middle" font-weight="700">foundation models</text>
      <circle cx="878" cy="433" r="5" fill="#ef4444"/><text x="876" y="420" fill="#b91c1c" font-size="9" text-anchor="middle" font-weight="700">diffusion / generative</text>
    </g>
    <text x="40" y="536" fill="#64748b" font-size="9">Direction of travel: from labeled convolutional classifiers toward label-efficient, uncertainty-aware, instrument-agnostic models that both reconstruct and interpret.</text>
  </g>
</svg>
