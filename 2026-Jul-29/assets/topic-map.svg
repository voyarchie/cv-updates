<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 660" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" role="img" aria-label="Topic map of the seven omnidirectional-imaging dense-detection and classification threads">
  <title>Omnidirectional imaging — seven dense-detection &amp; classification threads</title>
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#94a3b8"/>
    </marker>
  </defs>
  <!-- edges -->
  <g stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#ah)">
    <line x1="450" y1="330" x2="205" y2="150"/>
    <line x1="450" y1="330" x2="450" y2="128"/>
    <line x1="450" y1="330" x2="695" y2="150"/>
    <line x1="450" y1="330" x2="150" y2="330"/>
    <line x1="450" y1="330" x2="750" y2="330"/>
    <line x1="450" y1="330" x2="255" y2="512"/>
    <line x1="450" y1="330" x2="645" y2="512"/>
  </g>
  <!-- hub -->
  <g>
    <rect x="312" y="284" width="276" height="92" rx="12" fill="#1e293b" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="450" y="312" text-anchor="middle" fill="#f8fafc" font-size="15" font-weight="700">The sphere of light</text>
    <text x="450" y="334" text-anchor="middle" fill="#cbd5e1" font-size="12.5">wide-FoV geometry as the shared</text>
    <text x="450" y="352" text-anchor="middle" fill="#cbd5e1" font-size="12.5">substrate: distortion is the label problem</text>
  </g>
  <!-- nodes -->
  <g font-size="12" fill="#f8fafc">
    <!-- 1 primitive (top-left) -->
    <rect x="45" y="92" width="300" height="86" rx="10" fill="#4f46e5" stroke="#3730a3"/>
    <text x="60" y="116" font-size="12.5" font-weight="700">1 &#183; The primitive (&#167;3)</text>
    <text x="60" y="134" font-size="11.5" fill="#e0e7ff">equirect / fisheye / cubemap</text>
    <text x="60" y="150" font-size="11.5" fill="#e0e7ff">seam, poles, radial distortion</text>
    <text x="60" y="168" font-size="11.5" fill="#e0e7ff">kernels, boxes &amp; NMS all break</text>

    <!-- 2 detection (top-center) -->
    <rect x="300" y="42" width="300" height="86" rx="10" fill="#0f766e" stroke="#115e59"/>
    <text x="315" y="66" font-size="12.5" font-weight="700">2 &#183; Distortion-aware detection (&#167;4)</text>
    <text x="315" y="84" font-size="11.5" fill="#ccfbf1">spherical CNNs / KTN / SphereNet</text>
    <text x="315" y="100" font-size="11.5" fill="#ccfbf1">rotated / polygon / spherical boxes</text>
    <text x="315" y="118" font-size="11.5" fill="#ccfbf1">Sphere-IoU, seam-aware NMS</text>

    <!-- 3 segmentation (top-right) -->
    <rect x="555" y="92" width="300" height="86" rx="10" fill="#9333ea" stroke="#6b21a8"/>
    <text x="570" y="116" font-size="12.5" font-weight="700">3 &#183; Panoramic segmentation (&#167;5)</text>
    <text x="570" y="134" font-size="11.5" fill="#f3e8ff">Trans4PASS, PanoFormer, DPE</text>
    <text x="570" y="150" font-size="11.5" fill="#f3e8ff">pinhole&#8594;panoramic domain gap</text>
    <text x="570" y="168" font-size="11.5" fill="#f3e8ff">360SFUDA++, GoodSAM, open-vocab</text>

    <!-- 4 surround-view (mid-left) -->
    <rect x="0" y="287" width="150" height="86" rx="10" fill="#b45309" stroke="#92400e"/>
    <text x="12" y="309" font-size="12" font-weight="700">4 &#183; Surround</text>
    <text x="12" y="326" font-size="12" font-weight="700">-view (&#167;6)</text>
    <text x="12" y="345" font-size="11" fill="#fde68a">WoodScape,</text>
    <text x="12" y="360" font-size="11" fill="#fde68a">OmniDet, BEV</text>

    <!-- 5 depth (mid-right) -->
    <rect x="750" y="287" width="150" height="86" rx="10" fill="#0e7490" stroke="#155e75"/>
    <text x="762" y="309" font-size="12" font-weight="700">5 &#183; 360&#176; depth</text>
    <text x="762" y="326" font-size="12" font-weight="700">&amp; geometry (&#167;7)</text>
    <text x="762" y="345" font-size="11" fill="#cffafe">UniFuse,</text>
    <text x="762" y="360" font-size="11" fill="#cffafe">bi-projection</text>

    <!-- 6 foundation models (bottom-left) -->
    <rect x="105" y="470" width="300" height="86" rx="10" fill="#7c3aed" stroke="#5b21b6"/>
    <text x="120" y="494" font-size="12.5" font-weight="700">6 &#183; Foundation models on sphere (&#167;8)</text>
    <text x="120" y="512" font-size="11.5" fill="#ede9fe">SAM / CLIP / DINO / Depth-Anything</text>
    <text x="120" y="528" font-size="11.5" fill="#ede9fe">distortion-aware adaptation</text>
    <text x="120" y="544" font-size="11.5" fill="#ede9fe">panoramic generation as data</text>

    <!-- 7 datasets (bottom-right) -->
    <rect x="495" y="470" width="300" height="86" rx="10" fill="#be123c" stroke="#9f1239"/>
    <text x="510" y="494" font-size="12.5" font-weight="700">7 &#183; Datasets &amp; benchmarks (&#167;9)</text>
    <text x="510" y="512" font-size="11.5" fill="#fecdd3">Stanford2D3D, Matterport3D</text>
    <text x="510" y="528" font-size="11.5" fill="#fecdd3">Structured3D, DensePASS, WoodScape</text>
    <text x="510" y="544" font-size="11.5" fill="#fecdd3">KITTI-360, Fisheye8K, JRDB</text>
  </g>
</svg>
