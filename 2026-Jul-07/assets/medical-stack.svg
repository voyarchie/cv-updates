<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 470" role="img" aria-label="The medical-imaging dense-detection stack and where detectors, segmentors and classifiers attach">
  <title>The medical-imaging stack — two primitives, shared enablers, one clinical gate</title>
  <desc>Left to right: two acquisition primitives (a radiology 3D volume from CT/MRI/PET, and a gigapixel pathology whole-slide image) each flow through a representation stage (anisotropic voxel grid; multi-magnification tile pyramid) into dense heads (3D detection and segmentation scored by FROC and Dice; multiple-instance-learning slide classification plus cell and nuclei detection). A shared enabler band underneath supplies self-supervised foundation models, promptable segmentation such as MedSAM2 and SAM-Med3D, text-prompt grounding such as BiomedParse and SAT, and report-grounded vision-language models such as MAIRA-2. Everything passes through a reliability and regulatory gate — calibration, domain shift, fairness, FDA clearance — before clinical use.</desc>
  <style>
    .lbl { font-family: ui-sans-serif, system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .t  { fill: #f8fafc; font-weight: 600; }
    .s  { fill: #e2e8f0; }
    .cap { fill: #94a3b8; font-weight: 700; letter-spacing: .04em; }
    .flow { stroke: #94a3b8; stroke-width: 2.2; fill: none; }
    .up   { stroke: #b45309; stroke-width: 2; fill: none; stroke-dasharray: 5 4; }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/>
    </marker>
    <marker id="arrU" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#b45309"/>
    </marker>
  </defs>

  <g class="lbl">
    <text x="20" y="36" class="cap" font-size="12">ACQUISITION</text>
    <text x="258" y="36" class="cap" font-size="12">REPRESENTATION</text>
    <text x="496" y="36" class="cap" font-size="12">DENSE HEADS</text>
    <text x="734" y="36" class="cap" font-size="12">GATE → CLINIC</text>
  </g>

  <!-- Radiology lane (teal) -->
  <g class="lbl">
    <rect x="20" y="56" width="210" height="76" rx="11" fill="#0d9488" stroke="#0f766e"/>
    <text x="125" y="86" text-anchor="middle" class="t" font-size="13">Radiology volume</text>
    <text x="125" y="106" text-anchor="middle" class="s" font-size="11.5">CT · MRI · PET</text>
    <text x="125" y="123" text-anchor="middle" class="s" font-size="11.5">3D, grayscale, HU</text>

    <rect x="258" y="56" width="210" height="76" rx="11" fill="#0d9488" stroke="#0f766e"/>
    <text x="363" y="86" text-anchor="middle" class="t" font-size="13">Anisotropic voxel grid</text>
    <text x="363" y="106" text-anchor="middle" class="s" font-size="11.5">tiny lesions in a</text>
    <text x="363" y="123" text-anchor="middle" class="s" font-size="11.5">huge 3D background</text>

    <rect x="496" y="56" width="210" height="76" rx="11" fill="#0d9488" stroke="#0f766e"/>
    <text x="601" y="82" text-anchor="middle" class="t" font-size="13">3D detect / segment</text>
    <text x="601" y="102" text-anchor="middle" class="s" font-size="11.5">boxes + masks</text>
    <text x="601" y="119" text-anchor="middle" class="s" font-size="11.5">scored by FROC · Dice</text>
  </g>

  <!-- Pathology lane (violet) -->
  <g class="lbl">
    <rect x="20" y="164" width="210" height="76" rx="11" fill="#7c3aed" stroke="#6d28d9"/>
    <text x="125" y="194" text-anchor="middle" class="t" font-size="13">Gigapixel WSI</text>
    <text x="125" y="214" text-anchor="middle" class="s" font-size="11.5">~100k × 100k px</text>
    <text x="125" y="231" text-anchor="middle" class="s" font-size="11.5">weak slide labels</text>

    <rect x="258" y="164" width="210" height="76" rx="11" fill="#7c3aed" stroke="#6d28d9"/>
    <text x="363" y="194" text-anchor="middle" class="t" font-size="13">Multi-mag tile pyramid</text>
    <text x="363" y="214" text-anchor="middle" class="s" font-size="11.5">tile encoder →</text>
    <text x="363" y="231" text-anchor="middle" class="s" font-size="11.5">bag of instances</text>

    <rect x="496" y="164" width="210" height="76" rx="11" fill="#7c3aed" stroke="#6d28d9"/>
    <text x="601" y="190" text-anchor="middle" class="t" font-size="13">MIL slide label +</text>
    <text x="601" y="210" text-anchor="middle" class="t" font-size="13">cell / nuclei detect</text>
    <text x="601" y="229" text-anchor="middle" class="s" font-size="11.5">grading · counts (mF1/PQ)</text>
  </g>

  <!-- flow arrows within lanes -->
  <g class="flow">
    <line x1="230" y1="94"  x2="256" y2="94"  marker-end="url(#arr)"/>
    <line x1="468" y1="94"  x2="494" y2="94"  marker-end="url(#arr)"/>
    <line x1="230" y1="202" x2="256" y2="202" marker-end="url(#arr)"/>
    <line x1="468" y1="202" x2="494" y2="202" marker-end="url(#arr)"/>
    <!-- into gate -->
    <path d="M706 94 C 726 94, 726 150, 744 150" marker-end="url(#arr)"/>
    <path d="M706 202 C 726 202, 726 156, 744 156" marker-end="url(#arr)"/>
  </g>

  <!-- Enabler band (amber) -->
  <g class="lbl">
    <rect x="20" y="300" width="686" height="86" rx="11" fill="#d97706" stroke="#b45309"/>
    <text x="363" y="326" text-anchor="middle" class="t" font-size="13">Shared enablers — reused by both primitives</text>
    <text x="363" y="349" text-anchor="middle" class="s" font-size="11.5">self-supervised foundation models · promptable seg (MedSAM2 · SAM-Med3D)</text>
    <text x="363" y="368" text-anchor="middle" class="s" font-size="11.5">text-prompt grounding (BiomedParse · SAT) · report-grounded VLMs (MAIRA-2 · CT-CHAT)</text>
  </g>
  <g class="up">
    <line x1="200" y1="300" x2="200" y2="134" marker-end="url(#arrU)"/>
    <line x1="540" y1="300" x2="540" y2="134" marker-end="url(#arrU)"/>
    <line x1="330" y1="300" x2="330" y2="242" marker-end="url(#arrU)"/>
    <line x1="620" y1="300" x2="620" y2="242" marker-end="url(#arrU)"/>
  </g>

  <!-- Gate + clinic (slate) -->
  <g class="lbl">
    <rect x="744" y="56" width="216" height="184" rx="11" fill="#1f2937" stroke="#94a3b8"/>
    <text x="852" y="92"  text-anchor="middle" class="t" font-size="13">Reliability &amp;</text>
    <text x="852" y="111" text-anchor="middle" class="t" font-size="13">regulatory gate</text>
    <text x="852" y="140" text-anchor="middle" class="s" font-size="11.5">calibration · conformal</text>
    <text x="852" y="160" text-anchor="middle" class="s" font-size="11.5">domain / scanner shift</text>
    <text x="852" y="180" text-anchor="middle" class="s" font-size="11.5">fairness · shortcut audit</text>
    <text x="852" y="200" text-anchor="middle" class="s" font-size="11.5">prospective trial · FDA</text>

    <rect x="744" y="300" width="216" height="86" rx="11" fill="#0f766e" stroke="#0f766e"/>
    <text x="852" y="337" text-anchor="middle" class="t" font-size="13">Clinical use</text>
    <text x="852" y="360" text-anchor="middle" class="s" font-size="11.5">the AUC-to-bedside gap</text>
  </g>
  <g class="flow">
    <line x1="852" y1="240" x2="852" y2="298" marker-end="url(#arr)"/>
  </g>
</svg>
