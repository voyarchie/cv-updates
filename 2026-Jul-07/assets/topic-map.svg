<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 620" role="img" aria-label="Topic map for the 2026-Jul-07 CV update">
  <title>Topic map — 2026-Jul-07 CV update</title>
  <desc>A radial topic map of six threads in the medical-imaging dense detection and classification stack: why medical imaging is its own primitive, volumetric 3D radiology detection, gigapixel pathology foundation models and cell detection, promptable and universal medical models, medical vision-language models with report-grounded detection, and datasets/benchmarks/reliability with the classification side.</desc>
  <style>
    .lbl { font-family: ui-sans-serif, system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .edge { stroke: #94a3b8; stroke-width: 2; }
    .node { stroke-width: 1.5; }
    .nt { fill: #f8fafc; font-weight: 600; }
    .ns { fill: #e2e8f0; }
  </style>
  <!-- edges -->
  <g class="edge" fill="none">
    <line x1="490" y1="310" x2="315" y2="150"/>
    <line x1="490" y1="310" x2="665" y2="150"/>
    <line x1="490" y1="310" x2="255" y2="310"/>
    <line x1="490" y1="310" x2="725" y2="310"/>
    <line x1="490" y1="310" x2="315" y2="470"/>
    <line x1="490" y1="310" x2="665" y2="470"/>
  </g>
  <!-- hub -->
  <g class="lbl">
    <rect x="368" y="266" width="244" height="88" rx="12" fill="#1f2937" stroke="#94a3b8" class="node"/>
    <text x="490" y="298" text-anchor="middle" class="nt" font-size="15">Medical imaging</text>
    <text x="490" y="319" text-anchor="middle" class="nt" font-size="15">dense detection</text>
    <text x="490" y="340" text-anchor="middle" class="ns" font-size="12.5">+ classification</text>
  </g>
  <!-- T1 primitive -->
  <g class="lbl">
    <rect x="118" y="86" width="248" height="92" rx="12" fill="#0d9488" stroke="#0f766e" class="node"/>
    <text x="242" y="116" text-anchor="middle" class="nt" font-size="13.5">1 · The primitive</text>
    <text x="242" y="136" text-anchor="middle" class="ns" font-size="12">volume &amp; gigapixel · HU/intensity</text>
    <text x="242" y="154" text-anchor="middle" class="ns" font-size="12">imbalance · label scarcity · shift</text>
  </g>
  <!-- T2 radiology 3D -->
  <g class="lbl">
    <rect x="614" y="86" width="248" height="92" rx="12" fill="#0d9488" stroke="#0f766e" class="node"/>
    <text x="738" y="116" text-anchor="middle" class="nt" font-size="13.5">2 · Volumetric 3D detection</text>
    <text x="738" y="136" text-anchor="middle" class="ns" font-size="12">nnDetection · 3D DETR · ULS</text>
    <text x="738" y="154" text-anchor="middle" class="ns" font-size="12">Merlin · CT-CLIP · VoCo</text>
  </g>
  <!-- T3 pathology -->
  <g class="lbl">
    <rect x="8" y="264" width="248" height="92" rx="12" fill="#7c3aed" stroke="#6d28d9" class="node"/>
    <text x="132" y="294" text-anchor="middle" class="nt" font-size="13.5">3 · Gigapixel pathology</text>
    <text x="132" y="314" text-anchor="middle" class="ns" font-size="12">UNI2 · Virchow2 · GigaPath</text>
    <text x="132" y="332" text-anchor="middle" class="ns" font-size="12">MIL slides · CellViT++ nuclei</text>
  </g>
  <!-- T4 promptable -->
  <g class="lbl">
    <rect x="724" y="264" width="248" height="92" rx="12" fill="#7c3aed" stroke="#6d28d9" class="node"/>
    <text x="848" y="294" text-anchor="middle" class="nt" font-size="13.5">4 · Promptable &amp; universal</text>
    <text x="848" y="314" text-anchor="middle" class="ns" font-size="12">MedSAM2 · SAM-Med3D</text>
    <text x="848" y="332" text-anchor="middle" class="ns" font-size="12">BiomedParse · SAT</text>
  </g>
  <!-- T5 VLM -->
  <g class="lbl">
    <rect x="118" y="442" width="248" height="92" rx="12" fill="#d97706" stroke="#b45309" class="node"/>
    <text x="242" y="472" text-anchor="middle" class="nt" font-size="13.5">5 · Medical VLMs</text>
    <text x="242" y="492" text-anchor="middle" class="ns" font-size="12">grounded report gen · MAIRA-2</text>
    <text x="242" y="510" text-anchor="middle" class="ns" font-size="12">open-vocab · 3D CT-CHAT</text>
  </g>
  <!-- T6 data/eval -->
  <g class="lbl">
    <rect x="614" y="442" width="248" height="92" rx="12" fill="#d97706" stroke="#b45309" class="node"/>
    <text x="738" y="472" text-anchor="middle" class="nt" font-size="13.5">6 · Data · eval · reliability</text>
    <text x="738" y="492" text-anchor="middle" class="ns" font-size="12">FROC · eva/HEST · calibration</text>
    <text x="738" y="510" text-anchor="middle" class="ns" font-size="12">grading · fairness · FDA</text>
  </g>
</svg>
