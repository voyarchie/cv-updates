<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" role="img" aria-label="Why the X-ray security image is a different primitive: additive transmission overlap and dual-energy material colour versus natural-image occlusion">
  <title>The X-ray security primitive — additive overlap + dual-energy material colour vs. natural occlusion</title>
  <defs>
    <marker id="xp" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#94a3b8"/>
    </marker>
  </defs>

  <!-- headers -->
  <text x="230" y="30" text-anchor="middle" fill="#94a3b8" font-size="13" font-weight="700">NATURAL IMAGE (reflected light)</text>
  <text x="670" y="30" text-anchor="middle" fill="#94a3b8" font-size="13" font-weight="700">X-RAY SECURITY IMAGE (transmitted flux)</text>
  <line x1="450" y1="44" x2="450" y2="410" stroke="#475569" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- LEFT: occlusion -->
  <rect x="70" y="60" width="320" height="150" rx="10" fill="#1e293b" stroke="#94a3b8"/>
  <text x="230" y="84" text-anchor="middle" fill="#f8fafc" font-size="13.5" font-weight="700">Opaque surfaces → occlusion</text>
  <!-- front object hides back object -->
  <rect x="150" y="105" width="90" height="80" rx="6" fill="#64748b" stroke="#cbd5e1"/>
  <rect x="205" y="120" width="90" height="80" rx="6" fill="#4f46e5" stroke="#c7d2fe"/>
  <text x="230" y="200" text-anchor="middle" fill="#cbd5e1" font-size="10.5">nearer object writes over farther one</text>
  <text x="115" y="228" fill="#cbd5e1" font-size="11.5">• colour + texture cues are rich</text>
  <text x="115" y="246" fill="#cbd5e1" font-size="11.5">• hidden pixels are simply gone</text>

  <!-- RIGHT: additive overlap -->
  <rect x="510" y="60" width="320" height="150" rx="10" fill="#1e293b" stroke="#94a3b8"/>
  <text x="670" y="84" text-anchor="middle" fill="#f8fafc" font-size="13.5" font-weight="700">Translucent → additive overlap</text>
  <!-- overlapping translucent objects -->
  <rect x="590" y="105" width="90" height="80" rx="6" fill="#d97706" fill-opacity="0.7" stroke="#fed7aa"/>
  <rect x="645" y="120" width="90" height="80" rx="6" fill="#059669" fill-opacity="0.7" stroke="#a7f3d0"/>
  <rect x="645" y="120" width="35" height="65" fill="#0f766e" fill-opacity="0.85"/>
  <text x="670" y="200" text-anchor="middle" fill="#cbd5e1" font-size="10.5">overlap = attenuation of BOTH, superimposed</text>
  <text x="555" y="228" fill="#cbd5e1" font-size="11.5">• little texture; edges blur where items cross</text>
  <text x="555" y="246" fill="#cbd5e1" font-size="11.5">• feature coupling between stacked items</text>

  <!-- dual-energy material colour band -->
  <rect x="70" y="278" width="760" height="120" rx="10" fill="#0f172a" stroke="#94a3b8"/>
  <text x="450" y="302" text-anchor="middle" fill="#f8fafc" font-size="13.5" font-weight="700">Dual-energy → colour encodes MATERIAL, not appearance</text>
  <rect x="110" y="318" width="150" height="46" rx="8" fill="#ea580c" stroke="#fed7aa"/>
  <text x="185" y="340" text-anchor="middle" fill="#0f172a" font-size="12" font-weight="700">organic</text>
  <text x="185" y="356" text-anchor="middle" fill="#0f172a" font-size="10">low Z · explosives, drugs</text>
  <rect x="375" y="318" width="150" height="46" rx="8" fill="#16a34a" stroke="#bbf7d0"/>
  <text x="450" y="340" text-anchor="middle" fill="#0f172a" font-size="12" font-weight="700">inorganic mix</text>
  <text x="450" y="356" text-anchor="middle" fill="#0f172a" font-size="10">medium Z</text>
  <rect x="640" y="318" width="150" height="46" rx="8" fill="#2563eb" stroke="#bfdbfe"/>
  <text x="715" y="340" text-anchor="middle" fill="#f8fafc" font-size="12" font-weight="700">metal</text>
  <text x="715" y="356" text-anchor="middle" fill="#f8fafc" font-size="10">high Z · blades, guns</text>
  <text x="450" y="386" text-anchor="middle" fill="#cbd5e1" font-size="11">colour ≈ effective atomic number Z (from high/low-energy ratio) — the classifier reasons over material + shape, not RGB</text>
</svg>
